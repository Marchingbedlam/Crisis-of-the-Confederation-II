l_english:
 k_barnard_accord: "The Barnard Accord"
 form_barnard_accord_decision: "Form the Barnard Accord"
 form_barnard_accord_decision_tooltip: "Raise the four core duchies of the Horsehead Nebula into a [kingdom_cotc|E] of their own"
 form_barnard_accord_decision_desc: "Arjona trades, Galilei studies, Miltia drills and Abraxas prays, and not one of them can hold a shipping lane on its own. Four systems, four small ambitions, one dark cloud between them and the rest of the Confederation. Let them sign as equals under a single flag, and the Horsehead stops being a place ships pass through on their way somewhere that matters."
 form_barnard_accord_decision_confirm: "Let the Accord be signed"
 form_barnard_accord_decision_de_jure_tt: "[GetTitleByKey('d_arjona').GetNameNoTierNoTooltip], [GetTitleByKey('d_galilei').GetNameNoTierNoTooltip], [GetTitleByKey('d_miltia').GetNameNoTierNoTooltip] and [GetTitleByKey('d_abraxas').GetNameNoTierNoTooltip] become [de_jure|E] part of [GetTitleByKey('k_barnard_accord').GetNameNoTierNoTooltip]"
