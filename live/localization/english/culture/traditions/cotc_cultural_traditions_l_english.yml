 # ---- descriptions ----
 tradition_winter_warriors_desc:0 "This culture takes deep cold as a given. Its soldiers train, sleep and fight at temperatures that would put another army out of action entirely."
 tradition_forest_fighters_desc:0 "This culture is well-versed in fighting inside a nebula, where sensors are useless and the enemy is only ever found at knife range."
 tradition_mountaineers_desc:0 "Soldiers of this culture carry everything needed to cross a protostellar disc under their own power, through debris that would strand anyone else."
 tradition_warriors_of_the_dry_desc:0 "This culture has mastered the art of fighting in very dry climates."
 tradition_highland_warriors_desc:0 "Warriors of this culture fight well in the tumbling shadows of a belt, where the cover moves and every approach is a blind one."
 tradition_jungle_warriors_desc:0 "Warriors of this culture know how to cross a corrosive world, where the air alone will finish an unprepared army faster than any enemy."
 tradition_only_the_strong_desc:0 "This culture fields few soldiers and demands everything of them. If you are not among the best, you are not permitted to serve at all."
 tradition_warriors_by_merit_desc:0 "This culture holds that anyone who can prove their competence should be permitted to serve - whatever their birth, and whoever they are."
 tradition_warrior_monks_desc:0 "This culture holds that conviction untested is conviction unproven. Its orders train their devotees to defend the faith with force as readily as to study it."
 tradition_talent_acquisition_desc:0 ""Kill me if you wish, but if you let me live, I shall serve you loyally.""
 tradition_strength_in_numbers_desc:0 "This culture forgoes elite formations entirely, trusting instead to mass: more hulls, more bodies, more attacks than an enemy can answer."
 tradition_frugal_armorsmiths_desc:0 "One immaculate suit of powered armor may save a single life. Ten serviceable ones, refitted in the field, may win the engagement."
 tradition_malleable_invaders_desc:0 "We will take your worlds, your children, your traditions, and your #EMP future#!."
 tradition_quarrelsome_desc:0 "Border conflicts are common for rulers of this culture. Land often changes hands in unjust ways."
 tradition_swords_for_hire_desc:0 "This culture regards contract soldiering as honest work. Between wars its veterans hire out their skills to whoever is paying."
 tradition_reverence_for_veterans_desc:0 "This culture doesn't look down upon those who can no longer fight due to injury, instead they are celebrated as heroes and used as teachers."
 tradition_stalwart_defenders_desc:0 "Holding what is theirs matters more to this culture than taking what is not. They do not break, and they do not yield ground cheaply."
 tradition_battlefield_looters_desc:0 "Here an engagement is fought for the wreck field as much as for the objective. Prestige is poor compensation if you cannot fund the next campaign."
 tradition_hit_and_run_desc:0 "This culture has mastered the fast strike: light units hit hard, break contact, and are gone before a response can form."
 tradition_stand_and_fight_desc:0 "Soldiers of this culture do not withdraw. They hold position against any odds - for better or for worse."
 tradition_adaptive_skirmishing_desc:0 "This culture trains its irregulars to fight on ground of their own choosing, in any environment, against any weight of force."
 tradition_formation_fighting_desc:0 "This culture drills its formations until each element covers the others by reflex, turning mixed detachments into a single instrument."
 tradition_horse_breeder_desc:1 "This culture has painstakingly accumulated knowledge and experience in the fine art and science of horse breeding. Whether destriers or coursers, the horses of these people are renowned for their superiority."
 tradition_longbow_competitions_desc:1 "This culture favors a bow more powerful than most could draw, and practicing with them once a week is as dear as any ritual of worship everywhere from the most rural villages to the largest urban metropoles."
 tradition_futuwaa_desc:0 "$innovation_futuwaa_desc$"
 tradition_mubarizuns_desc:0 "$innovation_mubarizuns_desc$"
 tradition_desert_ribat_desc:0 "This culture has a tradition of fortified desert retreats, where the pious can live in connection with the open sky and the sands. This lifestyle breeds able and pious desert warriors and attracts mystics."
 tradition_land_of_the_bow_desc:0 "In a land of plenty, enriched by the Nile and their own ingenuity, the Nubian have prospered for generations. For almost as long, the bow has been the weapon of choice to deter the raiders and brigands of the surrounding deserts."
 tradition_druzhina_desc:0 "$innovation_druzhina_desc$"
 tradition_hussar_desc:0 "$innovation_hussar_raids_desc$"
 tradition_horn_mountain_skirmishing_desc:0 "$innovation_mountain_skirmishing_desc$"
 tradition_bush_hunting_desc:0 "$innovation_bush_hunting_desc$"
 tradition_mobile_guards_desc:0 "$innovation_mobile_guards_desc$"
 tradition_khadga_puja_desc:0 "This culture has embraced the martial art and ritual worship of two-handed broadswords letting them foster strong and able warriors. The heavy swords allow them to mow down infantry and cavalry alike."
 tradition_garuda_warriors_desc:0 "Distinguished warriors in this culture are designated as Garudas, and are expected to fight until death. Even those who follow a Garuda are expected to die if their leader does, either in battle or by their own hand."
 tradition_burman_royal_army_desc:0 "$innovation_royal_army_tradition_desc$"
 tradition_mountain_herding_desc:0 "This culture has made the cooler mountains their homes in an otherwise dry and arid region. The herders and farmers of these uplands have make for resilient and robust warriors, and over time their toil has made this people flourish far above the naked desert."
 tradition_forest_wardens_desc:0 "$innovation_forest_wardens_desc$"
 tradition_upland_skirmishing_desc:0 "$innovation_upland_skirmishing_desc$"
 tradition_strong_kinship_desc:0 "This culture has a strong tradition of kinship within the extended family, or clan. In times of need a ruler will always be able to rely on their kin."
 tradition_amharic_highlanders_desc:0 "The Amharic highlands are quite suitable for farming as long as one knows how to best approach the matter. For many generations this people have worked and lived in this environment, thriving while developing their own traditions and customs."
 tradition_polders_desc:0 "This culture has a long tradition of reclaiming land from the surrounding sea. This allows them to utilize what would normally be a shallow seabed for farming and construction."
 tradition_caucasian_wolves_desc:0 "Having spent centuries making themselves a home around the Caucasian gates, this culture has grown well at home with everything that mountain warfare entails."
 tradition_hird_desc:0 "$innovation_hird_desc$"
 tradition_chanson_de_geste_desc:0 "This culture values the heroic deeds of long gone ancestors. The romantic retelling of the lives of knights such as Guillaume, or Roland, will inspire generations to come."
 tradition_court_eunuchs_desc:1 "This culture makes extensive use of eunuchs at court, occupying positions ranging from domestic servants to bureaucratic administrators and even military commanders. Men with no desire are easy to trust."
 tradition_legalistic_desc:1 "This culture regards the rule of law and its codification as being the most important parameter of a civilized society."
 tradition_republican_legacy_desc:1 "This culture has a long history of republican values, where the urban classes are just as important as the rural landholders."
 tradition_hereditary_hierarchy_desc:0 "It is settled in this culture that office descends by blood and that the order of precedence is not open to question. Those who break that order are not soon forgiven."
 tradition_esteemed_hospitality_desc:0 "In this culture rulers are known, and expected, to welcome anyone who might come to their court with open arms. Hosting guests and visitors in a spectacular fashion."
 tradition_gardening_desc:0 "This culture has a long tradition of constructing and maintaining various types of gardens, building themselves a small paradise."
 tradition_tribe_unity_desc:0 "This culture leans on the bonds of family and household, pressing its people to remember the line they came from and what it owes itself."
 tradition_astute_diplomats_desc:1 "It is a common idea in this culture that the purest expression of superiority is the ability to subdue your enemy without fighting them."
 tradition_collective_lands_desc:0 "The idea that a person privately owns a world, a station or a yard is alien to this culture; what exists belongs to everyone, for the common good."
 tradition_female_only_inheritance_desc:1 "This culture enforces a matriarchal hierarchy, where the ruling class is overwhelmingly comprised of women."
 tradition_equal_inheritance_desc:0 "This culture has a history of rulers dividing their lands between all their children, even those who normally would be excluded."
 tradition_roman_legacy_desc:1 "The military organization of the Roman Empire is still in living memory within this culture. A professional army is favored over levied troops."
 tradition_metal_craftsmanship_desc:0 "Generations of easy access to ore have made this culture's foundries a byword for durable alloy. Their hulls and plate outlast anyone else's."
 tradition_family_entrepreneurship_desc:2 "This culture encourages businesses to develop along familial lines, each generation picking up the tools and techniques of their trade from the last, building a strong tradition of ancestral professionalism."
 tradition_wedding_ceremonies_desc:1 "For this culture, the union of two people in marriage is considered a highly public and ritualistic affair."
 tradition_culture_blending_desc:1 "Members of this culture have often lived alongside people of other cultures. Through exposure, they have become adept at incorporating foreign languages, traditions and customs into their own lives."
 tradition_isolationist_desc:0 "This culture prefers to keep to itself, and doesn't often look outside its own sphere."
 tradition_fervent_temple_builders_desc:0 "This culture holds that faith is served best through good order. Devout rulers are expected to fund and staff its institutions generously, and to build a great many of them."
 tradition_agrarian_desc:0 "This culture farms in earnest, and its habitable worlds yield enough to keep an army in the field indefinitely. Never having gone hungry has a cost: its soldiers lack the edge of those raised somewhere harder."
 tradition_pastoralists_desc:0 "This culture is at home in wide and open terrain, where they herd large groups of animals."
 tradition_parochialism_desc:0 "The great habitats of this culture compete fiercely and answer to no one. Each spends lavishly to ensure that #EMP its#! markets are the ones that matter."
 tradition_ruling_caste_desc:0 "Authority in this culture is inherited, not earned. Its administrators are practiced at governing populations that are not their own - efficient at suppressing unrest, and widely resented for it."
 tradition_staunch_traditionalists_desc:0 "Tradition is tradition: immovable, unchangeable. We must be ready to stand up for whatever it is that makes us ourselves."
 tradition_hill_dwellers_desc:0 "This culture is at home among the rocks, and knows how to work a belt for everything it will give up."
 tradition_forest_folk_desc:0 "This culture lives deep in the clouds, and knows how to draw a living from what drifts there."
 tradition_mountain_homes_desc:0 "This culture makes a home of accretion discs, anchoring its habitats in the churn of a system that has not finished forming - and thriving there."
 tradition_dryland_dwellers_desc:0 "This culture is accustomed to living in dry climates, and know where to find water and how to work the lands."
 tradition_jungle_dwellers_desc:0 "This culture lives on worlds that would dissolve an unprotected settlement, and has learned to harvest what such places offer."
 tradition_wetlanders_desc:0 "Settled on worlds a person can cross unmasked, this culture has never had to fight its own environment. It has spent the effort it saved on living well."
 tradition_hidden_cities_desc:0 "Tucked into the acid haze or screened behind a lattice of decoy hulls, this culture's stations may not be known to exist at all - let alone be findable by a fleet meaning to reduce them."
 tradition_ancient_miners_desc:1 "This culture has always been surrounded by raw materials, ore, and uncut gems. They have an affinity for finding sites for mining excavations."
 tradition_castle_keepers_desc:0 "Offense is not a good defense. A good defense is holding more fortified stations than anyone else in settled space."
 tradition_city_keepers_desc:0 "The great cities are the beating heart of this culture, and it means every one of its metropolises to be envied across settled space."
 tradition_maritime_mercantilism_desc:0 "Fleets may decide wars, but this culture knows that whoever controls the freight lanes controls everything moving along them."
 tradition_monastic_communities_desc:1 "This culture has a long history of sending noble progeny to serve the faith. Revered political thinkers often arise from the monastic orders."
 tradition_brewery_desc:0 "This culture treats distilling and drinking as central to both celebration and ordinary life, and every habitat runs a still of its own."
 tradition_byzantine_succession_desc:1 "This culture is closely associated with the imperial traditions of the Eastern Roman Empire and its legacy in the form of a complex and intricate code of courtly conduct."
 tradition_lords_of_the_elephant_desc:0 "This culture venerates elephants, likening them to royalty. They are masterful at capturing them, training them, and using them for devastating effect in war."
 tradition_african_tolerance_desc:1 "Though some would decry it as weakness, a realm founded on understanding and tolerance is a realm built on sturdy foundations."
 tradition_the_witenagemot_desc:1 "This culture has a long history of holding assemblies comprised of the land's ruling potentates, debating politics, law, finance, and, most importantly, how best to... #EMP advise#! the ruler."
 tradition_things_desc:1 "In Scandinavia, the distances and wilderness render centralized authority ineffective. When disputes must be resolved and decisions made, the #EMP Ting-meet #!is gathered, an assembly of peers presided over by a lawspeaker."
 tradition_caravaneers_desc:1 "This culture is well-integrated into the commercial practices of the region, and its people are strongly associated with the caravan trade."
 tradition_horse_lords_desc:0 "This culture has mastered the horse and its use in warfare."
 tradition_saharan_nomads_desc:1 "This culture is intimately accustomed with the Saharan desert, which it has traversed for centuries, connecting the Mediterranean with the sub-Saharan kingdoms of the Sahel."
 tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
 tradition_himalayan_settlers_desc:1 "This culture has made its home atop the 'roof of the world', where the air is fresh but cold, and the winters long and hard. They pride themselves that few of the cultures below would be able to live as well as this people does, among the peaks and plateaus where otherwise only sheep can thrive."
 tradition_desert_nomads_desc:1 "This culture is no stranger to the harsh environment of the desert and has mastered the use of camels to aid them in travel, warfare, and everyday life."
 tradition_mountaineer_ruralism_desc:1 "From their origins in the hills of the Bohemian Forest, to the crags of the Ore and Tatra mountains, most in this culture know not only how to traverse the rocky lands, but handle life on a mountain with ease."
 tradition_steppe_tolerance_desc:1 "Those who live on the Steppe will always have much in common with those who share their way of life. Strangers may worship differently, but they still live in the saddle."
 tradition_nubian_warrior_queens_desc:0 "Those who live in East Africa well remember the great Warrior Queens who once stood against invaders and forged kingdoms on the Kush. Our neighbors may insist on the superiority of males, but we track our bloodlines through our mothers, and the warcry of powerful Nubian women send these foreign "men" running home."
 tradition_nubian_warrior_kings_desc:0 "Those who live in East Africa well remember the great Warrior Kings who once stood against invaders and forged kingdoms on the Kush. Our neighbors may insist on the superiority of females, but we track our bloodlines through our fathers, and the warcry of powerful Nubian men send these foreign "women" running home."
 tradition_monogamous_desc:0 "In this culture one keeps a single spouse, regardless of faith."
 tradition_polygamous_desc:0 "In this culture one tend to have multiple spouses, regardless of faith."
 tradition_concubines_desc:1 "Rulers of this culture often keep a number of concubines in their household, regardless of their faith."
 tradition_sacred_mountains_desc:1 "This culture considers mountains to be connections to the divine, and treats them with reverence and respect."
 tradition_sacred_groves_desc:0 "Trees are considered sacred by this culture. The forest is a living being that ought to be cared for — not destroyed."
 tradition_culinary_art_desc:1 "Food isn't just sustenance for this culture; it is both an art and a ritual, a focal point for family and community alike."
 tradition_festivities_desc:1 "The frequency and exuberance with which this culture throws festivities would be considered vulgar to others, but a party is a party!"
 tradition_sorcerous_metallurgy_desc:0 "This culture keeps as many researchers chasing impossible alloys as it does smiths working proven ones. If the results cannot quite be explained, so much the better."
 tradition_mystical_ancestors_desc:0 "Descent matters enormously here. The first settlers have passed into legend, and a great many claim their line."
 tradition_religion_blending_desc:0 "Members of this culture live among those of other faiths as a matter of course, and are practiced at folding foreign observances into their own."
 tradition_religious_patronage_desc:0 "Standing is demonstrated through works, not claimed. You cannot simply purchase a good name - but endowing an order that sings your praises #EMP helps.#!"
 tradition_medicinal_plants_desc:0 "This culture has cataloged the pharmacology of everything that grows in its habitats. Few ailments lack a remedy drawn from a hydroponic bay."
 tradition_sacred_hunts_desc:0 "The hunt is neither sport nor pastime here but an act of devotion, in which one demonstrates mastery over a world that was never meant for people."
 tradition_faith_bound_desc:0 "In this culture being of a different faith means that you're not eligible for succession."
 tradition_by_the_sword_desc:0 "Members of this culture hold that the most persuasive missionary is an armed one. Holy war enjoys broad support, though motives are examined closely."
 tradition_language_scholars_desc:0 "To learn the words of a neighbor brings you one step closer to the language of the Divine."
 tradition_runestones_desc:1 "Death, conquest, the acquisition of rank — are these not the things that define life in the nobility? Where our people go, so go the markers of our lives' worth."
 tradition_merciful_blindings_desc:1 "No matter how far beyond forgiveness one has gone, this culture thinks it is better to gouge out an eye than run through a heart."
 tradition_xenophilic_desc:0 "This culture embraces everyone and is genuinely fascinated by all cultures."
 tradition_chivalry_desc:0 "This culture has revived an old code of conduct as a means of regulating behavior. Martial skill, duty, honor and courtesy are prized - as is a great deal of bad poetry."
 tradition_hard_working_desc:1 "This culture teaches and enshrines ideas of industriousness and hard work on behalf of one's community."
 tradition_loyal_soldiers_desc:0 "For this culture, service to the state is a duty and a privilege rather than a transaction - an oath given freely, not a wage accepted."
 tradition_pacifism_desc:1 "For this culture, the use of force can never be justified. Only by pursuing a path of non-violence can people truly live in peace."
 tradition_spartan_desc:0 "This culture has no use for the trappings of power - the ceremony, the wealth, the ornament. It is interested in power itself, preferably in the form of armor plate and gun emplacements."
 tradition_diasporic_desc:1 "People of this culture have lost the homeland they once held dear. Some among them travel the world searching for a place where they may begin anew."
 tradition_hunters_desc:0 "Whether from necessity or from status, this culture has refined the pursuit of native fauna into a precise and almost beautiful discipline."
 tradition_vegetarianism_desc:1 "This culture has developed a strong aversion to consuming the flesh of animals, and practices vegetarianism throughout their society."
 tradition_seafaring_desc:0 "For this culture the pull of the void is too strong to resist. They live to run the deep black, whether on a clear transit or through the teeth of a solar storm."
 tradition_storytellers_desc:0 "This culture keeps its record by voice rather than by archive. Its history is recited, generation to generation, and the reciters are held to be exact."
 tradition_music_theory_desc:1 "This culture treats music almost as the language of the divine, and thus many individuals take up the noble and celebrated pursuit of musical study from a young age."
 tradition_poetry_desc:0 "Poetry is considered a noble art in this culture, and many spend their time piecing words together with meaning and thought."
 tradition_fishermen_desc:0 "Anyone can run a gas skimmer. To come back full regardless of storm or pressure is a rarer talent, and these crews know the cloud decks better than anyone."
 tradition_mendicant_mystics_desc:0 "The holy people of this culture hold that the faith must be carried rather than housed, and its most devout spend their lives moving between the stars."
 tradition_warrior_culture_desc:0 "This culture prizes martial skill and strength above all else. Children are raised to fight and steered away from scholarly pursuits. Weakness is not tolerated."
 tradition_martial_admiration_desc:0 "Anyone willing to take up arms and fight for their culture has earned admiration. No matter the odds."
 tradition_philosopher_culture_desc:0 "This culture promotes thought and self-reflection."
 tradition_welcoming_desc:1 "The people of this culture excel in diplomatic matters, and social etiquette is valued above all else."
 tradition_eye_for_an_eye_desc:0 "In this culture an injury is neither forgotten nor forgiven. Grudges are kept precisely, and settled in full."
 tradition_zealous_people_desc:0 "The people of this culture are particularly zealous and dedicated to their faith."
 tradition_forbearing_desc:1 "In this culture being patient and restrained in the face of adversity is common."
 tradition_equitable_desc:0 "In this culture truth and impartial justice is valued highly."
 tradition_charitable_desc:0 "Regardless of faith, people of this culture are motivated to support those less fortunate."
 tradition_modest_desc:0 "This culture values modesty, one should not take up too much space or think oneself better than others."
 tradition_practiced_pirates_desc:0 "Boarding a station, stripping it, and burning what will not fit in the hold may not be honorable, but it #EMP is#! profitable."
 tradition_life_is_just_a_joke_desc:0 "This culture would find something funny to say while the airlock cycled."
 tradition_artisans_desc:0 "Children in this culture often carry on the profession of their parents, accumulating extensive knowledge and skill for their trade across generations."
 tradition_noble_adoption_desc:0 "Taking in orphaned children and raising them as full heirs is unremarkable here. The bond of the household outweighs the accident of birth."
 tradition_fp1_coastal_warriors_desc:1 "We have always been drawn to the shoreline. The sting of sea air, the crying gulls, the scent of smoked fish... what warrior would ever opt to live far from the water and its freedoms?"
 tradition_fp1_performative_honour_desc:1 "Honor is born, yes, but honor is also earned and lost through deeds. By pursuing and avenging slights, or failing to, soldiers fade to scum while whelps grow into warriors."
 tradition_fp1_northern_stories_desc:1 "Life is lived, told, and remembered through the lens of tales. What we say, and what people say about us, matters as much as what we do. We remember that, and it shows in our stories."
 tradition_fp1_trials_by_combat_desc:1 "Words are a coward's substitute for weapons. Why leave justice to decrepit laws and corrupt magistrates when disputes can be settled faster and fairer with the blade?"
 tradition_fp1_the_right_to_prove_desc:0 "Though not all are born fighters, with the right mettle and a strong sword-arm, any can show themselves a warrior at heart and so become one in deed."
 tradition_fp2_state_ransoming_desc:0 "Every soldier goes into battle ready to risk life and limb for their liege! Does it not behoove the liege to offer them some guarantee of safety, regardless of station, should they be captured in the field?"
 tradition_fp2_strategy_gamers_desc:0 "Any commander can gamble and get lucky on the day of battle. A #EMP real#! strategist keeps their mind honed through practice and pretend so that they have no #EMP need#! of 'luck'."
 tradition_fp2_malleable_subjects_desc:0 "Who's to say what freedom is? One king is much like another, regardless of culture. True freedom comes from learning how to live with any liege."
 tradition_fp2_ritualised_friendship_desc:0 "Blood may be thicker than water, but wine makes for better living."
 tradition_fp3_frontier_warriors_desc: "This culture is on a constant struggle to tame the wild frontier, utilizing a volatile mixture of elite soldiers, tribal mercenaries and fanatic volunteers."
 tradition_fp3_irrigation_experts_desc: "This culture are masters of water technology, and through inventiveness and communal effort, they can make even the harshest deserts bloom."
 tradition_fp3_beacon_of_learning_desc: "A nexus of Greek, Indian, and Arabic scholarship, this culture prides itself on scientific advancement."
 tradition_fp3_enlightened_magnates_desc: "This culture has a storied heritage of administrative acumen and poetic skill. A good ruler should possess a glorious mixture of both - or seek counsel with those who do."
 tradition_fp3_jirga_desc: "The elders and leaders of this culture can hold assemblies to solve disputes according to their ancient tribal code - and crown kings of the land. "
 tradition_fp3_pragmatic_creed_desc: "The warriors of this culture are not beholden to pomp, and emphasize the worth and adaptability of the common soldier at the expense of the traditional mounted elite." 
 tradition_fp3_fierce_independence_desc: "Throughout the years, many tyrants have tried to stomp out this culture. But, through resilience and military achievements, it has survived." 
 tradition_ep2_avid_falconers_desc:0 "The art of breeding, training, and hunting with raptors like falcons and hawks is one of most prestigious pastimes among this culture's elite."
 tradition_ce1_ritual_washing_desc: "The purifying properties of water are an essential part of life for this culture and the ritual of ablution occupies a prominent position in their society."
 tradition_ep3_indomitable_azatani_desc: "For this culture's fiercely proud nobles, riding down thunderously from their high strongholds, "The wound of a dagger heals, but that of a tongue — never!""
 tradition_ep3_audacious_cadets_desc: "Restless throngs of younger sons define this culture. Bold and unscrupulous, these horsemen chase dreams of faraway adventure, of mercenary cruelties, and of glorious conquest."
 tradition_ep3_imperial_tagmata_desc: "Elite, well-armored regiments form the backbone of this culture's military campaigns. Their haughty troops have little regard for petty warrior nobles and reckless acts of personal valor; instead, they honor discipline and the hallowed names of their units. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"
 tradition_ep3_roman_ceremonies_desc: "The emperors of the past have bestowed this culture with lingering grandeur, spectacular rites, an awe for the imperial office... and a public life rich with unrest."
 tradition_ep3_palace_politics_desc: "Powerful eunuchs and silk-robed sycophants man a vast political apparatus, impressing with fineries, flattering with honors, and plotting viciously in the name of advancement."
 tradition_ep3_cultivated_sophistication_desc: "Barbarians gaze in envy upon this culture's resplendent luxuries, their society's sophistication. Fueled by a sense of primacy, this culture rejects any contradictions that lie outside their cosmopolitan sphere of influence."
 oath_mend_the_fracture_tradition_desc:0 "From the anger and bloody mistrust, a concilliation emerged. Guided by its oathsworn sovereign, this culture has mended the rift between them and the other peoples of the realm, achieving peace and prosperity."
 tradition_mpo_iron_cavalry_desc: "Even horse peoples can be bested by cavalry clad head-to-hoof in lamellar plate. This culture has not only developed a taste for such expensive armament, but employs those born in the saddle — bow in hand — as its heavily armored riders."
 tradition_mpo_wolves_of_the_deep_steppe_desc: "Far from the touch of 'civilized' comforts, men live by what they can take, and dream of death on their horse's back. Weaker peoples are driven before these warriors."
 tradition_devoted_horsemanship_desc: "Even palatial comforts cannot keep the people of this culture from the saddle. Wherever they find themselves, their herds are there too, and the horses are tended to with a careful eye."
 tradition_mpo_northern_tribes_desc: "This is one of the cultures known generally as the 'Forest People' to their southern neighbors. These northerners are in some places reputable hunters, in others fine river-fishers, sometimes iron-smelters, and often herders."
 tradition_tgp_bushido_desc: "Rooted in a legacy of honor and martial discipline, this tradition elevates the bond between lord and vassal through acts of homage and valor. Strength of character and deeds of integrity forge unshakable loyalty and respect."
 tradition_tgp_rice_cultivators_desc: "Rice is the lifeblood of this culture. Through diligent labor and agricultural know-how, their harvests are rich as long as they control suitable lands for their crop. As a result, their economic prosperity and military might soar high above their less advanced neighbors."
 tradition_tgp_imperial_peace_desc: "Though largely kept safe from invasion by the sea, defending against raids from the north and maintaining Kanmu's peace against pretenders or upstart governors still demands skilled fighters and organization."
 tradition_tgp_defiant_ambushers_desc: "Ever-harried by encroaching invaders, mastery of the saddle and bow allows limited numbers to be used to devastating effect in hit-and-run raiding and ambushes."
 tradition_tgp_warrior_monks_desc: "Devotion to living morally should not preclude the use of force, especially when there is need to protect the religious community from rival sects and corrupt officials, or to defend the needy."
 tradition_tgp_ephemeral_grace_desc: "The aesthetic philosophy of #EMP Mono no Aware#! celebrates the transient beauty of fleeting moments. It fosters a deep harmony with nature and a reflective appreciation of art and life's impermanence."
 tradition_tgp_inward_perfection_desc: "This culture favors self-reliance and the enrichment of inner virtues over foreign influence. Diplomatic ties may wither, but knowledge and introspection flourish in tranquil isolation."
 tradition_cultural_primacy_desc: "This proud culture is content to look to its own rich history and social life, and feels little need to stoop to mingling with its neighbors."
 tradition_maritime_way_of_life_desc: "Since time immemorial the outrigger Catamarans of this culture have been sighted on the horizon. Long sea voyages is a second nature to this people.\nFor someone who consider life at sea natural there are no limits to where they can settle, how they can trade or who they can raid."
 tradition_tgp_hydraulic_builders_desc: "This culture places great importance in utilizing waterworks in spiritual ways. At the center of this fascination is the [GetBuilding('sacred_pool_06').GetName], which tend to be expanded into large reservoirs with utmost religious significance. "
 tradition_tgp_fortified_strongholds_desc: "This culture is characterized by great fortified cities which fulfill religious, military and governmental functions. The protection of those cultural strongholds is critical and foundation of further cities is a matter of great prestige."
 tradition_tgp_religious_hospitality_desc: "This culture is adept at blending foreign religions with their customs, leading to a more cosmopolitan society with many faiths living peacefully amongst each other. Much of this is achieved through trade and international relations."
 tradition_tgp_esoteric_power_desc: "Divine and mysterious are the two words that describe the nobility in the eyes of this culture. Rulers that wish to secure their mandate need to engage in elaborate rituals and manifest their power via the display of divine artifacts."
 tradition_tgp_barangay_confederations_desc: "The rulers of this culture lead many disparate city-states littered along river estuaries and the coast. Such states vary greatly in size, but tend to unite in confederations, which are led by a chief chosen from amongst the members' [Glossary( 'Datu', 'DATU_GLOSS' )]."
 tradition_nudists_desc: "Adherents of this culture do not believe in protecting one's body from the elements, opting instead to live as their creator made them."
 tradition_tgp_mountain_island_desc: "The mountains and forests of the many islands of the Japanese archipelago rise and fall across the ocean, their inhabitants well versed in traversing its rugged and diverse landscapes."
 tradition_stratified_society_desc: "There are those who are born to lead, and then there are those who are born to serve. In a $tradition_stratified_society_name$, the reality of hereditary privilege often overrides the principles of meritocracy and proximity to power is everything."
 tradition_fortress_mastery_desc: "This culture has a long tradition of defensive ingenuity, using the local terrain to shield their homeland and repel would-be invaders. They pair this skill with mastery of the bow and agile troops, capable of outmanoeuvring any foe."
 tradition_tgp_art_of_war_desc: "This culture has studied military theory for a thousand years, and its generals and marshals have at their disposal a rich crop of military manuals and text books. This wealth of knowledge is only overshadowed by a great technical understanding of how to make strong armor and weapons."
 tradition_tgp_court_machinations_desc: "Within the labyrinthine halls of the court, eunuchs hold sway, consorts vie for favor, and whispers of treachery echo through gilded chambers."
 tradition_scholar_officials_desc: "The pen and brush is mightier than the sword... This culture strongly believes in an ideal where influence is given to loyal officials educated in the noble arts."
 tradition_sinophilic_desc: "The influence of the Chinese hegemony over this realm has led to many of its people adopting customs from them."
 tradition_tgp_japanese_houses_desc: "While the norms of marriage are important to maintain for appearances and legal expediency, pleasure is a natural gift bestowed by the gods and vital to good health, whatever the ramifications on pedigree."
 tradition_cultivation_desc: "Tuning the body, the breath, and the mind until the mud of the heart settles and inner virtue rises like clear water."
 tradition_intensive_farming_desc: "This culture highly values a large farming class that supports its non-agrarian population. Through millennia of experience they have been able to greatly increase the output of wheat and rice depending on what fits the local circumstances the best."
 
