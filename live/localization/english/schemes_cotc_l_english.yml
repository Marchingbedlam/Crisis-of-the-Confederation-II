l_english:
 steal_technology_character: "Steal Technology From Ruler"
 steal_technology_character_action: "Steal Technology From"
 steal_technology_character_desc: "I will steal a [local_innovation_cotc|E] from [SCHEME.GetTargetCharacter.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 steal_technology_desc_general: "The $steal_technology_character$ [scheme|E] is a [hostile_scheme|E] that aims to steal a [local_innovation_cotc|E] from a foreign [system|E] and replicate it in the [scheme_owner|E]'s [capital|E]. The [scheme_target|E] can be either a $game_concept_system$ or a [ruler|E]."
 steal_technology_character_desc_general: "$steal_technology_desc_general$\n\n$steal_technology_character$ $game_concept_schemes$ that target a $game_concept_ruler$ can recruit [agents|E] from that $game_concept_ruler$'s [court|E], but will fail if the $game_concept_ruler$ dies or is removed from power."
 steal_technology_successful_roll_tt: "[st_home_county.GetNameNoTier] gains a random [local_innovation_cotc|E] from [st_target_county.GetNameNoTier]"
 STEAL_TECHNOLOGY_CHARACTER_SUCCESS_DESC: "Your [capital|E] gains a random [local_innovation_cotc|E] from [TARGET_CHARACTER.GetCapitalLocation.GetTitle.GetNameNoTier]"
 STEAL_TECHNOLOGY_CHARACTER_DISCOVERY_DESC: "[TARGET_CHARACTER.GetShortUIName|U] will not discover the attempted theft"
 can_steal_at_least_one_tech.tt: "[temp_target_name.GetNameNoTier] can research at least one [local_innovation_cotc|E] known in [temp_county_name.GetNameNoTier]"
 
 start_steal_technology_character_interaction: "Steal Technology From Ruler #weak (Scheme)#!"
 start_steal_technology_character_interaction_notification: "Steal Technology"
 start_steal_technology_character_interaction_notification_puppeteer: "[puppet_or_actor.GetShortUIName] has begun a Steal Technology scheme against [recipient.GetShortUIName]"
 scheme_interaction_tt_steal_technology_character_approved: "Attempt to steal a random [local_innovation_cotc|E] from [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] and replicate it in [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]\n\nThis [scheme|E] will target [recipient.GetShortUINamePossessiveNoTooltip] government, allowing you to recruit local [agents|E] but invalidating the $game_concept_scheme$ if [recipient.Custom('GetThey')] lose[recipient.Custom('GetGenderPlural')] power."
 
 start_steal_technology_interaction.tt.agent_focus_balance: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_hacker' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_planner' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_spy' ).GetName]"
 start_steal_technology_interaction.tt.agent_focus_success: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_hacker' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_spy' ).GetName]"
 start_steal_technology_interaction.tt.agent_focus_speed: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_planner' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_spy' ).GetName]"
 start_steal_technology_interaction.tt.agent_focus_secrecy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_spy' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_spy' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]"