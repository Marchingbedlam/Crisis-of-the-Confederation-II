l_english:
 state_capacity: "[state_capacity_cotc|E]"
 state_capacity_0: "Failed State"
 state_capacity_0_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Vassals' [titles|E] cannot be inherited by Characters outside the [realm|E]#!"
 state_capacity_0_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Can control #V 40#! Systems without allowing border wars."
 state_capacity_1: "Fragile State"
 state_capacity_1_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Can establish [tributaries|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Rulers can change between available Partition [succession_laws|E]#!\n$EFFECT_LIST_BULLET$[titles|E] can be revoked\n$EFFECT_LIST_BULLET$[vassals|E] can be retracted"
 state_capacity_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] cannot wage [war|E] against other Vassals unless they use a [hook|E] on their [liege|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Can control #V 84#! Systems without allowing border wars."
 state_capacity_2: "Functional State"
 state_capacity_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Rulers can change between all available [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 All Vassals who refuse Title revocation or Vassal retraction are considered [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! cost is reduced"
 state_capacity_2_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Cost for [liege|E] to call upon [provincial_armies|E]: [influence_i|E]#P -[EmptyScope.ScriptValue('admin_law_cost_reduction_value')|+0%]#!#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] cannot wage any [war|E] unless they use a [hook|E] on their [liege|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Can control #V 160#! Systems without allowing border wars."
 state_capacity_3: "Strong State"
 state_capacity_3_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Cost for [liege|E] to call upon [provincial_armies|E]: [influence_i|E]#P -[EmptyScope.ScriptValue('admin_law_cost_reduction_high_value')|+0%]#!#!"
 state_capacity_3_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] can never declare [war|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Can control #V 250#! Systems without allowing border wars."