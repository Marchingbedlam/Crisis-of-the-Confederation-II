l_english:
 popular_elective_succession_law: "Popular Elective"
 popular_elective_succession_law_subname: "Most Popular Candidate Inherits"
 popular_elective_succession_law_effects: "Upon succession, the general population will elect the next ruler. Voters usually want a charismatic, credible leader who shares their ideological beliefs. Candidates may also campaign to increase their chance of being elected."
 military_appointment_succession_law: "Military Appointment"
 military_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 military_appointment_succession_law_effects: "\n#V A type of [appointment_succession_law|E]. Under $military_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the Candidate with the highest [candidate_score|E].\n\nAny [adult|E] in the [realm|E] who is eligible for [military_power_base_adj|E] service may strive to be appointed to this position. Candidates with high [martial_skill|E] are favored.\n#!"
 commercial_appointment_succession_law: "Commercial Appointment"
 commercial_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 commercial_appointment_succession_law_effects: "\n#V A type of [appointment_succession_law|E]. Under $commercial_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the Candidate with the highest [candidate_score|E].\n\nAny [adult|E] in the [realm|E] who does not hold a [military_power_base_adj|E] or [bureaucratic_power_base_adj|E] title may strive to be appointed to this position. Candidates with high [diplomacy_skill|E] and [stewardship_skill|E] are favored.\n#!"
 technocratic_appointment_succession_law: "Technocratic Appointment"
 technocratic_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 technocratic_appointment_succession_law_effects: "\n#V A type of [appointment_succession_law|E]. Under $technocratic_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the Candidate with the highest [candidate_score|E].\n\nAny [adult|E] in the [realm|E] who does not hold a [military_power_base_adj|E] or [bureaucratic_power_base_adj|E] title may strive to be appointed to this position. Candidates with high [learning_skill|E] are favored.\n#!"
 theocratic_appointment_succession_law: "Theocratic Appointment"
 theocratic_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 theocratic_appointment_succession_law_effects: "\n#V A type of [appointment_succession_law|E]. Under $theocratic_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the Candidate with the highest [candidate_score|E].\n\nAny [adult|E] [clergy|E] in the [realm|E] shares the [state_faith|E] and does not hold a [military_power_base_adj|E] or [commercial_power_base_adj|E] title may strive to be appointed to this position. Candidates with high [learning_skill|E] are favored.\n#!"
 federal_elective_succession_law: "Federal Elective"
 federal_elective_succession_law_effects: "Upon succession, a college consisting of the current [ruler|E] and the rulers of [member_states_cotc|E] will elect the next ruler."
 federal_elective_electors: "Ruler and Member-States"
 federal_elective_electors_tooltip: "In order to be a valid [elector|E] under Federal Elective, a [vassal|E] must be a [member_state_cotc|E]."
 federal_elective_candidates: "Claimants, Direct Vassals, De Jure Vassals, and Councillors"
 federal_elective_candidates_tooltip: "In order to be a valid Candidate under Federal Elective, a character must not be a child or incapable, and must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a [claimant|E] to the title.\n$EFFECT_LIST_BULLET$"Be a direct [vassal|E] of the ruler.\n$EFFECT_LIST_BULLET$Be a [de_jure|E] Vassal or lower of the title.\n$EFFECT_LIST_BULLET$Be a member of the ruler's [council|E]."
 collegiate_elective_succession_law: "Collegiate Elective"
 collegiate_elective_succession_law_effects: "Upon succession, a college appointed by the current [ruler|E] and the rulers of [member_states_cotc|E] will elect the next ruler. Each appoints a number of electors proportionate to the population of their [realm|E]."
 collegiate_elective_electors: "Ruler and Member-States"
 collegiate_elective_electors_tooltip: "In order to be a valid [elector|E] under Federal Elective, a [vassal|E] must be a [member_state_cotc|E]."
 collegiate_elective_candidates: "Claimants, Direct Vassals, De Jure Vassals, and Councillors"
 collegiate_elective_candidates_tooltip: "In order to be a valid Candidate under Federal Elective, a character must not be a child or incapable, and must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a [claimant|E] to the title.\n$EFFECT_LIST_BULLET$"Be a direct [vassal|E] of the ruler.\n$EFFECT_LIST_BULLET$Be a [de_jure|E] Vassal or lower of the title.\n$EFFECT_LIST_BULLET$Be a member of the ruler's [council|E]."
 
