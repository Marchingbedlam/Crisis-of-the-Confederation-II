 support_bill_intent: "Support Bill"
 support_bill_intent_desc: "You don't really care what's in the bill, you just want it to pass for personal reasons."
 block_bill_intent: "Block Bill"
 block_bill_intent_desc: "You don't really care what's in the bill, you just want it to fail for personal reasons."
 balance_budget_intent: "Balance Budget"
 balance_budget_intent_desc: "You intend to make sure that the realm spends no more than it can afford, and you don't care what needs to be cut to achieve that."
 balance_budget_maintain_military_intent: "Balance Budget - No Military Cuts"
 balance_budget_maintain_military_intent_desc: "You must make sure that the realm spends no more than it can afford, but the military is vital. Any cuts must be made elsewhere."
 balance_budget_maintain_ministry_intent: "Balance Budget - No Development Cuts"
 balance_budget_maintain_ministry_intent_desc: "You must make sure that the realm spends no more than it can afford, but long-term economic development is vital. Any cuts must be made elsewhere."
 balance_budget_maintain_salary_intent: "Balance Budget - No Administrative Cuts"
 balance_budget_maintain_salary_intent_desc: "You must make sure that the realm spends no more than it can afford, but research and education are vital. Any cuts must be made elsewhere."
 increase_military_budget_intent: "Increase Military Spending"
 increase_military_budget_intent_desc: "The realm is defenseless. You intend to ensure that the military gets a bigger share of the budget."
 increase_ministry_budget_intent: "Increase Development Spending"
 increase_ministry_budget_intent_desc: "The realm is desperate for state-sponsored investment in the economy."
 increase_salary_budget_intent: "Increase Administrative Spending"
 increase_salary_budget_intent_desc: "Intellectual pursuits have been severely neglected by the realm. You intend to ensure that administrative worlds get a bigger share of the budget."
 
