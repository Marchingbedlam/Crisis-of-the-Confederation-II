 tax_bill_provisions_custom_loc: "\"That the tax code of [bill_title.GetDefinitiveName] be amended as follows:\n$BULLET$#indent_newline:2 [military_power_base_adj] Taxes: [bill.MakeScope.ScriptValue('proposed_military_tax_rate')]%#!\n$BULLET$#indent_newline:2 [commercial_power_base_adj] Taxes: [bill.MakeScope.ScriptValue('proposed_commercial_tax_rate')]%#!\n$BULLET$#indent_newline:2 [technocratic_power_base_adj] Taxes: [bill.MakeScope.ScriptValue('proposed_technocratic_tax_rate')]%#!\n$BULLET$#indent_newline:2 [theocratic_power_base_adj] Taxes: [bill.MakeScope.ScriptValue('proposed_theocratic_tax_rate')]%#!\"\n\nOfficials estimate that this tax code will bring in a monthly revenue of [bill.MakeScope.ScriptValue('proposed_total_tax_income')|2] million credits per month, as opposed to the current tax code's [bill.MakeScope.Var('ruler').ScriptValue('current_total_tax_income')|2] million credits per month.[bill.Custom('GetBillEarmarks')]"
 tax_bill_provisions_post: ""That the tax code of [title.GetDefinitiveName] be amended as follows:\n$BULLET$#indent_newline:2 [military_power_base_adj] Taxes: [proposed_military_tax_rate]%#!\n$BULLET$#indent_newline:2 [commercial_power_base_adj] Taxes: [proposed_commercial_tax_rate]%#!\n$BULLET$#indent_newline:2 [technocratic_power_base_adj] Taxes: [proposed_technocratic_tax_rate]%#!\n$BULLET$#indent_newline:2 [theocratic_power_base_adj] Taxes: [proposed_theocratic_tax_rate]%#!\"[ROOT.Char.Custom('GetPostBillEarmarks')]"
 
