 game_concept_county_demand: "Demand"
 game_concept_demand: "Demand"
 game_concept_demand_i: "Demand"
 game_concept_county_demand_desc: "Demand is a rough measure of the economic needs of the population in a [system|E]. It is primarily increased by constructing new [holdings|E] and upgrading [population_buildings|E].\n\nIf Demand is higher than [development|E], people's needs will go unmet and the population will become unhappy, causing a loss of [county_opinion|E] and [control|E]. If Demand is much higher than [development|E], [population_buildings|E] may be forcibly downgraded as people flee or die off.\n\nConversely, if [development|E] is much higher than Demand, a high standard of living may draw settlers, upgrading [population_buildings|E] for free."
 
 game_concept_population_building: "Population Building"
 game_concept_population_buildings: "Population Buildings"
 game_concept_population: "Population"
 game_concept_populations: "Populations"
 game_concept_population_building_desc: "Population Buildings represent the overall level of population in a [holding|E].\n\nA larger population means a larger workforce, so upgrading a Population Building increases [income|E] and allows the construction of additional [buildings|E].\n\nHowever, increasing population also comes with costs - a larger population is harder to [control|E], and has less [epidemic_resistance|E].\n\nAdditionally, a larger population will lead to higher [demand|E]."
 
 game_concept_legitimacy_type: "Legitimacy Type"
 game_concept_political_legitimacy: "Political Legitimacy"
 game_concept_legitimacy_cotc: "Legitimacy"
 game_concept_legitimate_cotc: "Legitimate"
 game_concept_legitimacy_type_desc: "A [government|E]'s $game_concept_legitimacy_type$ is the basis on which it justifies its right to govern society. Your $game_concept_legitimacy_type$ determines which [succession_laws|E] are available."
 
 game_concept_federation_cotc: "Federation"
 game_concept_federations_cotc: "Federations"
 game_concept_federal_cotc: "Federal"
 game_concept_confederation_cotc: "Confederation"
 game_concept_confederations_cotc: "Confederations"
 game_concept_confederate_cotc: "Confederate"
 game_concept_federation_cotc_desc: "$game_concept_federal_cotc$ [governments|E] derive their legitimacy from a formal agreement between member states.\n\n$BULLET$#indent_newline:2 Must be a [duchy|E] or higher\n$BULLET$#indent_newline:2 Can have [member_states_cotc|E]#!\n$BULLET$#indent_newline:2 Can use federal [succession_laws|E]#!\n$BULLET$#indent_newline:2 Has a [federal_territory_cotc|E]" 
 concept_federal_cotc_custom_loc: "[federal_cotc|E]"
 
 game_concept_aristocracy_cotc: "Aristocracy"
 game_concept_aristocratic_cotc: "Aristocratic"
 game_concept_monarchy_cotc: "Monarchy"
 game_concept_monarchies_cotc: "Monarchies"
 game_concept_aristocracy_cotc_desc: "$game_concept_aristocratic_cotc$ [governments|E] derive their legitimacy from heredity and traditional notions of property rights.\n\n$BULLET$#indent_newline:2 Can use hereditary [succession_laws|E]#!"
 concept_aristocratic_cotc_custom_loc: "[aristocratic_cotc|E]"
 
 game_concept_democracy_cotc: "Democracy"
 game_concept_democratic_cotc: "Democratic"
 game_concept_republic_cotc: "Republic"
 game_concept_republics_cotc: "Republics"
 game_concept_democracy_cotc_desc: "$game_concept_democratic_cotc$ [governments|E] derive their legitimacy from the consent of the governed.\n\n$BULLET$#indent_newline:2 Can use elective [succession_laws|E]#!"
 concept_democratic_cotc_custom_loc: "[democratic_cotc|E]"
 
 game_concept_meritocracy_cotc: "Meritocracy"
 game_concept_meritocratic_cotc: "Meritocratic"
 game_concept_administrative_cotc: "Administrative"
 game_concept_administration_cotc: "Administration"
 game_concept_administrations_cotc: "Administrations"
 game_concept_meritocracy_cotc_desc: "$game_concept_meritocratic_cotc$ [governments|E] derive their legitimacy from a higher authority, or from a long line of chosen successors.\n\n$BULLET$#indent_newline:2 Can use [appointment_succession_laws|E]#!"
 concept_meritocratic_cotc_custom_loc: "[meritocratic_cotc|E]"
 
 game_concept_power_base: "Power Base"
 game_concept_power_bases: "Power Bases"
 game_concept_base_power: "Base Power"
 game_concept_power_base_desc: "A [government|E]'s $game_concept_power_base$ is the means by which the state controls society. Your $game_concept_power_base$ determines your primary [holding_type|E], your [obligations|E] to your [liege|E], and your share of the [treasury_budget|E]."
 
 game_concept_commercial_power_base: "Commercial Government"
 game_concept_commercial_power_base_adj: "Commercial"
 game_concept_commercial_power_base_desc: "$game_concept_commercial_power_base_adj$ [governments|E] [base_power|E] on control of resources and the economy.\n\n$BULLET$#indent_newline:2 Primary [holding_type|E]: [commercial_holding|E]#!\n$BULLET$#indent_newline:2 [commercial_holdings|E] operate at full effiency#!"
 concept_commercial_power_base_adj_custom_loc: "[commercial_power_base_adj|E]"
 
 game_concept_military_power_base: "Military Government"
 game_concept_military_power_base_adj: "Military"
 game_concept_military_power_base_desc: "$game_concept_military_power_base_adj$ [governments|E] [base_power|E] on control of the armed forces.\n\n$BULLET$#indent_newline:2 Primary [holding_type|E]: [military_holding|E]#!\n$BULLET$#indent_newline:2 May control [city_holdings|E] at reduced efficiency#!\n$BULLET$#indent_newline:2 Can receive [treasury|E] from their [liege|E]'s [treasury_military_budget|E]#!"
 concept_military_power_base_adj_custom_loc: "[military_power_base_adj|E]"
 
 game_concept_technocratic_power_base: "Technocratic Government"
 game_concept_technocratic_power_base_adj: "Technocratic"
 game_concept_technocratic_power_base_desc: "$game_concept_technocratic_power_base_adj$ [governments|E] [base_power|E] on control through bureaucracy and ideology.\n\n$BULLET$#indent_newline:2 Primary [holding_type|E]: [administrative_holding|E]#!\n$BULLET$#indent_newline:2 May control [city_holdings|E] at reduced efficiency#!\n$BULLET$#indent_newline:2 Can receive [treasury|E] from their [liege|E]'s [treasury_military_budget|E]#!\n$BULLET$#indent_newline:2 Can have a [state_faith|E]#!"
 concept_technocratic_power_base_adj_custom_loc: "[commercial_power_base_adj|E]"
 
 game_concept_theoocratic_power_base: "Theocratic Government"
 game_concept_theocratic_power_base_adj: "Theocratic"
 game_concept_theocratic_power_base_desc: "$game_concept_theocratic_power_base_adj$ [governments|E] [base_power|E] on control through religion.\n\n$BULLET$#indent_newline:2 Primary [holding_type|E]: [administrative_holding|E]#!\n$BULLET$#indent_newline:2 May control [city_holdings|E] at reduced efficiency#!\n$BULLET$#indent_newline:2 Can receive [treasury|E] from their [liege|E]'s [treasury_military_budget|E]#!\n$BULLET$#indent_newline:2 Can have a [state_faith|E]#!\n$BULLET$#indent_newline:2 Rulers are considered Priests#!"
 concept_theocratic_power_base_adj_custom_loc: "[commercial_power_base_adj|E]"
 
 game_concept_authority_type_cotc: "Authority Type"
 game_concept_authority_types_cotc: "Authority Types"
 game_concept_authority_cotc: "Authority"
 game_concept_authority_type_cotc_desc: "A [government|E]'s $game_concept_authority_type_cotc$ is the degree of power it entrusts to the [ruler|E]. Your $game_concept_authority_type_cotc$ determines how much power you have over your [realm|E]."
 
 game_concept_despotism_cotc: "Despotism"
 game_concept_despotic_cotc: "Despotic"
 game_concept_despotism_cotc_desc: "$game_concept_despotic_cotc$ [governments|e] make no distinction between personal and institutional power - the [ruler|E] is the [realm|E] and the [realm|E] is the [ruler|E].\n\n$BULLET$#indent_newline:2 Can have a [royal_court|E]#!\n$BULLET$#indent_newline:2 Uses [gold|E] instead of [treasury|E]#!"
 
 game_concept_dictatorship_cotc: "Dictatorship"
 game_concept_dictatorial_cotc: "Dictatorial"
 game_concept_dictatorship_cotc_desc: "$game_concept_dictatorial_cotc$ [governments|E] are led by a single [ruler|E] whose [authority_cotc|E] is absolute, but who is nevertheless considered to be bound by the rule of law and whose personal authority is distinct from that of the state.\n$BULLET$#indent_newline:2 Can have a [royal_court|E]#!"
 
 game_concept_separation_of_powers_cotc: "Separation of Powers"
 game_concept_presidential_system_cotc: "Presidential System"
 game_concept_presidential_cotc: "Presidential"
 game_concept_separation_of_powers_cotc_desc: "$game_concept_presidential_cotc$ [governments|E] balance power over the state between a [ruler|E] who controls the executive branch and a [legislature_cotc|E] that controls legislation.\n$BULLET$#indent_newline:2 Can have a [legislature_cotc|E]#!\n$BULLET$#indent_newline:2 The [ruler|E] can propose [bills_cotc|E]#!"
 
 game_concept_parliamentarianism_cotc: "Parliamentarianism"
 game_concept_parliamentarian_cotc: "Parliamentarian"
 game_concept_parliamentary_system_cotc: "Parliamentary System"
 game_concept_parliamentarianism_cotc_desc: "$game_concept_parliamentarian_cotc$ [governments|E] subordinate the [ruler|E] to the [legislature_cotc|E], electing a [prime_minister_cotc|E] who takes on many of the Ruler's powers.\n$BULLET$#indent_newline:2 Can have a [legislature_cotc|E]#!\n$BULLET$#indent_newline:2 Can have a [prime_minister_cotc|E]#!\n$BULLET$#indent_newline:2 The [ruler|E] and [prime_minister_cotc|E] can both propose [bills_cotc|E]#!"
 
 game_concept_legislature_cotc: "Legislature"
 game_concept_legislatures_cotc: "Legislatures"
 game_concept_legislator_cotc: "Legislator"
 game_concept_legislators_cotc: "Legislators"
 game_concept_legislative_cotc: "Legislative"
 game_concept_senate_cotc: "Senate"
 game_concept_senates_cotc: "Senates"
 game_concept_senator_cotc: "Senator"
 game_concept_senators_cotc: "Senators"
 game_concept_parliament_cotc: "Parliament"
 game_concept_parliaments_cotc: "Parliaments"
 game_concept_mp_cotc: "MP"
 game_concept_mp_cotc: "MPs"
 game_concept_legislature_cotc_desc: "Some [governments|E] have $game_concept_legislatures_cotc$ - representative assemblies independent of the [ruler|E], which have the authority to enact laws.\n\nIf your government has a legislature, you will be unable to change laws by decree, and must instead pass a [bill_cotc|E].\n\nYou can see a list of any $game_concept_legislatures_cotc$ you are involved in in the [situation|E] panel, and a list of [bills_cotc|E] you can pass in the [activities|E] panel."
 
 game_concept_bill_cotc: "Bill"
 game_concept_bills_cotc: "Bills"
 game_concept_bill_cotc_desc: "A $game_concept_bill_cotc$ is an [activity|E] inviting the [legislature_cotc|E] to vote on a new [law|E] or [laws|E].\n\nLegislators will divide themselves into [bill_supporters_cotc|E] and [bill_opponents_cotc|E] based on their opinions of the proposal. At the end of the debate phase, if the $game_concept_bill_cotc$ has more [bill_supporters_cotc|E] than the required majority, it will be adapted as a [law|E]."
 
 game_concept_special_motion_cotc: "Motion"
 game_concept_special_motions_cotc: "Motions"
 game_concept_special_motion_cotc_desc: "A $game_concept_special_motion_cotc$ is an [activity|E] inviting the [legislature_cotc|E] to authorize some special action.\n\nLegislators will divide themselves into [bill_supporters_cotc|E] and [bill_opponents_cotc|E] based on their opinions of the proposal. At the end of the debate phase, if the $game_concept_special_motion_cotc$ has more [bill_supporters_cotc|E] than the required majority, the motion will pass."
 
 game_concept_bill_supporter_cotc: "Supporter"
 game_concept_bill_supporters_cotc: "Supporters"
 game_concept_bill_supporter_cotc_desc: "$game_concept_bill_supporters_cotc$ are [legislators_cotc|E] who support the current [bill_cotc|E] or [special_motion_cotc|E] and intend to vote for it. They may be persuaded otherwise by lobbyists or persuasive speeches."
 
 game_concept_bill_opponent_cotc: "Opponent"
 game_concept_bill_opponents_cotc: "Opponents"
 game_concept_bill_opponent_cotc_desc: "$game_concept_bill_opponents_cotc$ are are [legislators_cotc|E] who oppose the current [bill_cotc|E] or [special_motion_cotc|E] and intend to vote against it. They may be persuaded otherwise by lobbyists, persuasive speeches, or backroom deals."
 
 game_concept_no_confidence_motion_cotc: "Vote of No Confidence"
 game_concept_no_confidence_motions_cotc: "Votes of No Confidence"
 game_concept_no_confidence_cotc: "No Confidence"
 game_concept_no_confidence_motion_cotc_desc: "A $game_concept_no_confidence_motion$ is a [special_motion_cotc|E] claiming that the current [prime_minister_cotc|E] no longer commands the confidence of the [legislature_cotc|E], and calling for their replacement with a new [prime_minister_cotc|E].\n\n[legislators_cotc|E] may vote for either the incumbent or the challenger, and at the end of the debate phase, whichever candidate has more votes will become or remain [prime_minister_cotc|E]."
 
 game_concept_prime_minister_cotc: "Prime Minister"
 game_concept_prime_ministers_cotc: "Prime Ministers"
 game_concept_minister_president_cotc: "Minister-President"
 game_concept_ministers_president_cotc: "Ministers-President"
 game_concept_premier_cotc: "Premier"
 game_concept_premiers_cotc: "Premiers"
 game_concept_premiership_cotc: "Premiership"
 game_concept_premierships_cotc: "Premierships"
 game_concept_first_minister_cotc: "First Minister"
 game_concept_first_ministers_cotc: "First Ministers"
 game_concept_prime_minister_cotc_desc: "A $game_concept_prime_minister_cotc$ is a type of [diarch|E] available to [parliamentarian_cotc|E] [governments|E], who takes on many of the powers normally available to the [ruler|E].\n\nThe $game_concept_prime_minister_cotc$ is elected by the [legislature_cotc|E], and has the power to convene the [legislature_cotc|E] and propose [bills_cotc|E] and [special_motions_cotc|E].\n\nThe $game_concept_prime_minister_cotc$ is accountable to the [legislature_cotc|E], and may be replaced if the [legislature_cotc|E] passes a [no_confidence_motion_cotc|E]."
 
 game_concept_province_cotc: "Province"
 game_concept_provinces_cotc: "Provinces"
 game_concept_provincial_cotc: "Provincial"
 game_concept_province_cotc_desc: "$game_concept_provinces_cotc$ are administrative subdivisions with their own [treasury|E]. They are expected to provide their [liege|E] with [taxes|E] and [levies|E], and in return receive funding from their liege's treasury. They are required to obey their liege's [laws|E], but are otherwise free to govern themselves."
 
 game_concept_subordinate_cotc: "Subordinate"
 game_concept_subordinates_cotc: "Subordinates"
 game_concept_subordinate_cotc_desc: "$subordinates_cotc$ are [vassals|E] who rule and govern on behalf of a superior. They pay more in [taxes|E] and are expected to obey [directives|E]."
 
 game_concept_commercial_holding: "$city_holding$"
 game_concept_commercial_holdings: "$city_holding$s"
 game_concept_commercial_holding_desc: "TBD"
 
 game_concept_military_holding: "$castle_holding$"
 game_concept_military_holdings: "$castle_holding$s"
 game_concept_military_holding_desc: "TBD"
 
 game_concept_administrative_holding: "$temple_holding$"
 game_concept_administrative_holdings: "$temple_holding$s"
 game_concept_administrative_holding_desc: "TBD"
 
 game_concept_member_state_cotc: "Member State"
 game_concept_member_states_cotc: "Member States"
 game_concept_members_cotc: "Members"
 game_concept_member_state_cotc_desc: "A $game_concept_member_state_cotc$ is a [province_cotc|E] of a [federation_cotc|E] with special rights, including self-government and the right to vote in federal elections. Member States are expected to pay taxes and contribute to the federal military, but are otherwise exempt from federal laws."
 
 game_concept_federal_territory_cotc: "Federal Territory"
 game_concept_federal_territories_cotc: "Federal Territories"
 game_concept_territory_cotc: "Territory"
 game_concept_territories_cotc: "Territories"
 game_concept_federal_territory_cotc_desc: "A $game_concept_federal_territory_cotc$ is a [province_cotc|E] of a [federation_cotc|E] that is not a full member state, but rather a possession of the federal government. They do not have voting rights or the legal exemptions of full member states."
 
 game_concept_state_capacity_cotc: "State Capacity"
 game_concept_state_capacity_cotc_desc: "$game_concept_state_capacity_cotc$ is the ability of a non-[despotic_cotc|E] [realm|E] to control its [vassals|E] and govern its territories. Unlike [crown_authority|E], $game_concept_vassals$ cannot form Liberty [factions|E] to reduce $game_concept_state_capacity_cotc$. However, it can never be higher than the [ruler|E]'s [legitimacy_level|E].\n\nOnly the [top_liege|E] can change $game_concept_state_capacity$. Non-$game_concept_despotic_cotc$ $game_concept_vassals$ use the same level as their $game_concept_liege$.\n\nThere are four levels of $game_concept_state_capacity$:\n$EFFECT_LIST_BULLET$$state_capacity_0$\n$EFFECT_LIST_BULLET$$state_capacity_1$\n$EFFECT_LIST_BULLET$$state_capacity_2$\n$EFFECT_LIST_BULLET$$state_capacity_3$\n\nIncreasing $game_concept_state_capacity_cotc$ costs an amount of [prestige|E] depending on [realm_size|E] and the ruler's [learning_skill|E], and requires the unanimous approval of any [powerful_vassals|E]."