 game_concept_county_demand: "Demand"
 game_concept_demand: "Demand"
 game_concept_demand_i: "Demand"
 game_concept_county_demand_desc: "Demand is a rough measure of the economic needs of the population in a [system|E]. It is primarily increased by constructing new [holdings|E] and upgrading [population_buildings|E].\n\nIf Demand is higher than [development|E], people's needs will go unmet and the population will become unhappy, causing a loss of [county_opinion|E] and [control|E]. If Demand is much higher than [development|E], [population_buildings|E] may be forcibly downgraded as people flee or die off.\n\nConversely, if [development|E] is much higher than Demand, a high standard of living may draw settlers, upgrading [population_buildings|E] for free."
 game_concept_population_building: "Population Building"
 game_concept_population_buildings: "Population Buildings"
 game_concept_population: "Population"
 game_concept_populations: "Populations"
 game_concept_population_building_desc: "Population Buildings represent the overall level of population in a [holding|E].\n\nA larger population means a larger workforce, so upgrading a Population Building increases [income|E] and allows the construction of additional [buildings|E].\n\nHowever, increasing population also comes with costs - a larger population is harder to [control|E], and has less [epidemic_resistance|E].\n\nAdditionally, a larger population will lead to higher [demand|E]."