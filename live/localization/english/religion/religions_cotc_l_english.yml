 machine_cult: "Machine Cults"
 machine_cult_adj: "Machine Cultic"
 machine_cult_adherent: "Machine Cultist"
 machine_cult_adherent_plural: "Machine Cultists"
 machine_cult_desc: "#M \"Before honoring any request for spiritual intercession, first ensure that the supplicant has performed the Blessed Rite of Powercycling.\"\n - Catechisms of Maintenance, 2887#!\n\nOften derided by outsiders as \"toaster-worshippers\", Machine Cultists are followers of any number of myriad shamanistic cults that believe machines themselves to be alive and filled with spirits."
 