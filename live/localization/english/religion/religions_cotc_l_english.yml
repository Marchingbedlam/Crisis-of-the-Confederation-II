 rf_criminal:0 "Criminal"
 rf_criminal_opinion:0 "[GetReligionFamily('rf_criminal').GetName] Opinion"
 criminal_hostility_doctrine_name:0 "Criminal"
 criminal_hostility_doctrine_desc:0 "The following ideologies are Criminal:\n[GetReligionFamily('rf_criminal').GetReligions]"
 
 metroplanetism_ideology:0 "Metroplanetism"
 metroplanetism_ideology_adj:0 "Metroplanetist"
 metroplanetism_ideology_adherent:0 "Metroplanetist"
 metroplanetism_ideology_adherent_plural:0 "Metroplanetists"
 metroplanetism_ideology_desc:0 "Metroplanetism is the dominant political ideology of the Core Worlds, derived from a simple, straightforward interpretation of commonality and the simple material reality of Earth’s massive outsize influence on human civilization. Metroplanetists “cash out” commonality in the most straightforward way, with the belief that there should be a single pan-human government. This government is the Confederation. Additionally, metroplanetists believe that the natural seat of power for this government is Earth, the metroplanetes, or mother planet."
 
 terran_federalist:0 "Terran Federalism"
 terran_federalist_adj:0 "Terran Federalist"
 terran_federalist_adherent:0 "Federalist"
 terran_federalist_adherent_plural:0 "Federalists"
 terran_federalist_desc:0 "#M \"Above all, we recognize this, that all men are brothers and all women sisters, the sons and daughters of Earth.\"\n - Fourth Treaty of Terra, 2489#!\n\nThe Terran Federalist Party is one of the two primary political parties of the Terran Confederation. Terran Federalism, a secular, democratic, humanist ideology, supports the ideal of a single united human state, a democratic federation with its capital on Terra. Their beliefs loosely center upon the principle of Metroplanetism: that there should be a single pan-human federal government and Terra is the metroplanetes, mother planet, of humanity. Federalists favor a more decentralized federalized form of government, where all members of the Confederation answer to Terra but have a substantial say in the governance of the state."
 
 terran_republican:0 "Terran Republicanism"
 terran_republican_adj:0 "Terran Republican"
 terran_republican_adherent:0 "Republican"
 terran_republican_adherent_plural:0 "Republicans"
 terran_republican_desc:0 "#M \"The most stringent cries for freedom are always those of the slavers and warlords.\"\n - President Morgan Afolayan, 2998#!\n\nThe Terran Republican Party is one of the two primary political parties of the Terran Confederation. Terran Republicanism, a secular, democratic, humanist ideology, supports the ideal of a single united human state, a centralized republic with its capital on Terra. Their beliefs firmly center upon the principle of Metroplanetism: a single pan-human unitary government with Terra as the metroplanetes, mother planet, of humanity. Republicans favor a more centralized bureaucratic form of government where the member planets of the Confederation answer to Terra with minimal say in governance, and Terra has an overwhelming role in governance."
 
 universalist:0 "Universalism"
 universalist_adj:0 "Universalist"
 universalist_adherent:0 "Universalist"
 universalist_adherent_plural:0 "Universalists"
 universalist_desc:0 "#M \"Workers of all worlds, unite!\"\n - Unknown#!\n\nUniversal Socialism, better known as simply Universalism, is a political school of thought that combines traditional socialism with Metroplanetism. Universalists advocate for the transformation of the Terran Confederation into a federation of socialist states."
 
 terran_imperialist:0 "Terran Imperialism"
 terran_imperialist_adj:0 "Terran Imperialist"
 terran_imperialist_adherent:0 "Imperialist"
 terran_imperialist_adherent_plural:0 "Imperialist"
 terran_imperialist_desc:0 "#M \"It takes a peculiar sort of mind to witness the horrors of the Crisis and still say, ‘Yes, democracy will be our salvation.’\"\n - Captain-General Luo Tao, 3007#!\n\nTerran Imperialism, an illiberal, chauvinist ideology, seeks to unite humanity under the rule of a strong autocratic dictatorship centered on Terra. Imperialists believe in the principle of Metroplanetism, but they reject the democratic norms of the Terran Confederation: this is due to Terran Imperialism explicitly believing Terrans are better than other humans and entitled to rule the Confederation as their birthright. They heavily favor militarism and autocracy, seeing the colonies and outer planets as too disunited and chaotic to govern themselves."
 
 separatism_ideology:0 "Separatism"
 separatism_ideology_adj:0 "Separatist"
 separatism_ideology_adherent:0 "Separatist"
 separatism_ideology_adherent_plural:0 "Separatists"
 separatism_ideology_desc:0 "Separatism is the driving political ideology behind the Orion League, and therefore the Crisis as a whole. Separatists do not outright reject commonality, but they cash out the principle differently, seeing it as a moral value to aspire to but impractical for actual political organization. Rather than a single pan-human government, separatists envision a community of many independent states, united by a common heritage and friendly interstellar relations."
 
 liberal_separatist:0 "Liberal Separatism"
 liberal_separatist_adj:0 "Liberal Separatist"
 liberal_separatist_adherent:0 "Lebedevist"
 liberal_separatist_adherent_plural:0 "Lebedevists"
 liberal_separatist_desc:0 "#M \"We are indeed the children of Earth. But all children must one day learn to stand on their own.\"\n - President Juan Lebedev, 2997#!\n\nLiberal Separatists, sometimes known as \"Lebedevists\", are the most militant branch of Separatist thought. Liberal Separatists believe in commonality, but also see the Terran Confederation as a failed experiment. They seek to replace it with a community of free, independent colonial republics, where every colony will have the right to govern its own affairs."
 
 cooperationist:0 "Cooperationist"
 cooperationist_adj:0 "Cooperationist"
 cooperationist_adherent:0 "Cooperationist"
 cooperationist_adherent_plural:0 "Cooperationists"
 cooperationist_desc:0 "#M \"We are not revolutionaries, and we are not traitors. But this is Earth's fight, not ours. Whether that makes us enemies is up to you.\"\n - President Anika Trivedi, 2997#!\n\nCooperationists are a branch of the Separatist ideology who reject the heavy-handed approach of both the Metroplanetists and Lebedevists. They envision a community of small, independent federations that work together in a spirit of peace, tolerance, and mutual cooperation."
 
 neo_feudalist:0 "Neo-Feudalism"
 neo_feudalist_adj:0 "Neo-Feudal"
 neo_feudalist_adherent:0 "Neo-Feudalist"
 neo_feudalist_adherent_plural:0 "Neo-Feudalists"
 neo_feudalist_desc:0 "#M \"It is no coincidence that the archetypal hero is the knight in shining armor.\"\n - Duke Joseph Blackburne, 2999#!\n\nGenerally referred to as “neo-feudalism” by outsiders, Neo-Chivalry is a political movement inspired by romanticized notions of the European Middle Ages. The Neo-Chivalrous are captivated by notions of honorable knighthood, castles, kings and queens, courtly romance, and Arthurian legend. Their vision of the medieval is extremely inaccurate and rose-tinted, filtered through two millennia of history. They envision a society ruled by rulers groomed from birth, driven by ideals of honor, chivalry, and noblesse oblige. They envision courtly romance filtered through contemporary gender anarchy, where women can be knights and men can be fair maidens."
 
 astrism_ideology:0 "Astrism"
 astrism_ideology_adj:0 "Astrist"
 astrism_ideology_adherent:0 "Astrist"
 astrism_ideology_adherent_plural:0 "Astrists"
 astrism_ideology_desc:0 "Early space travel was fraught with danger. The first spacers, travelling through an incredibly hostile environment where only a thin layer of titanium alloy separated them from a horrific death, learned the hard way that the void was no place for egos or individualism. If you couldn’t trust your crew instinctively in a crisis, you faced almost certain death. They developed a unique ethical code based on three central principles: obey your captain, honor your word, and stand by your crew.\n\nWhen they returned to Earth, they found themselves strangers in their own homelands. The cavalier attitudes of terrestrial society to obedience, integrity, and loyalty disgusted them. In their eyes, adversity had brought the best out in humanity, while luxury had brought out the worst. Astrists believe in upholding the spacer code of ethics as a basic moral guideline for everyday life."
 
 mainline_astrist:0 "Reform Astrism"
 mainline_astrist_adj:0 "Reform Astrist"
 mainline_astrist_adherent:0 "Reformist"
 mainline_astrist_adherent_plural:0 "Reformists"
 mainline_astrist_desc:0 "#M \"Up there, your captain says something, you don't ask questions. You do it, because they're the captain. No exceptions.\"\n - Captain Michael McKinley, 2183#!\n\nDating back to the very first great wave of space travel, the Reform school of Astrism seeks to transform human society according to the values of the ancient spacers - obey your captain, honor your word, and stand by your crew. They believe that the ideal political model for civilization is that of a starship's crew on a grand scale, where power is concentrated in the hands of a 'captain' who is nonetheless responsible to their 'crew'."
 
 socialism_ideology:0 "Socialism"
 socialism_ideology_adj:0 "Socialist"
 socialism_ideology_adherent:0 "Socialist"
 socialism_ideology_adherent_plural:0 "Socialists"
 socialism_ideology_desc:0 "True socialism was not a popular ideology during the glory days of the Confederation, when a strong social welfare program and a thriving economy seemed to be proving capitalism a success. There were always, however, a mix of both utopians who chafed at the imperfections of society on principle and historical materialists who believed the golden age could not last. In the Confederation’s final century, the cracks began to show, and these philosophies only became more popular."
 
 neo_socialist:0 "Neo-Socialism"
 neo_socialist_adj:0 "Neo-Socialist"
 neo_socialist_adherent:0 "Neo-Socialist"
 neo_socialist_adherent_plural:0 "Neo-Socialists"
 neo_socialist_desc:0 "#M \"The bourgeosie think the capitalist order indestructible. They say there is no alternative, that oppression and exploitation are woven into the nature of humanity itself. But is it truly so unthinkable that we, who have conquered gravity, might not also conquer human greed?\"\n - Director-General Ekateirna Leonidov, 2645#!\n\nNeo-Socialism has its origins in the trauma of the collapse of the Centauri Republic and the disgust its intellectual progenitors felt towards the moribund, past-obsessed Old Socialists of the Centauri Reach. Neo-Socialism is first and foremost a forward-looking ideology, one that sees in the vast expanse of the stars infinite opportunities for humanity to escape its chains and thrive."
 
 gaoist:0 "Gaoism"
 gaoist_adj:0 "Gaoist"
 gaoist_adherent:0 "Gaoist"
 gaoist_adherent_plural:0 "Gaoists"
 gaoist_desc:0 "#M \"It doesn't matter whether the cat is black or white, as long as it catches mice.\"\n - Secretary-General Deng Xiaoping, 1962#!\n\nOriginating in the People's State of Xingjie, Gao Jianguo Thought combines traditional Chinese values, socialist theory, and a long-standing tradition of political pragmatism to carve a path forward for socialism under the often aggressively liberal rule of the Terran Confederation. Gaoists seek to temper market forces with the steady hand of a ruling vanguard party in order to protect the interests of the working class and the stability of the state."
 
 old_socialist:0 "Old Socialism"
 old_socialist_adj:0 "Old Socialist"
 old_socialist_adherent:0 "Old Socialist"
 old_socialist_adherent_plural:0 "Old Socialists"
 old_socialist_desc:0 "#M \"The bourgeosie know that we are their greatest enemy, and they will stop at nothing to destroy us. And their most dangerous weapon is not guns or bombs or spaceships, but doubt.\"\n - Secretary-General Alexei Adams, 2892#!\n\n'Old Socialism' is the common name for a school of thought that defines itself by strict adherence to the teachings of the ancient founders of socialist theory. Old Socialists are concerned with exegesis and interpretation of the writings of figures such as Karl Marx and Friedrich Engels, and highly disdainful of 'revisionists' who regard the Marxist tradition as in any way flawed or incomplete."
 
 frontier_anarchist:0 "Frontier Anarchism"
 frontier_anarchist_adj:0 "Frontier Anarchist"
 frontier_anarchist_adherent:0 "Blue Anarchist"
 frontier_anarchist_adherent_plural:0 "Blue Anarchists"
 frontier_anarchist_desc:0 "#M \"It ain't complicated. We just want to be free. Isn't that what this whole thing was supposed to be about from the start?\"\n - Speaker Liberty Jones, 3023#!\n\nFrontier Anarchism, also known as Anarcho-Liberalism and Blue Anarchism, is a political ideology that combines traditional liberal philosophy and rhetoric with left-wing anarchism. To Blue Anarchists, liberalism marks the start of a struggle for the human race to escape from the shackles of tyranny and oppression, and anarchism is its logical endpoint. Blue Anarchists are known for their use of symbols and iconography associated with the American and French Revolutions, which are treated almost as foundational myths."
 
 transhumanism_ideology:0 "Transhumanism"
 transhumanism_ideology_adj:0 "Transhumanist"
 transhumanism_ideology_adherent:0 "Transhumanist"
 transhumanism_ideology_adherent_plural:0 "Transhumanists"
 transhumanism_ideology_desc:0 "Transhumanism is, at its core, the belief that humanity can and should use technology to become something more than human. With advances in both genetic engineering and cybernetics, transhumanism has become a serious, but controversial, philosophy in the Confederation. While it has many enthusiastic supporters, transhumanism also has a controversial history."
 
 cyberneticist:0 "Cyberneticism"
 cyberneticist_adj:0 "Cyberneticist"
 cyberneticist_adherent:0 "Cyberneticist"
 cyberneticist_adherent_plural:0 "Cyberneticists"
 cyberneticist_desc:0 "#M \"Where does it end? It doesn't. Why should it? Life is good, health is good, beauty and happiness and fun and laughter and challenge and learning are good. This does not change for arbitrarily large amounts of life and beauty.\"\n\n - Eliezer Yudkowsky, 2007#!\n\Cyberneticists are the most straightforward form of transhumanist, seeking to modify and improve the human body through cybernetic augmentations. These include everything from brain-mounted wifi connections to artificial limbs to surgically installing the human brain into an android body. Cyberneticists believe in absolute bodily autonomy - that one’s physical form should be complete subordinate to one’s own wishes."
 
 bio_directionist:0 "Bio-Directionism"
 bio_directionist_adj:0 "Bio-Directionist"
 bio_directionist_adherent:0 "Bio-Directionist"
 bio_directionist_adherent_plural:0 "Bio-Directionists"
 bio_directionist_desc:0 "#M \"§M"I am not interested in 'playing God'. I am offended by the very suggestion. I have seen His handiwork, and would never lower myself to such an amateur level.\"\n - Doctor Ambrose Bacon, 2489#!\n\nBio-Directionism is the modern term for the belief that human evolution should be controlled by humans. Bio-Directionists have a broad concept of what constitutes humanity, envisioning an incredible diversity of physical forms and adaptations to countless alien environments. Thought often saddled with the legacy of the ancient philosophy of eugenics, Bio-Directionists strictly eschew its methods, instead relying on what they see as the humane alternatives of genetic engineering and cloning."
 
 sterlingist:0 "Sterlingism"
 sterlingist_adj:0 "Sterlingist"
 sterlingist_adherent:0 "Sterlingist"
 sterlingist_adherent_plural:0 "Sterlingists"
 sterlingist_desc:0 "#M \"The great problem with benevolent despotism was the notorious mortality of despots.\"\n - Doctor Victoria Locksley, 2505#!\n\nFollowers of philosopher-scientist Jacob Sterling, Sterlingists advocate for an extreme form of aristocracy, where absolute political power is placed in the hands of select individuals who are considered indispensible, and whose lives are figuratively perpetuated through the use of cloning."
 
 