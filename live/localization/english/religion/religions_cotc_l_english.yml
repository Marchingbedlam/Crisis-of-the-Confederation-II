 gaean_divine_realm_3: "$gaean_divine_realm$"
 
 xenoterran_ideology: "Xenoterranism"
 xenoterran_ideology_adj: "Xenoterran"
 xenoterran_ideology_adherent: "Xenoterran"
 xenoterran_ideology_adherent_plural: "Xenoterrans"
 xenoterran_ideology_desc: "Xenoterranism is the belief that humanity did not originate on Earth, but rather on some other planet. Considered by most to be a delusional conspiracy theory, Xenoterranism is mostly associated with a handful of radical religious cults that operate well outside the mainstream of Confederate society."
 
 lost_world: "Lost World Cults"
 lost_world_adj: "Lost World"
 lost_world_adherent: "Lost Worlder"
 lost_world_adherent_plural: "Lost Worlders"
 lost_world_desc: "#M \"Out of all the countless worlds of humanity, it seems a convenient coincidence that the oldest and most worthy of respect would also be the most powerful and proud.\"\n - Abbot Jie Xu, 2989#!\n\nThe Lost World cults are a family of loosely-associated religious movements united by their shared belief that humanity did not evolve on Earth, but that all knowledge of humanity's true homeworld has been lost. Lost World cults tend to be built around far-flung, isolated monastery-colonies, and have little involement with mainstream society."
 
 kolobite: "Kolobism"
 kolobite_adj: "Kobolist"
 kolobite_adherent: "Kolobite"
 kolobite_adherent_plural: "Kolobites"
 kolobite_desc: "#M \"There are those who believe that life here began out there...\"\n - Battlestar Galactica, 1978#!\n\nThe Celestial Church of Jesus Christ of Latter-Day Saints is a Mormon sect more commonly known as \"Kolobism\" for their belief that humanity did not originate on Earth, but rather was created on the distant planet of Kolob, the world closest to the Throne of God. The Celestial Church has dedicated itself to space exploration in the hope of eventually reaching Kolob."
