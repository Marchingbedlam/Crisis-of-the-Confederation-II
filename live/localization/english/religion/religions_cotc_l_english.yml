 religious_hostility_doctrine_name: "Religious"
 religious_hostility_doctrine_desc: "The following ideologies are Religious:\n[GetReligionFamily('rf_religious').GetReligions]"
 
 rf_criminal: "Criminal"
 rf_criminal_opinion: "[GetReligionFamily('rf_criminal').GetName] Opinion"
 criminal_hostility_doctrine_name: "Criminal"
 criminal_hostility_doctrine_desc: "The following ideologies are Criminal:\n[GetReligionFamily('rf_criminal').GetReligions]"
 
 metroplanetism_ideology: "Metroplanetism"
 metroplanetism_ideology_adj: "Metroplanetist"
 metroplanetism_ideology_adherent: "Metroplanetist"
 metroplanetism_ideology_adherent_plural: "Metroplanetists"
 metroplanetism_ideology_desc: "Metroplanetism is the dominant political ideology of the Core Worlds, derived from a simple, straightforward interpretation of commonality and the simple material reality of Earth’s massive outsize influence on human civilization. Metroplanetists “cash out” commonality in the most straightforward way, with the belief that there should be a single pan-human government. This government is the Confederation. Additionally, metroplanetists believe that the natural seat of power for this government is Earth, the metroplanetes, or mother planet."
 metroplanetist_symbol: "Earth"
 metroplanetist_symbol_2: "$metroplanetist_symbol$"
 metroplanetist_symbol_3: "$metroplanetist_symbol$
 metroplanetist_founding_text: "Treaties"
 metroplanetist_founding_text_2: "$metroplanetist_founding_text$"
 metroplanetist_founding_text_3: "$metroplanetist_founding_text$"
 
 terran_federalist: "Terran Federalism"
 terran_federalist_adj: "Terran Federalist"
 terran_federalist_adherent: "Federalist"
 terran_federalist_adherent_plural: "Federalists"
 terran_federalist_desc: "#M \"Above all, we recognize this, that all men are brothers and all women sisters, the sons and daughters of Earth.\"\n - Fourth Treaty of Terra, 2489#!\n\nThe Terran Federalist Party is one of the two primary political parties of the Terran Confederation. Terran Federalism, a secular, democratic, humanist ideology, supports the ideal of a single united human state, a democratic federation with its capital on Terra. Their beliefs loosely center upon the principle of Metroplanetism: that there should be a single pan-human federal government and Terra is the metroplanetes, mother planet, of humanity. Federalists favor a more decentralized federalized form of government, where all members of the Confederation answer to Terra but have a substantial say in the governance of the state."
 
 terran_republican: "Terran Republicanism"
 terran_republican_adj: "Terran Republican"
 terran_republican_adherent: "Republican"
 terran_republican_adherent_plural: "Republicans"
 terran_republican_desc: "#M \"The most stringent cries for freedom are always those of the slavers and warlords.\"\n - President Morgan Afolayan, 2998#!\n\nThe Terran Republican Party is one of the two primary political parties of the Terran Confederation. Terran Republicanism, a secular, democratic, humanist ideology, supports the ideal of a single united human state, a centralized republic with its capital on Terra. Their beliefs firmly center upon the principle of Metroplanetism: a single pan-human unitary government with Terra as the metroplanetes, mother planet, of humanity. Republicans favor a more centralized bureaucratic form of government where the member planets of the Confederation answer to Terra with minimal say in governance, and Terra has an overwhelming role in governance."
 
 universalist: "Universalism"
 universalist_adj: "Universalist"
 universalist_adherent: "Universalist"
 universalist_adherent_plural: "Universalists"
 universalist_desc: "#M \"Workers of all worlds, unite!\"\n - Unknown#!\n\nUniversal Socialism, better known as simply Universalism, is a political school of thought that combines traditional socialism with Metroplanetism. Universalists advocate for the transformation of the Terran Confederation into a federation of socialist states."
 
 terran_imperialist: "Terran Imperialism"
 terran_imperialist_adj: "Terran Imperialist"
 terran_imperialist_adherent: "Imperialist"
 terran_imperialist_adherent_plural: "Imperialist"
 terran_imperialist_desc: "#M \"It takes a peculiar sort of mind to witness the horrors of the Crisis and still say, ‘Yes, democracy will be our salvation.’\"\n - Captain-General Luo Tao, 3007#!\n\nTerran Imperialism, an illiberal, chauvinist ideology, seeks to unite humanity under the rule of a strong autocratic dictatorship centered on Terra. Imperialists believe in the principle of Metroplanetism, but they reject the democratic norms of the Terran Confederation: this is due to Terran Imperialism explicitly believing Terrans are better than other humans and entitled to rule the Confederation as their birthright. They heavily favor militarism and autocracy, seeing the colonies and outer planets as too disunited and chaotic to govern themselves."
 terran_imperialist_symbol: "winged sword"
 terran_imperialist_symbol_2: "$imperialist_symbol$"
 terran_imperialist_symbol_3: "$imperialist_symbol$"
 
 separatism_ideology: "Separatism"
 separatism_ideology_adj: "Separatist"
 separatism_ideology_adherent: "Separatist"
 separatism_ideology_adherent_plural: "Separatists"
 separatism_ideology_desc: "Separatism is the driving political ideology behind the Orion League, and therefore the Crisis as a whole. Separatists do not outright reject commonality, but they cash out the principle differently, seeing it as a moral value to aspire to but impractical for actual political organization. Rather than a single pan-human government, separatists envision a community of many independent states, united by a common heritage and friendly interstellar relations."
 separatist_symbol: "constellation"
 separatist_symbol_2: "$separatist_symbol$"
 separatist_symbol_3: "$separatist_symbol$"
 separatist_founding_text: "declarations"
 separatist_founding_text_2: "$separatist_founding_text$"
 separatist_founding_text_3: "$separatist_founding_text$"
 
 liberal_separatist: "Liberal Separatism"
 liberal_separatist_adj: "Liberal Separatist"
 liberal_separatist_adherent: "Lebedevist"
 liberal_separatist_adherent_plural: "Lebedevists"
 liberal_separatist_desc: "#M \"We are indeed the children of Earth. But all children must one day learn to stand on their own.\"\n - President Juan Lebedev, 2997#!\n\nLiberal Separatists, sometimes known as \"Lebedevists\", are the most militant branch of Separatist thought. Liberal Separatists believe in commonality, but also see the Terran Confederation as a failed experiment. They seek to replace it with a community of free, independent colonial republics, where every colony will have the right to govern its own affairs."
 
 cooperationist: "Cooperationist"
 cooperationist_adj: "Cooperationist"
 cooperationist_adherent: "Cooperationist"
 cooperationist_adherent_plural: "Cooperationists"
 cooperationist_desc: "#M \"We are not revolutionaries, and we are not traitors. But this is Earth's fight, not ours. Whether that makes us enemies is up to you.\"\n - President Anika Trivedi, 2997#!\n\nCooperationists are a branch of the Separatist ideology who reject the heavy-handed approach of both the Metroplanetists and Lebedevists. They envision a community of small, independent federations that work together in a spirit of peace, tolerance, and mutual cooperation."
 
 neo_feudalist: "Neo-Feudalism"
 neo_feudalist_adj: "Neo-Feudal"
 neo_feudalist_adherent: "Neo-Feudalist"
 neo_feudalist_adherent_plural: "Neo-Feudalists"
 neo_feudalist_desc: "#M \"It is no coincidence that the archetypal hero is the knight in shining armor.\"\n - Duke Joseph Blackburne, 2999#!\n\nGenerally referred to as “neo-feudalism” by outsiders, Neo-Chivalry is a political movement inspired by romanticized notions of the European Middle Ages. The Neo-Chivalrous are captivated by notions of honorable knighthood, castles, kings and queens, courtly romance, and Arthurian legend. Their vision of the medieval is extremely inaccurate and rose-tinted, filtered through two millennia of history. They envision a society ruled by rulers groomed from birth, driven by ideals of honor, chivalry, and noblesse oblige. They envision courtly romance filtered through contemporary gender anarchy, where women can be knights and men can be fair maidens."
 neo_feudalist_symbol: "crown"
 neo_feudalist_symbol_2: "$neo_feudalist_symbol$"
 neo_feudalist_symbol_3: "$neo_feudalist_symbol$"
 
 astrism_ideology: "Astrism"
 astrism_ideology_adj: "Astrist"
 astrism_ideology_adherent: "Astrist"
 astrism_ideology_adherent_plural: "Astrists"
 astrism_ideology_desc: "Early space travel was fraught with danger. The first spacers, travelling through an incredibly hostile environment where only a thin layer of titanium alloy separated them from a horrific death, learned the hard way that the void was no place for egos or individualism. If you couldn’t trust your crew instinctively in a crisis, you faced almost certain death. They developed a unique ethical code based on three central principles: obey your captain, honor your word, and stand by your crew.\n\nWhen they returned to Earth, they found themselves strangers in their own homelands. The cavalier attitudes of terrestrial society to obedience, integrity, and loyalty disgusted them. In their eyes, adversity had brought the best out in humanity, while luxury had brought out the worst. Astrists believe in upholding the spacer code of ethics as a basic moral guideline for everyday life."
 astrist_symbol: "spaceship"
 astrist_symbol_2: "$astrist_symbol$"
 astrist_symbol_3: "$astrist_symbol$"
 astrist_founding_text: "Code"
 astrist_founding_text_2: "$astrist_founding_text$"
 astrist_founding_text_3: "$astrist_founding_text$"
 
 mainline_astrist: "Reform Astrism"
 mainline_astrist_adj: "Reform Astrist"
 mainline_astrist_adherent: "Reformist"
 mainline_astrist_adherent_plural: "Reformists"
 mainline_astrist_desc: "#M \"Up there, your captain says something, you don't ask questions. You do it, because they're the captain. No exceptions.\"\n - Captain Michael McKinley, 2183#!\n\nDating back to the very first great wave of space travel, the Reform school of Astrism seeks to transform human society according to the values of the ancient spacers - obey your captain, honor your word, and stand by your crew. They believe that the ideal political model for civilization is that of a starship's crew on a grand scale, where power is concentrated in the hands of a 'captain' who is nonetheless responsible to their 'crew'."
 
 socialism_ideology: "Socialism"
 socialism_ideology_adj: "Socialist"
 socialism_ideology_adherent: "Socialist"
 socialism_ideology_adherent_plural: "Socialists"
 socialism_ideology_desc: "True socialism was not a popular ideology during the glory days of the Confederation, when a strong social welfare program and a thriving economy seemed to be proving capitalism a success. There were always, however, a mix of both utopians who chafed at the imperfections of society on principle and historical materialists who believed the golden age could not last. In the Confederation’s final century, the cracks began to show, and these philosophies only became more popular."
 socialist_symbol: "hammer and sickle"
 socialist_symbol_2: "$socialist_symbol$"
 socialist_symbol_3: "$socialist_symbol$"
 socialist_founding_text: "theory"
 socialist_founding_text_2: "$socialist_founding_text$"
 socialist_founding_text_3: "$socialist_founding_text$"
 
 neo_socialist: "Neo-Socialism"
 neo_socialist_adj: "Neo-Socialist"
 neo_socialist_adherent: "Neo-Socialist"
 neo_socialist_adherent_plural: "Neo-Socialists"
 neo_socialist_desc: "#M \"The bourgeosie think the capitalist order indestructible. They say there is no alternative, that oppression and exploitation are woven into the nature of humanity itself. But is it truly so unthinkable that we, who have conquered gravity, might not also conquer human greed?\"\n - Director-General Ekateirna Leonidov, 2645#!\n\nNeo-Socialism has its origins in the trauma of the collapse of the Centauri Republic and the disgust its intellectual progenitors felt towards the moribund, past-obsessed Old Socialists of the Centauri Reach. Neo-Socialism is first and foremost a forward-looking ideology, one that sees in the vast expanse of the stars infinite opportunities for humanity to escape its chains and thrive."
 
 gaoist: "Gaoism"
 gaoist_adj: "Gaoist"
 gaoist_adherent: "Gaoist"
 gaoist_adherent_plural: "Gaoists"
 gaoist_desc: "#M \"It doesn't matter whether the cat is black or white, as long as it catches mice.\"\n - Secretary-General Deng Xiaoping, 1962#!\n\nOriginating in the People's State of Xingjie, Gao Jianguo Thought combines traditional Chinese values, socialist theory, and a long-standing tradition of political pragmatism to carve a path forward for socialism under the often aggressively liberal rule of the Terran Confederation. Gaoists seek to temper market forces with the steady hand of a ruling vanguard party in order to protect the interests of the working class and the stability of the state."
 
 old_socialist: "Old Socialism"
 old_socialist_adj: "Old Socialist"
 old_socialist_adherent: "Old Socialist"
 old_socialist_adherent_plural: "Old Socialists"
 old_socialist_desc: "#M \"The bourgeosie know that we are their greatest enemy, and they will stop at nothing to destroy us. And their most dangerous weapon is not guns or bombs or spaceships, but doubt.\"\n - Secretary-General Alexei Adams, 2892#!\n\n'Old Socialism' is the common name for a school of thought that defines itself by strict adherence to the teachings of the ancient founders of socialist theory. Old Socialists are concerned with exegesis and interpretation of the writings of figures such as Karl Marx and Friedrich Engels, and highly disdainful of 'revisionists' who regard the Marxist tradition as in any way flawed or incomplete."
 
 frontier_anarchist: "Frontier Anarchism"
 frontier_anarchist_adj: "Frontier Anarchist"
 frontier_anarchist_adherent: "Blue Anarchist"
 frontier_anarchist_adherent_plural: "Blue Anarchists"
 frontier_anarchist_desc: "#M \"It ain't complicated. We just want to be free. Isn't that what this whole thing was supposed to be about from the start?\"\n - Speaker Liberty Jones, 3023#!\n\nFrontier Anarchism, also known as Anarcho-Liberalism and Blue Anarchism, is a political ideology that combines traditional liberal philosophy and rhetoric with left-wing anarchism. To Blue Anarchists, liberalism marks the start of a struggle for the human race to escape from the shackles of tyranny and oppression, and anarchism is its logical endpoint. Blue Anarchists are known for their use of symbols and iconography associated with the American and French Revolutions, which are treated almost as foundational myths."
 frontier_anarchist_symbol: "stars and stripes"
 frontier_anarchist_symbol_2: "$socialist_symbol$"
 frontier_anarchist_symbol_3: "$socialist_symbol$"
 
 transhumanism_ideology: "Transhumanism"
 transhumanism_ideology_adj: "Transhumanist"
 transhumanism_ideology_adherent: "Transhumanist"
 transhumanism_ideology_adherent_plural: "Transhumanists"
 transhumanism_ideology_desc: "Transhumanism is, at its core, the belief that humanity can and should use technology to become something more than human. With advances in both genetic engineering and cybernetics, transhumanism has become a serious, but controversial, philosophy in the Confederation. While it has many enthusiastic supporters, transhumanism also has a controversial history."
 transhumanist_symbol: "radiant"
 transhumanist_symbol_2: "$transhumanist_symbol$"
 transhumanist_symbol_3: "$transhumanist_symbol$"
 transhumanist_founding_text: "theory"
 transhumanist_founding_text_2: "$transhumanist_founding_text$"
 transhumanist_founding_text_3: "$transhumanist_founding_text$"
 
 cyberneticist: "Cyberneticism"
 cyberneticist_adj: "Cyberneticist"
 cyberneticist_adherent: "Cyberneticist"
 cyberneticist_adherent_plural: "Cyberneticists"
 cyberneticist_desc: "#M \"Where does it end? It doesn't. Why should it? Life is good, health is good, beauty and happiness and fun and laughter and challenge and learning are good. This does not change for arbitrarily large amounts of life and beauty.\"\n\n - Eliezer Yudkowsky, 2007#!\n\Cyberneticists are the most straightforward form of transhumanist, seeking to modify and improve the human body through cybernetic augmentations. These include everything from brain-mounted wifi connections to artificial limbs to surgically installing the human brain into an android body. Cyberneticists believe in absolute bodily autonomy - that one’s physical form should be complete subordinate to one’s own wishes."
 
 bio_directionist: "Bio-Directionism"
 bio_directionist_adj: "Bio-Directionist"
 bio_directionist_adherent: "Bio-Directionist"
 bio_directionist_adherent_plural: "Bio-Directionists"
 bio_directionist_desc: "#M \"§M"I am not interested in 'playing God'. I am offended by the very suggestion. I have seen His handiwork, and would never lower myself to such an amateur level.\"\n - Doctor Ambrose Bacon, 2489#!\n\nBio-Directionism is the modern term for the belief that human evolution should be controlled by humans. Bio-Directionists have a broad concept of what constitutes humanity, envisioning an incredible diversity of physical forms and adaptations to countless alien environments. Thought often saddled with the legacy of the ancient philosophy of eugenics, Bio-Directionists strictly eschew its methods, instead relying on what they see as the humane alternatives of genetic engineering and cloning."
 bio_directionist_symbol: "double helix"
 bio_directionist_symbol_symbol_2: "$bio_directionist_symbol$"
 bio_directionist_symbol_symbol_3: "$bio_directionist_symbol$"
 
 sterlingist: "Sterlingism"
 sterlingist_adj: "Sterlingist"
 sterlingist_adherent: "Sterlingist"
 sterlingist_adherent_plural: "Sterlingists"
 sterlingist_desc: "#M \"The great problem with benevolent despotism was the notorious mortality of despots.\"\n - Doctor Victoria Locksley, 2505#!\n\nFollowers of philosopher-scientist Jacob Sterling, Sterlingists advocate for an extreme form of aristocracy, where absolute political power is placed in the hands of select individuals who are considered indispensible, and whose lives are figuratively perpetuated through the use of cloning."
 
 outlawry_ideology: "Outlawry"
 outlawry_ideology_adj: "Outlaw"
 outlawry_ideology_adherent: "Outlaw"
 outlawry_ideology_adherent_plural: "Outlaws"
 outlawry_ideology_desc: "Outlaws are the most extreme form of criminals, choosing to live entirely outside the bounds of the law and civilized society. Outlaw settlements can be found in remote asteroid fields, on barren moons, and in the heart of blazing nebulas. They build their own anarchic communities and have little interaction with civilized space that isn't at the barrel of a gun."
 outlaw_symbol: "black flag"
 outlaw_symbol_2: "$outlawry_symbol$"
 outlaw_symbol_3: "$outlawry_symbol$"
 outlaw_founding_text: "articles"
 outlaw_founding_text_2: "$outlawry_founding_text$"
 outlaw_founding_text_3: "$outlawry_founding_text$"
 
 free_fleet: "Free Fleets"
 free_fleet_adj: "Free Fleet"
 free_fleet_adherent: "Free Spacer"
 free_fleet_adherent_plural: "Free Spacers"
 free_fleet_desc: "#M \"I've never been one for fancy debate. I prefer the wordless honesty of ionized lithium plasma.\"\n - Captain Kaoru Maeda, 3001#!\n\nWhen most people think of space pirates, they think of the so-called \"Free Fleets\" - lawless and ruthless pirate crews that follow no code nor creed. Rejecting ideology and morality as merely the tools of rich and powerful hypocrites, Free Spacers care for nothing but wealth and pleasure, choosing to carve out their own fate rather than submit to the rule of the elite. They maintain order, such as they have, through terror and the promise of fortune. A Free Captain, if they want to keep their position, must provide a steady flow of loot and plunder, or they will soon find themselves taking a short walk out the nearest airlock."
 
 outcast: "Outcast's Code"
 outcast_adj: "Outcast"
 outcast_adherent: "Outcast"
 outcast_adherent_plural: "Outcasts"
 outcast_desc: "#M \"I. Every man has a vote in affairs of moment; has equal title to the fresh provisions, or strong liquors, at any time seized, and may use them at pleasure, unless a scarcity (not an uncommon thing among them) makes it necessary, for the good of all, to vote a retrenchment. \"\n - Articles of Captain Bartholomew Roberts, c. 1720#!\n\nThe Fellowship of Outcasts is a loose coalition of space pirates bound by the Outcast's Code, a code of conduct that regulates their behavior and, in their eyes, elevates them above common thugs. The Outcast's Code is ultimately derived from the same early spacer values as astrism, and emphasizes the same basic principles: obey your captain, stand by your crew, and honor your word. It also promotes \"honor among thieves\", and Outcast pirate lords generally do not fight among themselves without good reason."
 outcast_founding_text: "Code"
 outcast_founding_text_2: "$outcast_founding_text$"
 outcast_founding_text_3: "$outcast_founding_text$"
 
 reaver: "Reaver Cults"
 reaver_adj: "Reaver"
 reaver_adherent: "Reaver"
 reaver_adherent_plural: "Reavers"
 reaver_desc: "#M \"Helen grimaced as she examined the grotesque, rotting remains of the half-eaten corpse. Blood dripped from the ceiling of the compartment, scrawled into inscrutable and unholy symbols of some deranged and demonic religion. She'd seen this before, a thousand times, but it never got any easier. Reavers, she thought.\"\n - Terror from the Void, published 2489#!\n\nDespite official denials by the Confederation, popular culture resounds with lurid and sensationalist tales of the so-called \"Reavers\", insane cannibals who haunt the blackest depths of space and offer up their captives as sacrifices to dark gods. Their actions are often attributed to symptoms of \"space madness\", but psychologists denounce this as an archaic and dangerous stereotype of mental illness and instead argue that Reavers - if they even exist - are more likely some form of cult, or even more likely, common pirates mimicking the stories to terrify and intimidate."
 
 old_ways_ideology: "Old Ways"
 old_ways_ideology_adj: "Old Ways"
 old_ways_ideology_adherent: "Elder"
 old_ways_ideology_plural: "Elders"
 old_ways_ideology_desc: "The \"Old Ways\" refer to a group of organized crime traditions that originated on pre-spaceflight Earth, and have survived more or less intact into the present day. The status of Elder crime syndicate is relative - there are no hard and fast rules and many \"Elder\" crime families are in fact mere decades old. What matters is adherence to certain rituals and codes of conduct that can be traced back to the ancient past."
 old_ways_symbol: "eight-pointed star"
 old_ways_symbol_2: "$old_ways_symbol$"
 old_ways_symbol_3: "$old_ways_symbol$"
 old_ways_founding_text: "traditions"
 old_ways_founding_text_2: "$old_ways_founding_text$"
 old_ways_founding_text_3: "$old_ways_founding_text$"
 
 mafia: "Mafia"
 mafia_adj: "Mafia"
 mafia_adherent: "Mafioso"
 mafia_adherent_plural: "Mafiosi"
 mafia_desc: "#M \"As far back as I can remember, I always wanted to be a gangster.\"\n - Unknown#!\n\n\"Mafia\" is a generic term for a common form of criminal organization, named after a common resemblance to the ancient American Mafia. Individual Mafia organizations are known as \"families\", and are indeed generally centered around an actual biological family. They are characterized by a strong sense of ethnic identity and a code of silence that punishes members who dare to turn a fellow Mafioso in to the authorities."
 
 vory: "Vorovskoy Mir"
 vory_adj: "Vorovskoy"
 vory_adherent: "Vor"
 vory_adherent_plural: "Vory"
 vory_desc: "#M \"The home for an angel is in Heaven, and the home for a Vor is in prison."\n - Vorovskoy Saying#!\n\n"The Vory are an ancient criminal tradition that began in the gulags of the ancient Soviet Union. The Vory are led by an elite class of master criminals who bear tattoos of an eight-pointed star and swear never to work or cooperate with the authorities. Most such master thieves expected to spend the majority of their lives in prison."
 
 yakuza: "Yakuza"
 yakuza_adj: "Yakuza"
 yakuza_adherent: "Yakuza"
 yakuza_adherent_plural: "Yakuza"
 yakuza_desc: "#M \"You know, we're heirs to a tradition that dates back over nearly ten centuries. We don't just have a reputation, we have a legacy. And when you don't pay us what we owe, you're insulting that thousand year legacy. So tell me, what exactly are you willing to give up to make things right?\"\n - Goro Solomonov, 2892#!\n\nYakuza are members of a form of criminal organization that began in ancient Japan, but that has since expanded far beyond its original culture - modern day Yakuza are identified less by nationality and more by their adherence to a particular set of rituals and traditions, including elaborate, full-body tattoos and the practice of self-mutilation to show contrition and atonement. Yakuza syndicates tend to avoid \"hard\" crime, such as drug-dealing, and instead try to operate within legal grey areas that make their members difficult to prosecute."
 
 new_ways_ideology: "New Ways"
 new_ways_ideology_adj: "New Ways"
 new_ways_ideology_adherent: "Youth"
 new_ways_ideology_adherent_plural: "Youths"
 new_ways_ideology_desc: "The \"New Ways\" are criminal traditions that have emerged in the aftermath of humanity's diaspora. Despite the name, many New Ways can actually be quite old, but unlike Elder crime syndicates, most Young organizations do not try to lay claim to ancient legacies and are much less concerned with tradition."
 new_ways_symbol: "solar eclipse"
 new_ways_symbol_2: "$new_ways_symbol$"
 new_ways_symbol_3: "$new_ways_symbol$"
 new_ways_founding_text: "traditions"
 new_ways_founding_text_2: "$new_ways_founding_text$"
 new_ways_founding_text_3: "$new_ways_founding_text$"
 
 shepherd: "Shepherdry"
 shepherd_adj: "Shepherd"
 shepherd_adherent: Shepherd"
 shepherd_adherent_plural: "Shepherds"
 shepherd_desc: "#M \"The scales of justice are crooked. Millions toil away for hours in mining colonies, sacrificing their lives to make someone else rich. All we're doing is evening out the scales.\"\n - Rebecca Liu, 2745#!\n\nShepherd Societies are a relatively young criminal tradition, emerging among the Frontier's working class within just the past few centuries. They avoid "hard" crime, such as space piracy or drug-dealing, and instead focus on extortion, fraud, and loan sharking. They see themselves as modern-day Robin Hoods, robbing the rich while protecting and feeding the poor, though in practice the most successful Shepherd Societies are the most ruthless and profit-oriented. Shepherd Societies are often willing to operate openly in situations where the authorities see shutting them down as more trouble than it's worth, generally framing themselves as charitable organizations."
 
 shadow_trade: "Shadow Trade"
 shadow_trade_adj: "Shadow Trade"
 shadow_trade_adherent: "Shadow Trader"
 shadow_trade_adherent_plural: "Shadow Traders"
 shadow_trade_desc: "#M \"A criminal? Hardly. I'm just a bit more creative than your average businessman."\n - Gabriel al-Alousi, 2992#!\n\nThe Shadow Trade is the name of an informal Confederation-wide network of organized crime syndicates dealing primarily in smuggling, particularly drug-running. Shadow Traders disdain the vicious and violent ways of common space pirates, seeing themselves as open-minded capitalists and enterprising merchants, though they are quick to resort to violence if it is necessary to protect their profits. Particularly unscrupulous Shadow Traders have even been known to engage in human trafficking and techno-slavery, although the majority consider this beneath them."
 
 pilgrimage_ideology: "The Pilgrimage"
 pilgrimage_ideology_adj: "Pilgrimage"
 pilgrimage_ideology_adherent: "Pilgrim"
 pilgrimage_ideology_adherent_plural: "Pilgrims"
 pilgrimage_ideology_desc: "The Pilgrimage is an ancient interfaith organization, dating back nearly to the dawn of space colonization, that provides transportation for colonists seeking to visit Earth and its holy places and circulates sacred relics throughout the colonies. The Pilgrimage is so influential that “Pilgrim” has become a byword for any outspoken follower of the Old Faiths, especially those with metroplanetist beliefs who allow their religion to strongly influence their politics. Through the collection of donations, it has become the wealthiest and most politically powerful non-profit organization in the Confederation, at times rivaling the influence of even the Big Five."
 pilgrim_religious_head_title: "Master"
 pilgrim_religious_head_title_name: "Mastery"
 k_pilgrimage: "Pilgrimage"
 k_pilgrimage_adj: "Pilgrim"
 k_pilgrimage_article: "the "
 
 ecumenical: "Ecumenicism"
 ecumenical_adj: "Ecumenical"
 ecumenical_adherent: "Ecumenical"
 ecumenical_adherent_plural: "Ecumenical"
 ecumenical_desc: "#M \"This is, of course, space travel - and in any discussion of religion, it deserves to be written thus: SPACE TRAVEL!\"\n - Frank Herbert, 1965#!\n\nThe Ecumenical Council is an alliance between several of the oldest Christian churches, most prominently the Roman Catholic and Eastern Orthodox churches. While the old structures of these churches are still intact, they have become increasingly politically irrelevant beyond Earth's atmosphere - most institutional power is now in the hands of the Pilgrimage."
 
 islamic: "Islam"
 islamic_adj: "Islamic"
 islamic_adherent: "Muslim"
 islamic_adherent_plural: "Muslims"
 islamic_desc: "#M \"There is no god but Allah, and Muhammad is the messenger of Allah.\"\n - The First Pillar of Islam#!\n\nWhile strong divisions still remain among Muslims, the cooperative spirit of the Cairo Treaty Organization, the centuries-long dormancy of the caliphate, the rising influence of the Pilgrimage, and the increasing secularization of Samawati society have all led to traditional distinctions such as the Sunni-Shia divide becoming increasingly irrelevant. Devout Muslims now identify themselves primarily as Muslims first and Pilgrims second, and consider other sectarian distinctions to be relatively unimportant."
 
 taharahist: "Taharah"
 taharahist_adj: "Taharahist"
 taharahist_adherent: "Taharahist"
 taharahist_adherent_plural: "Taharahists"
 taharahist_desc: "#M \"It is not permitted that the human body, which God has created, be sullied in any way. The mutilation of humans like cattle that now occurs on the worlds of al-Samawat is an abomination.\"\n - Muslihiddin Zarqawi, 2902#!\n\nTaharah is a relatively young Islamic sect, generally dated to a controversial fatwa issued by Muslihiddin Zarqawi condemning \"the sullying of the human body\". Taharahists consider modification of the human form to be a kind of ritual impurity and desecration of God's creation. Besides their opposition to transhumanism, Taharahists also tend to emphasize other traditional forms of ritual purity."
 
 sanatanist: "Sanatana Dharma"
 sanatanist_adj: "Sanatanist"
 sanatanist_adherent: "Sanatani"
 sanatanist_adherent_plural: "Sanatanis"
 sanatanist_desc: "#M \"The Spirit is neither born nor does it die at any time. It does not come into being, or cease to exist. It is unborn, eternal, permanent, and primeval. The Spirit is not destroyed when the body is destroyed... Just as a person puts on new garments after discarding the old ones; similarly, the living entity or the individual soul acquires new bodies after casting away the old bodies.\"\n - The Bhagavad Gita#!\n\nThe Path of the Sanatana Dharma, or Eternal Way, is derived from ancient Indian beliefs about dharma, reincarnation, and deities. The Eternal Way or Samsara is the key concept within the religion, where accumulated karma contributes to the cycle of death and rebirth. The cyclicity of all life, matter, and existence and the liberation of the self from the core of the spiritual quest of the Path of the Eternal Way. The Indian diaspora is where the Path of the Eternal Way still holds strong sway, though it still has many adherents on Terra as well which remains an important pilgrimage site."
 
 judaic: "Judaism"
 judaic_adj: "Jewish"
 judaic_adherent: "Jew"
 judaic_adherent_plural: "Jews"
 judaic_desc: "Jews! In! Spaaaaaace!"
 
 adoptionism_ideology: "Adoptionism"
 adoptionism_ideology_adj: "Adoptionist"
 adoptionism_ideology_adherent: "Adoptionist"
 adoptionism_ideology_adherent_plural: "Adoptionists"
 adoptionism_ideology_desc: "Adoptionism is a religious tendency that emerged during the first wave of interstellar colonization. Separated by vast distances from Earth and its sacred history, Adoptionists chose to reject the importance of that history and \"adopt\" their new homes as spiritual substitutes for Earth. Adoptionists come from a variety of faiths and tend to accept commonality but reject the rigid metroplanetism of the Pilgrims."
 
 independent: "Independence"
 independent_adj: "Independent"
 independent_adherent: "Independent"
 independent_adherent_plural: "Independents"
 independent_desc: "#M \"Our church is a living church, modern church, a human church! We carry the Gospel across the stars not as dogma but as salvation!\"\n - Reverend Daniela Franklin, 2337#!\n\nThe Congregation of Independent Churches is an assocation of many Christian denominations that allows a great range of doctrinal and theological beliefs. What ultimately unites them is a belief in the Bible, social justice, and the message of Jesus Christ that humanity should love one another. The Church has gone to great lengths to fit in within the larger world of the Confederation, rather than rejecting secular and worldly society. Many followers of the Independent Churches have left Earth over the years to bring the Word of God across the stars, but they maintain cordial relations with their kin on Earth."
 independent_priest_male: "pastor"
 independent_priest_male_plural: "pastors"
 independent_priest_female: "pastor"
 independent_priest_female_plural: "pastors"
 independent_priest_neuter: "pastor"
 independent_priest_neuter_plural: "pastors"
 
 sixther: "Sixthism"
 sixther_adj: "Sixthist"
 sixther_adherent: "Sixther"
 sixther_adherent_plural: "Sixthers"
 sixther_desc: "#M \"...and at last they stepped out from the shell of their vessel and looked up and beheld an azure sun blazing in the highest heavens, and knew at last that they had found rest.\"\n - Records of the Great Crossing, 2359#!\n\nThe Sixthers are the modern descendants of a twenty-fourth century religious movement that took root among the Nahua people of Central America. Rooted in historic Nahua religious beliefs, the Sixthers believe that their ancestors' migration to the Nahui-Ahtle system marked the beginning of the Sixth Age of the Sun, an era that will eventually see humanity liberated from conflict, strife, and even entropy."
 
 gaean: "Gaeanism"
 gaean_adj: "Gaeanist"
 gaean_adherent: "Gaean"
 gaean_adherent_plural: "Gaeans"
 gaean_desc: "#M \"The heartbeat of the universe reverberates through life, all life, on every world, no matter what form it takes.\"\n - Reverend Sebastian Florres, 2843#!\n\nThe Gaeans are a pantheistic religious sect that worships and venerates the natural world. They believe that all natural life is a manifestation of a universal oversoul, and that humans have a religious duty to live in harmony with nature. The greatest sin, in the eyes of the Gaeans, is to attempt to enforce one's will upon the natural order, and for this reason they are passionate enemies of transhumanism."
 gaean_high_god_name: "Gaea"
