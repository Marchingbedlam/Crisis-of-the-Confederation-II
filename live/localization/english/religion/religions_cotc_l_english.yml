 mechanism_ideology: "Mechanism"
 mechanism_ideology_adj: "Mechanic"
 mechanism_ideology_adherent: "Mechanist"
 mechanism_ideology_adherent_plural: "Mechanists"
 mechanism_ideology_desc: "Mechanism is a broad term for any of several forms of religious belief that revere scientific knowledge, technology, and machinery. While held in low regard by Pilgrims and scientists alike, Mechanic sects thrive on the Periphery and in the Wilds, where their followers are often the most tech-literate people in any given community."
 
 cosmist: "Cosmism"
 cosmist_adj: "Cosmist"
 cosmist_adherent: "Cosmist"
 cosmist_adherent_plural: "Cosmists"
 cosmist_desc: "#M \"Humans are... irrelevant in the grand scheme of things. To be honest, I find that reassuring. Science isn't just a way to learn about the universe, it's also the rules.\"\n - Doctor Andreas Vox, 2745#!\n\nThe so-called Church of the Cosmos is not a strictly religious organization - Cosmists are both atheist and mystical, a contradiction at the center of the group’s mythology. To the Cosmists, the universe is governed by laws revealed to them by physics and mathematics. As a result, Cosmists hold scientific learning to be their highest achievement, rejecting worldly achievement for discovering the mysteries of the universe."
 d_cosmist: "Church of the Cosmos"
 d_cosmist_adj: "Cosmist"
 d_cosmist_article: "the "
 
 guardianist: "Guardianism"
 guardianist_adj: "Guardianist"
 guardianist_adherent: "Guardianist"
 guardianist_adherent_plural: "Guardianists"
 guardianist_desc: "#M \"The history of the universe progresses from the small and simple to the great and complex. God cannot have come before us. God must be that which comes after us.\"\n - Doctor Nishi Eremias, 2992#!\n\nThe Children of the Guardian are a Mechanist sect that believes that artificial general intelligence is not only possible, but already exists. Guardianists purport to be followers of the Guardian, a supposed superintelligent AI designed to safeguard humanity from external threats."
