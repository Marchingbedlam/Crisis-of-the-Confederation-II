l_english:
 doctrine_commonality_name:0 "Commonality"
 doctrine_commonality_desc:0 "In the modern world, most people believe in the universal commonality of humanity, or simply "commonality" - that all humans are one people. This principle, however, can be cashed out in different ways."
 doctrine_metroplanetism_name:0 "Metroplanetism"
 doctrine_metroplanetism_desc:0 "There should be a single pan-human state, and as the origin of humanity, it is only natural that the capital of this state should be Earth."
 doctrine_parameter_hostility_override_doctrine_metroplanetism_3:1 "Considers metroplanetist [ideologies|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_metroplanetism: "Considers metroplanetist [ideologies|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_separatism_name:0 "Separatism"
 doctrine_separatism_desc:0 "Commonality is an ideal to be aspired to, but impractical as the basis for a political system. Individual communities should govern themselves, but work together in a spirit of friendship and cooperation."
 doctrine_anti_metroplanetism_name:0 "Anti-Metroplanetism"
 doctrine_anti_metroplanetism_desc:0 "There must be a single pan-human state, but mere historical accident affords Earth no special privileges."
 doctrine_particularism_name:0 "Particularism"
 doctrine_particularism_desc:0 "The very notion of commonality was a mistake. We owe nothing to our so-called 'fellow humans'."
 doctrine_parameter_hostility_override_doctrine_particularism_3:1 "Considers particularist [ideologies|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_particularism: "Considers particularist [ideologies|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_legitimacy_name:0 "Legitimacy"
 doctrine_legitimacy_desc:0 "Any system of political thought must start with the question of which forms of power are legitimate and which are not."
 doctrine_democracy_name:0 "Democracy"
 doctrine_democracy_desc:0 "No government is legitimate unless it derives its authority from the consent of the governed."
 doctrine_aristocracy_name:0 "Aristocracy"
 doctrine_aristocracy_desc:0 "Legitimate political power is conferred by heredity, whether that be because of genetic fitness or because of simple hereditary property rights."
 doctrine_meritocracy_name:0 "Meritocracy"
 doctrine_meritocracy_desc:0 "Legitimate authority belongs only to those most fit for the position, as determined by relevant experts, such as previous holders of authority."
 doctrine_anarchy_name:0 "Anarchy"
 doctrine_anarchy_desc:0 "The very notion of 'legitimate authority' is an oxymoron. All authorities are illegitimate."
 doctrine_power_base_name:0 "Power Base"
 doctrine_power_base_desc:0 "Political power must come from somewhere, be it norms and conventions or force of arms."
 doctrine_economic_power_name:0 "Economic"
 doctrine_economic_power_desc:0 "Control of wealth and resources is the key to control of society."
 doctrine_military_power_name:0 "Military"
 doctrine_military_power_desc:0 "Political power flows from the barrel of a gun."
 doctrine_bureaucratic_power_name:0 "Bureaucratic"
 doctrine_bureaucratic_power_desc:0 "Administration and the rule of law ensure social and political order."
 doctrine_authority_name:0 "Authority"
 doctrine_authority_desc:0 "No one rules alone, but opinions on exactly how much power a ruler should have differ dramatically."
 doctrine_despotism_name:0 "Despotism"
 doctrine_despotism_desc:0 "The state is the ruler and the ruler is the state. Political power is personal power and the notion of a limit to the ruler's authority is inherently absurd."
 doctrine_dictatorship_name:0 "Dictatorship"
 doctrine_dictatorship_desc:0 "Supreme political power must be invested in a single individual for the good of the state - parliaments and senates are too slow and cumbersome."
 doctrine_parliamentarianism_name:0 "Parliamentarianism"
 doctrine_parliamentarianism_desc:0 "No one individual should hold absolute power. The most important political decisions should be made deliberatively by the ruling class as a whole."
 doctrine_consensus_name:0 "Consensus"
 doctrine_consensus_desc:0 "Nobody should have a decision forced on them without their consent. Important political decisions must be approved of by everyone.
 tenet_capitalism_name:0 "Capitalism"
 tenet_capitalism_desc:0 "Property rights are the basis of a free and civilized society. By pursuing their own interests, private owners of capital benefit all of society, as if by an invisible hand."
 tenet_planned_economy_name:0 "Economic Planning"
 tenet_planned_economy_desc:0 "The economy should be strictly controlled and regulated for the benefit of the state."
 tenet_communal_possessions_name:0 "Socialism"
 tenet_communal_possessions_desc:0 "Profit is theft. Everyone is entitled to the fruit of their own labor, and no one should have to spend their life toiling to make someone else rich."