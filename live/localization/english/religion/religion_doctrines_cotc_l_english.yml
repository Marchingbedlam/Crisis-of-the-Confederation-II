l_english:
 doctrine_atheist_name: "Atheist"
 doctrine_atheist_desc: "There is no god and there are no spirits. The world is utterly mundane and comprehensible by science. Religion and superstitions are tools of control that the galaxy is better off without."
 doctrine_parameter_separation_of_church_and_state: "This ideology believes that [cotc_theocracies|E] should have no political power."
 doctrine_parameter_theocratic_tax_exemption: "This ideology believes that [cotc_theocracies|E] should be tax-exempt."
 
 doctrine_secular_name: "Secular"
 doctrine_secular_desc: "People can believe what they like about the next life, what matters is what they believe about this one."
 
 tenet_armed_pilgrimages_secular_name: "Revanchism"
 tenet_armed_pilgrimages_secular_desc: "There are worlds that rightfully belong to us and our ideals, and we will fight for them if necessary."
 
 tenet_carnal_exaltation_secular_name: "Sex Positivity"
 tenet_carnal_exaltation_secular_desc: "Sex is a natural part of human biology and sociology. So long as it is approached ethically, it is foolish to be squeamish about it."
 
 tenet_divine_marriage_secular_name: "Pure Bloodlines"
 tenet_divine_marriage_secular_desc: "It is in our nature to strive to pass on our genetic code as purely as possible."
 
 tenet_mendicant_preachers_secular_name: "Spread the Revolution"
 tenet_mendicant_preachers_secular_desc: "Our cause is carried forward from world to world by idealists and revolutionaries. Our voices will be heard in every corner of the galaxy."
 
 tenet_pentarchy_secular_name: "Core Worlds"
 tenet_pentarchy_secular_desc: "Certain planets hold great historical and traditional importance, and they are the natural seats of power for any legitimate political institution."
 
 tenet_unrelenting_faith_secular_name: "Never Surrender"
 tenet_unrelenting_faith_secular_desc: "Our convictions are strong, and we will gladly fight and die for our cause. No matter how badly the odds are stacked against us, we will never surrender."
 
 tenet_vows_of_poverty_secular_name: "Voluntary Poverty"
 tenet_vows_of_poverty_secular_desc: "Wealth is a corruptive force. One should eschew wealth and instead seek virtue."
 
 tenet_communal_identity_secular_desc: "Our beliefs are closely tied to our culture and heritage. This practice strengthens the bonds of our community, though it tends to exclude foreigners."
 
 tenet_adaptive_secular_desc: "Dogmatic purity tests only bring ruin and disaster. It is better to be flexible and to compromise our ideals than to die out and take those ideals with us."
 
 tenet_legalism_secular_desc: "The rule of law is vital to any stable and successful civilization. No one, no matter how exalted their status, is above the law."
 
 tenet_asceticism_secular_desc: "It is better to live simply, without sullying oneself with vulgar pleasures of the flesh."
 
 tenet_ritual_hospitality_secular_name: "Hospitality"
 tenet_ritual_hospitality_secular_desc: "The contract between guest and host is critical to the well-being of society."
 
 tenet_literalism_secular_name: "Originalism"
 tenet_literalism_secular_desc: "We got it right the first time. Nothing is more important than adhering to the ideals set out by our founders."
 
 tenet_tax_nonbelievers_secular_name: "Tax Dissidents"
 tenet_tax_nonbelievers_secular_desc: "It is only proper that those who do not conform to the ideals of our society pay a price for their deviancy."
 
 tenet_ancestor_worship_secular_name: "Shoulders of Giants"
 tenet_ancestor_worship_secular_desc: "We would not be where we are today without the efforts of those who came before us. We owe them an enormous debt."
 
 tenet_hedonistic_secular_desc: "The goal of life is pleasure, and we should indulge in it whenever we have the chance."
 
 tenet_ritual_celebrations_secular_name: "Grand Celebrations"
 tenet_ritual_celebrations_secular_desc: "Eat, drink, and be merry. There is nothing better in life than good times spent with good friends."
 
 tenet_sacred_childbirth_secular_name: "Pronatalism"
 tenet_sacred_childbirth_secular_desc: "Reproduction is the genetic imperative of humanity. There is nothing nobler than to create more humans."
 
 tenet_sanctity_of_nature_secular_name: "Environmentalism"
 tenet_sanctity_of_nature_secular_desc: "Humanity has done so much harm to our mother world. We must never repeat that mistake."
 
 tenet_warmonger_secular_desc: "War is glorious. War is where we are tested and discover who we truly are. War is the way of the galaxy, and cowardice is the greatest sin."
 
 tenet_pure_land_secular_name: "Revolutionary Fervor"
 tenet_pure_land_secular_desc: "No force is greater than the will of the people. Tyrants and corrupt rulers are a blight upon the galaxy that must be destroyed by any means necessary."

 tenet_science_and_reason_name: "Science and Reason"
 tenet_science_and_reason_desc: "Only through constant questioning and careful observation of the world can we hope to find the truth."
 
 tenet_scholarship_and_lore_name: "Scholarship and Lore"
 tenet_scholarship_and_lore_desc: "The key to true wisdom is to study the teachings of the great sages who came before us. Arrogant attempts at innovation inevitably lead to error."

 tenet_socialism_name: "Socialism"
 tenet_socialism_desc: "Profit is theft. Everyone is entitled to the fruit of their own labor, and no one should have to spend their life toiling to make someone else rich."
 
 tenet_code_of_silence_name: "Code of Silence"
 tenet_code_of_silence_desc: "Whoever appeals to the law against his fellow man is either a fool or a coward. Whoever cannot take care of himself without police protection is both."
 tenet_doublespeak_name: "Doublespeak"
 tenet_doublespeak_desc: "Whatever the Party says is the truth. If reality disagrees, so much the worse for reality."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes:0 "Adherents earn piety for successfully completing [intrigue|E] [schemes|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes:0 "Adherents are more willing to become Agents in the [schemes|E] of other characters"
 
 doctrine_ideology_type_name: "Ideology Type"
 doctrine_ideology_type_desc: "There are numerous forms of ideological belief."
 
 doctrine_political_name: "Political Ideology"
 doctrine_political_desc: "This ideology is a system of political thought, concerned with achieving meaningful, systemic results in the real world across entire societies."
 doctrine_parameter_secular_administrators: "Administrative [governments|E] formed by this ideology are not considered Theocracies. #X Feature not yet implemented.#!"
 
 doctrine_religious_name: "Religious Ideology"
 doctrine_religious_desc: "This ideology is a religion or cult, concerned with spirituality and the divine. While many people are religious, only followers of religious ideologies consider their religion to be the center of their political identity."
 doctrine_parameter_religious_administrators: "Administrative [governments|E] formed by this ideology are considered Theocracies. #X Feature not yet implemented.#!"
 
 doctrine_criminal_name: "Criminal Tradition"
 doctrine_criminal_desc: "This is less an ideology and more a set of traditions, loosely binding together a group for the purposes of engaging in organized crime."
 doctrine_parameter_can_form_crime_sydnicates: "Can form Crime Syndicates. #X Feature not yet implemented.#!"
 
 FAITH_DOCTRINES_POLITICS:"Politics"
 
 doctrine_legitimacy_name: "Legitimacy"
 doctrine_legitimacy_desc: "Any system of political thought must start with the question of which forms of power are legitimate and which are not."
 
 doctrine_democracy_name: "Democracy"
 doctrine_democracy_desc: "No government is legitimate unless it derives its authority from the consent of the governed."
 doctrine_parameter_prefers_democracy: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Democratic."
 doctrine_parameter_democratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Democratic governments. #X Feature not yet implemented.#!"
 
 doctrine_aristocracy_name: "Aristocracy"
 doctrine_aristocracy_desc: "Legitimate political power is conferred by heredity, whether that be because of genetic fitness or because of simple hereditary property rights."
 doctrine_parameter_prefers_aristocracy: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Aristocratic."
 doctrine_parameter_aristocratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Aristocratic governments. #X Feature not yet implemented.#!"
 
 doctrine_meritocracy_name: "Meritocracy"
 doctrine_meritocracy_desc: "Legitimate authority belongs only to those most fit for the position, as determined by relevant experts, such as previous holders of authority."
 doctrine_parameter_prefers_meritocratic: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Meritocratic."
 doctrine_parameter_meritocratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Meritocratic governments. #X Feature not yet implemented.#!"
 
 doctrine_anarchy_name: "Anarchy"
 doctrine_anarchy_desc: "The very notion of 'legitimate authority' is an oxymoron. All authorities are illegitimate."
 doctrine_parameter_neutral_revolutions: "Revolutions with leaders of this ideology will not copy the legitimacy type of the current government."
 
 doctrine_power_base_name: "Power Base"
 doctrine_power_base_desc: "Political power must come from somewhere, be it norms and conventions or force of arms."
 
 doctrine_commercial_power_name: "Commercial"
 doctrine_commercial_power_desc: "Control of wealth and resources is the key to control of society."
 doctrine_parameter_prefers_commercial_power: "Commercial [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Commercial."
 doctrine_parameter_commercial_revolutions: "Revolutions with leaders of this ideology will attempt to establish Commercial governments. #X Feature not yet implemented.#!"
 
 doctrine_military_power_name: "Military"
 doctrine_military_power_desc: "Political power flows from the barrel of a gun."
 doctrine_parameter_prefers_military_power: "Military [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Military."
 doctrine_parameter_military_revolutions: "Revolutions with leaders of this ideology will attempt to establish Military governments. #X Feature not yet implemented.#!"
 
 doctrine_administrative_power_name: "Administrative"
 doctrine_administrative_power_desc: "Bureaucracy and the rule of law ensure social and political order."
 doctrine_parameter_prefers_administrative_power: "Administrative [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Administrative."
 doctrine_parameter_administrative_revolutions: "Revolutions with leaders of this ideology will attempt to establish Administrative governments. #X Feature not yet implemented.#!"
 
 doctrine_authority_name: "Authority"
 doctrine_authority_desc: "No one rules alone, but opinions on exactly how much power a ruler should have differ dramatically."

 doctrine_despotism_name: "Despotism"
 doctrine_despotism_desc: "The state is the ruler and the ruler is the state. Political power is personal power and the notion of a limit to the ruler's authority is inherently absurd."
 doctrine_parameter_prefers_dictatorships: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Dictatorship. #X Feature not yet implemented.#!"
 doctrine_parameter_dictatorial_revolutions: "Revolutions with leaders of this ideology will attempt to establish Dictatorial governments. #X Feature not yet implemented.#!"
 
 doctrine_dictatorship_name: "Dictatorship"
 doctrine_dictatorship_desc: "Supreme political power must be invested in a single individual for the good of the state - parliaments and senates are too slow and cumbersome."
 
 doctrine_separation_of_powers_name: "Separation of Powers"
 doctrine_separation_of_powers_desc: "No one institution should hold absolute power. Executive and legislative power should be separated from each other, to form a system of checks and balances."
 doctrine_parameter_prefers_presidential_system: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Presidential system. #X Feature not yet implemented.#!"
 doctrine_parameter_presidential_revolutions: "Revolutions with leaders of this ideology will attempt to establish Presidential governments. #X Feature not yet implemented.#!"
 
 doctrine_parliamentarianism_name: "Parliamentarianism"
 doctrine_parliamentarianism_desc: "Executive power should be subordinate to a legislative branch that represents the state as a whole."
 doctrine_parameter_prefers_parliamentary_system: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Parliamentary system. #X Feature not yet implemented.#!"
 doctrine_parameter_parliamentary_revolutions: "Revolutions with leaders of this ideology will attempt to establish Parliamentary governments. #X Feature not yet implemented.#!"
 
 doctrine_anarchism_name: "Anarchism"
 doctrine_anarchism_desc: "Nobody should have power over anyone else. All hierarchies should be dismantled and the power of the state replaced with a form of governance based on consensus and self-determination."
 doctrine_parameter_prefers_anarchy: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward Anarchy. #X Feature not yet implemented.#!"
 doctrine_parameter_anarchist_revolutions: "Revolutions with leaders of this ideology will attempt to establish Anarchic societies. #X Feature not yet implemented.#!"
 
 doctrine_commonality_name: "Commonality"
 doctrine_commonality_desc: "In the modern world, most people believe in the universal commonality of humanity, or simply "commonality" - that all humans are one people. This principle, however, can be cashed out in different ways."
 
 doctrine_metroplanetism_name: "Metroplanetism"
 doctrine_metroplanetism_desc: "There should be a single pan-human state, and as the origin of humanity, it is only natural that the capital of this state should be Earth."
 doctrine_parameter_can_join_the_confederation: "Can petition to join the [GetTitleByKey('e_terran_confederacy').GetName|V]. #X Feature not yet implemented.#!"
 doctrine_parameter_will_not_secede_from_the_confederation: "[vassals|E] of this ideology will never declare independence wars or join Independence or Dissolution [factions|E] against the [GetTitleByKey('e_terran_confederacy').GetName|V]. #X Feature not yet implemented.#!"
 doctrine_parameter_reveres_earth: "Considers [GetTitleByKey('b_earth').GetName|V] a Holy Site. #X Feature not yet implemented.#!"
 doctrine_parameter_hostility_override_doctrine_particularism_3: "Considers ideologies with the Particularism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_particularism: "Considers ideologies with the Particularism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_commonality_pluralism_name: "Pluralism"
 doctrine_commonality_pluralism_desc: "There are many possible interpretations of commonality, and many ways to go about building our society. Ironically, focusing on competing interpretations only divides us."
 
 doctrine_separatism_name: "Separatism"
 doctrine_separatism_desc: "Commonality is an ideal to be aspired to, but impractical as the basis for a political system. Individual communities should govern themselves, but work together in a spirit of friendship and cooperation."
 doctrine_parameter_anti_imperialist: "[vassals|E] of this ideology are more likely to declare independence wars or join Independence or Dissolution [factions|E]. #X Feature not yet implemented.#!"
 
 doctrine_anti_metroplanetism_name: "Anti-Metroplanetism"
 doctrine_anti_metroplanetism_desc: "There must be a single pan-human state, but Earth is a tyrant-world that must be overthrown."
 doctrine_parameter_hates_the_confederation: "[vassals|E] of this ideology are more likely to declare independence wars or join Independence or Dissolution [factions|E] against the [GetTitleByKey('e_terran_confederacy').GetName|V]. #X Feature not yet implemented.#!"
 doctrine_parameter_hates_earth: "Can use orbital bombardment against [GetTitleByKey('b_earth').GetName|V]. #X Feature not yet implemented.#!"
 doctrine_parameter_hostility_override_doctrine_metroplanetism_3: "Considers ideologies with the Metroplanetism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_metroplanetism: "Considers ideologies with the Cyberneticism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_particularism_name: "Particularism"
 doctrine_particularism_desc: "The very notion of commonality was a mistake. We owe nothing to our so-called 'fellow humans'."
 doctrine_parameter_can_deport_foreigners: "Can deport [characters|E] with different [cultures|E]. #X Feature not yet implemented.#!"
 
 doctrine_extortion_name: "Extortion"
 doctrine_extortion_desc: "Extortion is the use of blackmail or threats of violence to extract money and other goods. Extortionists commonly run so-called protection rackets, in which they collect money in exchange for 'protection' from their own acts of violence, or from rival criminal organizations."
 
 doctrine_extortion_allowed_name: "Allowed"
 doctrine_extortion_allowed_desc: "Why fight when we don't have to? In the long run, selling protection is easier and more profitable than simple theft."
 doctrine_parameter_can_extort_provinces: "Can establish Protection Rackets in [counties|E]. #X Feature not yet implemented.#!"
 doctrine_parameter_can_extort_rulers: "Can use the Extortion [scheme|E] on [rulers|E]. #X Feature not yet implemented.#!"
 doctrine_parameter_can_offer_loans: "Can Offer Loans to [characters|E]. #X Feature not yet implemented.#!"
 
 doctrine_extortion_forbidden_name: "Forbidden"
 doctrine_extortion_forbidden_desc: "Extortion is too roundabout to be worth bothering with. We should take more direct action."
 
 doctrine_piracy_name: "Piracy"
 doctrine_piracy_desc: "Space is vast, but finding merchant ships is rarely difficult, and space piracy is a constant scourge in lightly-defended systems. Space pirates often know their local area well and become skilled at navigating the difficult currents created in hyperspace by interstellar nebulas."
 
 doctrine_piracy_encouraged_name: "Encouraged"
 doctrine_piracy_encouraged_desc: "Take what you can. Give nothing back."
 
 doctrine_piracy_allowed_name: "Allowed"
 doctrine_piracy_allowed_desc: "Piracy is an unsubtle tool, but sometimes you don't need subtlety."
 
 doctrine_piracy_forbidden_name: "Forbidden"
 doctrine_piracy_forbidden_desc: "Piracy is clumsy, dangerous, and attracts attention. Better to leave it to amateurs."
 
 doctrine_smuggling_name: "Smuggling"
 doctrine_piracy_desc: "States and other governments may try to put limits on trade, but there's always room to sneak in around the edges."
 
 doctrine_smuggling_allowed_name: "Allowed"
 doctrine_smuggling_allowed_desc: "Wherever there's something the law doesn't want people to have, there's money to be made."
 doctrine_parameter_can_trade_drugs: "Can trade #V Drugs#!. #X Feature not yet implemented.#!"
 doctrine_parameter_can_smuggle: "Can trade #N Illegal#! Trade Goods. #X Feature not yet implemented.#!"
 
 doctrine_smuggling_restricted_name: "Restricted"
 doctrine_smuggling_restricted_desc: "There's no shame in helping people acquire things the law would rather they not, but there are limits. We're not monsters, after all."
 
 doctrine_illegal_technology_name: "Illegal Tech"
 doctrine_illegal_technology_desc: "In some places, certain medical procedures are illegal. And in those places, the people who would normally go to a fancy, med school-educated doctor might have to settle for someone a little less prestigious."
 
 doctrine_illegal_technology_allowed_name: "Allowed"
 doctrine_illegal_technology_allowed_desc: "Wherever the hand of the law is heavy, there's an opportunity for profit. We provide access to services some would consider 'disgraceful to the human form'."
 doctrine_parameter_can_perform_illegal_cybersurgery: "Can perform #N Illegal#! Cybersurgery. #X Feature not yet implemented.#!"
 doctrine_parameter_can_perform_illegal_cloning: "Can perform #N Illegal#! Cloning. #X Feature not yet implemented.#!"
 doctrine_parameter_can_perform_illegal_gene_modding: "Can perform #N Illegal#! Gene Modding. #X Feature not yet implemented.#!"
 
 doctrine_illegal_technology_forbidden_name: "Forbidden"
 doctrine_illegal_technology_evil_desc: "Some things are illegal for good reason. We will not lower ourselves to mutilating people simply for profit."
 doctrine_illegal_technology_forbidden_desc: "The tech stuff is too hot, the training and parts too expensive."
 
 tenet_capitalism_name: "Capitalism"
 tenet_capitalism_desc: "Property rights are the basis of a free and civilized society. By pursuing their own interests, private owners of capital benefit all of society, as if by an invisible hand."
 doctrine_parameter_hostility_override_tenet_communal_possessions_2: "Considers ideologies with the Socialism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_tenet_communal_possessions: "Considers ideologies with the Socialism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_parameter_hostility_override_tenet_capitalism_2: "Considers ideologies with the Capitalism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_tenet_capitalism: "Considers ideologies with the Capitalism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_planned_economy_name: "Economic Planning"
 tenet_planned_economy_desc: "The economy should be strictly controlled and regulated for the benefit of the state."
 
 tenet_federalism_name: "Federalism"
 tenet_federalism_desc: "It is vital for those in positions of authority to respect local and regional differences. Most decisions should be made locally, with only the most important being handled by a central authority."
 doctrine_parameter_can_form_federations: "Can form Confederations. #X Feature not yet implemented.#!"
 
 tenet_spacer_values_name: "Spacer Values"
 tenet_spacer_values_desc: "We respect those who bravely throw themselves into the void, and hold to the code of the first generation of spacers - obey your captain, keep your word, and stand by your crew."
 
 tenet_cyberneticism_name: "Cyberneticism"
 tenet_cyberneticism_desc: "The human body is a prison to which technology has given us the key. Reject the weakness of the flesh and embrace the strength and certainty of steel. Become whatever you desire."
 doctrine_parameter_supports_cybernetics: "[rulers|E] of this ideology will try to legalize Cybernetics. #X Feature not yet implemented.#!"
 doctrine_parameter_full_cybernetic_conversion: "Can perform Full Cybernetic Conversions. #X Feature not yet implemented.#!"
 
 tenet_bio_directionism_name: "Bio-Directionism"
 tenet_bio_directionism_desc: "Science has provided us with the means to direct our own evolution. The human genome can be shaped to our will, our legacy defined by our choices rather than the whims of fate."
 doctrine_parameter_supports_gene_modding: "[rulers|E] of this ideology will try to legalize Gene Modding. #X Feature not yet implemented.#!"
 doctrine_parameter_supports_cloning: "[rulers|E] of this ideology will try to legalize Cloning. #X Feature not yet implemented.#!"
 doctrine_parameter_gene_modding: "Can Gene Mod newborn children and Clones. #X Feature not yet implemented.#!"
 
 tenet_genetic_dynasties_name: "Genetic Dynasties"
 tenet_genetic_dynasties_desc: "The greatest weakness of benevolent despotism was the mortality of despots. Through cloning technology, it is possible to keep the best leaders alive and in power for eternity."
 doctrine_parameter_clone_succession_enabled: "Can use the Genetic Dynasty Succession Law. #X Feature not yet implemented.#!"
 
 tenet_human_purity_name: "Human Purity"
 tenet_human_purity_desc: "Man was created in [ROOT.Faith.HighGodNamePossessive] image, and that image is sacred. To defile the human form with foul machines or genetic tinkering is an abomination."
 doctrine_parameter_hates_cybernetics: "[rulers|E] of this ideology will try to ban Cybernetics. #X Feature not yet implemented.#!"
 doctrine_parameter_hates_cloning: "[rulers|E] of this ideology will try to ban Cloning. #X Feature not yet implemented.#!"
 doctrine_parameter_hates_gene_modding: "[rulers|E] of this ideology will try to ban Gene Modding. #X Feature not yet implemented.#!"
 doctrine_parameter_hostility_override_doctrine_cyberneticism_3: "Considers ideologies with the Cyberneticism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_cyberneticism: "Considers ideologies with the Cyberneticism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_bio_directionism_3: "Considers ideologies with the Bio-Directionism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_bio_directionism: "Considers ideologies with the Bio-Directionism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_genetic_dynasties_3: "Considers ideologies with the Genetic Dynasties tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_genetic_dynasties: "Considers ideologies with the Genetic Dynasties tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_chivalry_name: "Neo-Chivalry"
 tenet_chivalry_desc: "We look to the legacy of Earth's ancient heroes, to brave knights and fair maidens, and uphold them as an ideal to which to aspire."
 doctrine_parameter_knighthood: "Can Knight [courtiers|E] and [vassals|E]. #X Feature not yet implemented.#!"
 doctrine_parameter_courtly_romance: "[characters|E] of this ideology are more likely to pursue Romance [schemes|E]. #X Feature not yet implemented.#!"
 
 tenet_philanthropy_name: "Philanthropy"
 tenet_philanthropy_desc: "A society's worth is judged by how it treats the least fortunate."
 tenet_alms_for_the_poor_name: "Alms for the Poor"
 tenet_alms_for_the_poor_desc: "It is easier for a camel to pass through the eye of a needle than it is for a rich man to enter the Kingdom of Heaven."
 tenet_chivalrous_thieves_name: "Chivalrous Thieves"
 tenet_chivalrous_thieves_desc: "Some may call us thieves and criminals, but in truth, we are heroes of the people, robbing from the rich and giving to the poor."
 doctrine_parameter_can_distribute_wealth: "Can Distribute Wealth in a [county|E] to gain [piety|E]. #X Feature not yet implemented.#!"
 
 tenet_united_front_name: "United Front"
 tenet_united_front_desc: "We cannot afford to fight amongst ourselves in the face of a common enemy."
 tenet_peace_of_god_name: "Peace of God"
 tenet_peace_of_god_desc: "The faithful must set aside our differences and fight together against the heathen."
 tenet_honor_among_thieves_name: "Honor Among Thieves"
 tenet_honor_among_thieves_desc: "Though outlaws we may be, a common code binds us together. When the galaxy is against us, it is foolish to fight each other."
 doctrine_parameter_attacking_coreligionists_costs_piety: "Declaring war on fellow followers of this ideology costs [piety|E]. #X Feature not yet implemented.#!"
 doctrine_parameter_cannot_use_conquest_cb_against_coreligionists: "Cannot use the Conquest [casus_belli|E] against fellow followers of this ideology."
 doctrine_parameter_cannot_use_invasion_cb_against_coreligionists: "Cannot use the Invasion [casus_belli|E] against fellow followers of this ideology."
 
 tenet_upstanding_citizens_name: "Upstanding Citizens"
 tenet_upstanding_citizens_desc: "Hard crime isn't worth the heat. We're not common criminals, we're upstanding members of the community."
 doctrine_parameter_political_hostility_to_us: "Political ideologies consider this ideology to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_religious_hostility_to_us: "Religious ideologies consider this ideology to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_thieves_in_law_name: "Thieves-in-Law"
 tenet_thieves_in_law_desc: "We honor the masters of our peculiar trade, who refuse to bow down to the law or sully their hands with politics or honest work."
 doctrine_parameter_monthly_piety_gain_in_prison: "Gain TOKEN_PARAMETER.GetIntValue [piety|E] per month while imprisoned."
 doctrine_parameter_non_criminal_contracts_cost_piety: "Non-Criminal [contracts|E] cost [piety|E]. #X Feature not yet implemented.#!"
 doctrine_parameter_master_thieves: "Can anoint [courtiers|E] and [vassals|E] as Master Thieves. #X Feature not yet implemented.#!"
 
 tenet_ritual_tattoos_name: "Ritual Tattoos"
 tenet_ritual_tattoos_desc: "Our commitments and history are inscribed into our very flesh."
 doctrine_parameter_can_apply_ritual_tattoos: "Can apply Ritual Tattoos. #X Feature not yet implemented.#!"
 
 tenet_atonement_through_sacrifice_name: "Atonement Through Sacrifice"
 tenet_atonement_through_sacrifice_desc: "Apologies are empty words, easily faked. Those who seek to redeem themselves for their sins must pay a price in blood to demonstrate the strength of their conviction."
 doctrine_parameter_can_mutilate_as_punishment: "Can punish [prisoners|E] with Mutilation. #X Feature not yet implemented.#!"
 doctrine_parameter_can_apologize_through_self_mutilation: "Can offer to reconcile with hostile [characters|E] through Self-Mutilation. #X Feature not yet implemented.#!"
 
 tenet_ritual_hallucinogens_name: "Ritual Hallucinogens"
 tenet_ritual_hallucinogens_desc: "So-called \"hallucinations\" bring us an otherworldly sight, giving us insights into the divine."
 doctrine_parameter_hallucinogenic_rituals: "Can perform Hallucinogenic Rituals. #X Feature not yet implemented.#!"
 
 special_doctrine_is_buddhist_faith_name: "Teachings of the Buddha"
 special_doctrine_is_buddhist_faith_desc: "We follow in the footsteps of the Buddha, walking the Noble Eightfold Path to liberation from Samsara."
 
 special_doctrine_is_hindu_faith_name: "Teachings of the Vedas"
 special_doctrine_is_hindu_faith_desc: "We believe in the revelations brought to the ancient sages and in the Eternal Way."
 
 special_doctrine_is_nahua_faith_name: "Followers of Teotl"
 special_doctrine_is_nahua_faith_desc: "We believe in teotl, the divine force that permeates the universe and manifests in spirits and gods."
 tenet_nahua_syncretism_name: "Nahua Syncretism"
 tenet_nahua_syncretism_desc: "Despite its... troubling history, there is something insightful about the philosophy of the Nahua and their belief in pantheistic force."
 
 special_doctrine_is_mechanic_faith_name: "Followers of the Machine"
 special_doctrine_is_mechanic_faith_desc: "We see the universe as a vast, unfathomable machine, running as if by clockwork according to sacred laws."
 tenet_mechanic_syncretism_name: "Mechanic Syncretism"
 tenet_mechanic_syncretism_desc: "The machine cults may be blasphemous, but they are not wrong that the universe is a mechanical marvel."