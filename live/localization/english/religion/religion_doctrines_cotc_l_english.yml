l_english:
 doctrine_ideology_type_name: "Ideology Type"
 doctrine_ideology_type_desc: "There are numerous forms of ideological belief."
 
 doctrine_political_name: "Political Ideology"
 doctrine_political_desc: "This ideology is a system of political thought, concerned with achieving meaningful, systemic results in the real world across entire societies."
 doctrine_parameter_secular_administrators: "Administrative [governments|E] formed by this ideology are not considered Theocracies."
 
 doctrine_religious_name: "Religious Ideology"
 doctrine_religious_desc: "This ideology is a religion or cult, concerned with spirituality and the divine. While many people are religious, only followers of religious ideologies consider their religion to be the center of their political identity."
 doctrine_parameter_religious_administrators: "Administrative [governments|E] formed by this ideology are considered Theocracies."
 
 doctrine_criminal_name: "Criminal Tradition"
 doctrine_criminal_desc: "This is less an ideology and more a set of traditions, loosely binding together a group for the purposes of engaging in organized crime."
 doctrine_parameter_can_form_crime_sydnicates: "Can form Crime Syndicates."
 
 doctrine_legitimacy_name: "Legitimacy"
 doctrine_legitimacy_desc: "Any system of political thought must start with the question of which forms of power are legitimate and which are not."
 
 doctrine_democracy_name: "Democracy"
 doctrine_democracy_desc: "No government is legitimate unless it derives its authority from the consent of the governed."
 doctrine_parameter_prefers_democracy: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Democratic."
 doctrine_parameter_democratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Democratic governments."
 
 doctrine_aristocracy_name: "Aristocracy"
 doctrine_aristocracy_desc: "Legitimate political power is conferred by heredity, whether that be because of genetic fitness or because of simple hereditary property rights."
 doctrine_parameter_prefers_aristocracy: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Aristocratic."
 doctrine_parameter_aristocratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Aristocratic governments."
 
 doctrine_meritocracy_name: "Meritocracy"
 doctrine_meritocracy_desc: "Legitimate authority belongs only to those most fit for the position, as determined by relevant experts, such as previous holders of authority."
 doctrine_parameter_prefers_meritocratic: "[rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is Meritocratic."
 doctrine_parameter_meritocratic_revolutions: "Revolutions with leaders of this ideology will attempt to establish Meritocratic governments."
 
 doctrine_anarchy_name: "Anarchy"
 doctrine_anarchy_desc: "The very notion of 'legitimate authority' is an oxymoron. All authorities are illegitimate."
 doctrine_parameter_neutral_revolutions: "Revolutions with leaders of this ideology will not copy the legitimacy type of the current government."
 
 doctrine_commonality_name: "Commonality"
 doctrine_commonality_desc: "In the modern world, most people believe in the universal commonality of humanity, or simply "commonality" - that all humans are one people. This principle, however, can be cashed out in different ways."
 
 doctrine_power_base_name: "Power Base"
 doctrine_power_base_desc: "Political power must come from somewhere, be it norms and conventions or force of arms."
 
 doctrine_commercial_power_name: "Commercial"
 doctrine_commercial_power_desc: "Control of wealth and resources is the key to control of society."
 doctrine_parameter_prefers_commercial_power: "Commercial [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Commercial."
 doctrine_parameter_commercial_revolutions: "Revolutions with leaders of this ideology will attempt to establish Commercial governments."
 
 doctrine_military_power_name: "Military"
 doctrine_military_power_desc: "Political power flows from the barrel of a gun."
 doctrine_parameter_prefers_military_power: "Military [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Military."
 doctrine_parameter_military_revolutions: "Revolutions with leaders of this ideology will attempt to establish Military governments."
 
 doctrine_administrative_power_name: "Administrative"
 doctrine_administrative_power_desc: "Bureaucracy and the rule of law ensure social and political order."
 doctrine_parameter_prefers_administrative_power: "Administrative [rulers|E] of this ideology will have a #N -20#! [opinion|E] of their liege unless the liege's [government|E] is also Administrative."
 doctrine_parameter_administrative_revolutions: "Revolutions with leaders of this ideology will attempt to establish Administrative governments."
 
 doctrine_authority_name: "Authority"
 doctrine_authority_desc: "No one rules alone, but opinions on exactly how much power a ruler should have differ dramatically."

 doctrine_despotism_name: "Despotism"
 doctrine_despotism_desc: "The state is the ruler and the ruler is the state. Political power is personal power and the notion of a limit to the ruler's authority is inherently absurd."
 doctrine_parameter_prefers_dictatorships: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Dictatorship."
 doctrine_parameter_dictatorial_revolutions: "Revolutions with leaders of this ideology will attempt to establish Dictatorial governments."
 
 doctrine_dictatorship_name: "Dictatorship"
 doctrine_dictatorship_desc: "Supreme political power must be invested in a single individual for the good of the state - parliaments and senates are too slow and cumbersome."
 
 doctrine_separation_of_powers_name: "Separation of Powers"
 doctrine_separation_of_powers_desc: "No one institution should hold absolute power. Executive and legislative power should be separated from each other, to form a system of checks and balances."
 doctrine_parameter_prefers_presidential_system: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Presidential system."
 doctrine_parameter_presidential_revolutions: "Revolutions with leaders of this ideology will attempt to establish Presidential governments."
 
 doctrine_parliamentarianism_name: "Parliamentarianism"
 doctrine_parliamentarianism_desc: "Executive power should be subordinate to a legislative branch that represents the state as a whole."
 doctrine_parameter_prefers_parliamentary_system: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward a Parliamentary system."
 doctrine_parameter_parliamentary_revolutions: "Revolutions with leaders of this ideology will attempt to establish Parliamentary governments."
 
 doctrine_anarchism_name: "Anarchism"
 doctrine_anarchism_desc: "Nobody should have power over anyone else. All hierarchies should be dismantled and the power of the state replaced with a form of governance based on consensus and self-determination."
 doctrine_parameter_prefers_anarchy: "[rulers|E] of this ideology may attempt to move their realm's [government|E] toward Anarchy."
 doctrine_parameter_anarchist_revolutions: "Revolutions with leaders of this ideology will attempt to establish Anarchic societies."
 
 doctrine_metroplanetism_name: "Metroplanetism"
 doctrine_metroplanetism_desc: "There should be a single pan-human state, and as the origin of humanity, it is only natural that the capital of this state should be Earth."
 doctrine_parameter_can_join_the_confederation: "Can petition to join the [GetTitleByKey('e_terran_confederacy').GetName|V]."
 doctrine_parameter_will_not_secede_from_the_confederation: "[vassals|E] of this ideology will never declare independence wars or join Independence or Dissolution [factions|E] against the [GetTitleByKey('e_terran_confederacy').GetName|V]."
 doctrine_parameter_reveres_earth: "Considers [GetTitleByKey('b_earth').GetName|V] a Holy Site."
 doctrine_parameter_hostility_override_doctrine_particularism_3: "Considers ideologies with the Particularism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_particularism: "Considers ideologies with the Particularism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_commonality_pluralism_name: "Pluralism"
 doctrine_commonality_pluralism_desc: "There are many possible interpretations of commonality, and many ways to go about building our society. Ironically, focusing on competing interpretations only divides us."
 
 doctrine_separatism_name: "Separatism"
 doctrine_separatism_desc: "Commonality is an ideal to be aspired to, but impractical as the basis for a political system. Individual communities should govern themselves, but work together in a spirit of friendship and cooperation."
 doctrine_parameter_anti_imperialist: "[vassals|E] of this ideology are more likely to declare independence wars or join Independence or Dissolution [factions|E]."
 
 doctrine_anti_metroplanetism_name: "Anti-Metroplanetism"
 doctrine_anti_metroplanetism_desc: "There must be a single pan-human state, but Earth is a tyrant-world that must be overthrown."
 doctrine_parameter_hates_the_confederation: "[vassals|E] of this ideology are more likely to declare independence wars or join Independence or Dissolution [factions|E] against the [GetTitleByKey('e_terran_confederacy').GetName|V]."
 doctrine_parameter_hates_earth: "Can use orbital bombardment against [GetTitleByKey('b_earth').GetName|V]."
 doctrine_parameter_hostility_override_doctrine_metroplanetism_3: "Considers ideologies with the Metroplanetism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_metroplanetism: "Considers ideologies with the Cyberneticism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_particularism_name: "Particularism"
 doctrine_particularism_desc: "The very notion of commonality was a mistake. We owe nothing to our so-called 'fellow humans'."
 doctrine_parameter_can_deport_foreigners: "Can deport [characters|E] with different [cultures|E]."
 
 tenet_capitalism_name: "Capitalism"
 tenet_capitalism_desc: "Property rights are the basis of a free and civilized society. By pursuing their own interests, private owners of capital benefit all of society, as if by an invisible hand."
 doctrine_parameter_hostility_override_tenet_communal_possessions_2: "Considers ideologies with the Socialism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_tenet_communal_possessions: "Considers ideologies with the Socialism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 doctrine_parameter_hostility_override_tenet_capitalism_2: "Considers ideologies with the Capitalism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_tenet_capitalism: "Considers ideologies with the Capitalism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_planned_economy_name: "Economic Planning"
 tenet_planned_economy_desc: "The economy should be strictly controlled and regulated for the benefit of the state."
 
 tenet_federalism_name: "Federalism"
 tenet_federalism_desc: "It is vital for those in positions of authority to respect local and regional differences. Most decisions should be made locally, with only the most important being handled by a central authority."
 doctrine_parameter_can_form_federations: "Can form Confederations."
 
 tenet_spacer_values_name: "Spacer Values"
 tenet_spacer_values_desc: "We respect those who bravely throw themselves into the void, and hold to the code of the first generation of spacers - obey your captain, keep your word, and stand by your crew."
 
 tenet_cyberneticism_name: "Cyberneticism"
 tenet_cyberneticism_desc: "The human body is a prison to which technology has given us the key. Reject the weakness of the flesh and embrace the strength and certainty of steel. Become whatever you desire."
 doctrine_parameter_supports_cybernetics: "[rulers|E] of this ideology will try to legalize Cybernetics."
 doctrine_parameter_full_cybernetic_conversion: "Can perform Full Cybernetic Conversions."
 
 tenet_bio_directionism_name: "Bio-Directionism"
 tenet_bio_directionism_desc: "Science has provided us with the means to direct our own evolution. The human genome can be shaped to our will, our legacy defined by our choices rather than the whims of fate."
 doctrine_parameter_supports_gene_modding: "[rulers|E] of this ideology will try to legalize Gene Modding."
 doctrine_parameter_supports_cloning: "[rulers|E] of this ideology will try to legalize Cloning."
 doctrine_parameter_gene_modding: "Can Gene Mod newborn children and Clones."
 
 tenet_genetic_dynasties_name: "Genetic Dynasties"
 tenet_genetic_dynasties_desc: "The greatest weakness of benevolent despotism was the mortality of despots. Through cloning technology, it is possible to keep the best leaders alive and in power for eternity."
 doctrine_parameter_clone_succession_enabled: "Can use the Genetic Dynasty Succession Law."
 
 tenet_human_purity_name: "Human Purity"
 tenet_human_purity_desc: "Man was created in God's image, and that image is sacred. To defile the human form with foul machines or genetic tinkering is an abomination."
 doctrine_parameter_hates_cybernetics: "[rulers|E] of this ideology will try to ban Cybernetics."
 doctrine_parameter_hates_cloning: "[rulers|E] of this ideology will try to ban Cloning."
 doctrine_parameter_hates_gene_modding: "[rulers|E] of this ideology will try to ban Gene Modding."
 doctrine_parameter_hostility_override_doctrine_cyberneticism_3: "Considers ideologies with the Cyberneticism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_cyberneticism: "Considers ideologies with the Cyberneticism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_bio_directionism_3: "Considers ideologies with the Bio-Directionism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_bio_directionism: "Considers ideologies with the Bio-Directionism tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_genetic_dynasties_3: "Considers ideologies with the Genetic Dynasties tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_genetic_dynasties: "Considers ideologies with the Genetic Dynasties tenet to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_chivalry_name: "Neo-Chivalry"
 tenet_chivalry_desc: "We look to the legacy of Earth's ancient heroes, to brave knights and fair maidens, and uphold them as an ideal to which to aspire."
 doctrine_parameter_knighthood: "Can Knight [courtiers|E] and [vassals|E]."
 doctrine_parameter_courtly_romance: "[characters|E] of this ideology are more likely to pursue Romance [schemes|E]."
 
 tenet_philanthropy_name: "Philanthropy"
 tenet_philanthropy_desc: "Philanthropy"
 tenet_alms_for_the_poor_name: "Alms for the Poor"
 tenet_alms_for_the_poor_desc: "[ROOT.Faith.GoodGodName] demands that we care for the less fortunate if we are to have a place in [ROOT.Faith.PositiveAfterLife]."
 tenet_chivalrous_thieves_name: "Chivalrous Thieves"
 tenet_chivalrous_thieves_desc: "Some may call us thieves and criminals, but in truth, we are heroes of the people, robbing from the rich and giving to the poor."