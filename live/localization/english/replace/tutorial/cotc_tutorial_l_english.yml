l_english:
 ra_landless_adventurer_1: "Landless Freelancer"
 ra_landless_adventurer_2: "Your Base"
 ra_landless_adventurer_3: "Your Staff"
 ra_landless_adventurer_4: "Contracts"
 ra_landless_adventurer_5: "Charter"
 ra_landless_adventurer_1_desc: "@ra_landless_adventurer_2! \nYou are a [adventurer|e]! Travel space, visit the [courts|e] of [rulers|e] to find work, and complete [task_contracts|e] for gainful rewards. You can improve your [camp|e], recruit [followers|e], and build up a vast [contact_list|e]."
 ra_landless_adventurer_2_desc: "As a [adventurer|e], you are not tied down, instead having the freedom to travel space. Your base of operations as an $game_concept_adventurer$ is your [camp|e], which you can upgrade and expand with [camp_buildings|e] during the course of your freelancing career. "
 ra_landless_adventurer_3_desc: "During your travels, you can gather [followers|e], which serve a similar purpose to the [courtiers|e] of landed [rulers|e]. When [traveling|e] as a [adventurer|e], you will have the opportunity to utilize the [GetTravelOption('adventurers_scout_for_talent_option').GetName] [travel_option|e].\n\nAdditionally, you might also acquire new $game_concept_followers$ by taking the Visit Holding [decision|e]. In your $game_concept_camp$, you can view your $game_concept_followers$ through the button in the top left corner of the panel."
 ra_landless_adventurer_4_desc: "As a [adventurer|e], your primary source of income will be [task_contracts|e]. You can see them represented on the map. $game_concept_task_contracts$ can be found all across space, and require you to complete a specific task for an employer.\n\nYour [prestige_level|E] determines the [task_contract_tier|e] of $game_concept_task_contracts$ you receive. Obtaining the [GetPrestigeLevelName('(int32)2')] Level of Fame or higher unlocks purchasing or conquering [land|E], should you wish to transition into a [landed|E] [ruler|E]. Higher levels unlock more powerful options.\n\nYou can access new $game_concept_task_contracts$ by moving your [camp|e], an action which will cost an amount of [provisions_i][provisions|e] based on the distance moved."
 ra_landless_adventurer_5_desc: "You can view details about your [camp|e] in the $game_concept_realm$ tab (highlighted). From there, you can change your [camp_purpose|e] and open the $game_concept_camp$ overview.\n\nThe Purpose of your $game_concept_camp$ will determine the type of [task_contracts|e] you will be able to find, might unlock certain [decisions|e] and [camp_buildings|e], as well as a variety of other benefits."
 ra_landless_adventurer_6_desc: "@ra_landless_adventurer!\nAccept [task_contracts|e], move your [camp|e] to explore different parts of space, and grow your [following|e].\n\nAs a [adventurer|e], you have the freedom to choose the future path of your [dynasty|e]. Will you stay a freelancer, try to gain a [title|e] in a distant system, or meddle with the affairs of [rulers|e] across space?"
