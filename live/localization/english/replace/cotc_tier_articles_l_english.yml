l_english:
 ### COTC - article fixes caused by tier renames.

 BUY_CLAIM_ALREADY_KING_OR_EMPEROR:1 "You cannot buy a [claim|E] on an [kingdom|E] if you already are a [king|E] or [emperor|E]"
 I_AM_NOT_KING_OR_EMPEROR:1 "You must hold an [kingdom|E] or an [empire|E]"
 I_MUST_BE_KING_OR_EMPEROR:1 "You hold an [kingdom|E] or an [empire|E]"
 SCHEME_TARGET_IS_A_KINGDOM: "[target.GetName] is an [kingdom|E]: $VALUE|+0=$"
 action_mega_duke_penalty_desc: "Your [realm_size|E] is too large for a [duke|E], making you suffer [megaduke_penalty|E].\n\n#help Dukes are not allowed to grow too large and have too many [counties|E] in their [realm|E]. As long as you have too many [counties|E], you suffer reduced [income|E]. You should create an [kingdom|E] Title.#!"
 any_drifting_kingdom_tt: "Either:\n$BULLET_WITH_TAB$There must be an [kingdom|E] with any [de_jure_drift|E] progress towards your [primary_title|E]\n$BULLET_WITH_TAB$You hold an additional [kingdom|E] [title|E]"
 confederate_lands_modifier_desc: "These lands are reaping benefits from a [confederation|E] that was elevated into an [kingdom|E]"
 confederate_vassal_modifier_desc: "This character was part of a [confederation|E] that was elevated into an [kingdom|E]"
 confederation_kingdom_creation_tt: "You get an [kingdom|E]-[title_tier|E] [title|E] and all [confederates|E] become your [vassals|E]\n@alert_icon!#alert_trial The Kingdom will have no [de_jure|E] lands#!"
 diarch_demand_despotate_interaction.tt.already_have_high_titles: "You already hold an [kingdom|E]-[title_tier|E] [title|E]"
 found_despotate_desc_general: "$found_despotate$ is a [political_scheme|E] that aims to establish an [kingdom|E]-[rank|E] [governorships|E]. It is based on [diplomacy|E] and [house|E] standing, and can recruit [agents|E].\n\nA successful $found_despotate$ will result in the creation of the [scheme_target|E] and the transfer of its [de_jure|E] [vassals|E]."
 found_kingdom_toledo_duchy_tt:0 "You [hold|E] and [completely_control|E] any [duchy|E] which [de_jure|E] borders the [GetTitleByKey('d_toledo').GetName], and which is part of an [kingdom|E] with more than two [de_jure|E] [duchies|E]"
 game_concept_appointment_level_desc: "An $game_concept_appointment_level$ is used by some [appointment_succession_laws|E] as a requirement for [characters|E] to become eligible candidates.\n\nLevels are based on the level of a specific currency and each law can use a different currency as a requirement. A higher tier [title|E] will typically require a higher level.\n\n#weak For example: [GetLaw('celestial_appointment_succession_law').GetName] requires [merit|E] - A [duchy|E] requires a [merit_level|E] of [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] or above, while an [kingdom|E] requires [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] or above.#!"
 game_concept_directed_great_holy_war_desc:0 "A $game_concept_directed_great_holy_war$ is declared by a $doctrine_temporal_head_name$ [head_of_faith|E] with the intention of bringing an [kingdom|E] under their own rule.\n\n[rulers|E] of their [faith|E] might choose to assist the Head of Faith, and may get rewards from doing so. Rewards include [piety|E] and potentially having their [dynasty|E] become [landed|E] within the conquered Kingdom.\n\nRulers of the targeted [religion|E] may choose to defend against this war without the need for an [alliance|E]."
 game_concept_duchy_desc: "A $game_concept_duchy$ is a [title|E] one [title_tier|E] below an [kingdom|E] and one above a [county|E].\n\nThe [holder|E] of a $game_concept_duchy$ has [de_jure|E] rights to its constituent $game_concept_counties$ and can have [counts|E] as [vassals|E].\n\nDuchies may be dormant and have no current Holder. Such $game_concept_title_succession$ can be created by a [ruler|E] who controls at least half of its $game_concept_counties$."
 game_concept_empire_desc: "An $game_concept_empire$ is a [title|E] one [title_tier|E] below a [hegemony|E] and one above an [kingdom|E].\n\nThe [holder|E] of an Empire has [de_jure|E] rights to its constituent territory and can have [kings|E] as [vassals|E].\n\n$game_concept_empires$ can be dormant and have no current $game_concept_holder$. Such $game_concept_titles$ can be created by a [ruler|E] who controls more than 80% of the [counties|E] within."
 game_concept_expand_dominance_desc: "A special war for [GetGovernment( 'nomad_government' ).GetName] [rulers|E] for either an area within their [de_jure|E] lands, or to expand their [de_jure|E] area to new frontiers.\n\nAll Nomadic Rulers of a [duchy|E] [title_tier|E] or higher can start the war within their De Jure. On a victory they will attempt to either [vassalize|E] the defender or force them to become a [tributary|E], or conquer their lands altogether if they hold land outside of the target lands of the war.\n\nTo expand their dominion to foreign lands, a Nomadic Ruler has to be of an [kingdom|E] Tier or higher. On a victory they will still attempt to Vassalize, Tributarize, or conquer the lands, but the lands will also immediately shift De Jure to the primary title of the Nomadic ruler."
 game_concept_king_desc: "A $game_concept_king$ is a [ruler|E] whose [primary_title|E] is an [kingdom|E].\n\nTheir [rank|E] is directly above [dukes|E] and directly below [emperors|E], and as such they can have $game_concept_dukes$ and below as [vassals|E], and an $game_concept_emperor$ or above as their [liege|E]."
 game_concept_title_desc:1 "A $game_concept_title$ is essentially a certificate of land ownership.\n\nThe smallest unit of land on the map is the [barony|E]. Baronies are organized into larger areas called [counties|E]. Counties [de_jure|E] belong to a [duchy|E], duchies to an [kingdom|E], and Kingdoms to an [empire|E].\n\nDuchies, Kingdoms and Empires do not always have a [holder|E], but are Titles that can be [created|E] by a ruler who controls enough of the corresponding territory."
 game_concept_undirected_great_holy_war_desc:0 "An $game_concept_undirected_great_holy_war$ is declared by a $doctrine_spiritual_head_name$ [head_of_faith|E] with the intention of bringing an [kingdom|E] under the rule of their [faith|E].\n\n$game_concept_undirected_great_holy_wars$ are not started immediately, instead they enter a [preparation_phase|E].\n\nBefore and during the war, rulers of the attacking Faith can choose to donate [gold|E] to the [war_chest|E].\n\nIf victorious, the targeted Kingdom will be taken and given to a character of the attacking Faith. Rewards for the attackers include [piety|E] and potentially having their [dynasty|E] become [landed|E] within the conquered Kingdom."
 has_latin_kingdom_title_tt: "You hold an [kingdom|E] [title|E] belonging to [GetTitleByKey('e_latin_empire').GetName] and at least #high 50%#! of its [de_jure|E] [counties|E]"
 invasion_war_warning_desc:1 "\n\n#X You may only attempt one invasion [war|E] against an [kingdom|E]-tier [title|E] per lifetime#!"
 japan_government_japan_kingdom_restriction_tt: "[GetGovernment('japan_administrative_government').GetName] and [GetGovernment('japan_feudal_government').GetName] [rulers|E] can only create [kingdoms|E] in Japan if they are [independent|E] or hold an [kingdom|E] [title|E] without holding [GetTitleByKey('e_japan').GetBaseNameNoTier]"
 legitimize_latin_dominion_decision_tooltip: "Add an [kingdom|E] to the [de_jure|E] land of [GetTitleByKey('e_latin_empire').GetName]"
 major_religious_war_warning_desc:1 "\n\n#X You may only attempt one [holy_war|E] against an [kingdom|E]-tier [title|E] per lifetime#!"
 overrunning_gain_titular_kingdom_tt: "You gain an [kingdom|E]-[title_tier|E] [titular_title|E]"
 ra_merit_candidacy_merit_desc: "Each [character|E] has a [merit_level|E]. The better the $game_concept_merit_level$, the higher [title_tier|E] [provinces|E] they can rule as [governor|E].\n\nAs your $game_concept_merit_level$ increases, more influential appointments become available:\n$BULLET_WITH_TAB$#V 9th to 8th#!: $game_concept_governor$ of a $county_celestial_chinese_vassal$ #weak (a [county|E] Title)#!\n$BULLET_WITH_TAB$#V 7th to 6th#!: $game_concept_governor$ of a $duchy_celestial_chinese_vassal$ #weak (a [duchy|E] Title)#!\n$BULLET_WITH_TAB$#V 5th to 4th#!: $game_concept_governor$ of a $kingdom_celestial_chinese_vassal$ #weak (an [kingdom|E] Title)#!\n$BULLET_WITH_TAB$#V 3rd to 1st#!: [minister|E] for the [son_of_heaven|E] #weak (an [empire|E] Title)#!\n\n$game_concept_characters$ without a $game_concept_merit_level$ cannot become $game_concept_governor$."
 ra_merit_governor_advancing_desc: "Each [governor|E] rules a [province|E] of a certain [title_tier|E].\n\nFrom lowest to highest, these are:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #weak (a [county|E] Title)#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #weak (a [duchy|E] Title)#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #weak (an [kingdom|E] Title)#!\n\nIn order to advance in the hierarchy and reach a higher $game_concept_title_tier$, you must increase your [merit_level|E] by earning [merit|E], and eventually retiring to complete a [imperial_examinations|E]."
 reactive_advice_megaduke_penalty_desc:2 "Your [duchy|E] is crumbling under the pressure of having too much land. You should [create|E] or [usurp|E] an [kingdom|E]!\n\n#TUT Perhaps you can already create a Kingdom? If so, open the Tips view, and see if there's one you can create. If not, there's a [decision|E] for you to found your own Kingdom â though beware that titles you found yourself are commonly weaker than existing [de_jure|E] ones.\n\nIf you're a [vassal|E] and your [liege|E] is a King, you have to demand independence before you can become a King yourself. The first step is to either join or start an [independence_faction|E].#!"
 reactive_advice_vassal_limit_desc:0 "No one can manage a horde of Counts â aspiring conquerors need to rely on higher-tier [vassals|E], such as Dukes, to manage their land for them!\n\nYou can see your current Vassal Limit in the Domain view.\n\n#TUT Much like with your domain limit, you do not want to exceed your [vassal_limit|E]. To avoid this penalty, you should consolidate your vassals.\n\nThe best way to do this is by granting [duchies|E] to your vassals, this will make them rule a larger area so that you don't have to! Though for this to work you must yourself hold an [kingdom|E] or an [empire|E], do not make the mistake of giving away one of your [primary_titles|E]!\n\nIf you find yourself exceeding the Vassal Limit as a Duke, we suggest that you form a Kingdom as soon as you can.#!"
 setting_historicity_extra_admin_player_wherever_alt_historic_always_desc: "Players that begin with at least an [kingdom|E]-[title_tier|E] [realm|E] will automatically convert it to an [administrative|E] [government|E] on game start."
 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait_desc: "Players that have the [GetTrait('august').GetName( GetNullCharacter )] [trait|E] & begin with at least an [kingdom|E]-[title_tier|E] [realm|E] will automatically convert it to an [administrative|E] [government|E] on game start (intended for asynchronous $game_concept_governments$ in multiplayer)."
 start_found_despotate_interaction_desc: "Attempt to establish an [kingdom|E]-[rank|E] [governorship|E]"
 steppe_admin_merit_req: "Any [tributary|E], [vassal|E], or neighboring [independent_ruler|E] is an [kingdom|E] [title_tier|E] or greater [ruler|E] with a [government|E] that uses [merit|E]"
 struggle_persia_ending_foundation_decision_nb_ally_tt: "You have at least #Z 2 #![allies|E] that hold an [kingdom|E] [title|E] (#V [SCOPE.ScriptValue('fp3_current_nb_ally_shia_caliphate')]/2#!)"
 struggle_persia_ending_rekindle_iran_decision_nb_ally_tt: "You have at least #V 2#! $heritage_iranian_name$ [heritage|E] [allies|E] that hold an [kingdom|E] [title|E]"
 unlock_legendary_integration_k_tt: "Gain access to the #EMP $legendary_integration_k$#! [decision|E], allowing you to immediately [de_jure_drift|E] an [kingdom|E] into your realm."
 valid_primary_war_enemy_for_crusade: "The enemy [war_leader|E] is not Christian and either holds an [kingdom|E] title or is part of an [kingdom|E]"
