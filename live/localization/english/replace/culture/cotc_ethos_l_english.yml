l_english:
# CotC | Ethos renames and de-terrestrialised descriptions. Overrides vanilla.
# Unlisted ethos keys are inherited from vanilla unchanged.
 ethos_bellicose_name: "Militarist"
 ethos_bellicose_desc: "This culture considers armed force to be a permanent condition of existence rather than a lapse from peace; ingrained in its people is the idea that what they hold, they hold only so long as they are willing to fight for it."
 ethos_communal_name: "Collectivist"
 ethos_courtly_name: "Formal"
 ethos_courtly_desc_nhc: "Protocol is so integral to this culture that it forms a core part of everyday social behavior. Rank, precedence and proper form are observed as strictly in private as in high office. A place for everyone, and everyone in their place."
 ethos_stoic_desc: "This culture believes in standing firm against the dark, taking any and all hardships that the universe may throw at them and enduring them all with grim determination and an indomitable spirit."
 ethos_spiritual_desc: "While some cultures turn to war and others to material knowledge, this culture places its trust in the only constant throughout its history - the divine. Spirituality is the only way forward in a harsh and uncaring universe."
