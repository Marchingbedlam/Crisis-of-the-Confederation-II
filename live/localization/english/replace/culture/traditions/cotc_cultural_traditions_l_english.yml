 #
 # ---- descriptions ----
 tradition_cotc_dummy_parameters_desc:0 "Dummy"
 tradition_cotc_asymmetric_doctrine_desc:0 "This culture trains its irregulars to fight on ground of their own choosing, in any environment, against any weight of force."
 tradition_cotc_agriculturalists_desc:0 "This culture farms in earnest, and its habitable worlds yield enough to supply a navy indefinitely. Yet quality food has a cost; its soldiers lack the edge of those raised somewhere harder."
 tradition_cotc_expert_artisans_desc:0 "Children in this culture often carry on the profession of their parents, accumulating extensive knowledge and skill for their trade across generations."
 tradition_cotc_astute_diplomats_desc:0 "It is a common idea in this culture that the purest expression of superiority is the ability to subdue your enemy without fighting them."
 tradition_cotc_salvage_rights_desc:0 "Here an engagement is fought for the wreck field as much as for the objective. Prestige is poor compensation if you cannot fund the next campaign."
 tradition_cotc_conversion_by_force_desc:0 "Members of this culture hold that the most persuasive missionary is an armed one. Holy war enjoys broad support, though motives are examined closely."
 tradition_cotc_military_bastions_desc:0 "Offense is not a good defense. A good defense is holding more fortified stations than anyone else in settled space."
 tradition_cotc_charitable_desc:0 "Regardless of faith, people of this culture are motivated to support those less fortunate."
 tradition_cotc_neo_chivalry_desc:0 "This culture has revived an old code of conduct as a means of regulating behavior. Martial skill, duty, honor and courtesy are prized - as is a great deal of bad poetry."
 tradition_cotc_metropolitan_desc:0 "Cities are the beating heart of this culture, and it means every one of its metropolises to be envied across settled space."
 tradition_cotc_collective_ownership_desc:0 "The idea that a person privately owns a world, a station or a yard is alien to this culture; what exists belongs to everyone, for the common good."
 tradition_cotc_concubines_desc:0 "Rulers of this culture often keep a number of concubines in their household, regardless of their faith."
 tradition_cotc_culinary_artists_desc:0 "Food isn't just sustenance for this culture; it is both an art and a ritual, a focal point for family and community alike."
 tradition_cotc_culture_blending_desc:0 "Members of this culture have often lived alongside people of other cultures. Through exposure, they have become adept at incorporating foreign languages, traditions and customs into their own lives."
 tradition_cotc_equal_inheritance_desc:0 "This culture has a history of rulers dividing their lands between all their children, even those who normally would be excluded."
 tradition_cotc_equitable_desc:0 "In this culture truth and impartial justice is valued highly."
 tradition_cotc_esteemed_hospitality_desc:0 "In this culture rulers are known, and expected, to welcome anyone who might come to their court with open arms. Hosting guests and visitors in a spectacular fashion."
 tradition_cotc_reciprocity_desc:0 "In this culture an injury is neither forgotten nor forgiven. Grudges are kept precisely, and settled in full."
 tradition_cotc_bound_by_faith_desc:0 "In this culture being of a different faith means that you're not eligible for succession."
 tradition_cotc_family_business_desc:0 "This culture encourages businesses to develop along familial lines, each generation picking up the tools and techniques of their trade from the last, building a strong tradition of ancestral professionalism."
 tradition_cotc_matriarchal_desc:0 "This culture enforces a matriarchal hierarchy, where the ruling class is overwhelmingly comprised of women."
 tradition_cotc_fervent_administrators_desc:0 "This culture holds that faith is served best through good order. Devout rulers are expected to fund and staff its institutions generously, and to build a great many of them."
 tradition_cotc_frequent_festivities_desc:0 "The frequency and exuberance with which this culture throws festivities would be considered vulgar to others, but a party is a party!"
 tradition_cotc_forbearing_desc:0 "In this culture being patient and restrained in the face of adversity is common."
 tradition_cotc_void_navigators_desc:0 "This culture fights where there is nothing to take cover behind. Its crews hold formation across the empty vacuum of space."
 tradition_cotc_born_in_space_desc:0 "This culture prefers to keep no ground at all. It lives in the open black and the drifting veil, and has learned how to draw a living from what passes through."
 tradition_cotc_strategic_discipline_desc:0 "This culture drills its formations until each element covers the others by reflex, turning mixed detachments into a single instrument."
 tradition_cotc_field_refitters_desc:0 "One immaculate exoskeleton may save a single life. Ten serviceable ones, refitted in the field, may win the engagement."
 tradition_cotc_garden_architects_desc:0 "This culture has a long tradition of constructing and maintaining various types of gardens, building themselves a small paradise."
 tradition_cotc_industrious_desc:0 "This culture teaches and enshrines ideas of industriousness and hard work on behalf of one's community."
 tradition_cotc_hereditary_office_desc:0 "It is settled in this culture that office descends by blood and that the order of precedence is not open to question. Those who break that order are not soon forgiven."
 tradition_cotc_cryo_hardened_desc:0 "This culture takes deep cold as a given. Its soldiers train, sleep and fight at temperatures that would put another army out of action entirely."
 tradition_cotc_cryo_colonists_desc:0 "This culture settles worlds where the cold never breaks, and has learned to raise habitats and grow food on ground frozen through to bedrock."
 tradition_cotc_guerilla_tacticians_desc:0 "This culture has mastered the fast strike: light units hit hard, break contact, and are gone before a response can form."
 tradition_cotc_xeno_hunters_desc:0 "Whether from necessity or from status, this culture has refined the pursuit of alien fauna into a precise and almost beautiful discipline."
 tradition_cotc_isolationist_desc:0 "This culture prefers to keep to itself, and doesn't often look outside its own sphere."
 tradition_cotc_belters_desc:0 "This culture is at home among the rocks, and knows how to work a belt or a forming disk for everything it will give up."
 tradition_cotc_belt_navigators_desc:0 "Soldiers of this culture fight well amidst stellar debris, where the cover moves, the ground is still forming, and every approach is a blind one."
 tradition_cotc_linguists_desc:0 "To learn the words of a neighbor brings you one step closer to the language of the Divine."
 tradition_cotc_legalistic_desc:0 "This culture regards the rule of law and its codification as being the most important parameter of a civilized society."
 tradition_cotc_life_is_just_a_joke_desc:0 "This culture would find something funny to say while the airlock cycled."
 tradition_cotc_loyal_subjects_desc:0 "For this culture, service to the state is a duty and a privilege rather than a transaction - an oath given freely, not a wage accepted."
 tradition_cotc_assimilationist_desc:0 "We will take your worlds, your children, your traditions, and your #EMP future#!."
 tradition_cotc_martial_admiration_desc:0 "Anyone willing to take up arms and fight for their culture has earned admiration. No matter the odds."
 tradition_cotc_naturopathy_desc:0 "This culture has cataloged the pharmacology of everything that grows in its habitats. Few ailments lack a remedy drawn from a hydroponic bay."
 tradition_cotc_mendicant_mystics_desc:0 "The holy people of this culture hold that the faith must be carried rather than housed, and its most devout spend their lives moving between the stars."
 tradition_cotc_merciful_blindings_desc:0 "No matter how far beyond forgiveness one has gone, this culture thinks it is better to gouge out an eye than run through a heart."
 tradition_cotc_alloy_foundries_desc:0 "Generations of easy access to ore have made this culture's foundries a byword for durable alloy. Their hulls and plate outlast anyone else's."
 tradition_cotc_modest_desc:0 "This culture values modesty, one should not take up too much space or think oneself better than others."
 tradition_cotc_monastic_communities_desc:0 "This culture has a long history of sending noble progeny to serve the faith. Revered political thinkers often arise from the monastic orders."
 tradition_cotc_monogamous_desc:0 "In this culture one keeps a single spouse, regardless of faith."
 tradition_cotc_aerostat_settlers_desc:0 "This culture anchors its habitats in atmospheres nothing should survive, riding the cloud decks of the giants and the acid haze alike, where there is no ground beneath them and never was."
 tradition_cotc_pressure_hardened_desc:0 "Soldiers of this culture are trained for atmospheres that kill - crushing depth, searing cold, air that eats through a seal. They work where an ordinary hull would fold."
 tradition_cotc_musical_theorists_desc:0 "This culture treats music almost as the language of the divine, and thus many individuals take up the noble and celebrated pursuit of musical study from a young age."
 tradition_cotc_venerated_founders_desc:0 "Descent matters enormously here. Their origins have passed into legend, and a great many claim the lines of exalted ancestors."
 tradition_cotc_adoption_desc:0 "Taking in orphaned children and raising them as full heirs is unremarkable here. The bond of the household outweighs the accident of birth."
 tradition_cotc_culling_doctrine_desc:0 "This culture fields few soldiers and demands everything of them. If you are not among the best, you are not permitted to serve at all."
 tradition_cotc_pacifists_desc:0 "For this culture, the use of force can never be justified. Only by pursuing a path of non-violence can people truly live in peace."
 tradition_cotc_commercialism_desc:0 "The cities of this culture compete fiercely and answer to no one. Each spends lavishly to ensure that #EMP its#! markets are the ones that matter."
 tradition_cotc_philosopher_culture_desc:0 "This culture promotes thought and self-reflection."
 tradition_cotc_refined_poetry_desc:0 "Poetry is considered a noble art in this culture, and many spend their time piecing words together with meaning and thought."
 tradition_cotc_polygamous_desc:0 "In this culture one tend to have multiple spouses, regardless of faith."
 tradition_cotc_corsair_charters_desc:0 "Boarding a station, stripping it, and burning what will not fit in the hold may not be honorable, but it #EMP is#! profitable."
 tradition_cotc_quarrelsome_desc:0 "Border conflicts are common for rulers of this culture. Land often changes hands in unjust ways."
 tradition_cotc_syncretic_desc:0 "Members of this culture live among those of other faiths as a matter of course, and are practiced at folding foreign observances into their own."
 tradition_cotc_patronage_desc:0 "Standing is demonstrated through works, not claimed. You cannot simply purchase a good name - but endowing an order that sings your praises #EMP helps.#!"
 tradition_cotc_reverence_for_veterans_desc:0 "This culture doesn't look down upon those who can no longer fight due to injury, instead they are celebrated as heroes and used as teachers."
 tradition_cotc_ruling_class_desc:0 "Authority in this culture is inherited, not earned. Its administrators are practiced at governing populations that are not their own - efficient at suppressing unrest, and widely resented for it."
 tradition_cotc_xeno_culling_desc:0 "The hunt is neither sport nor pastime here but an act of devotion, in which one demonstrates mastery over a world that was never meant for people."
 tradition_cotc_exotic_metallurgy_desc:0 "This culture keeps as many researchers chasing impossible alloys as it does smiths working proven ones. If the results cannot quite be explained, so much the better."
 tradition_cotc_spartan_desc:0 "This culture has no use for the trappings of power - the ceremony, the wealth, the ornament. It is interested in power itself, preferably in the form of armor plate and gun emplacements."
 tradition_cotc_indomitable_spirit_desc:0 "Holding what is theirs matters more to this culture than taking what is not. They do not break, and they do not yield ground cheaply."
 tradition_cotc_no_retreat_desc:0 "Soldiers of this culture do not withdraw. They hold position against any odds - for better or for worse."
 tradition_cotc_traditionalist_desc:0 "Tradition is tradition: immovable, unchangeable. We must be ready to stand up for whatever it is that makes us ourselves."
 tradition_cotc_oral_archivists_desc:0 "This culture keeps its record by voice rather than by archive. Its history is recited, generation to generation, and the reciters are held to be exact."
 tradition_cotc_swarm_tactics_desc:0 "This culture forgoes elite formations entirely, trusting instead to mass: more hulls, more bodies, more attacks than an enemy can answer."
 tradition_cotc_private_militaries_desc:0 "This culture regards contract soldiering as honest work. Between wars its veterans hire out their skills to whoever is paying."
 tradition_cotc_recognition_of_talent_desc:0 ""Kill me if you wish, but if you let me live, I shall serve you loyally.""
 tradition_cotc_vegetarians_desc:0 "This culture has developed a strong aversion to consuming the flesh of animals, and practices vegetarianism throughout their society."
 tradition_cotc_martial_culture_desc:0 "This culture prizes martial skill and strength above all else. Children are raised to fight and steered away from scholarly pursuits. Weakness is not tolerated."
 tradition_cotc_militant_orders_desc:0 "This culture holds that conviction untested is conviction unproven. Its orders train their devotees to defend the faith with force as readily as to study it."
 tradition_cotc_commission_by_merit_desc:0 "This culture holds that anyone who can prove their competence should be permitted to serve - whatever their birth, and whoever they are."
 tradition_cotc_marital_ceremonies_desc:0 "For this culture, the union of two people in marriage is considered a highly public and ritualistic affair."
 tradition_cotc_charismatic_desc:0 "The people of this culture excel in diplomatic matters, and social etiquette is valued above all else."
 tradition_cotc_terran_comforts_desc:0 "Settled on worlds a person can cross unmasked, this culture has never had to fight its own environment. It has spent the effort it saved on living well."
 tradition_cotc_xenophilic_desc:0 "This culture embraces everyone and is genuinely fascinated by all cultures."
 tradition_cotc_strong_believers_desc:0 "The people of this culture are particularly zealous and dedicated to their faith."
