 ##################################################
 # CONCEPTS - descriptions
 ##################################################

 game_concept_camp_desc: "A $game_concept_camp$ is whatever a [adventurer|E] group works out of - a hull under way, or a headquarters leased on some [barony_cotc|E].\n\nIt goes where they go, and [camp_buildings|E] are fitted to it, standing in for the [counties_cotc|E] a [landed|E] ruler would draw on. [followers|E] live aboard and may be appointed [officers|E].\n\n#WEAK Like [courts|E], a $game_concept_camp$ carries people too minor to portray - loaders, the third-shift watch, somebody's cousin.#!"

 game_concept_follower_desc: "A $game_concept_follower$ is an [unlanded|E] character signed to a [adventurer|E] group.\n\nMechanically they are [courtiers|E], under rather less obligation to be respectful or to stay. The collective [opinion|E] of a [camp|E]'s $game_concept_followers$ sets its [camp_temperament|E].\n\n$game_concept_followers$ can:\n$BULLET_WITH_TAB$Hold [officers|E] posts\n$BULLET_WITH_TAB$Serve as [commanders|E] or [knights|E]\n$BULLET_WITH_TAB$Let their [adventurer|E] press their [claims|E] in [war|E]"

 game_concept_camp_building_desc: "$game_concept_camp_buildings$ are what a [adventurer|E] installs in their [camp|E] - [domicile_buildings|E] by another name, though many are a standing arrangement or a habit rather than a structure.\n\nThey can:\n$EFFECT_LIST_BULLET$Open new [officers|E] posts\n$EFFECT_LIST_BULLET$Buff [skill|E] for everyone aboard\n$EFFECT_LIST_BULLET$Strengthen [men_at_arms|E]\n$EFFECT_LIST_BULLET$Unlock actions [landed|E] [rulers|E] take for granted\n\n#WEAK When a [adventurer|E] decides to stop, their $game_concept_camp_buildings$ are sold off and part of the value refunded as [gold|E].#!"

 game_concept_adventurer_desc: "A $game_concept_adventurer$ is an [unlanded|E] [character|E] running their own [camp|E].\n\nThey hold no [counties_cotc|E] and draw no tax. They live on [task_contracts|E] and on favours called in from their [contact_list|E], and they answer to nobody - which is the appeal, and the problem.\n\n$game_concept_adventurers$ go where they like. Their standing worry is [provisions|E].\n\nInstead of [crown_authority|E], most file a [camp_purpose|E]: what the group is for, and what it is willing to do.\n\n#WEAK Disinherited siblings, cashiered officers, surveyors who never filed, deposed governors, and people who simply felt trapped by the system.#!"

 game_concept_camp_purpose_desc: "A $game_concept_camp_purpose$ is the registration a group operates under - filed with a ministry, a board, a guild, or with nobody at all.\n\nIt decides which [task_contracts|E] come your way, which [camp_buildings|E] and [officers|E] you may have, and how the rest of the [counties_cotc|E] read you when you station.\n\n#WEAK $game_concept_camp_purpose$ also sets the [adventurer_possessive|E] title and how the [followers|E] dress.#!"

 game_concept_camp_temperament_desc: "A [camp|E] is not a [court|E]. There is no rank to hide behind, and grumbling from people who are #EMP not#! the [adventurer|E] matters a great deal.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! requires the majority [opinion|E] of all named [characters|E] to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] or better, and confers positive [character_modifiers|E].\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! requires it to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] or worse, and applies negative ones.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! is everything between.\n\n#WEAK Effects scale with [prestige_level|E]. The better known the outfit, the further its mood carries.#!"

 game_concept_provisions_desc: "$game_concept_provisions$ are what a [camp|E] consumes to stay alive between ports: water, air, fuel, and food.\n\nThey drain while under way and are replenished at friendly [baronies_cotc|E]. Run low and the [followers|E] start leaving; run out and they start dying.\n\n#WEAK A settled [camp|E] buys from local providers and rarely thinks about it.#!"

 game_concept_contact_list_desc: "[adventurers|E] hold no land, but they are not without people who owe them.\n\nYour $game_concept_contact_list$ holds everyone the group has completed a [task_contract|E] for, plus anyone else with reason to help - [family|E] who think well of them, [friends|E], [lovers|E].\n\n$game_concept_contact_list_contacts$ can be leaned on through the $contact_list_request_interaction|V$ [character_interaction|E]."

 game_concept_contractor_desc: "A $game_concept_contractor$ is whoever put the [task_contract|E] out. It chiefly affects them, and they are usually the one paying.\n\n#N [criminal_task_contracts|E] are generally #BOL not#! put out by their $game_concept_contractor$ - they exploit one. Someone who advertises how much they trust you is advertising something else too.#!"

 ##################################################
 # CHARTERS
 ##################################################

 camp_purpose_pass_phrase: "File as [Law.GetNameNoTooltip]"
 camp_purpose_confirmation_button_text: "Refile"

 camp_purpose_wanderers: "Freelancers"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Equal chance of [task_contracts|E] of any kind\n$EFFECT_LIST_BULLET$May file any other [camp_purpose|E] without the usual [prestige|E] cost\n\n#WEAK No charter on file.#!"

 camp_purpose_mercenaries: "Private Contractors"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Finds more [mercenary_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds more [prowess|E] and [martial|E] [task_contracts|E]\n\n#WEAK Registered to provide armed services for hire. The paperwork is usually in order; the work is usually not.#!"

 camp_purpose_scholars: "Researchers"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Finds more [learning|E] and [stewardship|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [diplomacy|E] [task_contracts|E]\n\n#WEAK Chartered as an institute or a foundation for the purposes of research and development.#!"

 camp_purpose_explorers: "Prospectors"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Finds more [transport_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds more [diplomacy|E] and [intrigue|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [martial|E] [task_contracts|E]\n\n#WEAK Licensed to survey and excavate. Carries the endurance to reach places nobody has seen yet, and the nerve to investigate them.#!"

 camp_purpose_brigands: "Privateers"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Finds more [criminal_task_contracts|E] of all kinds\n$EFFECT_LIST_BULLET$Finds more [prowess|E] and [intrigue|E] [task_contracts|E]\n\n#WEAK Registered somewhere that asks nothing and records even less. A privateer is a pirate with paperwork, and the paperwork is the only difference.#!"

