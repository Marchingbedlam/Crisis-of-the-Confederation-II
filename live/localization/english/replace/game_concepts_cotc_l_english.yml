 game_concept_corvettes_desc: "Corvettes are the lightest class of warship, used mainly for orbital patrols. In battle, they can be used as “glass cannon” fast attack ships, punching above their weight but vulnerable to enemy point defense. They are typically armed with lasers or ballistic weapons for close-in engagements, and their low mass and chemical rocket thrusters allow them to engage the enemy quickly."
 game_concept_missile_boats_desc: "Missile Boats are built on the same sort of hull as Corvettes, but are armed with long-range missile launchers. They have mostly the same strengths and weaknesses as Corvettes, but gain extra firepower in exchange for a more demanding logistical profile."
 game_concept_destroyers_desc: "Destroyers are dedicated point defense platforms, generally built on Corvette hulls. They are relatively slow, but bristle with laser turrets and auto-targeting point defense guns. Their role is to escort larger ships and defend them from missiles and other light, fast-moving threats."
 game_concept_cruisers_desc: "Cruisers are the workhorses of most fleets. They are medium-sized ships that are designed to be logistically self-sufficient. They typically mount ion engine arrays, which are slower than chemical rockets but get vastly better “gas mileage”, and are armed with some mix of missiles, lasers, and ballistic cannons."
 game_concept_raider_vessels_desc: "Raiders are fast and highly maneuverable craft with large cargo holds. By necessity, they are lightly armed and armored, typically using particle beam weapons that can kill enemy crew without damaging the ship, or EMP missiles that can short out enemy electronics, in both cases with the ultimate goal of making a ship easier to pursue. They are poor frontline fighters, but as their name suggests, good at raiding civilian ships."
 game_concept_fast_frigates_desc: "Fast Attack Frigates are medium-sized ships designed to rapidly close the distance with enemy warships and overwhelm them in close-range combat. They are heavily armed and have powerful chemical rocket engines."
 game_concept_missile_frigates_desc: "Missile Frigates are medium-sized ships designed to overwhelm the enemy with mass missile swarms. They have incredible firepower, but are relatively flimsy, and struggle to overcome enemy point defense."
 game_concept_ew_cruisers_desc: "Electronic Warfare cruisers are lightly armed, but are packed with computer banks and bristle with antennas. In combat, they focus on confusing enemy targeting, distracting point defense weapons, and remotely disabling drones."
 game_concept_merchanteers_desc: "A mix of lightly armed cargo and industrial vessels called out of civilian service to defend their worlds. Using pre-existing ships is cheap but stunts economic growth, and the bulky vessels aren’t great at anything but absorbing damage."

