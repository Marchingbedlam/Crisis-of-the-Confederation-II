 game_concept_prowess_skill_desc: "$game_concept_prowess$ is a [skill|E] representing a [character|E]'s general aptitude for combat of all forms. It increases both [combat|E] and [piloting|E]."
 
 game_concept_combat: "Combat"
 game_concept_combat_i: "@skill_prowess_icon!"
 game_concept_combat_skill: "Combat Skill"
 game_concept_combat_skill_desc: "$game_concept_combat$ is a derived [skill|E] representing the Character's abilities in personal combat.\n\nA high Combat Skill means they are more likely to survive and perform well in [single_combat_duel_plural|E].\n\n$PROWESS_MUSCLE_INFO$Increasing Combat will increase a Character's muscle mass."
 
 game_concept_piloting: "Piloting"
 game_concept_piloting_i: "@skill_prowess_icon!"
 game_concept_piloting_skill: "Piloting Skill"
 game_concept_piloting_skill_desc: "$game_concept_piloting$ is a derived [skill|E] representing the Character's abilities in piloting and commanding starships.\n\nA high Piloting Skill means they are more likely to survive and perform well as [knights|E] in [battles|E].\n\nEach point of Piloting gives a Captain:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!"