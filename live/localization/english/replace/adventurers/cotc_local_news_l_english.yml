 ##############################
 # Articles
 # Numbered for adding variants (randomized)
 ##############################
 cotc_news_confidence_scheme_1: "#bold CREDENTIALS REVIEW WIDENS AFTER THIRD OFFICE FLAGGED#!\nAdministrators have confirmed that at least three departments issued clearances against documentation which cannot now be traced to any issuing authority. The holder attended briefings, signed for materiel and, in one instance, countersigned a transfer of funds. Auditors have declined to say how far back the practice runs, or how many of the signatures presently on file were made by someone entitled to make them. Those who dealt with the individual describe a person who was patient and entirely unhurried."
 cotc_news_commerce_raid_1: "#bold FOURTH SHORTFALL THIS QUARTER ON OUTBOUND LANES#!\nOperators have logged a fourth discrepancy on the outbound routes, each aboard a vessel that arrived on schedule with its manifest in order. Underwriters have begun pricing the lane accordingly. The carriers' association maintains that the losses are administrative, though two of its own members have quietly stopped filing on the route altogether. No authority has yet accepted jurisdiction."
 cotc_news_ledger_intrusion_1: "#bold REVENUE OFFICE CONFIRMS DATABASE LEAK#!\nThe assessment office has acknowledged that its database was breached by an unauthorized party, and that an unknown number of liabilities were altered before the discrepancy was noticed. Officials stress that no funds have been compromised. They have been less forthcoming on how many assessments were raised, lowered or erased, and on how long the leak had persisted. Reconciliation will be conducted internally and is expected to take months."
 cotc_news_assassination_1: "#bold SECOND MURDER RULED UNSUSPICIOUS#!\nA second figure of standing has died under suspicious circumstances. Both had held positions in the same dispute, and both were due to hold them for some years yet, yet neither death has been referred for further examination."
 cotc_news_abduction_1: "#bold UNREPORTED ABSENCES#!\nA household of some standing has confirmed that one of its members is not presently at home, and has asked that the matter be treated as private. No report has been filed with any authority. The absence is now in its second week, and the household's silence has grown more careful."
 cotc_news_sabotage_1: "#bold PLANT OFFLINE NINE DAYS AS OPERATORS CITE MAINTENANCE#!\nA production facility has stood idle for nine days, which its operators attribute to scheduled maintenance. Our investigators report that no such schedule has been filed with the district, and output for this quarter has been revised downwards twice. Workers on the floor describe damage of a kind which does not occur through normal wear. The operator's competitors have not provided any comment."
 cotc_news_treasury_heist_1: "#bold RESERVES RECOUNTED FOR A THIRD TIME THIS QUARTER#!\nThe district treasury has been audited three times in as many months. An unprecedented frequency, while the published figures have not moved. The holdings are understood to have been consolidated into fewer locations, a decision which, in the view of others, has made them vulnerable."
 cotc_news_counterfeit_tech_1: "#bold UNREGISTERED COMPONENTS IN CIRCULATION#!\nInspectors have impounded a consignment of unregistered components which no listed foundry admits to having produced. The parts function, and it is believed that several more are already installed in load-bearing systems. The office of certification has opened a review of its own records and has not said when it expects to conclude it."
 cotc_news_cargo_diversion_1: "#bold CONSIGNMENTS DIVERTED#!\nA pattern of misrouted freight has been confirmed, in which sealed consignments have been sent and signed for at destinations that were not present on any documentation. The freight office has characterised the matter as a labelling fault, yet declined to explain how this labelling fault had selected the most high-value containers."
 cotc_news_shakedown_1: "#bold PROPRIETORS REPORT NEW OVERHEADS#!\nFor the past weeks, businesses in the district have begun paying for mysterious non-commissioned services. They have declined to comment, but many believe it to be underground insurance. Trade bodies have reported a rise in premises closing early and new owners who decline to be named at all. The authorities note that they cannot act on an absence of complaints."
 cotc_news_asset_recovery_1: "#bold NEW CLAIM OVER RARE UNSOLD ITEM#!\nA dispute has opened over an object of some value presently held by a party who did not, by the claimant's account, come by it lawfully. Both sides have produced documentation, but neither has found an authority willing to weigh in, the present owner and the claimant falling on either side of a steep legal boundary. The claimant has indicated that they consider the legal route exhausted."
 cotc_news_generic: "#bold DISTRICT BULLETIN#!\nThere is word of work in the district that is not advertised on the news feeds. Those who deal in it are not difficult to find, provided one asks in the right places and is not particular about the details."
