 ##################################################
 # POSTURE
 ##################################################

 game_concept_posture: "Posture"
 game_concept_postures: "Postures"
 game_concept_posture_desc: "Whether a [adventurer|E] works out of a ship or from a fixed headquarters.\n\n#P Roaming#! keeps the [camp|E] mobile, and new [task_contracts|E] are found by making port somewhere else.\n\n#P Settled#! plants the [camp|E] at one location for good, and work comes to you instead. Your diplomatic range is increased in order to deal with [rulers|E] further afield, and the operation earns more steadily - but it no longer travels.\n\nPosture is separate from [camp_purpose|E], and most Charters can be worked either way."

 cotc_posture_pass_phrase: "Adopt [Law.GetNameNoTooltip]"
 cotc_posture_confirmation_button_text: "Commit"

 posture_roaming: "Roaming"
 posture_roaming_effects: "$EFFECT_LIST_BULLET$Your [camp|E] becomes a ship, and relocates freely\n$EFFECT_LIST_BULLET$New [task_contracts|E] appear wherever you make port\n\n#WEAK Ready to leave at a moment's notice.\n#!"

 posture_settled: "Settled"
 posture_settled_effects: "$EFFECT_LIST_BULLET$Your [camp|E] becomes a fixed headquarters and will not relocate\n$EFFECT_LIST_BULLET$[task_contracts|E] come to you instead of being found on the move\n$EFFECT_LIST_BULLET$You can deal with [rulers|E] considerably further afield\n$EFFECT_LIST_BULLET$#N You travel more slowly#!\n\n#WEAK A property leased and an address registered.\n#!"

 cotc_charter_requires_roaming_tt: "Your [posture|E] is Roaming #weak (this Charter is defined by movement, lift off before filing it)#!"
 cotc_posture_charter_forbids_settled_tt: "Your [camp_purpose|E] permits a fixed headquarters #weak (Prospectors and Privateers must keep moving)#!"
 cotc_posture_cooldown_tt: "You have not changed [posture|E] recently"
 cotc_base_is_settled_cannot_move_tt: "Your [camp|E] is a fixed headquarters and does not travel"
 cotc_cannot_evict_settled_freelancer_tt: "They hold no registered headquarters here #weak (a settled [adventurer|E] is a registered property owner, not a squatter, and cannot be moved on)#!"
 cotc_posture_base_liquidated_tt: "Your [camp|E] is sold and every [camp_building|E] demolished, with a portion of their cost returned"
 cotc_group_renamed_tt: "Your [camp|E] may take a new name"
 cotc_posture_cooldown_warning_tt: "@warning_icon! #X You cannot change your [posture|E] for another 10 years#!"

