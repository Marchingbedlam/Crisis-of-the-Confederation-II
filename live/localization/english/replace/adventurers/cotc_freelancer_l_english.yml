 camp_purpose_mercenaries: "Private Contractors"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Finds more [mercenary_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds more [prowess|E] and [martial|E] [task_contracts|E]\n\n#WEAK Registered to provide armed services for hire. The paperwork is usually in order; the work is usually not.#!"

 camp_purpose_scholars: "Researchers"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Finds more [learning|E] and [stewardship|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [diplomacy|E] [task_contracts|E]\n\n#WEAK Chartered as an institute or a foundation for the purposes of research and development.#!"

 camp_purpose_explorers: "Prospectors"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Finds more [transport_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds more [diplomacy|E] and [intrigue|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [martial|E] [task_contracts|E]\n\n#WEAK Licensed to survey and excavate. Carries the endurance to reach places nobody has seen yet, and the nerve to investigate them.#!"

 camp_purpose_brigands: "Privateers"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Finds more [criminal_task_contracts|E] of all kinds\n$EFFECT_LIST_BULLET$Finds more [prowess|E] and [intrigue|E] [task_contracts|E]\n\n#WEAK Registered somewhere that asks nothing and records even less. A privateer is a pirate with paperwork, and the paperwork is the only difference.#!"

