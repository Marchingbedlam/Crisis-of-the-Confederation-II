 # Shakedown  (was laamp_base_5051, Mug Wealthy Citizenry)
 ##############################
 cotc_contract_shakedown_contract: "$laamp_base_5051_contract_scheme$"
 cotc_contract_shakedown_desc_title: "Collections work, immediate start,"
 cotc_contract_shakedown_desc: "The comfortable districts of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] have grown careless about where they walk and what they carry. This is correctable."
 cotc_contract_shakedown_request: "$laamp_request_boilerplate_prowess_scheme$, though throughout the $game_concept_scheme$ you will also be given special events to lean on wealthy locals for extra [gold|E] outside of the general reward.\n$laamp_request_boilerplate_criminal$"
 laamp_base_5051_contract_scheme: "Shakedown"
 laamp_base_5051_contract_scheme_action: "Shake down the districts of"

 ##############################
 # Asset Recovery  (laamp_steal_artifact_contract - key deliberately kept)
 ##############################
 laamp_steal_artifact_contract_contract: "Asset Recovery"
 laamp_steal_artifact_contract_desc_title: "Recovery specialists, paid on delivery,"
 laamp_steal_artifact_contract_desc: "Something belonging to [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] is presently in the wrong hands, and the usual channels have been exhausted. Discretion is required."
