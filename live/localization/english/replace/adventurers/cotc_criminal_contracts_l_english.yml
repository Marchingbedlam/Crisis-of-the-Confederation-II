 cotc_contract_counterfeit_tech_desc_title: "Best prices for certified hardware,"
 cotc_contract_counterfeit_tech_desc: "The court of [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] is in the market for augments with provenance. Provenance can be arranged; the augments are a different matter."
