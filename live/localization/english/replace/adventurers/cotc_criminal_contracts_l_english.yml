l_english:
 # COTC - Criminal contracts

 ##############################
 # Confidence Scheme  (was laamp_base_0041, Confidence Trickster)
 ##############################
 cotc_contract_confidence_scheme_contract: "$laamp_base_0041_contract_scheme$"
 cotc_contract_confidence_scheme_desc_title: "Persons of interest sought,"
 cotc_contract_confidence_scheme_desc: "The discerning [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is receiving proposals, and is said to be an easy audience for the right credentials. #EMP Limited#! accommodation provided, #EMP if#! you pass the vetting."
 cotc_contract_confidence_scheme_request: "$laamp_request_boilerplate_diplomacy_scheme$\n$laamp_request_boilerplate_criminal$"

 # The vanilla scheme, re-contextualised.
 laamp_base_0041_contract_scheme: "Confidence Scheme"
 laamp_base_0041_contract_scheme_action: "Defraud"

 ##############################
 # Commerce Raid  (was laamp_base_1041, Ambush Travelers)
 ##############################
 cotc_contract_commerce_raid_contract: "$laamp_base_1041_contract_scheme$"
 cotc_contract_commerce_raid_desc_title: "Crew with a fast ship wanted,"
 cotc_contract_commerce_raid_desc: "Traffic through the lanes of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] runs fat and lightly escorted."
 cotc_contract_commerce_raid_request: "This [task_contract|E] requires you to [travel|E] to a distant [holding|E], intercepting [characters|E] to take their [gold|E] as you go via either [prowess|E], [martial|E], or [intrigue|E] challenges.\n$laamp_request_boilerplate_criminal$"
 laamp_base_1041_contract_scheme: "Commerce Raid"
 laamp_base_1041_contract_scheme_action: "Raid the lanes of"

 ##############################
 # Ledger Intrusion  (was laamp_base_2041, Impersonate Tax Collector)
 ##############################
 cotc_contract_ledger_intrusion_contract: "$laamp_base_2041_contract_scheme$"
 cotc_contract_ledger_intrusion_desc_title: "Discreet systems work, well paid,"
 cotc_contract_ledger_intrusion_desc: "The revenue network of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] runs on hardware three generations old and credentials nobody has rotated since the last audit."
 cotc_contract_ledger_intrusion_request: "This [task_contract|E] requires you to [travel|E] to up to #BOL [TaskContract.GetEmployer.MakeScope.ScriptValue('laamp_base_2041_num_counties_to_rob_sans_capital_value')|0]#! [counties|E] in [TaskContract.GetEmployer.GetTitledFirstNamePossessive] lands, completing increasingly difficult [stewardship|E], [intrigue|E], or [GetCourtPositionType('master_bard_camp_officer').GetName()] [aptitude|E] challenges to reach the revenue network and rewrite what it says the [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] is owed\n$laamp_request_boilerplate_criminal$"
 laamp_base_2041_contract_scheme: "Ledger Intrusion"
 laamp_base_2041_contract_scheme_action: "Drain the accounts of"

 ##############################
 # Assassination  (was laamp_base_3011, Murder Foe)
 ##############################
 cotc_contract_assassination_contract: "$laamp_base_3011_contract_scheme$"
 cotc_contract_assassination_desc_title: "A problem requiring resolution,"
 cotc_contract_assassination_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] has someone who will not be reasoned with, bought out, or waited out. Deal with them."
 cotc_contract_assassination_request: "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_3011_contract_scheme: "Assassination"
 laamp_base_3011_contract_scheme_action: "Assassinate"

