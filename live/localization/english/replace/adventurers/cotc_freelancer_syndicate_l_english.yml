 ##############################
 # Game concepts
 ##############################
 game_concept_cotc_syndicate: "Syndicate"
 game_concept_cotc_syndicates: "Syndicates"
 game_concept_cotc_syndicate_desc: "A #EMP Syndicate#! is a settled outlaw [adventurer|E]'s enterprise. A [duchy|E] may carry any number of them and they compete with each other for supremacy. A Syndicate is measured by its [cotc_syndicate_grip|E]."
 game_concept_cotc_syndicate_grip: "Grip"
 game_concept_cotc_syndicate_grip_desc: "#EMP Grip#! measures how much of a [duchy|E] your [cotc_syndicate|E] actually controls, from #V 0#! to #V 100#!. Every rival operating the same [duchy|E] slows how quickly you gain it."
 game_concept_cotc_underworld: "Underworld"
 game_concept_cotc_underworld_desc: "The #EMP Underworld#! is the state of organised crime in a [duchy|E], tracked as a [situation|E] with its own phase. [syndicates|E] push it up, successful enforcement holds it down, and left alone it will slowly decay. A high Underworld makes crime more lucrative but crackdowns riskier."

