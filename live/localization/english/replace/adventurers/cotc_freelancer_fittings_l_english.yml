l_english:

 ##################################################
 # COTC - Unlock fitting branch localization
 ##################################################

 cotc_settled_outlaws_branch.tt.unlocked_by_purpose: "Your [camp_purpose|E] is [GetLaw('camp_purpose_brigands').GetName]"

 ##################################################
 # COTC - Core
 ##################################################


 camp_main_01_domicile_building: "Operations"
 camp_main_01_domicile_building_desc: "The heart of the [camp|E], full of command consoles and security."
 supply_tent_01_domicile_building: "Maintenance"
 supply_tent_01_domicile_building_desc: "Everything breaks eventually. A dedicated space to fix it is the difference between a delay and a disaster."
 barber_tent_01_domicile_building: "Infirmary"
 barber_tent_01_domicile_building_desc: "Proper healthcare is essential."
 baggage_train_01_domicile_building: "Storage"
 baggage_train_01_domicile_building_desc: "Storage is the one thing you cannot argue with. Somebody has to decide what stays, what goes, and where all of it sits."
 mess_tent_01_domicile_building: "Canteen"
 mess_tent_01_domicile_building_desc: "Some food, a hot drink, and twenty minutes where nobody outranks anybody."
 camp_fire_01_domicile_building: "Dormitory"
 camp_fire_01_domicile_building_desc: "Bunks and lockers for the long hours off-shift. People who live well together work well together, and gossip magnificently."
 proving_grounds_01_domicile_building: "Hangar"
 proving_grounds_01_domicile_building_desc: "Ample space for ships, vehicles, and drill cycles."
 camp_perimeter_01_domicile_building: "Security"
 camp_perimeter_01_domicile_building_desc: "Security works best when it is a habit rather than a reaction."

 ##################################################
 # COTC - Roaming General Fittings
 ##################################################

 # Maintenance
 supply_tent_sutler_domicile_building: "Bonded Stores"
 supply_tent_sutler_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A licensed quartermaster with the paperwork to buy and the margins to make it worth doing."
 supply_tent_mender_domicile_building: "Spare Parts"
 supply_tent_mender_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Salvaged components aren't elegant, but elegance never closed a hull breach."
 supply_tent_smithy_domicile_building: "Engineering Bay"
 supply_tent_smithy_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Engineering equipment and technicians who know their tolerances."
 supply_tent_arsenal_domicile_building: "Stocked Magazine"
 supply_tent_arsenal_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Barrels wear down and ordnances run dry. The value of thorough inventory is immeasurable."
 supply_tent_reserve_provisions_domicile_building: "Deep Stores"
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Rationing is never popular. It is, however, considerably more popular than the alternative."
 supply_tent_reserve_water_domicile_building: "Water Reclamation"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Anyone who does not respect a closed water system has never seen one fail."
 supply_tent_climbing_gear_domicile_building: "Hazard Rigging"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Extra seals and hard points to go where nobody else can follow."
 supply_tent_subdued_gear_domicile_building: "Unmarked Plating"
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!It is remarkable how much trouble can be avoided by simply being too boring."

 # Infirmary
 barber_tent_surgeons_tools_domicile_building: "Autodoc"
 barber_tent_surgeons_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nPrecise automation does wonders for the survival rate."
 barber_tent_dentists_tools_domicile_building: "Dentist's Office"
 barber_tent_dentists_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nIn a pinch, may double as an interrogation room."
 barber_tent_torturers_tools_domicile_building: "Interrogation Room"
 barber_tent_torturers_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nOn a sealed vessel, everyone eventually learns exactly how far the human voice carries."
 barber_tent_reference_corpus_domicile_building: "Medical Database"
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nThere is a protocol for almost everything, and for the rest there are some very clear manuals."
 barber_tent_morticians_tools_domicile_building: "Cold Storage"
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nCold organs will keep well, and might even find new owners."

 # Storage
 baggage_train_ample_steeds_domicile_building: "Contingency Plans"
 baggage_train_ample_steeds_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nReserve drives and a second answer to every question. Speed is a matter of already having decided."
 baggage_train_porters_domicile_building: "Loading Crew"
 baggage_train_porters_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nWhat cannot be carried gets left behind, so it is worth employing people who are very good at carrying."
 baggage_train_trackers_domicile_building: "Weight Redistribution"
 baggage_train_trackers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nTrim the load properly and the same journey costs less of everything. Bad storage is a tax you pay by the hour."
 baggage_train_kennel_domicile_building: "Drone Bay"
 baggage_train_kennel_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nExpendable and endlessly useful for scouting and screening."
 baggage_train_siege_engineers_domicile_building: "Breaching Charges"
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nCutting into a sealed structure is a specialist trade, and those specialists need equipment."
 baggage_train_shrine_domicile_building: "Quiet Room"
 baggage_train_shrine_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nFaith travels with the people who hold it, but a door that closes does help."
 baggage_train_scribes_domicile_building: "Information Database"
 baggage_train_scribes_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nThorough records can settle arguments worth millions."
 baggage_train_bartering_grounds_domicile_building: "Trade Office"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nTrade happens everywhere whether you sanction it or not. Giving it a desk means you get to take a cut."
 baggage_train_proof_of_claims_domicile_building: "Records Office"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nWords are cheap, but when they have to be notarised, timestamped, and filed in triplicate, they become considerably more expensive."
 baggage_train_ransom_cages_domicile_building: "Holding Cells"
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nSecure and demonstrably alive: the two things that ultimately decide what a prisoner is worth."
 baggage_train_negotiators_domicile_building: "Expert Negotiators"
 baggage_train_negotiators_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nReputations are malleable things, particularly when somebody is paid to malleate."
 baggage_train_ascetics_domicile_building: "Resident Ascetics"
 baggage_train_ascetics_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nThey ask for almost nothing and offer a dignity that a working [camp|E] does not otherwise generate on its own."
 baggage_train_pleasure_tents_domicile_building: "Private Cabins"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nA [camp|E] is often a communal space, which presents a few problems. Most [followers|E] appreciate a door they can close."

 # Canteen
 mess_tent_herbalists_domicile_building: "Food Specialists"
 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nKnowing what is safe and what will kill you is an important profession."
 mess_tent_brewers_domicile_building: "Resident Brewers"
 mess_tent_brewers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nThere is an art to brewing in space, and a real luxury in having your own supply of the results."
 mess_tent_curers_domicile_building: "Stocked Refrigerators"
 mess_tent_curers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nAnyone can freeze a crate. Keeping it edible and rotating for months takes a professional."
 mess_tent_bakers_domicile_building: "Resident Bakers"
 mess_tent_bakers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nFresh bread, from actual flour. Few things do more for [camp_temperament|E] at less expense."
 mess_tent_cooks_domicile_building: "Trained Chefs"
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nDoing more with less is easy to preach, but a proper chef and kitchenry can work wonders."

 # Dormitory
 camp_fire_trailing_musicians_domicile_building: "Resident Band"
 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nIt is astonishing how much more motivating it is to listen to live music."
 camp_fire_libations_for_the_lost_domicile_building: "Memorial Wall"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nWe put up the names of those we will not see again, so that their sacrifice may be remembered."
 camp_fire_local_hangers_on_domicile_building: "Civilian Cabins"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nDock workers, traders, and various hitch-hikers. Life tied to one place gets dull enough to loosen anybody's tongue."
 camp_fire_future_dreams_domicile_building: "Long-Term Plans"
 camp_fire_future_dreams_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nIt is easy to lose sight of a long goal. Harder, if you work it into every briefing and every shift."
 camp_fire_nightly_debates_domicile_building: "Open Forum"
 camp_fire_nightly_debates_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nAsk two specialists one question and you'll receive five contradictory answers. Educational, if loud."
 camp_fire_juicy_rumors_domicile_building: "Juicy Rumors"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nThere is a great deal of easily-gathered #EMP material#! circulating out here, for anyone willing to play the game."

 # Hangar
 proving_grounds_horse_run_domicile_building: "Corvette Drills"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCorvettes want running hard and often, well beyond what it takes to get from one place to the next."
 proving_grounds_life_in_the_saddle_domicile_building: "Missile Boat Drills"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nRaiders can be awkward vessels, which is why their crews must drill harder than anybody else."
 proving_grounds_camel_run_domicile_building: "Raider Drills"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJamming, spoofing, and the quiet war over the spectrum. Few groups can afford to practise it properly."
 proving_grounds_personal_bouts_domicile_building: "Point Defence Drills"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nLarge crews grow relaxed, and heavy hulls need exponentially more maintenance."
 proving_grounds_nightly_barding_drills_domicile_building: "Cruiser Drills"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSome crews are born into the long-range trade, molded by it. Others simply adopted it."
 proving_grounds_training_circle_domicile_building: "Fast Attack Drills"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSee the mark? That is today's firing solution."
 proving_grounds_the_stump_domicile_building: "Salvo Drills"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nYou can build a healthy resistance to incoming fire on the basis of prior fire."
 proving_grounds_elephantry_reserve_domicile_building: "Electronic Warfare Drills"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nYou do not practise to #EMP become#! sharp. You practise to #EMP stay#! sharp."
 proving_grounds_mock_battle_drills_domicile_building: "Infantry Drills"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA squadron must hold together, or they will come apart all at once."
 proving_grounds_lockwagon_domicile_building: "Contract Fixers"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWe move, fight, and #EMP get paid#! as one group. The fixers find the work and take their cut off the top."
 proving_grounds_martial_study_domicile_building: "Tactical Computing"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEvery engagement has been fought before in some form. There is no excuse for failing to consult the archives."
 proving_grounds_the_stick_game_domicile_building: "Boarding Practice"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nFirst through the lock without tripping the seals takes the pot."
 proving_grounds_bodyguard_drills_domicile_building: "Penetration Tests"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWe pay people to break into our own [camp|E], on the sound assumption that somebody will try regardless."

 # Security
 camp_perimeter_good_siting_domicile_building: "Scenic Stationing"
 camp_perimeter_good_siting_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nOnly a fool stops wherever when they are surrounded by the beauty of the galaxy."
 camp_perimeter_fixed_layout_domicile_building: "Fixed Layout"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nFamiliar places, familiar things. Dull, but proper routines save lives."
 camp_perimeter_extra_watch_domicile_building: "Frequent Rotations"
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nFar from anywhere familiar, you are often reminded of how exposed you are."
 camp_perimeter_palisade_domicile_building: "Extra Plating"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nThinking about defence works best once you have enough contingencies to stop thinking about it."
 camp_perimeter_ditch_domicile_building: "Countermeasures"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nToo many flares and a decoy budget that nobody enjoys signing off, but it will earn itself back the moment you have to break off."
 camp_perimeter_camp_hygiene_domicile_building: "Life Support"
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nEverything you breathe has been breathed before. Don't think about it."

 ##################################################
 # COTC - Settled General Fittings
 ##################################################

 # Maintenance
 cotc_settled_modular_layout_domicile_building: "Modular Layout"
 cotc_settled_modular_layout_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!\nModular corridors, modular offices, modular bathrooms. Some might call it boring, but standardized architecture makes it all faster and cheaper."
 cotc_settled_payroll_department_domicile_building: "Payroll Department"
 cotc_settled_payroll_department_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!\nSalaried contracts, filed deductions, and tax residency. People who are paid properly and on time turn out to be more reliable than people who are paid whenever there is money."

# Infirmary
 cotc_settled_licensed_clinic_domicile_building: "Licensed Clinic"
 cotc_settled_licensed_clinic_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nStaffed by professionals and registered with the local authority. Fast access to proper healthcare can save lives."

# Storage
 cotc_settled_contract_office_domicile_building: "Contract Office"
 cotc_settled_contract_office_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nFiled, signed and archived. Clients often pay better when the paperwork is somebody else's problem."

# Canteen
 cotc_settled_public_lounge_domicile_building: "Public Lounge"
 cotc_settled_public_lounge_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nA public lounge with appropriate amenities for all staff and qualified civilians. Half the work you get comes from somebody overhearing something in here."

 # Dormitory
 cotc_settled_recreation_area_domicile_building: "Recreation Area"
 cotc_settled_recreation_area_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nSomewhere to relax and take your mind off the daily grind. It just might stop a few good people from job-hopping."

# Hangar
 cotc_settled_motor_pool_domicile_building: "Motor Pool"
 cotc_settled_motor_pool_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAll manner of vehicles and vessels are stored here, along with the means to maintain them."

# Security
 cotc_settled_communications_room_domicile_building: "Communications Room"
 cotc_settled_communications_room_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nLinked directly to tight- and wide-beam relays to quickly receive and file communications from orbital vessels."

 ##################################################
 # COTC - Settled Outlaw Fittings
 ##################################################

# Maintenance
 cotc_settled_discreet_warehouse_domicile_building: "Discreet Warehouse"
 cotc_settled_discreet_warehouse_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!\nNothing in the back rows of this building appears on any manifest."

# Infirmary
 cotc_settled_sanitation_contract_domicile_building: "Sanitation Contract"
 cotc_settled_sanitation_contract_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nNo one has to know what gets disposed."

# Storage
 cotc_settled_holding_floor_domicile_building: "Holding Floor"
 cotc_settled_holding_floor_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nQuiet rooms where people are kept comfortable until terms are agreed."
 cotc_settled_legal_retainer_domicile_building: "Legal Counsel"
 cotc_settled_legal_retainer_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\Proper legalese is a staple of any venture."

# Canteen
 cotc_settled_protection_desk_domicile_building: "Protection Desk"
 cotc_settled_protection_desk_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nA well-established protection racket providing a semi-stable regular income."

# Dormitory
 cotc_settled_listening_post_domicile_building: "Listening Posts"
 cotc_settled_listening_post_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nPaid-off clerks, tapped wires, and a great deal of patience."

# Hangar
 cotc_settled_impound_yard_domicile_building: "Impound Yard"
 cotc_settled_impound_yard_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nRecovered property, awaiting collection for a small fee."
 cotc_settled_enforcer_gym_domicile_building: "Enforcer Gym"
 cotc_settled_enforcer_gym_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nPaid to be recognised."
 
# Security
 cotc_settled_front_business_domicile_building: "Front Business"
 cotc_settled_front_business_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nA registered trade that files real and mostly legal accounts."
