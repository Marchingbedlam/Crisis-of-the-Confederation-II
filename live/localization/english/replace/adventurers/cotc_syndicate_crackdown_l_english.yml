l_english:
 # The crackdown layer - heat, the four tiers, and the failure state.

 ##############################
 # Heat and the ladder
 ##############################
 cotc_crackdown_notice_toast: "The authorities take notice"
 cotc_crackdown_notice_tt: "The system governor has noticed your operation. Nothing formal has happened yet, but people are being careful."
 cotc_crackdown_enforcement_toast: "Enforcement Action"
 cotc_crackdown_enforcement_tt: "The system governor has moved against your operation directly. A successful raid will cost you ground, a Fitting and a share of your money."
 cotc_crackdown_interdiction_toast: "Interdiction"
 cotc_crackdown_interdiction_tt: "The system governor has declared you a problem to be solved by force."

 cotc_syndicate_dismantled_toast: "The syndicate is broken"
 cotc_syndicate_dismantled_tt: "Your assets are seized, your base is liquidated, and you have been banished from the system - but nothing stops you starting again somewhere else."


 ##############################
 # Dismantle the syndicate
 ##############################
 cotc_dismantle_syndicate: "Dismantle the Syndicate"
 cotc_dismantle_syndicate_action: "Move against"
 cotc_dismantle_syndicate_desc_general: "Somebody is trying to run this system behind your back. Find them."
 cotc_dismantle_syndicate_success_desc: "The raid lands."
 cotc_dismantle_deep_roots_desc: "How deeply the syndicate is rooted in the system"
 cotc_dismantle_notoriety_desc: "How openly the syndicate operates"
 cotc_dismantle_syndicate_raid_toast: "Your syndicate is raided"
 cotc_dismantle_syndicate_raid_tt: "The raid costs you ground, one Fitting and a quarter of your money. It also costs you notoriety. For now, they think they have finished the job."
 cotc_dismantle_syndicate_failed_toast: "The raid comes to nothing"
 cotc_dismantle_syndicate_failed_tt: "They found an empty warehouse and no witnesses. The [cotc_underworld|E] in this Sector is emboldened."

 ##############################
 # Sanction
 ##############################
 cotc_demand_syndicate_dissolution_interaction: "Demand the Syndicate Dissolve"
 cotc_demand_syndicate_dissolution_desc: "[ROOT.Char.GetTitledFirstName] has issued demands regarding your syndicate: stand down, hand over what can, and you may leave.\n\nRefuse, and the next demands will come in force."
 cotc_dissolution_ai_grip_desc: "The syndicate is winning and knows it"
 cotc_dissolution_ai_outgunned_desc: "The authority can obviously win a war over this"
 cotc_dissolution_ai_frontier_desc: "A great power's sector is a poor place to be stubborn"

 ##############################
 # Interdiction
 ##############################
 COTC_INTERDICTION_CB_NAME: "Interdiction"
 COTC_INTERDICTION_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetFirstNamePossessive] $COTC_INTERDICTION_CB_NAME$ against [DEFENDER.GetFirstName]"
 COTC_INTERDICTION_WAR_NAME_BASE: "[ATTACKER.GetFirstName][DEFENDER.GetFirstName]"
 cotc_interdiction_victory_desc: "The syndicate is broken up, its assets seized and its leadership imprisoned."
 cotc_interdiction_defeat_desc: "The interdiction fails. The syndicate is stronger for having survived it, and the sector has watched the authorities lose."
 cotc_interdiction_white_peace_desc: "The interdiction is called off."
 cotc_interdiction_event_army: "Sector Security Force"
