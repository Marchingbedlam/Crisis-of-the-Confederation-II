l_english:

 ##################################################
 # COTC - Fitting descriptions
 ##################################################

 ##################################################
 # TRUNKS
 ##################################################

 camp_main_01_domicile_building_desc: "The heart of the [camp|E]: command consoles, the plot table, and ample security."
 supply_tent_01_domicile_building_desc: "Everything breaks eventually. A dedicated space to fix it, and to hold what it takes to fix it, is the difference between a delay and a disaster."
 barber_tent_01_domicile_building_desc: "Out here medicine is less a question of what the databanks say and more of who is nearest, steadiest, and awake."
 baggage_train_01_domicile_building_desc: "Mass is the one thing you cannot argue with. Somebody has to decide what stays, what goes, and where all of it sits."
 mess_tent_01_domicile_building_desc: "Lunch, a hot drink, and twenty minutes in which nobody outranks anybody."
 camp_fire_01_domicile_building_desc: "Bunks and lockers for the long hours off-shift. People who live well together work well together, and gossip magnificently."
 proving_grounds_01_domicile_building_desc: "Ample space for vessels, vehicles, and for staff to perform endless drill cycles."
 camp_perimeter_01_domicile_building_desc: "Regular staff rotations, access logging, and security passes. Security works when it is a habit rather than a reaction."

 ##################################################
 # MAINTENANCE
 ##################################################

 supply_tent_sutler_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A licensed quartermaster with the paperwork to buy anywhere and the margin to make it worth their while."
 supply_tent_mender_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!A bin of salvaged components is not elegant, but elegance has never once closed a hull breach."
 supply_tent_smithy_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Engineering equipment and technicians who know their tolerances. Fabrication is expensive, and priceless when traveling."
 supply_tent_arsenal_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Barrels wear down and ordnances run dry - the value of a thorough inventory is immeasurable."
 supply_tent_reserve_provisions_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Rationing is never popular. It is, however, considerably more popular than the alternative."
 supply_tent_reserve_water_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Anyone who does not respect a closed water system has never seen one fail."
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!Extra seals and hard points to go where nobody else can follow."
 supply_tent_subdued_gear_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('supply_tent_01').GetName])#!It is remarkable how much trouble a blank hull can avoid, especially paired with an unremarkable registry."

 ##################################################
 # INFIRMARY
 ##################################################

 barber_tent_surgeons_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nPrecise automation does wonders for the survival rate."
 barber_tent_dentists_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nPressure cycling is unkind to bad dental work, and in a pinch the tools make an #EMP excellent#! way to settle an argument."
 barber_tent_torturers_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nOn a sealed vessel, everyone eventually learns exactly how far a human voice carries."
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nThere is a protocol for almost everything, and for the rest there are some very clear manuals."
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('barber_tent_01').GetName])#!\nCold organs keep well enough, and with a bit of paperwork, they might find new owners."

 ##################################################
 # STORAGE
 ##################################################

 baggage_train_ample_steeds_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nReserve drives and a second answer to every question. Speed is simply a matter of already having decided."
 baggage_train_porters_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nWhat cannot be carried gets left behind, so it is worth employing people who are very good at carrying."
 baggage_train_trackers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nTrim the load properly and the same journey costs less of everything. Badly stowed mass is a tax you pay by the hour."
 baggage_train_kennel_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nCheap, expendable, and endlessly useful for scouting and screening."
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nCutting into a sealed structure is a specialist trade, and specialists need equipment."
 baggage_train_shrine_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nFaith travels with the people who hold it, but a door that closes does help."
 baggage_train_scribes_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nThorough records can settle arguments worth millions."
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nTrade happens everywhere whether you sanction it or not. Giving it a desk means you get to take a cut."
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nWords are cheap, but when they have to be notarised, timestamped, and filed in triplicate, they become considerably more expensive."
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nSecure, documented, and demonstrably alive: the three things that decide what a prisoner is actually worth."
 baggage_train_negotiators_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nReputations are malleable things, particularly when somebody is paid by the hour to do the malleating."
 baggage_train_ascetics_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nThey ask for almost nothing and offer a dignity that a working [camp|E] does not otherwise generate on its own."
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('baggage_train_01').GetName])#!\nA [camp|E] is often a communal space, which presents a few problems. Most [followers|E] appreciate a door they can close."

 ##################################################
 # CANTEEN
 ##################################################

 mess_tent_herbalists_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nKnowing what is safe to eat, what is merely unpleasant, and what will kill you by morning is a genuine profession."
 mess_tent_brewers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nThere is an art to brewing in space, and a real luxury in having your own supply of the results."
 mess_tent_curers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nAnyone can freeze a crate. Keeping it edible, catalogued, and rotated for months takes a professional."
 mess_tent_bakers_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nFresh bread, from actual flour. Few things do more for [camp_temperament|E] at less expense."
 mess_tent_cooks_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('mess_tent_01').GetName])#!\nDoing more with less is easy to preach, but a proper chef and kitchenry can work wonders."

 ##################################################
 # DORMITORY
 ##################################################

 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nIt is astonishing how much more motivating it is to listen to live music."
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nWe put up the names of those we will not see again, so that their sacrifice may be remembered."
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nDock workers, traders, and various hitch-hikers. Life tied to one place gets dull enough to loosen anybody's tongue."
 camp_fire_future_dreams_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nIt is easy to lose sight of a long goal. Harder, if you work it into every briefing and every shift."
 camp_fire_nightly_debates_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nAsk two specialists one question and you'll receive five contradictory answers. Educational, if loud."
 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_fire_01').GetName])#!\nThere is a great deal of easily-gathered #EMP material#! circulating out here, for anyone willing to play the game."

 ##################################################
 # HANGAR
 ##################################################

 proving_grounds_horse_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCorvettes want running hard and often, well beyond the burns it takes to get from one place to the next."
 proving_grounds_camel_run_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nRaiders can be awkward vessels, which is why their crews must drill harder than anybody else."
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJamming, spoofing, and the quiet war over the spectrum. Few groups can afford to practise it properly."
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nLarge crews grow relaxed, and heavy hulls need exponentially more maintenance."
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSome crews are born into the long-range trade, molded by it. Others are simply adopted."
 proving_grounds_the_stump_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nSee the mark? That is today's firing solution."
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nYou build a resistance to incoming fire almost entirely on the basis of prior incoming fire."
 proving_grounds_training_circle_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nYou do not practise to #EMP become#! sharp. You practise to #EMP stay#! sharp."
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA squadron must hold together, or they will come apart all at once."
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWe move, fight, and #EMP get paid#! as one group. The fixers find the work and take their cut off the top."
 proving_grounds_martial_study_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nEvery engagement has been fought before in some form. There is no excuse for failing to consult the data."
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nFirst through the lock without tripping the seals takes the pot. Training rounds only, and if you are spotted, you are out."
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nWe pay people to break into our own [camp|E], on the sound assumption that somebody is going to try regardless."

 ##################################################
 # SECURITY
 ##################################################

 camp_perimeter_good_siting_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nOnly a fool berths wherever they happen to be when surrounded by the beauty of the galaxy."
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nThe same things, the same places, the same times. Dull, but proper routines can save lives."
 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nFar from anywhere familiar, you are reminded how exposed you are. Shorter rotations are the cheapest measure against it."
 camp_perimeter_palisade_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nThinking about defence works best once you have enough contingencies to stop thinking about it."
 camp_perimeter_ditch_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nToo many flares and a decoy budget where nobody enjoys signing off the number, but it earns itself back the moment you have to break off."
 camp_perimeter_camp_hygiene_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nScrubbers, filters, and a thorough maintenance schedule. Everything you breathe has been breathed before. Just don't think about it."
