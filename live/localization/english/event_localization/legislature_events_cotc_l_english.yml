 legislature_events.1.desc: "[ROOT.Char.Custom('GetNewsIntro')][ROOT.Char.Custom('GetNewsSource')]legislative elections have been called in [situation.MakeScope.Var('legislature_title').GetDefinitiveName]. Citizens now head to the polls to elect a new [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')]."
 legislature_events.1.a: "I see."
 
 legislature_events.10.desc: "The polls have closed in the [county.GetNameNoTier] System, and you have been elected [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')]. You will now represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title).Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title).Title.GetDefinitiveName]."
 legislature_events.10.a: "A powerful opportunity."
 legislature_events.10.legislator_elected.tt: "[situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')] Elected"
 legislature_events.10.legislator_elected.desc: "[legislator_elect.GetFullName] will now represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title').Title.GetDefinitiveName]."
 
 legislature_events.11.desc: "The polls have closed in the [county.GetNameNoTier] System, and you have been re-elected [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')]."
 legislature_events.11.a: "My career continues."
 legislature_events.11.legislator_elected.tt: "[situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')] Re-Elected"
 legislature_events.11.legislator_elected.desc: "[legislator_elect.GetFullName] will continue to represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title').Title.GetDefinitiveName]."
 
 legislature_events.12.desc: "The polls have closed in the [county.GetNameNoTier] System, and unfortunately you have failed to be re-elected."
 legislature_events.12.a: "Damn!"
 
 legislature_events.100.desc: "With the shift to a new form of government come changes to the organization of the state. You have permanently dissolved [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')], estalishing one-[ROOT.Char.Custom('GetPerson')] rule."
 legislature_events.100.a: "I am [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')]."
 legislature_events.101.desc: "With the shift to a new form of government come changes to the organization of the state. [ruler.GetFullName] has permanently dissolved [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')], estalishing one-[ruler.Custom('GetPerson')] rule."
 legislature_events.101.a: "So this is how liberty dies..."
 
 legislature_events.200.desc: "You have ascended to a higher office, and brought the machinery of government with you. [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')|U][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')] now serves [ROOT.PrimaryTitle.GetDefinitiveName]."
 legislature_events.200.a: "So be it."
 legislature_events.201.desc: "[ruler.GetFullName] has ascended to a higher office, and brought the machinery of government with [ruler.Custom('GetThem')]. [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')|U][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')] now serves [ruler.PrimaryTitle.GetDefinitiveName]."
 legislature_events.201.a: "A promotion, in a sense."
 
 legislature_events.300.desc: "You have united multiple formerly disparate states, and with them their governments. Multiple legislative bodies have been merged into the [ROOT.PrimaryTitle.Custom('GetLegislatureName')] of [ROOT.PrimaryTitle.GetDefinitiveName]."
 legislature_events.300.a: "I see."
 legislature_events.301.desc: "[ruler.GetFullName] has united multiple formerly disparate states, and with them their governments. Multiple legislative bodies have been merged into the [ruler.PrimaryTitle.Custom('GetLegislatureName')] of [ruler.PrimaryTitle.GetDefinitiveName]."
 legislature_events.301.a: "I see."
 
 legislature_events.1000.desc: "You have finished drafting a [activity.Custom('GetBillType')] and have convened [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')]. Once all the [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] have arrived, discussion of the bill can begin:\n\n[activity.Custom('GetBillProvisions')]"
 legislature_events.1000.a: "Hopefully this won't be too much trouble."
 
 legislature_events.1010.desc: "Unfortunately, this legislative session has ended in a dismal failure. Too few [activity_title.Custom('GetLegislatorNamePlural')] arrived for the session, failing to reach the necessary quorum. The bill will not go through. This is both a political defeat and a serious embarassment."
 legislature_events.1010.a: "Unbelievable."
 legislature_events.1015.desc: "This legislative session has ended in a dismal failure. Too few [activity_title.Custom('GetLegislatorNamePlural')] arrived for the session, failing to reach the necessary quorum. The bill will not go through."
 legislature_events.1015.a: "So I came all this way for nothing?"
 
 legislature_events.1020.desc: "With the dissolution of [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')], the ongoing legislative session has become rather redundant."
 legislature_events.1020.a: "I see."
 legislature_events.1025.desc: "With the dissolution of [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')], the ongoing legislative session has become rather redundant."
 legislature_events.1025.a: "I see."
 
 legislature_events.1030.desc: "Broader political changes have rendered the bill currently being debated by [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')] irrelevant."
 legislature_events.1030.a: "I see."
 legislature_events.1035.desc: "Broader political changes have rendered the bill currently being debated by [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')] irrelevant."
 legislature_events.1035.a: "I see."
 
 legislature_events.1040.desc: "In an embarassing moment of absent-mindedness, you proposed a bill that does not actually change any laws."
 legislature_events.1040.a: "...oops."
 legislature_events.1045.desc: "In an embarassing moment of absent-mindedness, [activity_host.GetFullName] proposed a bill that did not actually changed any laws."
 legislature_events.1045.a: "What a fool."
 
 legislature_events.1100.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')|U][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has convened, and, to your pleasant surprise, seems to overwhelmingly support your [activity.Custom('GetBillType')]. They intend to hold a vote tomorrow, although at this point it is merely a formality."
 legislature_events.1100.a: "I love democracy."

 legislature_events.1101.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')|U][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has convened, and already there are problems. A total of [activity.MakeScope.ScriptValue('total_bill_supporters')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] have voiced support for your [activity.Custom('GetBillType')] - short of the [activity.MakeScope.Var('legislature').ScriptValue('simple_majority')] needed for a simple majority. You will need to find some way to convince enough of the holdouts for your bill to pass."
 legislature_events.1101.a: "Hold a vote in one month."
 legislature_events.1101.b: "Hold a vote in two months."
 legislature_events.1101.c: "Hold a vote in three months."
 
 
 legislature_events.1200.desc: "The day for the vote has come, and [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has voted on your [activity.Custom('GetBillType')]. To your great satisfaction, the bill has passed, with a final vote of [activity.MakeScope.ScriptValue('total_bill_supporters')] - [activity.MakeScope.ScriptValue('total_bill_opponents')] in favor."
 legislature_events.1200.a: "Now we can move forward."
 legislature_events.1210.desc: "The day for the vote has come, and [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has voted on your [activity.Custom('GetBillType')]. To your immense frustration, the bill has failed, with a final vote of [activity.MakeScope.ScriptValue('total_bill_opponents')] - [activity.MakeScope.ScriptValue('total_bill_supporters')] against."
 legislature_events.1210.a: "What a disaster."
 
 legislature_events.1300.desc: "Thanks to some clever lobbying by [representative_opponent.GetFullName], the [host.GetTitleTierName] has agreed to amend [host.Custom('GetTheir')] proposed [host.Custom('GetBillType')]. The new [host.Custom('GetBillType')] is much more satisfactory:\n\n[host.Custom.('GetBillProvisions')]."
 legislature_events.1300.a: "I suppose I'll be voting for it after all."
 legislature_events.1300.b: "This changes nothing."
 legislature_events.1310.desc: "Thanks to some clever lobbying by [representative_opponent.GetFullName], the [host.GetTitleTierName] has agreed to amend [host.Custom('GetTheir')] proposed [host.Custom('GetBillType')]. The new [host.Custom('GetBillType')] is much less satisfactory:\n\n[host.Custom.('GetBillProvisions')]."
 legislature_events.1310.a: "And with that, there goes my support."
 legislature_events.1310.b: "This changes nothing."
 legislature_events.1320.desc: "The [host.GetTitleTierName] has rejected a proposal by [representative_opponent.GetFullName] that would have made [host.Custom('GetTheir')] proposed [host.Custom('GetBillType')] much more agreeable."
 legislature_events.1320.a: "Stubborn fool."
 legislature_events.1330.desc: "The [host.GetTitleTierName] has rejected a proposal by [representative_opponent.GetFullName] that would have made [host.Custom('GetTheir')] proposed [host.Custom('GetBillType')] much less agreeable."
 legislature_events.1330.a: "Good job standing [host.Custom('GetTheir')] ground."
 
 legislature_events.1500.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')|U] [target_opponent.Custom('GetFullPersonalName')] is an outspoken critic of your [activity.Custom('GetBillType')]. Perhaps you could persuade [target_opponent.Custom('GetThem')] to change [target_opponent.Custom('GetTheir')] mind?"
