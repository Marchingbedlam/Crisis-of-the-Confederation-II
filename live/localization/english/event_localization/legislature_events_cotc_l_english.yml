 legislature_events.2200.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')|U] [representative_opponent.Custom('GetFullPersonalName')], a prominent and outspoken opponent of your budget, has come to you to offer a deal.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I believe we can come to a compromise. I represent a significant faction of [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')], and we would be willing to vote for your budget with only a few changes. Here, let me show you our proposed amendments:\"\n\n$BULLET$#indent_newline:2 [treasury_military_budget|E]: [ROOT.Char.MakeScope.Var('amended_military_budget').GetValue]%#!\n$BULLET$#indent_newline:2 [treasury_ministry_budget|E]: [ROOT.Char.MakeScope.Var('amended_ministry_budget').GetValue]%#!\n$BULLET$#indent_newline:2 [treasury_salary_budget|E]: [ROOT.Char.MakeScope.Var('amended_salary_budget').GetValue]%#!\n$BULLET$#indent_newline:2 Total Budget: [ROOT.Char.MakeScope.ScriptValue('amended_total_budget')]%#!"
 legislature_events.2200.a: "Very well, I agree to these terms."
 legislature_events.2200.b: "Absolutely unacceptable. The proposal will stand."
