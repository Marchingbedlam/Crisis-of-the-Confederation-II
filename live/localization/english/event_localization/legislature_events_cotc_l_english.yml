 legislature_events.1500.hook_not_gained.desc: "[target_opponent.GetFullName] has refused to grant you a favor."
 legislature_events.1510.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] made you a surprising offer: a bribe. In exchange for your vote, [actor.Custom('GetThey')] will pay you a sizable sum of credits."
 legislature_events.1510.a: "Well, I can't say no to that."
 legislature_events.1510.b: "I very much #italic can#! say no to that."
 legislature_events.1520.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] made you a surprising offer. If you agree to support the bill, [actor.Custom('GetThey')] will add a provision earmarking special funds for the development of your constituency, the [ROOT.Var('riding').Title.GetNameNoTier] [ROOT.Var('riding').Title.GetTierAsName]."
 legislature_events.1520.a: "Perhaps this bill isn't so bad after all."
 legislature_events.1520.b: "I hate the taste of pork."
 pork_barrel_effect_desc: "[activity.MakeScope.Var('legislature_title').GetDefinitiveName] will invest [ROOT.Char.Var('riding').ScriptValue('treasury_required_for_stimulus')] [treasury|E] into the [ROOT.Char.Var('riding').GetAdjective] economy."
 legislature_events.1530.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHave')] made it clear: you do not have a choice in the matter. [actor.Custom('GetThey')|U] [actor.Custom('GetBePresent')] calling in your debt."
 legislature_events.1530.a: "I guess I'm voting for it now."
 legislature_events.1535.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] made it clear that [actor.Custom('GetThey')] [actor.Custom('GetBePresent')] calling in your debt. \"If you're a [ROOT.Char.Custom('GetPerson')] of your word,\" [actor.Custom('GetThey')] said, \"you'll vote for this bill.\""
 legislature_events.1535.a: "Fine, but this makes us even."
 legislature_events.1535.b: "I guess I'm not a [ROOT.Char.Custom('GetPerson')] of my word."
 legislature_events.1540.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] came to you and practically begged you to vote for the bill, in exchange for a future favor."
 legislature_events.1540.a: "I #italic am#! a fan of unspecified future favors."
 legislature_events.1540.b: "I'm not basing my vote on something so nebulous."
 
