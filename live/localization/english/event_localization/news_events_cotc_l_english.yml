 cotc_news.11.desc: "\"[ROOT.Char.Custom('GetNewsIntro')][ROOT.Char.Custom('GetNewsSource')][attacker.GetPrimaryTitle.GetDefinitiveName] has declared war against [defender.GetPrimaryTitle.GetDefinitiveName]. We have not yet received comment from [defender.Custom('GetBestName')].\n\n[ROOT.Char.Custom('GetNewsOutro')]"
