l_english:
 cotc_legislative_campaign_events.1.desc.incumbent: "\"[ROOT.Char.Custom('GetNewsIntro')][candidate.Custom('GetNewsSource')][candidate.Custom('GetTheir')] intent to run for an additional term as [legislature.MakeScope.Var('legislature_title').Custom('GetLegislatorName')] for [riding.GetDefinitiveName].\""
 cotc_legislative_campaign_events.1.desc.illegal_candidate: "\"[ROOT.Char.Custom('GetNewsIntro')][candidate.Custom('GetNewsSource')][candidate.Custom('GetTheir')] entry into the race to represent [riding.GetNameNoTier] in the upcoming [legislature.MakeScope.Var('legislature_title').Title.Custom('GetTierAdjective')] election. Many have voiced opposition to [candidate.Custom('GetTheir')] candidacy, arguing that under [legislature.MakeScope.Var('legislature_title').GetAdjective] law, it is illegal for a [candidate.GetFaith.GetAdherentName] to hold public office.\n\n\"[ROOT.Char.Custom('GetNewsOutro')]\""
 cotc_legislative_campaign_events.1.desc.other: "\"[ROOT.Char.Custom('GetNewsIntro')][candidate.Custom('GetNewsSource')][candidate.Custom('GetTheir')] entry into the race to represent [riding.GetNameNoTier] in the upcoming [legislature.MakeScope.Var('legislature_title').Title.Custom('GetTierAdjective')] election.\""
 cotc_legislative_campaign_events.1.a: "[candidate.Custom('GetThey')] [candidate.Custom('GetDo')]n't stand a chance."
 cotc_legislative_campaign_events.1.b: "I wish [candidate.Custom('GetThem')] luck."
 cotc_legislative_campaign_events.1.c: "We'll see how this plays out."
 cotc_legislative_campaign_events.1.d: "Hopefully the voters are smarter than that."
 
 cotc_legislative_campaign_events.15.desc.incumbent: "\"[ROOT.Char.Custom('GetNewsIntro')][candidate.Custom('GetNewsSource')][candidate.Custom('GetThey')] [candidate.Custom('GetHave')] ended [candidate.Custom('GetTheir')] campaign for re-election as [legislature.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')] for [riding.GetNameNoTier]."
 cotc_legislative_campaign_events.15.desc.other: "\"[ROOT.Char.Custom('GetNewsIntro')][candidate.Custom('GetNewsSource')][candidate.Custom('GetThey')] [candidate.Custom('GetHave')] conceded the race to represent [riding.GetNameNoTier] in [legislature.MakeScope.Var('legislature_title').Title.Custom('GetDefinitiveLegislatureName')]."
 cotc_legislative_campaign_events.15.a: "One less rival."
 cotc_legislative_campaign_events.15.b: "That's a shame."
 cotc_legislative_campaign_events.15.c: "I see."
 cotc_legislative_campaign_events.15.d: "Good riddance."
 
 cotc_legislative_campaign_events.50.desc: "This is an AI control event. You shouldn't be able to see it. Please inform the devs that you saw cotc_legislative_campaign_events.50, with the associated titles being [legislature.MakeScope.Var('legislature_title').GetName] and [riding.GetName]."
 cotc_legislative_campaign_events.50.a: "Break things even more!"
 cotc_legislative_campaign_events.50.b: "Cut your losses."
 
 cotc_legislative_campaign_events.100.desc.no_secret_faith: "You have announced that you plan to stand for election to represent [riding.GetDefinitiveName] in the [legislature.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [legislature.MakeScope.Var('legislature_title').GetDefinitiveName]. However, there is a complication. You are a known [ROOT.Char.GetFaith.GetAdherentName], and [legislature.MakeScope.Var('legislature_title').GetAdjective] law bans [ROOT.Char.GetFaith.GetNameNoTooltip] in politics. Unless you publicly repudiate your beliefs, your name will not be on the ballot."
 cotc_legislative_campaign_events.100.desc.single_party_state: "You have announced that you plan to stand for election to represent [riding.GetDefinitiveName] in the [legislature.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [legislature.MakeScope.Var('legislature_title').GetDefinitiveName]. There's just one problem: [legislature.MakeScope.Var('legislature_title').GetNameNoTierNoTooltip] is a single-party state, and you're not a member. If you want your name added to the ballot, you will have to publicly declare your allegiance to [closest_legal_faith.GetName]."
 cotc_legislative_campaign_events.100.desc.no_secret_faith: "You have announced that you plan to stand for election to represent [riding.GetDefinitiveName] in the [legislature.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [legislature.MakeScope.Var('legislature_title').GetDefinitiveName]. However, there is a complication: you are a known [ROOT.Char.GetFaith.GetAdherentName], and [legislature.MakeScope.Var('legislature_title').GetAdjective] law bans [ROOT.Char.GetFaith.GetNameNoTooltip] in politics. Unless you publicly repudiate your beliefs, your name will not be on the ballot."
 cotc_legislative_campaign_events.100.desc.secret_faith: "You have announced that you plan to stand for election to represent [riding.GetDefinitiveName] in the [legislature.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [legislature.MakeScope.Var('legislature_title').GetDefinitiveName]. However, there is a complication: you are - at least, as far as anyone knows - a [ROOT.Char.GetFaith.GetAdherentName], and [legislature.MakeScope.Var('legislature_title').GetAdjective] law bans [ROOT.Char.GetFaith.GetNameNoTooltip] in politics. Unless you publicly repudiate your alleged beliefs, your name will not be on the ballot."
 cotc_legislative_campaign_events.100.a: "Become a loyal [closest_legal_faith.GetAdherentName]."
 cotc_legislative_campaign_events.100.b: "Become a crypto-[ROOT.Char.GetFaith.GetAdherentName]."
 cotc_legislative_campaign_events.100.c: "Publicly embrace [closest_legal_faith.GetName]."
 will_remain_crypto_desc: "You will remain a crypto-[ROOT.Char.GetSecretFaith.GetAdherentName]."
 cotc_legislative_campaign_events.100.d: "Drop out of the race."