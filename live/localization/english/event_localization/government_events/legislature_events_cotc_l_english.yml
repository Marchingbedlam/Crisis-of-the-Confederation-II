l_english:
 legislature_events.1.desc: "[ROOT.Char.Custom('GetNewsIntro')][ROOT.Char.Custom('GetNewsSource')]legislative elections have been called in [situation.MakeScope.Var('legislature_title').GetDefinitiveName]. Citizens now head to the polls to elect a new [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')]."
 legislature_events.1.a: "I see."
 
 legislature_events.10.desc: "The polls have closed in the [county.GetNameNoTier] System, and you have been elected [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')]. You will now represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title).Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title).Title.GetDefinitiveName]."
 legislature_events.10.a: "A powerful opportunity."
 legislature_events.10.legislator_elected.tt: "[situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')] Elected"
 legislature_events.10.legislator_elected.desc: "[legislator_elect.GetFullName] will now represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title').Title.GetDefinitiveName]."
 
 legislature_events.11.desc: "The polls have closed in the [county.GetNameNoTier] System, and you have been re-elected [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')]."
 legislature_events.11.a: "My career continues."
 legislature_events.11.legislator_elected.tt: "[situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatorName')] Re-Elected"
 legislature_events.11.legislator_elected.desc: "[legislator_elect.GetFullName] will continue to represent [county.GetNameNoTier] in the [situation.MakeScope.Var('legislature_title').Title.Custom('GetLegislatureName')] of [situation.MakeScope.Var('legislature_title').Title.GetDefinitiveName]."
 
 legislature_events.12.desc: "The polls have closed in the [county.GetNameNoTier] System, and unfortunately you have failed to be re-elected."
 legislature_events.12.a: "Damn!"
 
 legislature_events.100.desc: "With the shift to a new form of government come changes to the organization of the state. You have permanently dissolved [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')], estalishing one-[ROOT.Char.Custom('GetPerson')] rule."
 legislature_events.100.a: "I am [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')]."
 legislature_events.101.desc: "With the shift to a new form of government come changes to the organization of the state. [ruler.GetFullName] has permanently dissolved [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')], estalishing one-[ruler.Custom('GetPerson')] rule."
 legislature_events.101.a: "So this is how liberty dies..."
 
 legislature_events.200.desc: "You have ascended to a higher office, and brought the machinery of government with you. [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')|U][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')] now serves [ROOT.PrimaryTitle.GetDefinitiveName]."
 legislature_events.200.a: "So be it."
 legislature_events.201.desc: "[ruler.GetFullName] has ascended to a higher office, and brought the machinery of government with [ruler.Custom('GetThem')]. [situation.MakeScope.Var('legislature_title').Custom('GetLegislatureArticle')|U][situation.MakeScope.Var('legislature_title').Custom('GetLegislatureName')] now serves [ruler.PrimaryTitle.GetDefinitiveName]."
 legislature_events.201.a: "A promotion, in a sense."
 
 legislature_events.300.desc: "You have united multiple formerly disparate states, and with them their governments. Multiple legislative bodies have been merged into the [ROOT.PrimaryTitle.Custom('GetLegislatureName')] of [ROOT.PrimaryTitle.GetDefinitiveName]."
 legislature_events.300.a: "I see."
 legislature_events.301.desc: "[ruler.GetFullName] has united multiple formerly disparate states, and with them their governments. Multiple legislative bodies have been merged into the [ruler.PrimaryTitle.Custom('GetLegislatureName')] of [ruler.PrimaryTitle.GetDefinitiveName]."
 legislature_events.301.a: "I see."