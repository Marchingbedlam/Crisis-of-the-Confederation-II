l_english:
 cotc_tax_bill_events.200.desc: "[title.Custom('GetLegislatureArticle')|U][title.Custom('GetLegislatureName')|U] has passed your tax code, which will now be enacted as official policy:\n\n$tax_bill_provisions_post$"
 cotc_tax_bill_events.210.desc: "Thanks in part to your vote, the [host.GetTitleTierName]'s tax code has passed [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_supporters] - [final_opponents] in favor. The terms of the bill are as follows:\n\n$tax_bill_provisions_post$"
 cotc_tax_bill_events.220.desc: "Despite your vote, the [host.GetTitleTierName]'s tax code has passed [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_supporters] - [final_opponents] in favor. The terms of the bill are as follows:\n\n$tax_bill_provisions_post$"
 cotc_tax_bill_events.250.desc: "The [title.Custom('GetLegislatureName')|U] of [title.GetNameNoTier] has passed a new tax code, which will now be enacted as official policy:\n\n$tax_bill_provisions_post$"
 cotc_tax_bill_events.300.desc: "[title.Custom('GetLegislatureArticle')|U][title.Custom('GetLegislatureName')|U] has rejected your tax code. You will need to carry on with the laws as they are."
 cotc_tax_bill_events.310.desc: "Despite your vote, the [host.GetTitleTierName]'s tax code has failed to pass [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_opponents] - [final_supporters] against."
 cotc_tax_bill_events.320.desc: "Thanks in part to your vote, the [host.GetTitleTierName]'s tax code has failed to pass [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_opponents] - [final_supporters] against."
 
 cotc_tax_bill_events.400.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')|U] [representative_opponent.Custom('GetFullPersonalName')], a prominent and outspoken opponent of your tax code, has come to you to offer a deal.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I believe we can come to a compromise. I represent a significant faction of [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] who want to [representative_opponent.Custom('GetLegislativeIntent')], and we would be willing to vote for your bill with only a few changes. Here, let me show you our proposed amendments:\"\n\n$BULLET$#indent_newline:2 [military_power_base_adj] Taxes: [ROOT.Char.MakeScope.ScriptValue('amended_military_tax_rate')]%#!\n$BULLET$#indent_newline:2 [commercial_power_base_adj] Taxes: [ROOT.Char.MakeScope.ScriptValue('amended_commercial_tax_rate')]%#!\n$BULLET$#indent_newline:2 [technocratic_power_base_adj] Taxes: [ROOT.Char.MakeScope.ScriptValue('amended_technocratic_tax_rate')]%#!\n$BULLET$#indent_newline:2 [theocratic_power_base_adj] Taxes: [ROOT.Char.MakeScope.ScriptValue('amended_theocratic_tax_rate')]%#!"