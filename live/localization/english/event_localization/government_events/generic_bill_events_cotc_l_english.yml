 cotc_bill_events.400.hook_succeeded.desc: "[target_opponent.GetFullName] now supports your [activity.Custom('GetBillType')]."
 cotc_bill_events.400.hook_failed.tt: "Hook Failed"
 cotc_bill_events.400.hook_failed.desc: "Your [hook|E] failed, and [target_opponent.GetFullName] still refuses to support your [activity.Custom('GetBillType')]."
 cotc_bill_events.400.hook_gained.tt: "Favor Granted"
 cotc_bill_events.400.hook_gained.desc: "[target_opponent.GetFullName] now supports your [activity.Custom('GetBillType')] and has a weak [hook|E] on you."
 cotc_bill_events.400.hook_not_gained.tt: "Favor Not Granted"
 cotc_bill_events.400.hook_not_gained.desc: "[target_opponent.GetFullName] has refused to grant you a favor."
 cotc_bill_events.410.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] made you a surprising offer: a bribe. In exchange for your vote, [actor.Custom('GetThey')] will pay you a sizable sum of credits."
 cotc_bill_events.410.a: "Well, I can't say no to that."
 cotc_bill_events.410.b: "I very much #italic can#! say no to that."
 cotc_bill_events.420.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] made you a surprising offer. If you agree to support the bill, [actor.Custom('GetThey')] will add a provision earmarking special funds for the development of your constituency, the [ROOT.Var('riding').Title.GetNameNoTier] [ROOT.Var('riding').Title.GetTierAsName]."
 cotc_bill_events.420.a: "Perhaps this bill isn't so bad after all."
 cotc_bill_events.420.b: "I hate the taste of pork."
 pork_barrel_effect_desc: "[activity.MakeScope.Var('legislature_title').GetDefinitiveName] will invest [ROOT.Char.Var('riding').ScriptValue('treasury_required_for_stimulus')] [treasury|E] into the [ROOT.Char.Var('riding').GetAdjective] economy."
 cotc_bill_events.430.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHave')] made it clear: you do not have a choice in the matter. [actor.Custom('GetThey')|U] [actor.Custom('GetBePresent')] calling in your debt."
 cotc_bill_events.430.a: "I guess I'm voting for it now."
 cotc_bill_events.435.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] made it clear that [actor.Custom('GetThey')] [actor.Custom('GetBePresent')] calling in your debt. \"If you're a [ROOT.Char.Custom('GetPerson')] of your word,\" [actor.Custom('GetThey')] said, \"you'll vote for this bill.\""
 cotc_bill_events.435.a: "Fine, but this makes us even."
 cotc_bill_events.435.b: "I guess I'm not a [ROOT.Char.Custom('GetPerson')] of my word."
 cotc_bill_events.440.desc: "You have made no secret of your opposition to [actor.GetFullName]'s proposed [actor.Custom('GetBillType')]. Today, however, [actor.Custom('GetThey')] [actor.Custom('GetHas')] came to you and practically begged you to vote for the bill, in exchange for a future favor."
 cotc_bill_events.440.a: "I #italic am#! a fan of unspecified future favors."
 cotc_bill_events.440.b: "I'm not basing my vote on something so nebulous."
 
