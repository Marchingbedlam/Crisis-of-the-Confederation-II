 cotc_bill_events.1.desc: "You have finished drafting a [activity.Custom('GetBillType')] and have convened [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')]. Once all the [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] have arrived, discussion of the bill can begin:\n\n[activity.Custom('GetBillProvisions')]"
 cotc_bill_events.1.a: "Hopefully this won't be too much trouble."
 
 cotc_bill_events.10.desc: "Unfortunately, this legislative session has ended in a dismal failure. Too few [activity_title.Custom('GetLegislatorNamePlural')] arrived for the session, failing to reach the necessary quorum. The bill will not go through. This is both a political defeat and a serious embarassment."
 cotc_bill_events.10.a: "Unbelievable."
 cotc_bill_events.15.desc: "This legislative session has ended in a dismal failure. Too few [activity_title.Custom('GetLegislatorNamePlural')] arrived for the session, failing to reach the necessary quorum. The bill will not go through."
 cotc_bill_events.15.a: "So I came all this way for nothing?"
 
 cotc_bill_events.20.desc: "With the dissolution of [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')], the ongoing legislative session has become rather redundant."
 cotc_bill_events.20.a: "I see."
 cotc_bill_events.25.desc: "With the dissolution of [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')], the ongoing legislative session has become rather redundant."
 cotc_bill_events.25.a: "I see."
 
 cotc_bill_events.30.desc: "Broader political changes have rendered the bill currently being debated by [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')] irrelevant."
 cotc_bill_events.30.a: "I see."
 cotc_bill_events.35.desc: "Broader political changes have rendered the bill currently being debated by [activity_title.Custom('GetLegislatureArticle')][activity_title.Custom('GetLegislatureName')] irrelevant."
 cotc_bill_events.35.a: "I see."
 
 cotc_bill_events.40.desc: "In an embarassing moment of absent-mindedness, you proposed a bill that does not actually change any laws."
 cotc_bill_events.40.a: "...oops."
 cotc_bill_events.45.desc: "In an embarassing moment of absent-mindedness, [activity_host.GetFullName] proposed a bill that did not actually changed any laws."
 cotc_bill_events.45.a: "What a fool."
 
 cotc_bill_events.100.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')|U][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has convened, and, to your pleasant surprise, seems to overwhelmingly support your [activity.Custom('GetBillType')]. They intend to hold a vote tomorrow, although at this point it is merely a formality."
 cotc_bill_events.100.a: "I love democracy."

 cotc_bill_events.150.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')|U][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has convened, and already there are problems. A total of [activity.MakeScope.ScriptValue('total_bill_supporters')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] have voiced support for your [activity.Custom('GetBillType')] - short of the [activity.MakeScope.Var('legislature').ScriptValue('simple_majority')] needed for a simple majority. You will need to find some way to convince enough of the holdouts for your bill to pass."
 cotc_bill_events.150.a: "Hold a vote in one month."
 cotc_bill_events.150.b: "Hold a vote in two months."
 cotc_bill_events.150.c: "Hold a vote in three months."
 
 cotc_bill_events.200.desc: "The day for the vote has come, and [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has voted on your [activity.Custom('GetBillType')]. To your great satisfaction, the bill has passed, with a final vote of [activity.MakeScope.ScriptValue('total_bill_supporters')] - [activity.MakeScope.ScriptValue('total_bill_opponents')] in favor."
 cotc_bill_events.200.a: "Now we can move forward."
 cotc_bill_events.250.desc: "The day for the vote has come, and [activity.MakeScope.Var('title').Title.Custom('GetLegislatureArticle')][activity.MakeScope.Var('title').Title.Custom('GetLegislatureName')] has voted on your [activity.Custom('GetBillType')]. To your immense frustration, the bill has failed, with a final vote of [activity.MakeScope.ScriptValue('total_bill_opponents')] - [activity.MakeScope.ScriptValue('total_bill_supporters')] against."
 cotc_bill_events.250.a: "What a disaster."
 
 cotc_bill_events.300.desc: "Thanks to some clever lobbying by [representative_opponent.GetFullName], the [host.GetTitleTierName] has agreed to amend [host.Custom('GetTheir')] proposed [activity.Custom('GetBillType')]. The new [activity.Custom('GetBillType')] is much more satisfactory:\n\n[host.Custom.('GetBillProvisions')]."
 cotc_bill_events.300.a: "I suppose I'll be voting for it after all."
 cotc_bill_events.300.b: "This changes nothing."
 cotc_bill_events.310.desc: "Thanks to some clever lobbying by [representative_opponent.GetFullName], the [host.GetTitleTierName] has agreed to amend [host.Custom('GetTheir')] proposed [activity.Custom('GetBillType')]. The new [activity.Custom('GetBillType')] is much less satisfactory:\n\n[host.Custom.('GetBillProvisions')]."
 cotc_bill_events.310.a: "And with that, there goes my support."
 cotc_bill_events.310.b: "This changes nothing."
 cotc_bill_events.320.desc: "The [host.GetTitleTierName] has rejected a proposal by [representative_opponent.GetFullName] that would have made [host.Custom('GetTheir')] proposed [activity.Custom('GetBillType')] much more agreeable."
 cotc_bill_events.320.a: "Stubborn fool."
 cotc_bill_events.330.desc: "The [host.GetTitleTierName] has rejected a proposal by [representative_opponent.GetFullName] that would have made [host.Custom('GetTheir')] proposed [activity.Custom('GetBillType')] much less agreeable."
 cotc_bill_events.330.a: "Good job standing [host.Custom('GetTheir')] ground."
 
 cotc_bill_events.400.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')|U] [target_opponent.Custom('GetFullPersonalName')], who wants to [target_opponent.Custom('GetLegislativeIntent')], is an outspoken critic of your [activity.Custom('GetBillType')]. Perhaps you could persuade [target_opponent.Custom('GetThem')] to change [target_opponent.Custom('GetTheir')] mind?"
 cotc_bill_events.400.a: "Offer a bribe."
 cotc_bill_events.400.b: "Add a stimulus rider for [target_opponent.MakeScope.Var('riding').Title.GetDefinitiveName]."
 already_spending_pork_desc: "Your bill already earmarks [activity.MakeScope.Var('pork').ShowValue] [treasury|E]."
 cotc_bill_events.400.c: "Call in a [hook|E]."
 cotc_bill_events.400.d: "Ask [target_opponent.Custom('GetThem')] to do it as a favor."
 cotc_bill_events.400.e: "I'll find votes elsewhere."
 cotc_bill_events.400.bribe_accepted.tt: "Bribe Accepted"
 cotc_bill_events.400.bribe_accepted.desc: "[target_opponent.GetFullName] has accepted your bribe and now supports your [activity.Custom('GetBillType')]."
 cotc_bill_events.400.bribe_refused.tt: "Bribe Refused"
 cotc_bill_events.400.bribe_refused.desc: "[target_opponent.GetFullName] has refused your bribe."
