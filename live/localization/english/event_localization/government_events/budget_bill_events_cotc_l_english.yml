l_english:
 cotc_budget_bill_events.100.desc: "The [host.GetTitleTierName] has proposed a new [activity.Custom('GetBillType')] for [activity.MakeScope.Var('title').GetDefinitiveName], and [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')] has convened to vote on it. The proposed [activity.Custom('GetBillType')] is as follows:\n\n[activity.Custom('GetBillProvisions')]\n\nThere is still some time before voting begins. How do you plan to vote?"
 cotc_budget_bill_events.100.a: "I intend to vote for this [activity.Custom('GetBillType')]."
 cotc_budget_bill_events.100.b: "I intend to vote against this [activity.Custom('GetBillType')]."
 cotc_budget_bill_events.100.votes_for.tt: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')] Supports [activity.Custom('GetBillType')|U]."
 cotc_budget_bill_events.100.votes_for.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')] [voter.GetFullName] intends to vote for the proposed [activity.Custom('GetBillType')]."
 cotc_budget_bill_events.100.votes_against.tt: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')] Opposes [activity.Custom('GetBillType')|U]."
 cotc_budget_bill_events.100.votes_against.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')] [voter.GetFullName] intends to vote against the proposed [activity.Custom('GetBillType')]."

 cotc_budget_bill_events.200.desc: "[title.Custom('GetLegislatureArticle')|U][title.Custom('GetLegislatureName')|U] has passed your budget, which will now be enacted as official policy:\n\n$budget_bill_provisions_post$"
 cotc_budget_bill_events.200.a: "Mission accomplished."
 cotc_budget_bill_events.210.desc: "Thanks in part to your vote, the [host.GetTitleTierName]'s budget has passed [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_supporters] - [final_opponents] in favor. The terms of the bill are as follows:\n\n$budget_bill_provisions_post$"
 cotc_budget_bill_events.210.a: "A job well done."
 cotc_budget_bill_events.220.desc: "Despite your vote, the [host.GetTitleTierName]'s budget has passed [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_supporters] - [final_opponents] in favor. The terms of the bill are as follows:\n\n$budget_bill_provisions_post$"
 cotc_budget_bill_events.220.a: "This will be a disaster for the [title.GetTierAsName]."
 cotc_budget_bill_events.250.desc: "The [title.Custom('GetLegislatureName')|U] of [title.GetNameNoTier] has passed a new budget, which will now be enacted as official policy:\n\n$budget_bill_provisions_post$"
 cotc_budget_bill_events.250.a: "I see."
 cotc_budget_bill_events.300.desc: "[title.Custom('GetLegislatureArticle')|U][title.Custom('GetLegislatureName')|U] has rejected your budget. You will need to carry on with the laws as they are."
 cotc_budget_bill_events.300.a: "This is a disaster."
 cotc_budget_bill_events.310.desc: "Despite your vote, the [host.GetTitleTierName]'s budget has failed to pass [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_opponents] - [final_supporters] against."
 cotc_budget_bill_events.310.a: "This will be a disaster for the [title.GetTierAsName]."
 cotc_budget_bill_events.320.desc: "Thanks in part to your vote, the [host.GetTitleTierName]'s budget has failed to pass [title.Custom('GetLegislatureArticle')][title.Custom('GetLegislatureName')|U], with a final vote of [final_opponents] - [final_supporters] against."
 cotc_budget_bill_events.320.a: "A job well done."
 
 cotc_budget_bill_events.400.desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorName')|U] [representative_opponent.Custom('GetFullPersonalName')], a prominent and outspoken opponent of your budget, has come to you to offer a deal.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I believe we can come to a compromise. I represent a significant faction of [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] who want to [representative_opponent.Custom('GetLegislativeIntent')], and we would be willing to vote for your budget with only a few changes. Here, let me show you our proposed amendments:\"\n\n$budget_bill_amendment_proposed_desc$"
 cotc_budget_bill_events.400.a: "Very well, I agree to these terms."
 cotc_budget_bill_events.400.b: "Absolutely unacceptable. The proposal will stand."
 cotc_budget_bill_events.400.refused_amendment.tt: "Amendment Refused"
 cotc_budget_bill_events.400.refused_amendment.desc: "[host.GetFullName] refused a proposed amendment to [host.Custom('GetTheir')] [activity.Custom('GetBillType')]."
 budget_bill_amendment_proposed_desc: "$BULLET$#indent_newline:2 [treasury_military_budget|E]: [host.MakeScope.Var('amended_military_budget').GetValue]%#!\n$BULLET$#indent_newline:2 [treasury_ministry_budget|E]: [host.MakeScope.Var('amended_ministry_budget').GetValue]%#!\n$BULLET$#indent_newline:2 [treasury_salary_budget|E]: [host.MakeScope.Var('amended_salary_budget').GetValue]%#!\n$BULLET$#indent_newline:2 Total Budget: [host.MakeScope.ScriptValue('amended_total_budget')]%#!"