l_english:
 government_change_events.100.intro.was_free.legislature: "It appears that your autonomy is about to be severely curtailed. [enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] has passed [passed_by.Custom('GetBestNameNoState')]'s bill regulating the government of all [SCOPE.Custom('GetSavedPowerBase')] territories. "
 government_change_events.100.intro.now_free.legislature: "[passed_by.Custom('GetBestNameNoState')|U] has managed to convince [enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] to pass a bill abolishing all regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. You now have the right to determine for yourself how the leadership of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] should be chosen."
 government_change_events.100.intro.other.legislature: "[passed_by.Custom('GetBestNameNoState')|U] has managed to convince [enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] to pass a bill amending the regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. "
 government_change_events.100.intro.was_free: "It appears that your autonomy is about to be severely curtailed. [enacting_ruler.Custom('GetBestName')] has declared a new law regulating the government of all [SCOPE.Custom('GetSavedPowerBase')] territories. "
 government_change_events.100.intro.now_free: "[enacting_ruler.Custom('GetBestName')|U] has declared a new law abolishing all regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. You now have the right to determine for yourself how the leadership of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] should be chosen."
 government_change_events.100.intro.other: "[enacting_ruler.Custom('GetBestName')|U] has declared a new law amending the regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. "
 government_change_events.100.desc.democratic: "The citizens of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] have been granted the right to democratically elect your successor."
 government_change_events.100.desc.aristocratic: "You may now consider [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] to be the rightful property of your family, to be passed down by hereditary succession."
 government_change_events.100.desc.meritocratic: "From now on, the leadership of [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] will be appointed directly by the [enacting_ruler.GetTitleTierName]."
 government_change_events.100.a.free: "Whatever happened to separation of church and state?"
 government_change_events.100.a.democratic: "And I suppose the people get no say any longer?"
 government_change_events.100.a.aristocratic: "So much for the rights of the nobility..."
 government_change_events.100.a.meritocratic: "And how can we trust these new leaders will be competent?"
 government_change_events.100.b: "What gives [passed_by.Custom('GetThem')] the right to meddle like this?"
 government_change_events.100.c: "[passed_by.Custom('GetBePresent')|U] [passed_by.Custom('GetThey')] a complete idiot?"
 government_change_events.100.d: "I respect [passed_by.Custom('GetTheir')] pragmatism, if nothing else."
 government_change_events.100.e: "Finally, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] will be out of our hair."
 government_change_events.100.f.free: "Religion isn't the state's business anyway."
 government_change_events.100.f.democratic: "A great day for liberty."
 government_change_events.100.f.aristocratic: "Only the nobility are fit to rule."
 government_change_events.100.f.meritocratic: "Finally, we can expect some competent leadership."
 government_change_events.100.g: "I see."
 government_change_events.101.intro.was_free.legislature: "[enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] has passed [passed_by.Custom('GetBestNameNoState')]'s bill regulating the government of all [SCOPE.Custom('GetSavedPowerBase')] territories. "
 government_change_events.101.intro.now_free.legislature: "[passed_by.Custom('GetBestNameNoState')|U] has managed to convince [enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] to pass a bill abolishing all regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. The regional governors now have the right to determine for themselves how the leadership of their territories should be chosen."
 government_change_events.101.intro.other.legislature: "[passed_by.Custom('GetBestNameNoState')|U] has managed to convince [enacting_ruler.GetPrimaryTitle.Custom('GetDefinitiveLegislatureName')|U] to pass a bill amending the regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. "
 government_change_events.101.intro.was_free: "[enacting_ruler.Custom('GetBestName')] has declared a new law regulating the government of all [SCOPE.Custom('GetSavedPowerBase')] territories. "
 government_change_events.101.intro.now_free: "[enacting_ruler.Custom('GetBestName')|U] has declared a new law abolishing all regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. The regional governors now have the right to determine for themselves how the leadership of their territories should be chosen."
 government_change_events.101.intro.other: "[enacting_ruler.Custom('GetBestName')|U] has declared a new law amending the regulations on local [SCOPE.Custom('GetSavedPowerBase')] governments. "
 government_change_events.101.desc.democratic: "The citizens of these provinces have been granted the guaranteed right to democratically elect their leaders."
 government_change_events.101.desc.aristocratic: "The leadership of these provinces is henceforth to be entrusted to the families of their rulers, passed down through hereditary succession."
 government_change_events.101.desc.meritocratic: "From now on, the governors of these territories shall be appointed directly by the [enacting_ruler.GetTitleTierName]."
 
 government_change_events.110.desc: "Ruling in [relevant_ruler.GetPrimaryTitle.GetDefiniteName] carries it with certain restrictions. The laws are clear - as the [ROOT.Char.GetTitleTierName] of a [ROOT.Char.Custom('GetRulerPowerBase')] government, your territory must be governed in a [ROOT.Char.Custom('GetRulerLegitimacyAdj')] fashion."