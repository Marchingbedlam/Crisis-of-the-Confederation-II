 cotc_no_confidence_events.305.desc: "[actor.GetFullName] has called your leadership skills into question and has challenged you to a debate on the subject. You are not obligated to respond, but ignoring the challenge will make you look weak and prevent you from responding to [actor.Custom('GetTheir')] arguments."
 cotc_no_confidence_events.305.a: "[actor.Custom('GetThey')|U] can have [actor.Custom('GetTheir')] debate."
 cotc_no_confidence_events.305.b: "Let [actor.Custom('GetThem')] argue with [actor.Custom('GetThemself')]."
 cotc_no_confidence_events.306.desc: "[opponent.GetFullName] has accepted your call for a debate on [opponent.Custom('GetTheir')] leadership. You don't have to go through with it, but backing out now would you make you look weak."
 cotc_no_confidence_events.306.a: "I said I wanted a debate and I'm going to do it."
 cotc_no_confidence_events.306.b: "On second thought, maybe not."
