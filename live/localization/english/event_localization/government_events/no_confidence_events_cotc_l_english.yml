 cotc_no_confidence_events.308.desc.supports_actor_opposed: "In a debate before [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')], [actor.GetFullName] savagely attacked [opponent.GetFullNamePossessive] qualifications as a leader, exposing [opponent.Custom('GetThem')] as, in [actor.Custom('GetTheir')] words, \"[opponent.Custom('GetBadDiplomacyInsult')]\". It is clear that [actor.GetDynastyHouseName] is more qualified."
 cotc_no_confidence_events.308.desc.supports_actor_unopposed: "In a speech before [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')], [actor.GetFullName] savagely attacked [opponent.GetFullNamePossessive] qualifications as a leader, exposing [opponent.Custom('GetThem')] as, in [actor.Custom('GetTheir')] words, \"[opponent.Custom('GetBadDiplomacyInsult')]\". It is clear that [actor.GetDynastyHouseName] is more qualified."
 cotc_no_confidence_events.308.desc.supports_opponent_opposed: "In a debate before [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')], [actor.GetFullName] savagely attacked [opponent.GetFullNamePossessive] qualifications as a leader, exposing [opponent.Custom('GetThem')] as, in [actor.Custom('GetTheir')] words, \"[opponent.Custom('GetBadDiplomacyInsult')]\". You have been a staunch supporter of [opponent.GetDynastyHouseName], but it seems clear that [actor.GetDynastyHouseName] is more qualified."
