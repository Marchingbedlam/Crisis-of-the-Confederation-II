 cotc_no_confidence_events.307.desc.opponent_refused: "[opponent.GetFullName] has ignored your challenge to a leadership debate, leaving you to argue unopposed before [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')]. You could back down now, but doing so would make you look extremely weak."
 cotc_no_confidence_events.307.desc.opponent_absent: "As [opponent.GetFullName] is not present, [opponent.Custom('GetThey')] cannot respond to your call for a leadership debate, leaving you to argue unopposed before [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')]. You could back down now, but doing so would make you look extremely weak."
