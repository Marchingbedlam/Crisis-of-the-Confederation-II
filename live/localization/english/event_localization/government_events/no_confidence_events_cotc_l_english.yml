l_english:
 cotc_no_confidence_events.100.desc: "[host.GetFullName] has called for a vote of no confidence in the leadership of [activity.MakeScope.Var('incumbent').Char.GetFullName], and [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')] has convened. If a majority of [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] vote for the motion, [host.GetFullName] will replace [activity.MakeScope.Var('incumbent').Char.GetFullName] as [activity.MakeScope.Var('ruler').Char.GetDiarchTitle]. How do you plan to vote?"
 cotc_no_confidence_events.100.a: "Support [host.GetFullName]."
 vote_for_challenger_desc: "You declare your support for the challenger, [activity.MakeScope.Var('incumbent').Char.GetShortUIName]."
 cotc_no_confidence_events.100.votes_for_challenger.tt: "[voter.GetFullName] Supports [host.GetShortUIName|U]"
 cotc_no_confidence_events.100.votes_for_challenger.desc: "[voter.GetFullName] declared [voter.Custom('GetTheir')] support for [host.GetShortUINamePossessive] vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetShortUIName]."
 voted_for_challenger_title: "#P [voter.GetShortUIName|U] Supported [host.GetShortUIName|U]#!"
 voted_for_challenger_intent_desc: "[voter.GetFullName] declared [voter.Custom('GetTheir')] support for [host.GetShortUINamePossessive] vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetShortUIName] in order to [voter.Custom('GetLegislativeIntent')]."
 cotc_no_confidence_events.100.b: "Support [activity.MakeScope.Var('incumbent').Char.GetFullName]."
 vote_for_incumbent_desc: "You declare your support for the incumbent, [activity.MakeScope.Var('incumbent').Char.GetShortUIName]."
 cotc_no_confidence_events.100.votes_for_incumbent.tt: "[voter.GetFullName] Supports [activity.MakeScope.Var('incumbent').Char.GetShortUIName|U]"
 cotc_no_confidence_events.100.votes_for_incumbent.desc: "[voter.GetFullName] declared [voter.Custom('GetTheir')] opposition to [host.GetShortUINamePossessive] vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetShortUIName]."
 voted_for_incumbent_title: "#N [voter.GetShortUIName|U] Supported [activity.MakeScope.Var('incumbent').Char.GetShortUIName|U]#!"
 voted_for_incumbent_intent_desc: "[voter.GetFullName] declared [voter.Custom('GetTheir')] opposition to [host.GetShortUINamePossessive] vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetShortUIName] in order to [voter.Custom('GetLegislativeIntent')]."
 cotc_no_confidence_events.100.c: "Remain undecided for now."
 remain_undecided_desc: "You remain undecided."
 cotc_no_confidence_events.100.is_undecided.tt: "[voter.GetFullName] Abstains"
 cotc_no_confidence_events.100.is_undecided.desc: "[voter.GetFullName] chose to remain undecided on [host.GetShortUINamePossessive] motion of no confidence."
 
 cotc_no_confidence_events.110.desc: "[activity.MakeScope.Var('challenger').Char.GetFullName] has called for a vote of no confidence in your leadership, and [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')] has convened to vote on it. So far, [activity.MakeScope.ScriptValue('total_bill_supporters')] [activity.Custom('SenatorsSupport')] the motion, [activity.MakeScope.ScriptValue('total_bill_opponents')] [activity.Custom('SenatorsOpposeNoName')] it, and [activity.MakeScope.ScriptValue('total_undecideds')] [activity.Custom('SenatorsUndecidedNoName')]. As [ROOT.Liege.GetDiarchTitle], is your pregorative to set the date for the final vote."
 cotc_no_confidence_events.110.a: "Set the vote for one month from now."
 cotc_no_confidence_events.110.b: "Set the vote for two months from now."
 cotc_no_confidence_events.110.c: "Set the vote for three months from now."
 cotc_no_confidence_events.115.desc: "You have called for a vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetFullNamePossessive] leadership, and [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')] has convened to vote on it. So far, [activity.MakeScope.ScriptValue('total_bill_supporters')] [activity.Custom('SenatorsSupport')] the motion, [activity.MakeScope.ScriptValue('total_bill_opponents')] [activity.Custom('SenatorsOpposeNoName')] it, and [activity.MakeScope.ScriptValue('total_undecideds')] [activity.Custom('SenatorsUndecidedNoName')].\n\n[activity.MakeScope.Var('incumbent').Char.GetDynastyHouseName] has chosen to attend the proceedings personally, and has used [activity.MakeScope.Var('incumbent').Char.Custom('GetTheir')] prerogative to set the date of the vote [activity.GetEstimatedProgressPhaseDate.GetTimeToDate] from now."
 cotc_no_confidence_events.115.a: "Let the debate begin."
 cotc_no_confidence_events.120.desc: "You have called for a vote of no confidence in [activity.MakeScope.Var('incumbent').Char.GetFullNamePossessive] leadership, and [activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')] has convened to vote on it. So far, [activity.MakeScope.ScriptValue('total_bill_supporters')] [activity.Custom('SenatorsSupport')] the motion, [activity.MakeScope.ScriptValue('total_bill_opponents')] [activity.Custom('SenatorsOpposeNoName')] it, and [activity.MakeScope.ScriptValue('total_undecideds')] [activity.Custom('SenatorsUndecidedNoName')]. Since [activity.MakeScope.Var('incumbent').Char.Custom('GetFullPersonalName')] has declined to attend the proceedings, you have the right to determine the date of the final vote."
 
 cotc_no_confidence_events.210.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has passed your motion of no confidence in [incumbent.GetFullNamePossessive] leadership by a vote of [final_supporters] - [final_opponents] in favor. You will now take [incumbent.Custom('GetTheir')] place as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]."
 cotc_no_confidence_events.210.a: "It's time there were some changes around here."
 cotc_no_confidence_events.211.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has passed [challenger.GetFullNamePossessive] motion of no confidence in your leadership by a vote of [final_supporters] - [final_opponents] in favor. [challenger.Custom('GetThey')|U] will now take your place as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]."
 cotc_no_confidence_events.211.a: "[challenger.Custom('GetThey')|U]'ll regret this!"
 cotc_no_confidence_events.211.b: "I suppose my time was up anyway."
 cotc_no_confidence_events.212.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has passed [challenger.GetFullNamePossessive] motion of no confidence in [incumbent.GetFullNamePossessive] leadership by a vote of [final_supporters] - [final_opponents] in favor. [challenger.GetDynastyHouseName] will take [incumbent.GetDynastyHouseNamePossessive] place as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]."
 cotc_no_confidence_events.212.a: "A much-needed change in leadership."
 cotc_no_confidence_events.213.a: "This will be a disaster for the [title.GetTierAsName]."
 cotc_no_confidence_events.214.a: "We'll have to see where this goes."
 cotc_no_confidence_events.215.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has rejected your motion of no confidence in [incumbent.GetFullNamePossessive] leadership by a vote of [final_opponents] - [final_supporters] against. [incumbent.Custom('GetThey')|U] will continue to serve as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]."
cotc_no_confidence_events.215.a: "Blind fools."
cotc_no_confidence_events.216.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has rejected [challenger.GetFullNamePossessive] motion of no confidence in your leadership by a vote of [final_opponents] - [final_supporters] against. You will continue to serve as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]." 
cotc_no_confidence_events.216.a: "A disaster narrowly averted."
cotc_no_confidence_events.217.desc: "The final vote is in - [title.Custom('GetDefinitiveLegislatureName')] has rejected [challenger.GetFullNamePossessive] motion of no confidence in [incumbent.GetFullNamePossessive] leadership by a vote of [final_opponents] - [final_supporters] against. [incumbent.Custom('GetThey')|U] will continue to serve as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName]."
cotc_no_confidence_events.217.a: "Do people really want more of this?"
cotc_no_confidence_events.218.a: "A disaster narrowly averted."
cotc_no_confidence_events.219.a: "Back to business as usual, then."
cotc_no_confidence_events.220.desc: "Scandal! Treachery! Behind your back, [title.Custom('GetDefinitiveLegislatureName')] has passed a motion of no confidence in your leadership. By a vote of [final_supporters] - [final_opponents] in favor, they have voted to replace you as the [ruler.GetDiarchTitle] of [title.GetDefinitiveName] with [challenger.GetFullName]."
cotc_no_confidence_events.221.desc: "To your immense satisfaction, [title.Custom('GetDefinitiveLegislatureName')] has rejected [challenger.GetFullNamePossessive] pathetic attempt to unseat you, by a vote of [final_opponents] - [final_supporters] against."
cotc_no_confidence_events.221.a: "Now perhaps they can do something important."
 
 cotc_no_confidence_events.300.desc.challenger_winning: "[activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')|U] seems likely to vote in favor of your motion of no confidence in [opponent.GetFullName], but it never hurts to be thorough. Perhaps you could challenge [opponent.Custom('GetThem')] to a debate, or find some way to smear [opponent.Custom('GetThem')]."
 cotc_no_confidence_events.300.desc.challenger_losing: "[activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')|U] seems likely to vote against your motion of no confidence in [opponent.GetFullName] - you need to find some way to swing the scales. Perhaps you could challenge [opponent.Custom('GetThem')] to a debate, or find some way to smear [opponent.Custom('GetThem')]."
 cotc_no_confidence_events.300.desc.incumbent_winning: "[activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')|U] seems likely to vote against [opponent.GetFullNamePossessive] motion of no confidence in you, but it never hurts to be thorough. Perhaps you could challenge [opponent.Custom('GetThem')] to a debate, or find some way to smear [opponent.Custom('GetThem')]."
 cotc_no_confidence_events.300.desc.incumbent_losing: "[activity.MakeScope.Var('title').Title.Custom('GetDefinitiveLegislatureName')|U] seems likely to vote in favor of [opponent.GetFullNamePossessive] motion of no confidence in you - you need to find some way to swing the scales. Perhaps you could challenge [opponent.Custom('GetThem')] to a debate, or find some way to smear [opponent.Custom('GetThem')]."
 cotc_no_confidence_events.300.a: "Attack [opponent.Custom('GetTheir')] leadership skills."
 cotc_no_confidence_events.300.cares_about_qualifications_desc: "[activity.MakeScope.ScriptValue('total_legislators_that_care_about_qualifications')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about qualifications, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_qualifications')] [activity.Custom('SenatorsSupportNoNameQualifications')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_qualifications')] [activity.Custom('SenatorsOpposeNoNameQualifications')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_qualifications')] [activity.Custom('SenatorsUndecidedNoNameQualifications')]."
 cotc_no_confidence_events.300.b: "Argue that [opponent.Custom('GetThem')] cannot pay off the [activity.MakeScope.Var('title').GetTierAsNamePossessive] debt."
 cotc_no_confidence_events.300.c: "Challenge [opponent.Custom('GetThem')] to a debate about the war."
 cotc_no_confidence_events.300.d: "Attack [opponent.Custom('GetTheir')] credibility as a good [opponent.GetFaith.GetAdherentName]."
 cotc_no_confidence_events.300.cares_about_purity_desc: "[activity.MakeScope.ScriptValue('total_legislators_that_care_about_purity')] [actor.GetFaith.GetAdjective] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about ideology, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_purity')] [activity.Custom('SenatorsSupportNoNamePurity')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_purity')] [activity.Custom('SenatorsOpposeNoNamePurity')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_purity')] [activity.Custom('SenatorsUndecidedNoNamePurity')]."
 cotc_no_confidence_events.300.e: "Denounce [opponent.GetFaith.GetName] and promote [actor.GetFaith.GetName]."
 cotc_no_confidence_events.300.cares_about_ideology_desc: "[activity.MakeScope.ScriptValue('total_legislators_that_care_about_ideology')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about ideology, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_ideology')] [activity.Custom('SenatorsSupportNoNameIdeology')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_ideology')] [activity.Custom('SenatorsOpposeNoNameIdeology')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_ideology')] [activity.Custom('SenatorsUndecidedNoNameIdeology')]."
 cotc_no_confidence_events.300.f: "Condemn [opponent.Custom('GetThem')] as a self-serving traitor unloyal to the [activity.MakeScope.Var('ruler').Char.GetTitleAsName]."
 cotc_no_confidence_events.300.cares_about_loyalty_desc: "[activity.MakeScope.ScriptValue('total_legislators_that_care_about_loyalty')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about loyalty, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_loyalty')] [activity.Custom('SenatorsSupportNoNameLoyalty')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_loyalty')] [activity.Custom('SenatorsOpposeNoNameLoyalty')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_loyalty')] [activity.Custom('SenatorsUndecidedNoNameLoyalty')]."
 cotc_no_confidence_events.300.g: "Condemn [opponent.Custom('GetThem')] as a vile tyrant."
 cotc_no_confidence_events.300.cares_about_ethics_desc: "[activity.MakeScope.ScriptValue('total_legislators_that_care_about_ethics')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about ethics, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_ethics')] [activity.Custom('SenatorsSupportNoNameEthics')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_ethics')] [activity.Custom('SenatorsOpposeNoNameEthics')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_ethics')] [activity.Custom('SenatorsUndecidedNoNameEthics')]."
 cotc_no_confidence_events.300.h: "Condemn [opponent.Custom('GetThem')] as a [opponent.Custom('GetCrime')]."
 cotc_no_confidence_events.300.cares_about_known_crime_desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] who care about ethics and consider [opponent.GetShortUIName] to be a criminal will consider changing their vote.\n$EFFECT_LIST_BULLET$[activity.MakeScope.ScriptValue('total_legislators_that_care_about_known_crime')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about ethics and consider [opponent.GetShortUIName] to be a criminal, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_known_crime')] [activity.Custom('SenatorsSupportNoNameKnownCrime')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_known_crime')] [activity.Custom('SenatorsOpposeNoNameKnownCrime')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_known_crime')] [activity.Custom('SenatorsUndecidedNoNameKnownCrime')]."
 cotc_no_confidence_events.300.i: "Reveal that [opponent.Custom('GetThey')] [criminal_secret.Custom('SecretDescriptionThirdPerson')]."
 cotc_no_confidence_events.300.cares_about_secret_crime_desc: "[activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] who care about ethics and consider [criminal_secret.GetName] to be unethical will consider changing their vote.\n$EFFECT_LIST_BULLET$[activity.MakeScope.ScriptValue('total_legislators_that_care_about_secret_crime')] [activity.MakeScope.Var('title').Title.Custom('GetLegislatorNamePlural')] care about ehtics and consider [criminal_secret.GetName] to be unethical, of whom [activity.MakeScope.ScriptValue('total_supporters_that_care_about_secret_crime')] [activity.Custom('SenatorsSupportNoNameSecretCrime')] [activity.MakeScope.Var('challenger').Char.GetShortUIName], [activity.MakeScope.ScriptValue('total_opponents_that_care_about_secret_crime')] [activity.Custom('SenatorsOpposeNoNameSecretCrime')] [activity.MakeScope.Var('incumbent').Char.GetShortUIName], and [activity.MakeScope.ScriptValue('total_undecideds_that_care_about_secret_crime')] [activity.Custom('SenatorsUndecidedNoNameSecretCrime')]."
 cotc_no_confidence_events.300.j: "Slander [opponent.Custom('GetThem')] as vaguely corrupt and unethical, regardless of facts."
 cotc_no_confidence_events.300.k: "Do nothing for now."
 
