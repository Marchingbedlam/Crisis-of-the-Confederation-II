l_english:
 cotc_cloning_events.100.title.my_clone: "My Clone"
 cotc_cloning_events.100.title.other: "Clone Decanted"
 cotc_cloning_events.100.desc.double_donor.first_donor: "You've waited for months, but at last the gestation period is finished, and you hold an infant [clone.Custom('GetChild')] in your hands, a child created from the intermixing of [second_donor.Custom('GetBestName')]'s DNA and your own.\n\n"
 cotc_cloning_events.100.desc.double_donor.second_donor: "You've waited for months, but at last the gestation period is finished, and you hold an infant [clone.Custom('GetChild')] in your hands, a child created from the intermixing of [first_donor.Custom('GetBestName')]'s DNA and your own.\n\n"
 cotc_cloning_events.100.desc.double_donor.third_party: "It's taken some time, but the gestation period has ended, and the clone in your possession has finally been decanted. It is an infant [clone.Custom('GetChild')] that already shows traits from both [clone.Custom('GetTheir')] donors - [first_donor.Custom('GetBestName')] and [second_donor.Custom('GetBestName')], but it under your care that [clone.Custom('GetChild')] will grow up.\n\n"
 cotc_cloning_events.100.desc.single_donor.first_donor: "You've waited for months, but at last the gestation period is finished, and you hold an infant [clone.Custom('GetChild')] in your hands. It is like looking into a window into the past, at your own face from years gone by.\n\n"
 cotc_cloning_events.100.desc.single_donor.third_party: "It's taken some time, but the gestation period has ended, and the clone in your possession has finally been decanted. It is an infant [clone.Custom('GetChild')] that already shows [clone.Custom('GetTheir')] resemblance to [first_donor.Custom('GetBestName')], but it under your care that [clone.Custom('GetChild')] will grow up.\n\n"
 cotc_cloning_events.100.desc.monarch_heir: "Some day, [clone.Custom('GetThey')] will carry on your legacy. What name would befit the future ruler of [monarch_title.GetNameNoTier]?"
 cotc_cloning_events.100.desc.leader_heir: "Some day, [clone.Custom('GetThey')] will carry on your legacy. What name would befit the future ruler of [leader_title.GetNameNoTier]?"
 cotc_cloning_events.100.desc.not_heir: "Who will this child become, and what will you call [clone.Custom('GetThem')]?"
 cotc_cloning_events.100.a: "A good name!"
 
 cotc_cloning_events.101.desc: "[decanter.Custom('GetBestName')] has decanted the clone the two of you commissioned together, a baby [clone.Custom('GetChild')] who now shares a mix of both of your genetic material. [decanter.Custom('GetThey')|U] [decanter.Custom('GetHave')] named the [clone.Custom('GetChild')] \"[clone.GetFirstName]\"."
 cotc_cloning_events.101.a: "Wonderful!"
 
 cotc_cloning_events.102.desc: "Incredibly, your clone - your own flesh and blood - has reached viability while still in the clutches of [decanter.Custom('GetBestName')]. [decanter.Custom('GetThey')|U] [decanter.Custom('GetHave')] decanted your clone and given [clone.Custom('GetThem')] the name [clone.GetFirstName]."
 cotc_cloning_events.102.a: "How dare [decanter.Custom('GetThey')]?"