l_english:
 cotc_research_project_events.title: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]"
 cotc_research_project_events.1.intro.theory: "You have decided to commission a new investigation into the theory of [research_subject.GetName]. "
 cotc_research_project_events.1.intro.praxis: "You have decided to commission a new study on the hypothetical practice of [research_subject.GetName]. "
 cotc_research_project_events.1.intro.engineering: "You have decided to commission a new project aimed at developing viable [research_subject.GetName]. "
 cotc_research_project_events.1.desc.military_war: "This is a serious issue that holds great significance for the [ROOT.Char.GetPrimaryTitle.GetAdjective] military - success could easily give you an edge over the [enemy.GetPrimaryTitle.GetName].\n\n"
 cotc_research_project_events.1.desc.military_peace: "This is a serious issue that holds great significance for the [ROOT.Char.GetPrimaryTitle.GetAdjective] military - success could easily give you an edge over your rivals.\n\n"
 cotc_research_project_events.1.desc.social: "If the project is a success, it could have enormous implications for [ROOT.Char.GetPrimaryTitle.GetAdjective] society.\n\n"
 cotc_research_project_events.1.desc.economic: "Success would bring great benefits to the [ROOT.Char.GetPrimaryTitle.GetAdjective] economy and assure prosperity for years to come.\n\n"
 cotc_research_project_events.1.desc.transhumanist: "It will be a great undertaking, with the potential to change what it even means to be human.\n\n"
 cotc_research_project_events.1.desc.other: "Should you succeed, it will shape the future of humanity for years to come.\n\n"
 cotc_research_project_events.1.outro.war: "The only concern is security. If the project is conducted in the open, it will be easy to draw in researchers looking for fame and fortune - but your activities will also be openly exposed to [enemy.GetPrimaryTitle.GetAdjective] spies. Perhaps secrecy would be better advised."
 cotc_research_project_events.1.outro.peace: "There is only the matter of security. If the project is conducted in the open, it will be easy to draw in researchers looking for fame and fortune, but your activities will also be more exposed to potential rivals. Perhaps secrecy would be better advised."
 cotc_research_project_events.1.a: "We will do our research in the open."
 cotc_research_project_events.1.tt: ""
 cotc_research_project_events.1.a.tt: "You will start a new [research_project_cotc|E] researching [research_subject.GetName]"
 cotc_research_project_events.1.b: "This project must remain top secret."
 cotc_research_project_events.1.b.tt: "You will start a new @scheme_secrecy_icon![secret_scheme_single|E] [research_project_cotc|E] researching [research_subject.GetName]"
 cotc_research_project_events.1.c: "On second thought, maybe we don't need this project at all."
 
 cotc_research_project_events.2.desc: "Work now officially begins on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], your new [scheme.Custom('GetResearchProjectSecrecy')] [scheme.Custom('GetResearchProjectType')] [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName]. The only remaining issue is the question of funding. The more you invest in the project, the more experts you will be able to bring on board it." 
 cotc_research_project_events.2.a: "Pay just the bare minimum."
 cotc_research_project_events.2.a.tt: "You will be able to recruit #P 2#! [agents|E]"
 cotc_research_project_events.2.b: "Make a modest investment."
 cotc_research_project_events.2.b.tt: "You will be able to recruit #P 3#! [agents|E]"
 cotc_research_project_events.2.c: "Make a significant investment."
 cotc_research_project_events.2.c.tt: "You will be able to recruit #P 4#! [agents|E]"
 cotc_research_project_events.2.d: "Make an enormous investment."
 cotc_research_project_events.2.d.tt: "You will be able to recruit #P 5#! [agents|E]"
 
 cotc_research_project_events.10.desc.intro: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], your [scheme.Custom('GetResearchProjectSecrecy')] [scheme.Custom('GetResearchProjectType')] [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName], is finally complete. "
 cotc_research_project_events.10.desc.first_ever_discovery_with_team: "Your team has accomplished a monumental feat, pushing forward the sum total of all human knowledge, and their work will surely bring great benefits to the [ROOT.GetPrimaryTitle.GetName]."
 cotc_research_project_events.10.desc.first_ever_discovery_no_team: "Incredibly, despite the burdens of your office, you were able to complete the project entirely on your own, singlehandedly pushing back the boundaries of human knowledge and ensuring a brighter future for the [ROOT.GetPrimaryTitle.GetName]."
 cotc_research_project_events.10.desc.first_culture_discovery_with_team: "Your team has made great strides for the [ROOT.GetPrimaryTitle.GetName], discovering things previously unknown to the [ROOT.GetCapitalLocation.GetCounty.GetCulture.GetAdjective] people."
 cotc_research_project_events.10.desc.first_culture_discovery_no_team: "Incredibly, despite the burdens of your office, you were able to complete the project entirely on your own, discovering things previously unknown to the [ROOT.GetCapitalLocation.GetCounty.GetCulture.GetAdjective] people."
 cotc_research_project_events.10.desc.no_team: "Incredibly, despite the burdens of your office, you were able to complete the project entirely on your own."
 cotc_research_project_events.10.a: "A job well done."
 cotc_research_project_events.11.desc.first_ever_discovery: "At last, your work on [patron.Custom('GetBestNameNoState')]'s [discovered_innovation.GetName] research project is complete! This completely unprecedented achievement will surely make your name famous in the academic community, and of course the [patron.GetTierAsNameNoTooltip] has made sure that you are generously compensated for your services."
 cotc_research_project_events.11.desc.first_culture_discovery: "At last, your work on [patron.Custom('GetBestNameNoState')]'s [discovered_innovation.GetName] research project is complete! This achievement will surely make your name famous in the academic community, at least in [patron.GetCapitalLocation.GetCounty.GetCulture.GetAdjective] space, and of course the [patron.GetTierAsNameNoTooltip] has made sure that you are generously compensated for your services."
 cotc_research_project_events.11.desc: "At last, your work on [patron.Custom('GetBestNameNoState')]'s [discovered_innovation.GetName] research project is complete! This achievement will surely make your name better known in the academic community, and of course the [patron.GetTierAsNameNoTooltip] has made sure that you are generously compensated for your services."
 cotc_research_project_events.11.a: "A job well done."
 
 cotc_research_project_events.20.desc: "With the loss of your worlds and titles, you have lost access to the resources you once had, and Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] has come to an ignominous end."
 cotc_research_project_events.20.a: "Wonderful, more bad news."
 cotc_research_project_events.21.desc: "With the fall of [patron.Custom('GetBestNameNoState')], [patron.Custom('GetTheir')] research project is no longer funded and has come an end. It would appear you are out of a job."
 cotc_research_project_events.21.a: "I have more important things to do, anyway."
 
 cotc_research_project_events.30.desc: "By whatever twist of fate, the people of [ROOT.GetCapitalLocation.GetCounty.GetNameNoTier] appear to have discovered [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName] all on their own. Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] no longer serves any useful purpose, and has been shuttered."
 cotc_research_project_events.30.a: "A complete waste of time and money."
 cotc_research_project_events.31.desc: "You have just received word that your work on [research_subject.GetName] for [patron.Custom('GetBestNameNoState')] has been deemed obsolete - it appears that someone else has beaten you to the punch. The project has been shuttered, and you will not receive any further pay."
 cotc_research_project_events.31.a: "What a colossal waste of my time."
 
 cotc_research_project_events.40.desc: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] has come to an unceremonious and inconclusive end."
 cotc_research_project_events.40.a: "A complete waste of time and money."
 cotc_research_project_events.41.desc: "You have just received word that your work on [research_subject.GetName] for [patron.Custom('GetBestNameNoState')] is over, as the project has come to an unceremonious and inconclusive end."
 cotc_research_project_events.41.a: "What a colossal waste of my time."
 
 cotc_research_project_events.50.desc: "Among the many other issues caused by the death of your predecessor, [old_project_patron.Custom('GetBestNameNoState')], there is the matter of Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], [old_project_patron.Custom('GetTheir')] [scheme.Custom('GetResearchProjectType')] [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName]. [old_project_patron.Custom('GetTheir')|U] death has disrupted the project somewhat, but not to the point of derailing it entirely. Research will continue as long as you are interesting in continuing it."
 cotc_research_project_events.50.a: "I see."
 cotc_research_project_events.51.desc: "The death of [old_project_patron.Custom('GetBestNameNoState')] has caused significant disruption to the progress of Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], but has not derailed it entirely. You have been asked to continue on in your current role on the project.
 cotc_research_project_events.51.a: "I see."
 
 cotc_research_project_events.60.desc: "Among the many other issues caused by your taking over [title.GetDefinitiveName], there is the matter of Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], your predecessor's [scheme.Custom('GetResearchProjectType')] [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName]. The change of power has disrupted the project somewhat, but not to the point of derailing it entirely. Research will continue as long as you are interesting in continuing it."
 cotc_research_project_events.60.a: "I see."
 cotc_research_project_events.61.desc: "The transfer of power from [old_project_patron.Custom('GetBestNameNoState')] to [owner.Custom('GetBestNameNoState')] has caused significant disruption to the progress of Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], but has not derailed it entirely. You have been asked to continue on in your current role on the project.
 cotc_research_project_events.61.a: "I see."
 cotc_research_project_events.62.desc: "The transfer of [title.GetDefinitiveName] has left you without the resources or authority to continue Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]. However, while the transfer of power has disrupted the project, it has not derailed it entirely, and your successor, [owner.Custom('GetBestNameNoState')] will be able to continue it."
 cotc_research_project_events.62.a: "I see."
 
 cotc_research_project_events.70.desc: "Information security on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] has become a joke. The project is ostensibly supposed to be top secret, but there have been so many security breaches that it is now known to virtually everyone. There is no longer any point in trying to maintain the charade of secrecy."
 cotc_research_project_events.70.a: "We'll continue our research in the open."
 cotc_research_project_events.70.b: "That's it for the project, then."
 
 cotc_research_project_events.100.desc: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] aims to bring [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName] to [owner.GetCapitalLocation.GetCounty.GetDefinitiveName]."
 cotc_research_project_events.100.a: "Increase Funding"
 project_slots_maxed.tt: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] already has 5 [agent|E] Slots"
 cotc_research_project_events.100.a.tt: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] gains #P 1#! [agent|E] Slot"
 cotc_research_project_events.100.b: "Devote Yourself to Research"
 cotc_research_project_events.100.c: "Withdraw From Research"
 cotc_research_project_events.100.d: "Go Public"
 cotc_research_project_events.100.d.tt: "Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] will no longer use [secrecy|E]"
 cotc_research_project_events.100.e: "Close"
 cotc_research_project_events.102.desc: "[owner.Custom('GetBestNameNoState')] has chosen to end the security precautions around Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] and take the project public. As such, there is no longer any need for your services - you have been dismissed to make room for more actual researchers."
 cotc_research_project_events.102.a: "We'll see how that works out for them."
 cotc_research_project_events.103.desc: "[owner.Custom('GetBestNameNoState')] has chosen to end the security precautions around Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] and take the project public."
 cotc_research_project_events.103.a: "We'll see how that works out."
 
 cotc_research_project_events.200.desc: "When [owner.Custom('GetBestNameNoState')] brought you on board as a researcher for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], you assumed that [owner.Custom('GetThey')] somehow knew about your previous work on [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName], but to your surprise, it appears that [owner.Custom('GetThey')] [owner.Custom('GetHave')] no clue about your expertise in the field. If you were to let [owner.Custom('GetThem')] know, you could greatly accelerate the project's progress."
 cotc_research_project_events.200.a: "I'll inform [owner.Custom('GetThem')] at once."
 cotc_research_project_events.200.b: "No, I need to keep my previous work a secret."
 cotc_research_project_events.201.desc: "When you brought [researcher.Custom('GetBestNameNoState')] on board Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] as a researcher, you did so simply because you had trust in [researcher.Custom('GetTheir')] skills and abilities. Now, however, [researcher.Custom('GetThey')] [researcher.Custom('GetHave')] revealed to you that someone else beat you to it - [researcher.Custom('GetThey')] [researcher.Custom('GetHave')] already worked on a successful project researching [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName], and [researcher.Custom('GetBePresentContraction')] willing to put that knowledge and experience to work in your service."
 cotc_research_project_events.201.a: "Excellent news!"
 
 cotc_research_project_events.210.desc: "You increasingly find work on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] to be a pleasant and enjoyable experience, not just because of the work itself, but because of some of your coworkers. You've found that you particularly enjoy [second_researcher.Custom('GetBestNameNoState')]'s company, and that you do your best work when working alongside [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.210.a: "Propose that the two of you collaborate more often."
 cotc_research_project_events.210.b: "Just silently enjoy [second_researcher.Custom('GetTheir')] presence."
 cotc_research_project_events.211.desc: "[first_researcher.Custom('GetBestNameNoState')], one of your coworkers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], seems to enjoy working with you, and has proposed that the two of you work together more closely and more often."
 cotc_research_project_events.211.a: "Sounds good to me."
 cotc_research_project_events.211.a.owner.title: "Researcher Collaboration"
 cotc_research_project_events.211.a.owner.desc: "[first_researcher.GetShortUIName] and [second_researcher.GetShortUIName] are working well together on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.211.a.response.title: "Collaboration Accepted"
 cotc_research_project_events.211.a.response.desc: "[second_researcher.GetShortUIName] accepted [first_researcher.GetShortUINamePossessive] offer to collaborate."
 cotc_research_project_events.211.b: "I'd prefer not to."
 cotc_research_project_events.211.b.response.title: "Collaboration Declined"
 cotc_research_project_events.211.b.response.desc: "[second_researcher.GetShortUIName] declined [first_researcher.GetShortUINamePossessive] offer to collaborate."
 
 cotc_research_project_events.220.intro: "Work on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] is becoming increasingly difficult, and not because of the work itself. It's because of [second_researcher.Custom('GetBestNameNoState')]. "
 cotc_research_project_events.220.desc.annoying: "You don't know exactly what it is, but something about [second_researcher.Custom('GetThem')] just consistently rubs you the wrong way. Working with [second_researcher.Custom('GetThem')] is such a pain."
 cotc_research_project_events.220.desc.despise: "You absolutely cannot stand [second_researcher.Custom('GetThem')]. [second_researcher.Custom('GetTheir')|U] very presence infuriates you. Actually getting anything useful done is becoming next to impossible."
 cotc_research_project_events.220.desc.grudge: "Even after all this time, you still remember what [second_researcher.Custom('GetThey')] did. You're not sure you'll ever be able to forgive [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.220.desc.rival: "Your long history of bitter mutual hatred makes working together infuriating."
 cotc_research_project_events.220.desc.evil_ideology: "Being asked to work together with a [second_researcher.GetFaith.GetAdherentName] is absolutely insufferable."
 cotc_research_project_events.220.desc.bad_learning: "[second_researcher.Custom('GetThey')|U] [second_researcher.Custom('GetDo')]n't have the slightest clue what [second_researcher.Custom('GetBePresentContraction')] doing. [second_researcher.Custom('GetTheir')|U] knowledge of even the most basic theory is practically nonexistent. [second_researcher.Custom('GetTheir')|U] 'contributions' to the project are worse than useless, they're actively harmful."
 cotc_research_project_events.220.desc.bad_martial: "[second_researcher.Custom('GetThey')|U] [second_researcher.Custom('GetDo')]n't have the slightest clue what [second_researcher.Custom('GetBePresentContraction')] doing. [second_researcher.Custom('GetThey')|U] [second_researcher.Custom('GetHave')] very obviously never been with five lightyears of a real battlefield, and [second_researcher.Custom('GetTheir')] grasp of even the most basic tactics is completely nonexistent. [second_researcher.Custom('GetTheir')|U] 'contributions' to the project are worse than useless, they're actively harmful."
 cotc_research_project_events.220.desc.bad_diplomacy: "[second_researcher.Custom('GetThey')|U] [second_researcher.Custom('GetDo')]n't have the slightest clue what [second_researcher.Custom('GetBePresentContraction')] doing. [second_researcher.Custom('GetThey')|U] treat[second_researcher.Custom('GetGenderPlural')] people like numbers and auomata, with no understanding of basic psychology or social interactions. [second_researcher.Custom('GetTheir')|U] 'contributions' to the project are worse than useless, they're actively harmful."
 cotc_research_project_events.220.desc.bad_stewardship: "[second_researcher.Custom('GetThey')|U] [second_researcher.Custom('GetDo')]n't have the slightest clue what [second_researcher.Custom('GetBePresentContraction')] doing. [second_researcher.Custom('GetThey')|U] lack[second_researcher.Custom('GetGenderPlural')] even the most cursory understanding of interplanetary economics. [second_researcher.Custom('GetTheir')|U] 'contributions' to the project are worse than useless, they're actively harmful."
 cotc_research_project_events.220.a: "I'll give [second_researcher.Custom('GetThem')] a piece of my mind."
 cotc_research_project_events.220.b: "[owner.Custom('GetBestNameNoState')] needs to do something about [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.220.c: "That's it, either [second_researcher.Custom('GetThey')] [second_researcher.Custom('GetGo')] or I go."
 cotc_research_project_events.220.d: "I just have to buckle down and bear with it."
 cotc_research_project_events.221.intro: "Your work on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] has been interrupted. One of your coworkers, [first_researcher.Custom('GetBestNameNoState')], apparently has a problem with you, calling you '[second_researcher.Custom2('InsultAdjective', SCOPE.sC('first_researcher'))] [second_researcher.Custom2('InsultNoun', SCOPE.sC('first_researcher'))] to your face. "
 cotc_research_project_events.221.desc.annoying: "It seems a bit extreme, honestly."
 cotc_research_project_events.221.desc.despise: "Of course, this hatred is nothing new, but it's making it difficult to get any work done."
 cotc_research_project_events.221.desc.grudge: "You have absolutely no clue what [first_researcher.Custom('GetTheir')] problem with you is."
 cotc_research_project_events.221.desc.rival: "You knew working with [first_researcher.Custom('GetThem')] was a terrible idea, after all the two of you have done to each other."
 cotc_research_project_events.221.desc.evil_ideology: "Apparently, [first_researcher.Custom('GetThey')] [first_researcher.Custom('GetHave')] a problem with [second_researcher.GetFaith.GetAdherentNamePlural]."
 cotc_research_project_events.221.desc.bad_learning: "Apparently, [first_researcher.Custom('GetThey')] think[first_researcher.Custom('GetGenderPlural')] you're an ignorant moron with nothing to contribute to the project."
 cotc_research_project_events.221.desc.bad_martial: "Apparently, [first_researcher.Custom('GetThey')] think[first_researcher.Custom('GetGenderPlural')] you're a cowardly, incompetent tactician with nothing to contribute to the project."
 cotc_research_project_events.221.desc.bad_diplomacy: "Apparently, [first_researcher.Custom('GetThey')] think[first_researcher.Custom('GetGenderPlural')] you know absolutely nothing about politics or psychology and have nothing to contribute to the project."
 cotc_research_project_events.221.desc.bad_stewardship: "Apparently, [first_researcher.Custom('GetThey')] think[first_researcher.Custom('GetGenderPlural')] you lack even the slightest grasp of economics and have nothing to contribute to the project."
 cotc_research_project_events.221.desc.stole_credit: "Apparently, [first_researcher.Custom('GetThey')] think[first_researcher.Custom('GetGenderPlural')] deserve[first_researcher.Custom('GetGenderPlural')] more credit for the meager contributions [first_researcher.Custom('GetThey')] made to your recent breakthrough."
 cotc_research_project_events.221.a: "If [first_researcher.Custom('GetThey')] want[first_researcher.Custom('GetGenderPlural')] a fight, [first_researcher.Custom('GetThey')]'ll get one."
 cotc_research_project_events.221.a.response.title: "Argument Provoked"
 cotc_research_project_events.221.a.response.desc: "[second_researcher.GetShortUIName] responded to your insults by starting an argument, slowing down Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.221.a.owner.title: "Argument Stalls Project"
 cotc_research_project_events.221.a.owner.desc: "[first_researcher.GetShortUIName] and [second_researcher.GetShortUIName] are arguing, slowing down Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')].
 cotc_research_project_events.221.b: "[owner.Custom('GetBestNameNoState')] will sort this out.""
 cotc_research_project_events.221.c: "Best to just ignore [first_researcher.Custom('GetThem')]."
 cotc_research_project_events.221.c.response.title: "Insult Ignored"
 cotc_research_project_events.221.c.response.desc: "[second_researcher.GetShortUIName] ignored your insults."
 cotc_research_project_events.222.intro.first_researcher: "[first_researcher.Custom('GetBestNameNoState')] has come to you with a major complaint about one of [first_researcher.Custom('GetTheir')] coworkers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], [second_researcher.Custom('GetBestNameNoState')]. Apparently, "
 cotc_research_project_events.222.intro.second_researcher: "[second_researcher.Custom('GetBestNameNoState')] has come to you with a major compalint about one of [second_researcher.Custom('GetTheir')] coworkers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], [first_researcher.Custom('GetBestNameNoState')]. Apparently, [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))] has been constantly harrassing [second_researcher.Custom('GetThem')].\n\nWhen you confront [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))], [first_researcher.Custom('GetThey')] explain[first_researcher.Custom('GetGenderPlural')] that "
 cotc_research_project_events.222.intro.already_fought: "You absolutely cannot believe this. Two of the researchers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], [first_researcher.Custom('GetBestNameNoState')] and [second_researcher.Custom('GetBestNameNoState')], have started bickering like children, putting the whole project back. A short investigation shows that it started when [first_researcher.Custom('GetContextualSingleName', SCOPE.sC('second_researcher'))] started harassing [second_researcher.Custom('GetContextualSingleName', SCOPE.sC('first_researcher'))].\n\nWhen you demand an explanation, [first_researcher.Custom('GetThey')] tell[first_researcher.Custom('GetGenderPlural')] you that "
 cotc_research_project_events.222.desc.annoying: "[first_researcher.Custom('GetThey')] 'just find[first_researcher.Custom('GetGenderPlural')] [second_researcher.Custom('GetThem')] really annoying'."
 cotc_research_project_events.222.desc.despise: "[first_researcher.Custom('GetThey')] utterly despise[first_researcher.Custom('GetGenderPlural')] [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.222.desc.grudge: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] once did [first_researcher.Custom('GetThem')] a great wrong in the past, although [first_researcher.Custom('GetThey')] refuse[first_researcher.Custom('GetGenderPlural')] to talk about the details, and [second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] has no idea what [first_researcher.Custom('GetBePresentContraction')] talking about."
 cotc_research_project_events.222.desc.rival: "the two of them have a long-standing mutual hatred, the details of which would take too long to explain."
 cotc_research_project_events.222.desc.evil_ideology: "[first_researcher.Custom('GetThey')] simply can't stand [second_researcher.GetFaith.GetAdherentNamePlural]."
 cotc_research_project_events.222.desc.bad_learning: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] is an incompetent buffoon who knows nothing about [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName] whatsoever."
 cotc_research_project_events.222.desc.bad_martial: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] is a blundering oaf whose grasp of military theory and tactics is practically nonexistent, and who is actively holding the project back."
 cotc_research_project_events.222.desc.bad_diplomacy: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] knows absolutely nothing about human psychology or society, and is actively holding the project back."
 cotc_research_project_events.222.desc.bad_stewardship: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] knows absolutely nothing about economics or industry, and is actively holding the project back."
 cotc_research_project_events.222.desc.stole_credit: "[second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))]'s recent breakthrough was actually a joint effort between the two of them, but [second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] stole the credit."
 cotc_research_project_events.222.a: "Side with [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))]."
 cotc_research_project_events.222.b: "Side with [second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))]."
 cotc_research_project_events.222.c: "Tell them to sort this out themselves."
 cotc_research_project_events.223.intro.first.first: "You take your issues with [second_researcher.Custom('GetBestNameNoState')] to [owner.Custom('GetBestNameNoState')], and lay out in detail all of your problems with [second_researcher.Custom('GetThey')]. "
 cotc_research_project_events.223.intro.first.second: "To your surprise, it appears that one of your coworkers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] has taken issue with you. [first_researcher.Custom('GetBestNameNoState')] has made several complaints about you to [owner.Custom('GetBestNameNoState')]. "
 cotc_research_project_events.223.intro.second.first: "At first you thought [second_researcher.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] was simply ignoring your insults, but it turns out that [second_researcher.Custom('GetThey')] decided to go behind your back and complain to [owner.Custom('GetBestNameNoState')]. You do your best to lay out your reasons. "
 cotc_research_project_events.223.intro.second.second: "You tell [owner.Custom('GetBestNameNoState')] about the problems [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] has been causing for you. [first_researcher.Custom('GetThey')|U] make[first_researcher.Custom('GetGenderPlural')] a pathetic attempt to justify [first_researcher.Custom('GetTheir')] provocations. "
 cotc_research_project_events.223.intro.already_fought: "Your exchange of insults has devolved into an argument that threatens to derail Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] entirely, to the point that [owner.Custom('GetBestNameNoState')] felt the need to step in personally. "
 cotc_research_project_events.223.desc.first_researcher: "Fortunately, [owner.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')] saw the light and understood that your complaints were completely valid."
 cotc_research_project_events.223.desc.second_researcher: "Unfortunately, [owner.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] apparently bought into the completely groundless accusationsn against you."
 cotc_research_project_events.223.a: "I'm glad [owner.Custom('GetThey')] made the correct decision."
 cotc_research_project_events.223.b: "How can [owner.Custom('GetThey')] be such an idiot?"
 cotc_research_project_events.223.c: "What does any of this have to do with me?"
 cotc_research_project_events.224.desc.first_researcher: "Unfortunately, [owner.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')] insisted that your complaints couldn't possibly justify your actions against [second_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')]."
 cotc_research_project_events.224.desc.second_researcher: "Fortunately, [owner.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] understood the pettiness of [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')]'s complaints."
 cotc_research_project_events.225.desc: "Ultimately, [owner.Custom2('GetContextualSingleName'), ROOT.Char] decides to dismiss both of you, insisting that your problems are none of [owner.Custom('GetTheir')] concern and that the two of you should work them out yourselves."
 cotc_research_project_events.225.a: "Some help [owner.Custom('GetThey')] [owner.Custom('GetBePast')]."
 cotc_research_project_events.225.b: "At least [owner.Custom('GetThey')] understand[owner.Custom('GetGenderPlural')] how petty this is."
 cotc_research_project_events.225.c: "Well, [owner.Custom('GetThey')] [owner.Custom('GetDo')] have a point..."
 cotc_research_project_events.226.intro: "[first_researcher.Custom('GetBestNameNoState')], one of your researchers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], has come to you with an ultimatum. 'I've had it up to here with [second_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')],' [first_researcher.Custom('GetThey')] say[first_researcher.Custom('GetGenderPlural')], 'I refuse to work with [second_researcher.Custom('GetThem')] a day longer. Either [second_researcher.Custom('GetThey')] [second_researcher.Custom('GetGo')], or I go.'\n\nWhen you ask for an explanation, [first_researcher.Custom('GetThey')] tell[first_researcher.Custom('GetGenderPlural')] you that "
 cotc_research_project_events.226.a: "Fine. [second_researcher.Custom('GetBePresentContraction')|U] off the project."
 cotc_research_project_events.226.b: "If it's you or [second_researcher.Custom('GetThem')], I choose [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.227.intro: "[first_researcher.Custom('GetBestNameNoState')], one of your coworkers on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], has approached the project's sponsor, [owner.Custom('GetBestNameNoState')], with an ultimatum. Apparently, [first_researcher.Custom('GetThey')] find[first_researcher.Custom('GetGenderPlural')] working with you so utterly agonizing that [first_researcher.Custom('GetThey')] refuse[first_researcher.Custom('GetGenderPlural')] to do it a moment longer - either you go, or [first_researcher.Custom('GetThey')] [first_researcher.Custom('GetGo')].\n\n"
 cotc_research_project_events.227.first_researcher: "[owner.Custom('GetBestNameNoState')] has wisely accepted your ultimatum, and dismissed [second_researcher.Custom('GetBestNameNoState')] from Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.227.second_researcher: "Unfortunately, [owner.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] accepted [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('owner'))]'s demand, and has permanently dismissed you from the project."
 cotc_research_project_events.227.a: "Well, that's certainly a relief."
 cotc_research_project_events.227.b: "It was a pointless endeavor anyway."
 cotc_research_project_events.227.c: "Why am I seeing this event? Something is bugged."
 cotc_research_project_events.228.first_researcher: "Unfortunately, [owner.Custom('GetBestNameNoState')] has rejected your ultimatum, and dismissed you from Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.228.second_researcher: "Fortunately, [owner.Custom2('GetContextualSingleName', SCOPE.sC('first_researcher'))] wisely rejected [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('owner'))]'s demand, and has permanently dismissed [first_researcher.Custom('GetThem')] from the project."
 
 cotc_research_project_events.230.desc.weapon_misfire: "You are working in the engineering lab on a new prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], when suddenly the weapon discharges, right as you are caught in the testfire zone!\n\nYou survive the accident, and the damage to the lab is limited, but you are gravely injured."
 cotc_research_project_events.230.desc.reactor_explosion: "You are working in the engeering lab on a new prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], when suddenly the prototype overloads! The safeties prevent a complete disaster, but the explosion still sends you flying across the lab.\n\nYou survive the accident, and the damage to the lab is limited, but you are gravely injured."
 cotc_research_project_events.230.desc: "You are working in the engineering lab on a new prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], when suddenly the prototype malfunctions!\n\nYou survive the accident, and the damage to the lab is limited, but you are gravely injured."
 cotc_research_project_events.230.a: "Argh!"
 cotc_research_project_events.231.desc.weapon_misfire: "Bad news. A prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] misfired in the weapons lab. Fortunately, the lab itself was mostly undamaged, but [first_researcher.Custom('GetBestNameNoState')] sustained severe injuries."
 cotc_research_project_events.231.desc.reactor_explosion: "Bad news. A prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] overloaded and set off a small explosion in the lab. Fortunately, the safeties prevented a complete disaster, but [first_researcher.Custom('GetBestNameNoState')] sustained severe injuries."
 cotc_research_project_events.231.desc: "Bad news. A prototype for Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] malfunctioned while [first_researcher.Custom('GetBestNameNoState')] was working on it. Fortunately, damage was limited, but [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('owner')] sustained severe injuries."
 cotc_research_project_events.231.a: "Immediately order [first_researcher.Custom('Getthem')] off the project."
 cotc_research_project_events.231.b: "Oh, well, these things happen."
 cotc_research_project_events.232.desc: "In response to your recent lab accident, [owner.Custom('GetBestNameNoState')] has ordered you off the project, ostensibly for your own safety."
 cotc_research_project_events.232.a: "How dare [owner.Custom('GetThey')]?!"
 cotc_research_project_events.232.a.title: "Jilted Ex-Researcher"
 cotc_research_project_events.232.a.desc: "[first_researcher.GetShortUIName] was furious about being taken off Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.232.b: "I'm glad [owner.Custom('GetThey')] care[owner.Custom('GetGenderPlural')]."
 cotc_research_project_events.232.b.title: "Pleased Ex-Researcher"
 cotc_research_project_events.232.b.desc: "[first_researcher.GetShortUIName] was happy to be released from Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 
 cotc_research_project_events.240.desc: "You've made a phenomenal breakthrough on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], one that could advance the project's timetable by months if not years."
 cotc_research_project_events.240.a: "I need to report this right away!"
 cotc_research_project_events.241.desc: "[first_researcher.Custom('GetBestNameNoState')] has made a phenomenal breakthrough on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], one that could advance the project's timetable by months if not years."
 cotc_research_project_events.241.a: "Well done."
 cotc_research_project_events.242.desc: "Word has gotten around that [first_researcher.Custom('GetBestNameNoState')] is in [owner.Custom('GetBestNameNoState')]'s good books lately. Apparently, [first_researcher.Custom('GetThey')] made a major breakthrough on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], one that could advance the project's timetable by months if not years - and make you look useless and incompetent in comparions."
 cotc_research_project_events.242.a: "I'll tell [owner.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] that it was really MY breakthrough!"
 cotc_research_project_events.242.b: "I'll just have to work harder."
 cotc_research_project_events.243.intro: "Just a few days after [first_researcher.Custom('GetBestNameNoState')] made [first_researcher.Custom('GetTheir')] breakthrough, [second_researcher.Custom('GetBestNameNoState')] comes up to you with a shocking claim. [second_researcher.Custom('GetThey')|U] say that the breakthrough was actually a joint effort between the two of them, but [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] stole credit for [second_researcher.Custom('GetTheir')] work and claimed the results as [first_researcher.Custom('GetTheir')] own."
 cotc_research_project_events.243.desc.first_researcher: "\n\nYou are almost certain that [second_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')] is lying."
 cotc_research_project_events.243.desc.second_researcher: "\n\nYou are almost certain that [second_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('first_researcher')] is telling the truth."
 cotc_research_project_events.243.desc.unknown: "\n\nYou cannot tell which of them is telling the truth."
 cotc_research_project_events.243.a: "This result is [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')]'s alone."
 cotc_research_project_events.243.b: "The two of you will share credit."
 cotc_research_project_events.244.intro.first_researcher.in_the_wrong: "A few days after reporting your new results, [owner.Custom('GetBestNameNoState')] confronts you. Apparently, [second_researcher.Custom('GetBestNameNoState')] found out about your economic use of the truth, and told [owner.Custom('GetThem')] that you stole the credit for the recent breakthrough on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')]."
 cotc_research_project_events.244.intro.first_researcher.in_the_right: "A few days after reporting your new results, [owner.Custom('GetBestNameNoState')] confronts you. Unbelievably, [second_researcher.Custom('GetBestNameNoState')] told [owner.Custom('GetThem')] that your recent breakthrough on [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] was really [second_researcher.Custom('GetTheir')] work, and that you stole it and claimed it for your own."
 cotc_research_project_events.244.intro.second_researcher.in_the_wrong: "You confront [owner.Custom('GetBestNameNoState')] and fabricate a tale. You and [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] made an important discovery working together, you say, but that no-good dirty scoundrel lied about your involvement and claimed all the credit for [first_researcher.Custom('GetThemself')]."
 cotc_research_project_events.244.intro.second_researcher.in_the_right: "You confront [owner.Custom('GetBestNameNoState')] and tell [owner.Custom('GetThem')] the whole story - how you and [first_researcher.Custom2('GetContextualSingleName'), SCOPE.sC('second_researcher')] made an important discovery working together, but [first_researcher.Custom('GetThey')] lied about your involvement and stole the credit for [first_researcher.Custom('GetThemself')]."
 cotc_research_project_events.244.desc.first_researcher: "\n\nFortunately, [owner.Custom('GetThey')] did not believe [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.244.desc.second_researcher: "\n\\nUnfortunately, [owner.Custom('GetThey')] does not believe you."
 cotc_research_project_events.244.a: "I'm glad [owner.Custom('GetThey')] made the right call."
 cotc_research_project_events.244.b: "I don't believe this!"
 cotc_research_project_events.245.desc.first_researcher: "\n\nUnfortunately, [owner.Custom('GetThey')] believed [second_researcher.Custom('GetThem')]."
 cotc_research_project_events.245.desc.second_researcher: "\n\\nFortunately, [owner.Custom('GetThey')] believes you."
 
 cotc_research_project_events.250.desc: "Eureka! You have been working together with [second_researcher.Custom('GetBestNameNoState')] on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], and together, the two of you have made a huge breakthrough, potentially advancing the project by months, if not years. All that remains is for you to report this discovery to [owner.Custom('GetBestNameNoState')], the project's sponsor."
 cotc_research_project_events.250.a: "I'll tell [owner.Custom('GetThem')] all about our discovery."
 cotc_research_project_events.250.b: "I'll tell [owner.Custom('GetThem')] all about MY discovery."
 cotc_research_project_events.251.desc: "Eureka! You have been working together with [second_researcher.Custom('GetBestNameNoState')] on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], and together, the two of you have made a huge breakthrough, potentially advancing the project by months, if not years. [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))] has already presented your findings to [owner.Custom('GetBestNameNoState')], the project's sponsor."
 cotc_research_project_events.251.a: "A job well done."
 cotc_research_project_events.252.desc: "[first_researcher.Custom('GetBestNameNoState')] approaches you with good news! It appears that [first_researcher.Custom('GetThey')] and [second_researcher.Custom('GetBestNameNoState')] have made a major breakthrough on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], one that could advance the project by months if not years."
 cotc_research_project_events.252.a: "Excellent work, both of you."
 cotc_research_project_events.253.desc: "How is this possible? You and [first_researcher.Custom('GetBestNameNoState')] were working together on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')], and the two of you had made an important breakthrough together, one that would advance the project by months if not years. You thought you could trust [first_researcher.Custom('GetThem')], but [first_researcher.Custom('GetThey')] told [owner.Custom('GetBestNameNoState')] that the discovery was [first_researcher.Custom('GetTheirs')] alone, completely ignoring the role you played in it."
 cotc_research_project_events.253.a: "I need to tell [owner.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))] the truth."
 cotc_research_project_events.253.b: "I'm going to give [first_researcher.Custom2('GetContextualSingleName', SCOPE.sC('second_researcher'))] a piece of my mind."
 cotc_research_project_events.253.c: "I'll just have to deal with this."
 
 cotc_research_project_events.300.a: "Eureka!"
 
 cotc_research_project_events.310.a: "I need a doctor, right away!"
 cotc_research_project_events.310.b: "That's it, I can't work on this project anymore."
 
 cotc_research_project_events.500.desc: "Bad news on Project [scheme.Custom('GetResearchProjectCodenameAdj')][scheme.Custom('GetResearchProjectCodenameNoun')] - it turns out that all the progress you thought you'd made in the past few months was based on bad assumptions and theories that turned out to be false. You've hit a complete dead end, and will have to start over from scratch."
 cotc_research_project_events.500.desc.hard_research_subject: "\n\n#weak [scheme.MakeScope.Var('research_subject').CultureInnovationType.GetName] is a very advanced and poorly understood subject. You may have more luck after [ROOT.GetCapitalLocation.GetCounty.GetCulture.GetName] advances to a later [cultural_era|E].#!"
 cotc_research_project_events.500.a: "A frustrating setback."
 cotc_research_project_events.500.b: "This is an AI-only option, you should never see this."