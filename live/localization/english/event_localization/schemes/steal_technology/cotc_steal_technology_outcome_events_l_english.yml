l_english:
 cotc_steal_technology_outcome_events.100.title: "Technology Stolen"
 cotc_steal_technology_outcome_events.100.desc.intro: "Your agents have successfully stolen vital information about [stolen_technology.GetName] from the government of [st_target_county.GetDefinitiveName], allowing you replicate this [innovation|E] here in [st_home_county.GetNameNoTier]. "
 cotc_steal_technology_outcome_events.100.desc.discovered: "Unfortunately, [st_target_character.Custom('GetBestName')]'s security team was able to trace the leak back to you and your agents, which may sour relations in the future.
 cotc_steal_technology_outcome_events.100.desc.undiscovered: "The operation was a complete success, and [st_target_character.Custom('GetBestName')] is none the wiser."
 cotc_steal_technology_outcome_events.100.a: "Mission accomplished."
 
 cotc_steal_technology_outcome_events.101.desc: "You've just been informed of a security breach. Apparently, [owner.GetPrimaryTitle.GetAdjective] agents were somehow able to infiltrate [st_target_county.GetNameNoTier]. Your security team was able to discover their operations, but not before they made off with critical information about [stolen_technology.GetName]."
 cotc_steal_technology_outcome_events.101.a: "Sounds like they couldn't figure it out themselves."
 
 cotc_steal_technology_outcome_events.110.desc.thief: "On your orders, [mvp.Custom('GetBestName')] successfully infiltrated official archives in [st_target_county.GetDefinitiveName] and stole several documents detailing [st_target_character.GetPrimaryTitle.GetAdjective] research into [stolen_technology.GetName]. "
 cotc_steal_technology_outcome_events.110.desc.spy: "One of your agents in [st_target_county.GetDefinitiveName], [mvp.Custom('GetBestName')], was able to subtly observe [stolen_technology.GetName] in action, taking detailed notes and forwarding the information to [st_home_county.GetNameNoTier], where your analysts were able to reverse engineer the [innovation|E]. "
 cotc_steal_technology_outcome_events.110.desc.hacker: "On your orders, [mvp.Custom('GetBestName')] cracked security on several data centers in [st_target_county.GetDefinitiveName], extracting vital information related to [stolen_technology.GetName]. Your analysts are now able to replicate this [innovation|E] in [st_home_county.GetNameNoTier]. "
 cotc_steal_technology_outcome_events.110.desc.diplomat: "[mvp.Custom('GetBestName')] was able to persuade a few key figures in [st_target_county.GetDefinitiveName] to part with sensitive information about [stolen_technology.GetName] - enough for your analysts to reconstruct the [innovation|E]. "
 cotc_steal_technology_outcome_events.110.desc.generic: "[mvp.Custom('GetBestName')] successfully stole information about [stolen_technology.GetName] from [st_target_county.GetDefinitiveName] for you. "
 cotc_steal_technology_outcome_events.110.desc.undiscovered: "The operation was a complete success, and [mvp.Custom('GetTheir')] cover was maintained."
 cotc_steal_technology_outcome_events.110.desc.discovered: "Unfortunately, [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] exposed in the process, and [mvp.Custom('GetBePresent')] now at risk of arrest by [st_target_character.GetPrimaryTitle.GetAdjective] authorities."
 
 cotc_steal_technology_outcome_events.111.desc.thief: "On [owner.Custom('GetBestName')]'s orders, you successfully infiltrated official archives in [st_target_county.GetDefinitiveName] and stole several documents detailing [st_target_character.GetPrimaryTitle.GetAdjective] research into [stolen_technology.GetName]. "
 cotc_steal_technology_outcome_events.111.desc.spy: "You were able to subtly observe [stolen_technology.GetName] in action in [st_target_county.GetDefinitiveName], taking detailed notes and forwarding the information to [home_county.GetNameNoTier], where [owner.Custom('GetBestName')]'s analysts were able to reverse engineer the [innovation|E]. "
 cotc_steal_technology_outcome_events.111.desc.hacker: "On [owner.Custom('GetBestName')]'s orders, you cracked security on several data centers in [st_target_county.GetDefinitiveName], extracting vital information related to [stolen_technology.GetName]. [owner.Custom('GetTheir')|U] analysts are now able to replicate this [innovation|E] in [home_county.GetNameNoTier]. "
 cotc_steal_technology_outcome_events.111.desc.diplomat: "You were able to persuade a few key figures in [st_target_county.GetDefinitiveName] to part with sensitive information about [stolen_technology.GetName] - enough for [owner.Custom('GetBestName')]'s analysts to reconstruct the [innovation|E] in [home_county.GetNameNoTier]. "
 cotc_steal_technology_outcome_events.111.desc.generic: "You successfully stole information about [stolen_technology.GetName] from [st_target_county.GetDefinitiveName] for [owner.Custom('GetBestName')]. "
 cotc_steal_technology_outcome_events.111.desc.undiscovered: "The operation was a complete success, and your cover was maintained."
 cotc_steal_technology_outcome_events.111.desc.discovered: "Unfortunately, you were exposed in the process, and [mvp.Custom('GetBePresent')] now at risk of arrest by [st_target_character.GetPrimaryTitle.GetAdjective] authorities."
 cotc_steal_technology_outcome_events.111.a: "I think it's time I skipped town."
 cotc_steal_technology_outcome_events.111.b: "Mission accomplished."
 
 cotc_steal_technology_outcome_events.112.desc.thief: "There's been a security breach. A thief, [mvp.Custom('GetBestName')], infiltrated official archives in [st_target_county.GetDefinitiveName], stole several documents detailing information on [stolen_technology.GetName], and delivered them to [owner.GetPrimaryTitle.GetDefinitiveName]."
 cotc_steal_technology_outcome_events.112.desc.spy: "Your security team has intercepted an encrypted transmission to a packet ship in the [st_target_county.GetNameNoTier] System. The ship successfully fled the system, but cracking the encryption has revealed that the transmission contained observations on [stolen_technology.GetName], made by [mvp.Custom('GetBestName')] and prepared for delivery to [owner.GetPrimaryTitle.GetDefinitiveName]."
 cotc_steal_technology_outcome_events.112.desc.hacker: "There's been a security breach. A hacker, [mvp.Custom('GetBestName')], was able to crack security on several data centers in [st_target_county.GetDefinitiveName], extracting vital information related to [stolen_technology.GetName] - enough for another state to replicate the [innovation|E]. Your analysts believe [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] in the pay of [owner.Custom('GetBestName')]."
 cotc_steal_technology_outcome_events.112.desc.diplomat: "There's been a securiy breach. Several minor officials in [st_target_county.GetDefinitiveName] were caught mishandling sensitive information about [stolen_technology.GetName] - it appears that handed the information to [mvp.Custom('GetBestName')], who in turn passed it on to [owner.GetPrimaryTitle.GetDefinitiveName]."
 cotc_steal_technology_outcome_events.112.desc.generic: "There's been a security breach. [mvp.Custom('GetBestName')] stole information on [stolen_technology.GetName] from [st_target_county.GetDefinitiveName] and gave it to [owner.Custom('GetBestName')].
 cotc_steal_technology_outcome_events.112.desc.skipped_town: " Unfortunately, [mvp.Custom('GetContextualSingleName', SCOPE.sC('st_target_character'))] has already fled the system."
 
 cotc_steal_technology_outcome_events.200.title: "Theft Thwarted"
 cotc_steal_technology_outcome_events.200.desc: "Your agents were unable to steal any useful information from [st_target_county.GetDefinitiveName]. "
 cotc_steal_technology_outcome_events.200.desc.discovered: "Even worse, their efforts were discovered by [st_target_character.Custom('GetBestName')], souring relations and destroying all the progress you'd made."
 cotc_steal_technology_outcome_events.200.desc.undiscovered: "Fortunately, they still remain undetected."
 cotc_steal_technology_outcome_events.200.a: "The whole operation has failed."
 cotc_steal_technology_outcome_events.200.b: "If at first you don't succeed.."
 
 cotc_steal_technology_outcome_events.201.desc: "Your security agents have successfully thwarted an attempt by [owner.Custom('GetBestName')] to steal research and technology from [st_target_county.GetDefinitiveName]."
 cotc_steal_technology_outcome_events.201.a: "They couldn't figure it out themselves?"
 
 cotc_steal_technology_outcome_events.210.desc.thief: "On your orders, [mvp.Custom('GetBestName')] attempted to infiltrate official archives in [st_target_county.GetDefinitiveName], but [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] caught in the act. "
 cotc_steal_technology_outcome_events.210.desc.spy: "One of your agents in [st_target_county.GetDefinitiveName], [mvp.Custom('GetBestName')], attempted to subtly observe their technology in action, but was spotted in the act by [st_target_character.GetPrimaryTitle.GetAdjective] security forces. "
 cotc_steal_technology_outcome_events.210.desc.hacker: "On your orders, [mvp.Custom('GetBestName')] cracked security on several data centers in [st_target_county.GetDefinitiveName], but [mvp.Custom('GetThey')] quickly found [mvp.Custom('GetThem')]self frozen out of the network. "
 cotc_steal_technology_outcome_events.210.desc.diplomat: "[mvp.Custom('GetBestName')] attempted to persuade a few key figures in [st_target_county.GetDefinitiveName] to part with sensitive information, but all of them steadfastly refused. "
 cotc_steal_technology_outcome_events.210.desc.generic: "[mvp.Custom('GetBestName')] failed to steal technology from [st_target_county.GetDefinitiveName] for you. "
 cotc_steal_technology_outcome_events.210.desc.undiscovered: "Fortunately, [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] able to escape without blowing [mvp.Custom('GetTheir')] cover."
 cotc_steal_technology_outcome_events.210.desc.discovered: "To make matters worse, [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] identified in the process, and [mvp.Custom('GetTheir')] actions reported to [st_target_character.Custom('GetBestName')]."
 
 cotc_steal_technology_outcome_events.211.desc.thief: "On [owner.Custom('GetBestName')]'s orders, you attempted to infiltrated official archives in [st_target_county.GetDefinitiveName], but you were caught in the act. "
 cotc_steal_technology_outcome_events.211.desc.spy: "You attempted to subtly observe new technology in action in [st_target_county.GetDefinitiveName], but were spotted in the act by [st_target_character.GetPrimaryTitle.GetAdjective] security forces. "
 cotc_steal_technology_outcome_events.211.desc.hacker: "On [owner.Custom('GetBestName')]'s orders, you cracked security on several data centers in [st_target_county.GetDefinitiveName], but you quickly found yourself frozen out of the network. "
 cotc_steal_technology_outcome_events.211.desc.diplomat: "You attempted to persuade a few key figures in [st_target_county.GetDefinitiveName] to part with sensitive information, but all of them steadfastly refused. "
 cotc_steal_technology_outcome_events.211.desc.generic: "You failed to steal technology from [st_target_county.GetDefinitiveName] for [owner.Custom('GetBestName')]. "
 cotc_steal_technology_outcome_events.211.desc.undiscovered: "Fortunately, you were at least able to escape without blowing your cover."
 cotc_steal_technology_outcome_events.211.desc.discovered: "To make matters worse, your cover was blown, and your actions reported to [st_target_character.Custom('GetBestName')]."
 cotc_steal_technology_outcome_events.211.a: "I think it's time I skipped town."
 cotc_steal_technology_outcome_events.211.b: "This is fine, probably."
 
 cotc_steal_technology_outcome_events.212.desc.thief: "There's been a security breach. A thief, [mvp.Custom('GetBestName')], was caught attempting to infiltrate official archives in [st_target_county.GetDefinitiveName] on the orders of [owner.Custom('GetBestName')]."
 cotc_steal_technology_outcome_events.212.desc.spy: "Your security team has caught [mvp.Custom('GetBestName')] spying on classified technology in [st_target_county.GetDefinitiveName] on the orders of [owner.Custom('GetBestName')]"
 cotc_steal_technology_outcome_events.212.desc.hacker: "There's been a security breach. A hacker attempted to crack security on several data centers in [st_target_county.GetDefinitiveName]. Fortunately, [mvp.Custom('GetThey')] failed, and your security team was able to trace the attempt and identify the hacker: [mvp.Custom('GetBestName')]. Your analysts believe [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] in the pay of [owner.Custom('GetBestName')]."
 cotc_steal_technology_outcome_events.212.desc.diplomat: "There's been a securiy breach. Several minor official reported that [mvp.Custom('GetBestName')] approached them and attempted to get them to divulge sensitive information. Your analysts believe [mvp.Custom('GetThey')] [mvp.Custom('GetBePast')] in the pay of [owner.Custom('GetBestName')]."
 cotc_steal_technology_outcome_events.212.desc.generic: "There's been a security breach. [mvp.Custom('GetBestName')] attempted to steal information on [local_innovations_cotc|E] in [st_target_county.GetDefinitiveName] for [owner.Custom('GetBestName')].
 cotc_steal_technology_outcome_events.212.desc.skipped_town: " Unfortunately, [mvp.Custom('GetContextualSingleName', SCOPE.sC('st_target_character'))] has already fled the system."
 
 cotc_steal_technology_outcome_events.300.title: "Mission Aborted"
 cotc_steal_technology_outcome_events.300.desc: "As you no longer have a [capital|E] to implement new [local_innovations_cotc|E], your [scheme|E] to Steal Technology no longer means anything."
 cotc_steal_technology_outcome_events.300.a: "I see."
 
 cotc_steal_technology_outcome_events.310.desc: "With [st_target_character.Custom('GetBestName')] fall from power, your infiltration of [st_target_character.Custom('GetTheir')] government is useless, and your [scheme|E] to Steal Technology from [st_target_character.Custom('GetThem')] no longer means anything."
 
 cotc_steal_technology_outcome_events.320.desc: "With new [local_innovations_cotc|E] in [st_home_county.GetNameNoTier], your [scheme|E] to Steal Technology from [st_target_county.GetNameNoTier] no longer has any purpose."