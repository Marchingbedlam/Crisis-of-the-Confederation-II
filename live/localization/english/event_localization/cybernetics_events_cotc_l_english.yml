 cotc_cybernetics_events.1051.desc.other: "Your [patient.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [patient.Custom('GetBestName')], will soon be undergoing cybersurgery to install a new [target.GetName]. The issue, of course, is that [patient.Custom('GetThey')] already [patient.Custom('GetHave')] two perfectly good artificial legs. One of them will need to be replaced."
 cotc_cybernetics_events.1051.a: "Remove the [leg_1.GetName]."
