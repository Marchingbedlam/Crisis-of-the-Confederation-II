 cotc_cybernetics_events.1000.title: "Cybersurgery"
 cotc_cybernetics_events.1000.desc.self: "Your [physician.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [sponsor.Custom('GetBestName')], wants to undergo cybersurgery. "
 cotc_cybernetics_events.1000.desc.other: "Your [physician.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [sponsor.Custom('GetBestName')], wants you to perform cybersurgery on [sponsor.Custom('GetTheir')] [sponsor.Custom2('RelationToMeShort', SCOPE.sC('patient'))], [patient.Custom('GetBestName')]. "
 cotc_cybernetics_events.1000.desc.replace: "[sponsor.Custom('GetThey')|U] [sponsor.Custom('GetHave')] asked you to replace [patient.Custom('GetTheir')] [replaced_implant.GetName] with a new [target.GetName]."
 cotc_cybernetics_events.1000.desc.new: "[sponsor.Custom('GetThey')|U] [sponsor.Custom('GetHave')] asked you to install a new [target.GetName]."
 cotc_cybernetics_events.1000.desc.potential_risk: " This is a delicate operation on some of the body's most vital organs - one mistake could prove fatal."
 cotc_cybernetics_events.1000.a: "I'll do it."
 cotc_cybernetics_events.1000.b: "How very unfortunate for [patient.Custom2('GetContextualSingleName', SCOPE.sC('physician'))]."
 cotc_cybernetics_events.1000.c: "I refuse to mutilate a human body."
 cotc_cybernetics_events.1000.d: "I'm not qualified for this."
 
 cotc_cybernetics_events.1001.desc: "Unfortunately, your [physician.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [physician.Custom('GetBestName')], adamantly refuses to perform the cybersurgery. 
 cotc_cybernetics_events.1001.desc.ideological: "\"Mutilating the human body like this is an abomination,\" [physician.Custom('GetThey')] say[physician.Custom('GetGenderPlural')], \"I will have no part in it.\""
 cotc_cybernetics_events.1001.desc.not_qualified: "[physician.Custom('GetThey')|U] protest[physician.Custom('GetGenderPlural')] that [physician.Custom('GetThey')] [physician.Custom('GetBePresent')] woefully unqualified to perform such a delicate operation."
 cotc_cybernetics_events.1001.a: "Well, that's a disappointment."
 cotc_cybernetics_events.1001.b: "You do realize this means you're fired, right?"
 
 cotc_cybernetics_events.1010.desc: "At your request, your [sponsor.Custom2('RelationToMeShort', SCOPE.sC('physician'))], [physician.Custom('GetBestName')], agrees to perform the cybersurgery. "
 cotc_cybernetics_events.1010.desc.replace.self: "[physician.Custom('GetThey')|U] will be replacing your old [replaced_implant.GetName] with a new [target.GetName]."
 cotc_cybernetics_events.1010.desc.replace.other: "[physician.Custom('GetThey')|U] will be replacing [patient.Custom2('GetContextualSingleName', SCOPE.sC('sponsor'))]'s old [replaced_implant.GetName] with a new [target.GetName]."
 cotc_cybernetics_events.1010.desc.first_surgery.self: "[physician.Custom('GetThey')|U] will be surgically removing part of your organic body to install a new [target.GetName]."
 cotc_cybernetics_events.1010.desc.first_surgery.other: "[physician.Custom('GetThey')|U] will be surgically removing part of [patient.Custom2('GetContextualSingleName', SCOPE.sC('sponsor'))]'s organic body to install a new [target.GetName]."
 cotc_cybernetics_events.1010.desc.new: "[physician.Custom('GetThey')|U] will be installing a new [target.GetName]."
 cotc_cybernetics_events.1010.a: "Proceed with the surgery."
 cotc_cybernetics_events.1010.b: "On second thought, this is too dangerous."
 
 cotc_cybernetics_events.1020.desc: "Your cybersurgery was a complete success!"
 cotc_cybernetics_events.1020.desc.replace: " Your old [replaced_implant.GetName] was removed, and in its place you now have a new [target.GetName]."
 cotc_cybernetics_events.1020.desc.new: " You now have a brand new [target.GetName]."
 cotc_cybernetics_events.1020.a: "I feel better than ever."
 cotc_cybernetics_events.1020.msg.title: "Successful Cybersurgery"
 cotc_cybernetics_events.1020.msg.desc: "[physician.GetShortUIName] successfully installed [patient.GetShortUINamePossessive] [target.GetName]."
 
 cotc_cybernetics_events.1030.desc: "Your cybersurgery was completed, but there were complications."
 cotc_cybernetics_events.1030.desc.wounded_3: " Unfortunately, [physician.Custom('GetBestName')] badly botched the procedure, and you suffered serious injuries as a result."
 cotc_cybernetics_events.1030.desc.wounded_2: " Unfortunately, [physician.Custom('GetBestName')] botched the procedure, and you suffered noticeable injuries as a result."
 cotc_cybernetics_events.1030.desc.wounded_1: " Unfortunately, [physician.Custom('GetBestName')] made some mistakes in the procedure, and you suffered mild injuries as a result."
 cotc_cybernetics_events.1030.desc.apologize: " [physician.Custom('GetThey')|U] apologize[physician.Custom('GetGenderPlural')] profusely for the mistake and beg[physician.Custom('GetGenderPlural')] for forgiveness."
 cotc_cybernetics_events.1030.a: "...I'll live."
 cotc_cybernetics_events.1030.b: "You're fired."
 cotc_cybernetics_events.1030.c: "Some time in a cell will give you a chance to improve."
 cotc_cybernetics_events.1030.d: "You won't make the same mistake twice if you're dead."
 cotc_cybernetics_events.1030.msg.title: "Botched Cybersurgery"
 cotc_cybernetics_events.1030.msg.desc: "[physician.GetShortUIName] successfully installed [patient.GetShortUINamePossessive] [target.GetName], but there were complications."
 
 cotc_cybernetics_events.1031.desc: "[patient.Custom('GetBestName')]'s cybersurgery was completed, but there were complications."
 cotc_cybernetics_events.1031.desc.replace: " [patient.Custom('GetTheir')|U] old [replaced_implant.GetName] was removed, and in its place [patient.Custom('GetThey')] now [patient.Custom('GetHave')] a new [target.GetName]."
 cotc_cybernetics_events.1031.desc.new: " [patient.Custom('GetThey')|U] now [patient.Custom('GetHave')] a brand new [target.GetName]."
 cotc_cybernetics_events.1031.desc.wounded_3: " Unfortunately, [physician.Custom('GetBestName')] badly botched the procedure, and [patient.Custom('GetThey')] suffered serious injuries as a result."
 cotc_cybernetics_events.1031.desc.wounded_2: " Unfortunately, [physician.Custom('GetBestName')] botched the procedure, and [patient.Custom('GetThey')] suffered noticeable injuries as a result."
 cotc_cybernetics_events.1031.desc.wounded_1: " Unfortunately, [physician.Custom('GetBestName')] made some mistakes in the procedure, and [patient.Custom('GetThey')] suffered mild injuries as a result."
 cotc_cybernetics_events.1031.a: "This outcome is acceptable."
 
 cotc_cybernetics_events.1040.desc: "Going under [physician.Custom('GetBestName')]'s knife was a huge mistake. "
 cotc_cybernetics_events.1040.desc.replace.brain_damage: "While attempting to remove your [replaced_implant.GetName], [physician.Custom('GetThey')] sever[physician.Custom('GetGenderPlural')] a vital connection between your brain and your central nervous system. Your death is effectively instantaneous."
 cotc_cybernetics_events.1040.desc.replace.organ_failure: "While [physician.Custom('GetThey')] successfully remove[physician.Custom('GetGenderPlural')] your [replaced_implant.GetName], [physician.Custom('GetThey')] [physician.Custom('GetBe')] not nearly so successful in replacing it. You spend entire minutes on the operating table missing multiple vital organs. You are helpless to act as your brain slowly shuts down."
 cotc_cybernetics_events.1040.desc.new.brain_damage: "While attempting to install your new [target.GetName], [physician.Custom('GetThey')] sever[physician.Custom('GetGenderPlural')] a vital connection between your brain and your central nervous system. Your death is effectively instantaneous."
 cotc_cybernetics_events.1040.desc.new.organ_failure: "While [physician.Custom('GetThey')] successfully remove[physician.Custom('GetGenderPlural')] your internal organs [physician.Custom('GetThey')] [physician.Custom('GetBe')] not nearly so successful in replacing them. You spend entire minutes on the operating table missing multiple vital organs. You are helpless to act as your brain slowly shuts down."
 cotc_cybernetics_events.1040.msg.title: "Fatal Cybersurgery"
 cotc_cybernetics_events.1040.msg.desc: "[patient.GetShortUIName] died while undergoing cybersurgery by [physician.GetShortUIName]."
 cotc_cybernetics_events.1040.a: "Arghablargh..."
 
 cotc_cybernetics_events.1041.desc: "Disaster! Your [patient.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [patient.Custom('GetBestName')], is dead. [physician.Custom('GetBestName')] agreed to perform cybersurgery on [patient.Custom('GetThem')], but badly botched the procedure."
 cotc_cybernetics_events.1041.desc.brain_damage: " Your [patient.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))] died missing a considerable portion of [patient.Custom('GetTheir')] brain matter."
 cotc_cybernetics_events.1041.desc.organ_failure: " Your [patient.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))] was on the operating table for several minutes missing [patient.Custom('GetTheir')] heart and lungs. Needless to say, [patient.Custom('GetThey')] didn't make it."
 cotc_cybernetics_events.1041.a: "So it goes."
 
 cotc_cybernetics_events.1050.desc.self: "You will soon be undergoing cybersurgery to install a new [target.GetName]. The issue, of course, is that you already have two perfectly good artificial arms. One of them will need to be replaced."
 cotc_cybernetics_events.1050.desc.other: "Your [patient.Custom2('RelationToMeShort', SCOPE.sC('sponsor'))], [patient.Custom('GetBestName')], will soon be undergoing cybersurgery to install a new [target.GetName]. The issue, of course, is that [patient.Custom('GetThey')] already [patient.Custom('GetHave')] two perfectly good artificial arms. One of them will need to be replaced."
 cotc_cybernetics_events.1050.a: "Remove the [arm_1.GetName]."
 cotc_cybernetics_events.1050.b: "Remove the [arm_2.GetName]."
 
