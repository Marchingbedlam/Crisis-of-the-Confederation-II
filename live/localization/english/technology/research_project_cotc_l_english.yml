 game_concept_research_project_cotc_desc: "A $game_concept_research_project_cotc$ is a [scheme|E] aimed at discovering a new [local_innovation_cotc|E]. Unlike a standard $game_concept_scheme$, $game_concept_research_projects_cotc$ are guaranteed to succeed - eventually. At the end of each [scheme_phase_phase|E], there is a chance equal to the current @scheme_success_icon![scheme_success_chance|E] that the project will be completed, after which the $game_concept_scheme_success_chance$ will increase.\n\nOnce the project is successfully completed, your [capital|E] will gain the project's subject as a new $game_concept_local_innovation_cotc$.\n\n$game_concept_research_projects_cotc$ can be either public or @scheme_secrecy_icon![secret_scheme_single|E]. A $game_concept_secret_scheme_single$ $game_concept_research_project_cotc$ will not be visible to other characters, but will not reward [prestige_i|E][prestige|E] or [piety_i|E][piety|E] and is capped at one fewer [researcher_cotc|E]. $game_concept_secret_scheme_single$ $game_concept_research_projects_cotc$ can go public at any time."
 
 game_concept_researcher_cotc: "Researcher"
 game_concept_researchers_cotc: "Researchers"
 game_concept_researcher_cotc_desc: "A $game_concept_researcher_cotc$ is an [agent|E] working on a [research_project_cotc|E] who conducts actual research, decreasing the length of each [scheme_phase_phase|E]. The more funding a $game_concept_research_project_cotc$ has, the more $game_concept_researchers_cotc$ it can employ. @scheme_secrecy_icon![secret_scheme_single|E] $game_concept_research_projects_cotc$ can hire one fewer $game_concept_researcher_cotc$."
 
