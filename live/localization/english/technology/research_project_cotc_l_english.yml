 agent_research_doctor: "Doctor"
 agent_research_doctor_i: "[scheme_speed_i]"
 agent_research_doctor_desc: "#WEAK A medical doctor, brimming with knowledge about the human body and exactly what can go wrong with it.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] and [GetTrait('whole_of_body').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('drunkard').GetName( GetNullCharacter )] and [GetTrait('blind').GetName( GetNullCharacter )]"
 agent_research_physicist: "Physicist"
 agent_research_physicist_i: "[scheme_speed_i]"
 agent_research_physicist_desc: "#WEAK An expert on the fundamental particles and forces that make up the universe.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('scholar').GetName( GetNullCharacter )] and [GetTrait('humble').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('lazy').GetName( GetNullCharacter )] and [GetTrait('arbitrary').GetName( GetNullCharacter )]"
 agent_research_engineer: "Engineer"
 agent_research_engineer_i: "[scheme_speed_i]"
 agent_research_engineer_desc: "#WEAK No matter how much theoretical knowledge you amass, putting it into use will always require a more practical touch.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('architect').GetName( GetNullCharacter )] and [GetTrait('administrator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('content').GetName( GetNullCharacter )] and [GetTrait('lazy').GetName( GetNullCharacter )]"
 agent_research_economist: "Economist"
 agent_research_economist_i: "[scheme_speed_i]"
 agent_research_economist_desc: "#WEAK An expert on the dismal science and the impact of interstellar travel on the economy.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [stewardship_i] [stewardship|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ Requires [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('scholar').GetName( GetNullCharacter )] and [GetTrait('administrator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('lazy').GetName( GetNullCharacter )] and [GetTrait('profligate').GetName( GetNullCharacter )]"
 agent_research_sociologist: "Sociologist"
 agent_research_sociologist_i: "[scheme_speed_i]"
 agent_research_sociologist_desc: "#WEAK An expert on social psychology and the way humans related to one another.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [diplomacy_i] [diplomacy|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('gregarious').GetName( GetNullCharacter )] and [GetTrait('scholar').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('callous').GetName( GetNullCharacter )] and [GetTrait('shy').GetName( GetNullCharacter )]"
 agent_research_officer: "Officer"
 agent_research_officer_i: "[scheme_speed_i]"
 agent_research_officer_desc: "#WEAK The military has a vested interested in new weapons research, and will happily lend its experience with the practical art of murder.#!\n$EFFECT_LIST_BULLET$ Reduces [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Requires [martial_i] [martial|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('patient').GetName( GetNullCharacter )] and [GetTrait('diligent').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('lazy').GetName( GetNullCharacter )] and [GetTrait('content').GetName( GetNullCharacter )]"
 agent_research_security_chief: "Monitor"
 agent_research_security_chief_i: "[scheme_secrecy_i]"
 agent_research_security_chief_desc: "#WEAK An intelligence officer charged with keeping the details of the project top secret.#!\n$EFFECT_LIST_BULLET$ Provides [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Requires [intrigue_i] [intrigue|E] & [learning_i] [learning|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('patient').GetName( GetNullCharacter )] and [GetTrait('paranoid').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('impatient').GetName( GetNullCharacter )] and [GetTrait('trusting').GetName( GetNullCharacter )]"