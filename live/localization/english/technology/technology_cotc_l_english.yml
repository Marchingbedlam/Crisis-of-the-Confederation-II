l_english:
 county_has_tech.tt: "[temp_county_name.GetNameNoTier] has the [temp_tech_name.GetName] [local_innovation_cotc|E]"
 add_tech_to_county.tt: "[temp_county_name.GetNameNoTier] gains the [temp_tech.GetName] [local_innovation_cotc|E]"
 culture_parameter_colonial_military: "Colonial Military Innovation"
 culture_parameter_colonial_civic: "Colonial Civic Innovation"
 culture_parameter_confederate_military: "Confederate Military Innovation"
 culture_parameter_confederate_civic: "Confederate Civic Innovation"
 culture_parameter_trimillennial_military: "Trimillennial Military Innovation"
 culture_parameter_trimillennial_civic: "Trimillennial Civic Innovation"
 culture_parameter_neorenaissance_military: "Neorenaissance Military Innovation"
 culture_parameter_neorenaissance_civic: "Neorenaissance Civic Innovation"
 innovation_mass_literacy: "Mass Literacy"
 tech_mass_literacy_character_modifier: "$innovation_mass_literacy$"
 culture_parameter_mass_literacy_learning_buff: "#P 2#! [learning_i|E] for each [character|E]"
 innovation_mass_literacy_desc: "A population that can read and write is a population that can more readily record and pass on important knowledge."
 start_research_project_mass_literacy: "$innovation_mass_literacy$"
 mass_literacy_tooltip: "$innovation_mass_literacy_desc$\n\n#weak Effects: #!\n$EFFECT_LIST_BULLET$$culture_parameter_mass_literacy_learning_buff$"
 innovation_propaganda: "Propaganda"
 tech_propaganda_county_modifier: "$innovation_propaganda$"
 culture_parameter_propaganda_opinion_buff: "#P +5#! [public_opinion|E] for each [system|E]"
 innovation_propaganda_desc: "The power of mass media can be used to bring the opinions of the people better in line with those of the state."
 start_research_project_propaganda: "$innovation_propaganda$"
 propaganda_tooltip: "$innovation_propaganda_desc$\n\n#weak Effects: #!\n$EFFECT_LIST_BULLET$$culture_parameter_propaganda_opinion_buff$"
 innovation_fusion_reactors: "Fusion Reactors"
 innovation_fusion_reactors_desc: "The fusion of two light atomic nuclei into a larger nucleus also releases unparalled energy. Fusion reactors operate on the same principle as the stars themselves."
 start_research_project_fusion_reactors: "$innovation_fusion_reactors$"
 fusion_reactors_tooltip: "$innovation_fusion_reactors_desc$\n\n#weak Effects: #!"
 innovation_modern_medicine: "Modern Medicine"
 tech_modern_medicine_character_modifier: "$innovation_modern_medicine$"
 culture_parameter_modern_medicine_health_buff: "#P 2#! [health|E] for each [character|E]"
 innovation_modern_medicine_desc: "Prior to the 19th century, fully half of all children never lived to see adulthood. With the adoption of modern medical techniques, that percentage has dropped to near zero."
 start_research_project_modern_medicine: "$innovation_modern_medicine$"
 modern_medicine_tooltip: "$innovation_modern_medicine_desc$\n\n#weak Effects: #!\n$EFFECT_LIST_BULLET$$culture_parameter_modern_medicine_health_buff$"
 innovation_cloning: "Cloning"
 innovation_cloning_desc: "It is possible to create a synthetic embryo containing an exact duplicate of a donor's genetic code. If allowed to develop, the embryo will eventually grow into a younger identical twin of the donor."
 start_research_project_cloning: "$innovation_cloning$"
 cloning_tooltip: "$innovation_cloning_desc$\n\n#weak Effects: #!"
 innovation_genetic_screening: "Genetic Screening"
 innovation_genetic_screening_desc: "Using modern medical technology, it is possible to screen a developing fetus for possible undesired genetic traits and neutralize those genes before they can be fully expressed."
 start_research_project_genetic_screening: "$innovation_genetic_screening$"
 genetic_screening_tooltip: "$innovation_genetic_screening_desc$\n\n#weak Effects: #!"
 innovation_cybernetics: "Cybernetics"
 innovation_cybernetics_desc: "The human body can be augmented by replacing natural, organic body parts with artificial ones which connect directly to the nervous system, allowing them to be controlled as easily as any natural organ."
 start_research_project_cybernetics: "$innovation_cybernetics$"
 cybernetics_tooltip: "$innovation_cybernetics_desc$\n\n#weak Effects: #!"
 innovation_direct_neural_interface: "Direct Neural Interface"
 innovation_direct_neural_interface_desc: "Colloquially known as the 'skulltop', the Direct Neural Interface is a cybernetic augmentation to the brain that acts as a basis for other, more sophisticated neurological augmentations."
 start_research_project_direct_neural_interface: "$innovation_direct_neural_interface$"
 direct_neural_interface_tooltip: "$innovation_direct_neural_interface_desc$\n\n#weak Effects: #!"
 innovation_nuclear_missiles: "Nuclear Missiles"
 innovation_nuclear_missiles_desc: "While nuclear missiles typically operate on old-fashioned nuclear fission rather than more modern fusion technology, they are nevertheless potent weapons of mass destruction."
 start_research_project_nuclear_missiles: "$innovation_nuclear_missiles$"
 nuclear_missiles_tooltip: "$innovation_nuclear_missiles_desc$\n\n#weak Effects: #!"
 innovation_automatic_weapons: "Automatic Weapons"
 innovation_automatic_weapons_desc: "Automatic weapons such as the machine gun appear to represent an important breaking point in military history, where technological sophistication became able to overcome even a massive disadvantage in numbers."
 start_research_project_automatic_weapons: "$innovation_automatic_weapons$"
 automatic_weapons_tooltip: "$innovation_automatic_weapons_desc$\n\n#weak Effects: #!"
 innovation_lasers: "Lasers"
 innovation_lasers_desc: "Light Amplification by Stimulated Emission of Radiation devices emit beams of focused, coherent light, which at sufficiently high energy levels can make for a powerful weapon."
 start_research_project_lasers: "$innovation_lasers$"
 lasers_tooltip: "$innovation_lasers_desc$\n\n#weak Effects: #!"