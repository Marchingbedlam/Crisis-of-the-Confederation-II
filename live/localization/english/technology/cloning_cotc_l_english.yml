 feature_clone_sex_female: "female"
 feature_clone_sex_male: "male"
 single_donor_clone_name: "[clone|E] of [first_donor.Custom('GetBestName')]"
 single_donor_clone_description: "This is a [newly_created_clone.GetFeatureText('clone_sex')] [gestating_clone|E] of [newly_created_clone.MakeScope.Var('first_donor').Char.Custom('GetBestName')]. It will reach viability in #V [newly_created_clone.MakeScope.Var('months_remaining').GetValue]#! months."
 double_donor_clone_name: "[clone|E] of [first_donor.Custom('GetBestName')] and [second_donor.Custom('GetBestName')]"
 double_donor_clone_description: "This is a [newly_created_clone.GetFeatureText('clone_sex')] double-donor [gestating_clone|E] of [newly_created_clone.MakeScope.Var('first_donor').Char.Custom('GetBestName')] and [newly_created_clone.MakeScope.Var('second_donor').Char.Custom('GetBestName')]. It will reach viability in #V [newly_created_clone.MakeScope.Var('months_remaining').GetValue]#! months."