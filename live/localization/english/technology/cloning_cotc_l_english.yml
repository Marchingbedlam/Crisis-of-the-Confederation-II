l_english:
 game_concept_cloning: "Cloning"
 game_concept_clone: "Clone"
 game_concept_clones: "Clones"
 game_concept_donor: "Donor"
 game_concept_donors: "Donors"
 game_concept_cloning_desc: "$game_concept_cloning$ is the practice of creating an artificial human using genetic material from a donors.\n\nWhen a $game_concept_clone$ is commissioned, a [gestating_clone|E] is created. When the $game_concept_gestating_clone$ reaches maturity, it will be decanted, creating a new [character|E].\n\n$game_concept_clones$ are considered the [children|E] of their donors, and have a chance to inherit each of their donor's [congenital_traits|E] based on the [clone_fidelity|E] of the commissioner's [local_innovations_cotc|E]."
 game_concept_single_donor_clone: "Single-Donor Clone"
 game_concept_single_donor_clones: "Single-Donor Clones"
 game_concept_one_donor_clone: "One-Donor Clone"
 game_concept_one_donor_clones: "One-Donor Clones"
 game_concept_single_donor_clone_desc: "$game_concept_single_donor_clones$ are [clones|E] produced from a single genetic donor, who will be the clone's sole parent."
 game_concept_double_donor_clone: "Double-Donor Clone"
 game_concept_double_donor_clones: "Double-Donor Clones"
 game_concept_two_donor_clone: "Two-Donor Clone"
 game_concept_two_donor_clones: "Two-Donor Clones"
 game_concept_double_donor_clone_desc: "$game_concept_double_donor_clones$ are [clones|E] produced by mixing the DNA of two genetic donors. The result resembles a natural [child|E] of both donors."
 game_concept_gestating_clone: "Gestating Clone"
 game_concept_gestating_clones: "Gestating Clones"
 game_concept_clone_gestation: "Clone Gestation"
 game_concept_gestating_clone_desc: "A $game_concept_gestating_clone$ is an [artifact|E] containing a [clone|E] that has not yet reached viability."
 game_concept_clone_fidelity: "Clone Fidelity"
 game_concept_clone_fidelity_desc: "$game_concept_clone_fidelity$ is a measure of how resistant the [cloning|E] process is to errors. The higher your $game_concept_clone_fidelity$, the greater the chance that $game_concept_clones$ will inherit their donors' [congenital_traits|E].
 
 clone: "[clone|E]"
 donor: "[donor|E]"
 commission_single_donor_clone_interaction: "Create Clone"
 commission_single_donor_clone_interaction.desc.self: "Commission a [clone|E] of yourself. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E]."
 commission_single_donor_clone_interaction.desc.puppet: "Order [puppet_or_actor.Custom('GetBestName')] to commission a [clone|E] of [puppet_or_actor.Custom('GetThemself')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E]."
 commission_single_donor_clone_interaction.desc.other: "Offer to commission a [clone|E] of [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of [recipient.Custom('GetTheir')] [congenital_traits|E]."
 commission_single_donor_clone_interaction.notification.both_hate_cloning: "Despite our shared misgivings about this abominable practice, I wish to collect a blood sample in order to commission a clone with your DNA.
 commission_single_donor_clone_interaction.notification.actor_hates_cloning: "Despite my misgivings about this abominable practice, I wish to collect a blood sample in order to commission a clone with your DNA."
 commission_single_donor_clone_interaction.notification.recipient_hates_cloning: "While I understand that you have misgivings about the procedure, I nevertheless wish to collect a blood sample in order to commission a clone with your DNA."
 commission_single_donor_clone_interaction.notification.cloning_okay: "I wish to collect a blood sample in order to commission a clone with your DNA."
 
 commission_double_donor_clone_interaction: "Create Double-Donor Clone"
 commission_double_donor_clone_interaction.desc.puppet: "Order [puppet_or_actor.Custom('GetBestName')] to offer to commission a [double_donor_clone|E] of [puppet_or_actor.Custom('GetThemself')] and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of their [congenital_traits|E]."
 commission_double_donor_clone_interaction.desc.puppet.close_family: "Order [puppet_or_actor.Custom('GetBestName')] to offer to commission a [double_donor_clone|E] of [puppet_or_actor.Custom('GetThemself')] and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of their [congenital_traits|E] and a #N [puppet_or_actor.MakeScope.ScriptValue('clone_close_family_inbred_chance')]%#! chance of being [GetTrait('inbred').GetName( GetNullCharacter )]."
 commission_double_donor_clone_interaction.desc.puppet.extended_family: "Order [puppet_or_actor.Custom('GetBestName')] to offer to commission a [double_donor_clone|E] of [puppet_or_actor.Custom('GetThemself')] and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of their [congenital_traits|E] and a #N [puppet_or_actor.MakeScope.ScriptValue('clone_extended_family_inbred_chance')]%#! chance of being [GetTrait('inbred').GetName( GetNullCharacter )]."
 commission_double_donor_clone_interaction.desc: "Offer to commission a [double_donor_clone|E] of yourself and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E]."
 commission_double_donor_clone_interaction.desc.close_family: "Offer to commission a [double_donor_clone|E] of yourself and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E] and a #N [puppet_or_actor.MakeScope.ScriptValue('clone_close_family_inbred_chance')]%#! chance of being [GetTrait('inbred').GetName( GetNullCharacter )]."
 commission_double_donor_clone_interaction.desc.extended_family: "Offer to commission a [double_donor_clone|E] of yourself and [recipient.Custom('GetBestName')]. The clone will have a #P [puppet_or_actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E] and a #N [puppet_or_actor.MakeScope.ScriptValue('clone_extended_family_inbred_chance')]%#! chance of being [GetTrait('inbred').GetName( GetNullCharacter )]."
 commission_double_donor_clone_interaction.notification.both_hate_cloning.inbreeding: "Despite both our shared misgivings about this abominable practice and the risk of inbreeding, I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.both_hate_cloning: "Despite our shared misgivings about this abominable practice, I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.actor_hates_cloning.inbreeding: "Despite both my own misgivings about this abominable practice and the risk of inbreeding, I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.actor_hates_cloning: "Despite my own misgivings about this abominable practice, I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.recipient_hates_cloning.inbreeding: "While I understand both that you have misgivings about the procedure and that there is a serious risk of inbreeding, I nevertheless wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.recipient_hates_cloning: "While I understand that you have misgivings about the procedure, I nevertheless wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.cloning_okay.inbreeding: "Despite the risk of inbreeding, I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 commission_double_donor_clone_interaction.notification.cloning_okay: "I wish to collect a blood sample in order to commission a clone sharing a mixture of our combined DNA."
 
