l_english:
 game_concept_cloning: "Cloning"
 game_concept_clone: "Clone"
 game_concept_clones: "Clones"
 game_concept_cloning_desc: "$game_concept_cloning$ is the practice of creating an artificial human using genetic material from one or more donors.\n\nWhen a $game_concept_clone$ is commissioned, a [gestating_clone|E] is created. When the $game_concept_gestating_clone$ reaches maturity, it will be decanted, creating a new [character|E].\n\n$game_concept_clones$ are considered the [children|E] of their donors, and have a chance to inherit each of their donors' [congenital_traits|E] based on the [clone_fidelity|E] of the commissioner's [local_innovations_cotc|E]."
 game_concept_single_donor_clone: "Single-Donor Clone"
 game_concept_single_donor_clones: "Single-Donor Clones"
 game_concept_one_donor_clone: "One-Donor Clone"
 game_concept_one_donor_clones: "One-Donor Clones"
 game_concept_single_donor_clone_desc: "$game_concept_single_donor_clones$ are [clones|E] produced from a single genetic donor, who will be the clone's sole parent."
 game_concept_double_donor_clone: "Double-Donor Clone"
 game_concept_double_donor_clones: "Double-Donor Clones"
 game_concept_two_donor_clone: "Two-Donor Clone"
 game_concept_two_donor_clones: "Two-Donor Clones"
 game_concept_double_donor_clone_desc: "$game_concept_double_donor_clones$ are [clones|E] produced by mixing the DNA of two genetic donors. The result resembles a natural [child|E] of both donors."
 game_concept_gestating_clone: "Gestating Clone"
 game_concept_gestating_clones: "Gestating Clones"
 game_concept_clone_gestation: "Clone Gestation"
 game_concept_gestating_clone_desc: "A $game_concept_gestating_clone$ is an [artifact|E] containing a [clone|E] that has not yet reached maturity."
 game_concept_clone_fidelity: "Clone Fidelity"
 game_concept_clone_fidelity_desc: "$game_concept_clone_fidelity$ is a measure of how resistant the [cloning|E] process is to errors. The higher your $game_concept_clone_fidelity$, the greater the chance that $game_concept_clones$ will inherit their donors' [congenital_traits|E].
 
 commission_single_donor_clone_interaction: "Create Single-Donor Clone"
 commission_single_donor_clone_interaction.desc.self: "Commission a [single_donor_clone|E] of yourself. The clone will have a #P [actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E]."
 commission_single_donor_clone_interaction.desc.puppet: "Order [puppet_or_actor.Custom('GetBestName')] to commission a [single_donor_clone|E] of [puppet_or_actor.Custom('GetThemself')]. The clone will have a #P [actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of your [congenital_traits|E]."
 commission_single_donor_clone_interaction.desc.other: "Offer to commission a [single_donor_clone|E] of [recipient.Custom('GetBestName')]. The clone will have a #P [actor.MakeScope.ScriptValue('clone_fidelity')]%#! chance to inherit each of [recipient.Custom('GetTheir')] [congenital_traits|E]."
 SINGLE_DONOR_CLONE_ACTOR_HATES_CLONING: "[actor.GetShortUIName] opposes [cloning|E]"
 SINGLE_DONOR_CLONE_RECIPIENT_HATES_CLONING: "[recipient.GetShortUIName] opposes [cloning|E]"
 SINGLE_DONOR_CLONING_CLONING_OKAY: "Both [actor.GetShortUIName] and [recipient.GetShortUIName] tolerate [cloning|E]"
 AI_IDEOLOGY_SUPPORTS_CLONING: "[recipient.GetShortUINamePossessive] [rite|E] supports [cloning|E]: $VALUE|=+0$"
 AI_IDEOLOGY_HATES_CLONING: "[recipient.GetShortUINamePossessive] [rite|E] opposes [cloning|E]: $VALUE|=+0$"
 AI_ALREADY_HAS_CHILDREN: "[recipient.GetShortUIName] already has [children|E]: $VALUE|=+0$"
 AI_NO_MEANINGFUL_CONNECTION: "[recipient.GetShortUIName] has no meaningful connection to [puppet_or_actor.GetShortUIName]: #N BLOCKED#!"
 clone_inherits_trait: "[clone|E] inherits [temp_trait.GetName(recipient)]"
 
 feature_clone_sex_female: "female"
 feature_clone_sex_male: "male"
 single_donor_clone_name: "[clone|E] of [first_donor.Custom('GetBestName')]"
 single_donor_clone_description: "This is a [newly_created_clone.GetFeatureText('clone_sex')] single-donor [gestating_clone|E] of [newly_created_clone.MakeScope.Var('first_donor').Char.Custom('GetBestName')]. It will reach maturity in #V [newly_created_clone.MakeScope.Var('months_remaining').GetValue]#! months."