l_english:
 game_concept_cybernetics: "Cybernetics"
 game_concept_cybernetic: "Cybernetic"
 game_concept_cybernetic_implant: "Cybernetic Implant"
 game_concept_cybernetic_implants: "Cybernetic Implants"
 game_concept_augments: "Augments"
 game_concept_augmentations: "Augmentations"
 game_concept_implant: "Implant"
 game_concept_implants: "Implants"
 game_concept_cyborg: "Cyborg"
 game_concept_cybernetics_desc: "$game_concept_cybernetics$ are [artifacts|E] that replace a part of a [character|E]'s natural body. There are seven types of $game_concept_implant$:\n$EFFECT_LIST_BULLET$[direct_neural_interfaces|E]\n$EFFECT_LIST_BULLET$[dermal_implants|E]\n$EFFECT_LIST_BULLET$[internal_implants|E]\n$EFFECT_LIST_BULLET$[monocular_implants|E]\n$EFFECT_LIST_BULLET$[binocular_implants|E]\n$EFFECT_LIST_BULLET$[artificial_arms|E]\n$EFFECT_LIST_BULLET$[artificial_legs|E]\n\nEach type of $game_concept_implant$ corresponds to a particular [trait|E], and can only be equipped by $game_concept_characters$ with that $game_concept_trait$, while counteracting its negative effects. They can be further upgraded to provide additional bonuses."
 game_concept_direct_neural_interface: "Direct Neural Interface"
 game_concept_direct_neural_interfaces: "Direct Neural Interfaces"
 game_concept_dni: "DNI"
 game_concept_dnis: "DNIs"
 game_concept_skulltop: "Skulltop"
 game_concept_skulltops: "Skulltops"
 game_concept_datajack: "Datajack"
 game_concept_datajacks: "Datajacks"
 game_concept_datajacked: "Datajacked"
 game_concept_direct_neural_interface_desc: "A $game_concept_direct_neural_interface$, or '$game_concept_skulltop$', is an [implant|E] that connects directly to the brain through an artificial port called a $game_concept_datajack$. $game_concept_dnis$ can be upgraded to improve almost every [skill|E]. They can only be equipped by [characters|E] with the Datajacked [trait|E], counter-act the penalties of that trait, and make the equipped character vulnerable to [digital_diseases|E]."
 game_concept_dermal_implant: "Dermal Implant"
 game_concept_dermal_implants: "Dermal Implants"
 game_concept_dermal_implant_desc: "A $game_concept_dermal_implant$ is an [implant|E] that replaces the skin. $game_concept_dermal_implants$ can improve [diplomacy|E] and [intrigue|E]. They can only be equipped by characters with the Disfigured [trait|E], counter-act the penalties of that trait, and make the equipped character immune to [skin_diseases|E]."
 game_concept_internal_implant: "Internal Implant"
 game_concept_internal_implants: "Internal Implants"
 game_concept_implant_dependent: "Implant-Dependent"
 game_concept_implant_dependence: "Implant Dependence"
 game_concept_internal_implant_desc: "$game_concept_internal_implants$ are [implants|E] that replace a [character|E]'s internal organs. They render the character immune to [organic_diseases|E] and can significantly improve [health|E], as well as provide bonuses to other [implants|E]. However, they can only be equipped by characters with the Implant-Dependent [trait|E], and these characters will die if their $game_concept_internal_implants$ are ever removed or destroyed."
 game_concept_monocular_implant: "Monocular Implant"
 game_concept_monocular_implants: "Monocular Implants"
 game_concept_artificial_eye: "Artificial Eye"
 game_concept_artificial_eyes: "Artificial Eyes"
 game_concept_monocular_implant_desc: "A $game_concept_monocular_implant$ is an [implant|E] that replaces a single eye. They can increase [prowess|E], [personal_prowess|E], and [intrigue|E]. They can only be equipped by characters with the One-Eyed [trait|E] and counter-act the penalties of that trait."
 game_concept_binocular_implant: "Binocular Implant"
 game_concept_binocular_implants: "Binocular Implants"
 game_concept_binocular_implant_desc: "A $game_concept_binocular_implant$ is an [implant|E] that replaces both eyes. They can increase [prowess|E], [personal_prowess|E], and [intrigue|E]. They can only be equipped by characters with the Blind [trait|E] and counter-act the penalties of that trait."
 game_concept_artificial_arm: "Artificial Arm"
 game_concept_artificial_arms: "Artificial Arms"
 game_concept_artificial_arm_desc: "An $game_concept_artificial_arm$ is an [implant|E] that replaces an arm. $game_concept_artificial_arms$ can improve [personal_prowess|E] and [health|E]. They can only be equipped by characters with the One-Armed or Armless [traits|E], counter-act the penalties of those traits, and, when two $game_concept_artificial_arms$ are combined with two [artificial_legs|E], make the equipped [character|E] immune to [joint_diseases|E]."
 game_concept_artificial_leg: "Artificial Leg"
 game_concept_artificial_legs: "Artificial Legs"
 game_concept_artificial_leg_desc: "An $game_concept_artificial_leg$ is an [implant|E] that replaces a leg. $game_concept_artificial_legs$ can improve [personal_prowess|E] and [health|E]. They can only be equipped by characters with the One-Legged or Legless [traits|E], counter-act the penalties of those traits, and, when two $game_concept_artificial_legs$ are combined with two [artificial_arms|E], make the equipped [character|E] immune to [joint_diseases|E]."
 
