 purchase_rough_terrain_gear_option: "Purchase Pathfinder's Gear"
 purchase_rough_terrain_gear_option_desc: "Traversing mountains and swamps are a challenge — for the unprepared! You will purchase climbing hooks, extra ropes, and all manner of gear necessary to traverse the most treacherous path."
 
 purchase_desert_gear_option: "Purchase Arid Explorer's Pack"
 purchase_desert_gear_option_desc: "You will purchase veils to keep the sand out of your faces, and sturdy camels to assist in your journey."
 
 purchase_forest_gear_option: "Purchase Wilderness Kit"
 purchase_forest_gear_option_desc: "The forest knows no master — but you will tame it with long knives, saws, axes, and a #EMP lot#! of extra wheel grease!"
 
 adventurers_encourage_relationships_option: "Encourage Relationships"
 adventurers_encourage_relationships_option_desc: "True long-lasting bonds can not be forced, they emerge from shared hardships. The road may be a cruel mistress, but for each challenge overcome a new relationship is potentially forged."
 adventurers_encourage_relationships_option.tt: "Your [followers|E] may spontaneously form [friendships|E], become [lovers|E], or [marry|E] — either with each other or with [wanderers|E] as you [travel|E] past [baronies|E]. Every relationship formed this way will give you [prestige_i][prestige|E].\n#weak (Your [children|E], [spouses|E], or others you care about will not [marry|E] or take [lovers|E]. This will not cause [followers|E] to become [GetTrait('adulterer').GetName( GetNullCharacter )]s.)#!"
 ep3_travel_option_events.0002.title: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_marry'))|U] [courtier_to_marry.GetFirstName] Married [marriage_material.GetFirstName]"
 ep3_travel_option_events.0003.title: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_befriend'))|U] [courtier_to_befriend.GetFirstName] Befriended [friend_target.GetFirstName]"
 ep3_travel_option_events.0004.title: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_love'))|U] [courtier_to_love.GetFirstName] and [pls_love_me.GetFirstName] became Lovers"
 
 adventurers_search_for_secrets_option: "Search for Secrets"
 adventurers_search_for_secrets_option_desc: "Rumors are a map to a treasure trove of secrets — but it takes a cunning mind to follow them, X marks the spot!"
 adventurers_search_for_secrets_option.tt: "When passing through a [barony|E], you may learn a [secret|E] of someone residing there\n#weak (Chance % equal to your [intrigue_i])#!"
 adventurers_search_for_secrets_option.title: "[GetTravelOption('adventurers_search_for_secrets_option').GetName] Successful!"
 
 adventurers_proselytize_zealously_option: "Proselytize to Locals"
 adventurers_proselytize_zealously_option_desc: "In the far reaches of the world they have yet to hear of the true faith. It is our solemn duty to remedy this."
 adventurers_proselytize_zealously_option.tt: "When passing through a [barony|E], you may convert a [wanderer|E] residing there to your [faith|E] and gain [piety_i][piety|E]\n#weak (Chance % equal to your [learning_i])#!"
 adventurers_proselytize_zealously_option.title: "[wanderer_to_convert.GetShortUIName] converts to [ROOT.Char.GetFaith.GetName]!"
 adventurers_proselytize_zealously_option.tt.perk_or_tenet: "You have the [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)] [perk|E], or $tenet_mendicant_preachers_name$ is your [personal_tenet|E]"
 
 adventurers_gather_inspiration_option: "Gather Inspiration"
 adventurers_gather_inspiration_option_desc: "There's plenty of inspiration to find on the road — beautiful scenery, impressive landmarks, and remarkable people to meet. It truly stirs the mind's fount!"
 adventurers_gather_inspiration_option.tt: "When passing through a [barony|E], a random [follower|E] has a chance to become [inspired|E]\n#weak (Chance % equal to a sixth of your [stewardship_i])#!"
 adventurers_gather_inspiration_option.title: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_follower'))|U] [inspired_follower.GetFirstName] becomes Inspired!"
 adventurers_gather_inspiration_option.effect: "[inspired_follower.GetUIName] got the [inspired_follower.GetCurrentInspiration.GetName] - [inspired_follower.Custom('InspirationTypeDescriptionFuturePresent')].\n\n[inspired_follower.Custom('InspiredPersonQuality')]"
 
 adventurers_make_local_deals_option: "Gray Market Deals"
 adventurers_make_local_deals_option_desc: "There is #EMP always#! a deal to be made. If people know you, they trust you, and are willing to haggle. Unfortunately, it also means that criminals know #EMP exactly#! who to target..."
 adventurers_make_local_deals_option.tt: "When passing through a [barony|E], you gain #V 25%#! of the Holding's [loot|E] value as [gold_i][gold|E]\n#weak (can only gain Gold once per Holding)#!"
 
 adventurers_scout_for_talent_option: "Scout for Talent"
 adventurers_scout_for_talent_option_desc: "There are many galaxy-weary figures to find — some of them will surely be in search of employment!"
 adventurers_scout_for_talent_option.tt: "Enables Events to recruit [wanderers|E] for [gold_i][gold|E] if you have open positions for [officers|E]"
 excellent.aptitude_tt: "[local_character.GetUINamePossessive] [aptitude|E] is $aptitude_excellent$"
 good.aptitude_tt: "[local_character.GetUINamePossessive] [aptitude|E] is $aptitude_good$"
 average.aptitude_tt: "[local_character.GetUINamePossessive] [aptitude|E] is $aptitude_average$"
 poor.aptitude_tt: "[local_character.GetUINamePossessive] [aptitude|E] is $aptitude_poor$"
 terrible.aptitude_tt: "[local_character.GetUINamePossessive] [aptitude|E] is $aptitude_terrible$"
 ep3_travel_option_events.0001.t: "$adventurers_scout_for_talent_option$: A Willing Follower"
 ep3_travel_option_events.0001.intro: "I come across a [local_character.GetWomanMan] while passing through [location.GetTitle.GetNameNoTier]. [local_character.GetSheHe|U] is [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('local_character'))] and [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('local_character'))] as I approach.\n\n"
 
 ep3_travel_option_events.0001.court_physician_court_position: ""[local_character.GetFaith.HighGodName|U] be with you, I am [local_character.GetFullName] — a physician of [location.GetNameNoTooltip]. Locals come to my clinic to treat what ails them: broken bones, rashes, I even deliver children from time-to-time. My passion for healthcare outcomes fills me with wanderlust, I desire to explore."\n\n"
 ep3_travel_option_events.0001.bodyguard_court_position: ""Ello', my name is [local_character.GetFullName]. I know how to rough folks up. Real good I am at it, too. Knocked the stablemaster out in one punch during last nights brawl, I did."\n\n"
 ep3_travel_option_events.0001.travel_leader_court_position: ""Hello! Are you lost, starfarer? My name is [local_character.GetFullName], I know this region well. I prospect these [location.Custom('GetTerrainTypePlural')] every day, but my heart belongs to distant stars. To be a starfinder, a guide — that is my dream."\n\n"
 ep3_travel_option_events.0001.second_camp_officer: ""Greetings, my name is [local_character.GetFullName]. I've overseen operations at the [location.GetNameNoTooltip] spaceport for years. I've organized the shifts of work crews in zero-g. Yes, what haven't I done..."\n\n"
 ep3_travel_option_events.0001.quartermaster_camp_officer: ""I've organized the warehouses of [location.GetNameNoTooltip] meticilously, I've audited every import and export, each ingot and barrel and container. But staying here bores me. Take me with you."\n\n"
 ep3_travel_option_events.0001.armorer_camp_officer: ""I've worked at the local berths, building ships for the [location.GetNameNoTooltip] garrison. It's good work, but I've felt the call of the void for a long while."\n\n"
 ep3_travel_option_events.0001.chief_forager_camp_officer: ""I am [local_character.GetFullName] — I've been all over the galaxy, studying the shapes of things. If you want to find food, water, fuel, all that, you'll need my help."\n\n"
 ep3_travel_option_events.0001.master_thief_camp_officer: ""Better watch your wallet friend, lots of scammers around these parts. Of course, I would never hustle on someone like yourself... no, I have bigger plans, and I think we can work together."\n\n"
 ep3_travel_option_events.0001.head_porter_camp_officer: ""G'day, my name is [local_character.GetFullName], I'm a loadmaster — nothing in [location.GetNameNoTooltip] moves without my say-so, har har! I make sure the forklifts and cranes don't drop anything, and nobody gets run over, har har!"\n\n"
 ep3_travel_option_events.0001.head_groom_camp_officer: ""[local_character.GetFaith.HighGodName|U] be with you, my name is [local_character.GetFullName], I'm a propulsion engineer here in [location.GetNameNoTooltip]. I've got experience with all sorts of commercial engines designs, getting them up and running and kept at peak performance."\n\n"
 ep3_travel_option_events.0001.huntperson_camp_officer: ""Hey there — I'm a weapons tech, long time in [location.GetNameNoTooltip]. [local_character.GetFullName] is my name, and explosions are my game. The stars are full of dangers, and if you want to survive you'll need me keeping your guns in good shape."\n\n"
 ep3_travel_option_events.0001.kennelperson_camp_officer: ""Good day. I am [local_character.GetFullName], I've done a tour in the local defense force, mission coordinator track. If you want to get the best out of your aces and get everyone home alive, you'll need me on deck."\n\n"
 ep3_travel_option_events.0001.chief_engineer_camp_officer: ""I've done a tour with the marines of [location.GetNameNoTooltip], running drills, riding shuttles, breaching and demolitions... now I want to put it into practice."\n\n"
 ep3_travel_option_events.0001.witness_camp_officer: ""Ah, I see the spark of greatness in your eyes! And your starship, positively astounding! This place, [location.GetNameNoTooltip], it used to be good enough for me — no more, this fish is too big for this small pond. You are obviously [ROOT.Char.Custom('ComplimentAdjective')], [ROOT.Char.Custom( 'RomanticComplimentAdjective')], a true [ROOT.Char.Custom('RomanticComplimentNoun')]!"\n\n"
 ep3_travel_option_events.0001.person_haggler_camp_officer: ""I am [local_character.GetFullName], security expert — I've done a career in the [location.GetNameNoTooltip] prison system. I'll make sure your prisoners are kept nice and neat for as long as they're staying with us."\n\n"
 ep3_travel_option_events.0001.camp_cook_camp_officer: ""Hello [ROOT.Char.Custom('RomanticComplimentNoun')], are you hungry? I'm a cook, no, a chef, and I've worked at a dozen of the best eateries in [location.GetNameNoTooltip]! I can work wonders with soy paste and planktic mass, but I would love to have the chance to work with more exotic ingredients..."\n\n"
 ep3_travel_option_events.0001.master_bard_camp_officer: ""Hey hey, I'm the [local_character.Custom('ComplimentAdjective')] [local_character.GetFullName]! I'm a microcelebrity around here, but I need more! I need to escape this place, and go where my art can be appreciated by the whole galaxy!"\n\n"
 ep3_travel_option_events.0001.stooge_camp_officer: ""I am tired of getting kicked around like a space dog! No one respects me here, everyone laughs as soon as '[local_character.GetFullName]' is uttered, fools! [local_character.Custom2('InsultNoun', ROOT.Char)|U]s! [ROOT.Char.Custom2('InsultNoun', ROOT.Char)|U]s! #EMP Gaaaah, I get so mad — I must get out of here!#!"\n\n"
 ep3_travel_option_events.0001.master_of_arms_camp_officer: ""Attention! I am [local_character.GetFullName], an ordinance chief at the [location.GetNameNoTooltip] garrison. If you want your batteries to be charged, warheads primed, and crew kept in line, you need someone like me."\n\n"
 ep3_travel_option_events.0001.light_cavalry_captain_camp_officer: ""[local_character.GetFaith.HighGodName|U] be with you, I am [local_character.GetFullName]. I am a scout, messenger, and outrider — my heart belongs in the wilds, far from the dredge of cities and villages."\n\n"
 ep3_travel_option_events.0001.camelry_captain_camp_officer: ""Camels are my life. I've ridden them into battle innumerable times, none could stand in the way of '[local_character.GetFullNamePossessive] Conquering Camels'. I wish to see the world again, I wish to conquer again!"\n\n"
 ep3_travel_option_events.0001.elephantry_captain_camp_officer: ""Greetings, my name is [local_character.GetFullName]. I care for the great beasts we know as elephants, I groom them and feed them. There's no charge as deadly as that from one of these tusked giants."\n\n"
 ep3_travel_option_events.0001.heavy_cavalry_captain_camp_officer: ""I am [local_character.GetFullName], and I've served as a [local_character.Custom('KnightCultureNoTooltipLowercase')] in the guard of [location.GetNameNoTooltip], fully armored and with a barded horse I've charged countless enemies of the realm."\n\n"
 ep3_travel_option_events.0001.horse_archer_captain_camp_officer: ""I am [local_character.GetFullName], since I was a wee child I've lived in the saddle. [local_character.GetFaith.HighGodName|U] has blessed me with skill, endurance, and persistence. All I need is a bow and a horse."\n\n"
 ep3_travel_option_events.0001.archer_captain_camp_officer: ""Greetings, I am [local_character.GetFullName] the watchman, I scour the [location.Custom('GetTerrainTypePlural')] of [location.GetNameNoTooltip] from the top of my tower. If brigands approach, my bow does the talking. Though I tire of this sedentary life — I wish to go further than any of my arrows!"\n\n"
 ep3_travel_option_events.0001.heavy_infantry_captain_camp_officer: ""Greetings, my name is [local_character.GetFullName]. I don heavy armor and a shield in service of the [location.GetNameNoTooltip] garrison. Been doing it for some years, but the last arrow came awfully close to ending me, and I got thinking that there's more to life."\n\n"
 ep3_travel_option_events.0001.light_infantry_captain_camp_officer: ""I am [local_character.GetFullName], a man-at-arms in the [location.GetNameNoTooltip] garrison. Hit-and-run, hurl a javelin, grab a buckler and a dagger — then go in for the kill. I've served here long enough, the world has more to offer."\n\n"
 ep3_travel_option_events.0001.pike_captain_camp_officer: ""I have served as a spearman in the [location.GetNameNoTooltip] garrison for years. I know how things are done — dig in, face the enemy, and await the charge with a will of steel."\n\n"
 ep3_travel_option_events.0001.master_of_spoils_camp_officer: ""Hello there, I'm [local_character.GetFullName]. I'm the kind of guy who knows a guy, if you know what I mean. I'll make sure that you get the best prices for the things you find out there in the starry sky, no matter who used to own it."\n\n"
 ep3_travel_option_events.0001.fallback: ""Hello, I am [local_character.GetFullName]. I don't have much of a resume, but I've done a bit of everything. I think I'm what you're looking for in a crewmate."\n\n"
 
 ep3_travel_option_events.0001.excellent: ""I am at the top of my field." [local_character.GetSheHe|U] says with conviction. "With me on your side, you'll be unbeatable.""
 ep3_travel_option_events.0001.good: ""Take a look at my qualifications." [local_character.GetSheHe|U] continues, flashing a list. "Shall we discuss payment?""
 ep3_travel_option_events.0001.average: ""I would be willing to join your group." [local_character.GetSheHe|U] continues. "A sensible paycheck is all I want.""
 ep3_travel_option_events.0001.poor: ""I may not be the best, but I am willing." [local_character.GetSheHe|U] says. "And cheap. I will join your entourage, if you'll have me.""
 ep3_travel_option_events.0001.terrible: ""Take mercy upon poor, useless me!" [local_character.GetSheHe|U] grovels. "I'll do anything for cash — I'll even scrub the latrines with a #EMP smile#!.""
 ep3_travel_option_events.0001.a: "I'll happily pay you to join my team!"
 ep3_travel_option_events.0001.provisions: "I can only pay you in food and board."
 ep3_travel_option_events.0001.b: "Hit the bricks, you useless [local_character.Custom2('InsultNoun', ROOT.Char)]."
 
 estate_mounts_option: "Best of the Best"
 estate_mounts_option_desc: "You staff your mission with some of the best support staff in the galaxy, all from your own contacts!"

 hire_allied_mercenaries_option: "Private Army"
 hire_allied_mercenaries_option_desc: "A mixed group of promising officers and local guns for hire, to ensure a quick and safe yet affordable journey."

 appeasement_option: "Appeasement"
 appeasement_option_desc: "Sometimes one must don a benevolent facade, concealing tyranny with charm, soothing your inferiors."

 leisurely_option: "Mellow Journey"
 leisurely_option_desc: "In your travels, you will set aside time to visit each community, connecting with the locals."
 leisurely_option_tt: "Receive [prestige_experience|E] for every visited [holding|E]"
 leisurely_option_effect: "$leisurely_option$"
 
 tutor_child_option: "Tutoring Trip"
 tutor_child_option_desc: "Bringing your heir along will give them valuable experience that can't be found in a classroom."
 tutor_child_option_tt: "Children accompanying you to [holdings|E] in your [domain|E] will be able to increase their skills"
 child_brought_along.tt: "Your [heir|E] will be brought into your entourage."
 child_brought_along_specific.tt: "Your heir, [tutored_heir.GetName], will be brought into your entourage."
 heir_can_join_tt: "[heir_for_tooltip.GetName] is available to join the entourage"
 no_heir_tt: "[heir|E] is available to join the entourage"
 travel_logs_title: "$travel_logs_perk_name$"
