l_english:
 game_concept_organic_disease: "Organic Disease"
 game_concept_organic_diseases: "Organic Diseases"
 game_concept_organic_disease_desc: "Organic [diseases|E] infect the body's internal organs. As a result, they cannot infect [characters|E] who have replaced their internal organs with [internal_implants|E]."
 game_concept_skin_disease: "Skin Disease"
 game_concept_skin_diseases: "Skin Diseases"
 game_concept_skin_disease_desc: "Skin [diseases|E] infect the skin. As a result, they cannot infect [characters|E] who have replaced their skin with [dermal_implants|E]."
 game_concept_joint_disease: "Joint Disease"
 game_concept_joint_diseases: "Joint Diseases"
 game_concept_joint_disease_desc: "Joint [diseases|E] infect the body's limbs and joints. As a result, they cannot infect [characters|E] who have replaced their limbs with [artificial_arms|E] and [artificial_legs|E]."
 game_concept_digital_disease: "Digital Disease"
 game_concept_digital_diseases: "Digital Diseases"
 game_concept_digital_disease_desc: "Digital [diseases|E] infect the brain via an external connection such as a datajack. As a result, they cannot infect characters who do not have a [direct_neural_interface|E]."