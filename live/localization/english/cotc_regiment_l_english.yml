 #Cultural MaA Descriptions
 d_pavise_flavor: "#F In the tradition of the greatest knights, these superior destroyers defend ships at their weakest but do not harm a yielding enemy. #!"
 monitor_frigates_flavor: "#F $game_concept_missile_frigates_desc$ \nA monitor carries a massive gun battery with the capabilities to fire it. Everything else aboard is there to keep that gun firing. #!"
 q_ships_flavor: "#F $game_concept_merchanteers_desc$ \nUnder the cargo plating sit launch rails and a gun crew who have been waiting a long time for someone to try their luck. #!"
 lancer_corvettes_flavor: "#F $game_concept_corvettes_desc$ \nBuilt for the picket line with sharp sensors and the endurance to hold station until relieved. #!"
 spectre_cruisers_flavor: "#F $game_concept_ew_cruisers_desc$ \nThey carry barely a gun worth naming. What they carry instead is the certainty that the enemy's targeting solution is a lie. #!"
 dragon_cruisers_flavor: "#F $game_concept_cruisers_desc$ \nMagazines running the length of the keel, and yard crews who consider a half-empty bunker a personal failing. #!"
 compact_raiders_flavor: "#F $game_concept_raiders_desc$ \nWelded together from whatever the yards had that season. Fast, fragile, and available in numbers. #!"
