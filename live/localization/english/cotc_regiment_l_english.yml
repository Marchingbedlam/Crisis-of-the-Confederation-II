 #Base MaA Descriptions
 corvettes_base_flavor: "#F Corvettes are the lightest class of warship, used mainly for orbital patrols. #!"
 missile_boats_base_flavor: "#F Missile Boats are built on the same sort of hull as Corvettes, but are armed with long-range missile launchers. #!"
 destroyers_base_flavor: "#F Destroyers are dedicated point defense platforms. They are relatively slow, but bristle with laser turrets and auto-targeting point defense guns. #!"
 cruisers_base_flavor: "#F Cruisers are the workhorses of most fleets. They are medium-sized ships that are designed to be logistically self-sufficient. #!"
 raiders_base_flavor: "#F Raiders are fast, lightly-armed, and highly maneuverable craft with large cargo holds. #!"
 fast_frigates_base_flavor: "#F Fast Attack Frigates are medium-sized ships designed to rapidly close the distance with enemy warships and overwhelm them in close-range combat. #!"
 missile_frigates_base_flavor: "#F Missile Frigates are medium-sized ships designed to overwhelm the enemy with mass missile swarms. #!"
 ew_cruisers_base_flavor: "#F Electronic Warfare cruisers are lightly armed, but are packed with computer banks and bristle with antennas. #!"
 merchanteers_base_flavor: "#F A mix of lightly armed cargo and industrial vessels called out of civilian service to defend their worlds. #!"
 
 #Cultural MaA Descriptions
 pavise_destroyers_flavor: "#F In the tradition of the greatest knights, these superior destroyers defend ships at their weakest but refuse to harm a yielding enemy. #!"
 monitor_frigates_flavor: "#F A monitor-class frigate carries a massive gun battery with the capability to fire it. Everything else aboard is there to keep that gun firing. #!"
 armored_merchanteers_flavor: "#F Under this merchant vessel's cargo plating sit launch rails and a gun crew who have been waiting a long time for someone to try their luck. #!"
 lancer_corvettes_flavor: "#F A lancer is a corvette purpose-built to maintain a picket line, with sharp sensors and the endurance to hold station until relieved. #!"
 spectre_cruisers_flavor: "#F Though it offers less firepower than a standard EW cruiser, the crew of these vessels hold the certainty that the enemy's targeting solution is a lie. #!"
 dragon_cruisers_flavor: "#F These powerful cruisers carry magazines running the length of the keel and a crew that considers a half-empty battery a personal failing. #!"
 compact_raiders_flavor: "#F These compact raiders are welded together from whatever the yards had that season. Fast, fragile, and available in numbers. #!"
